<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2160" viewBox="0 0 1500 2160" role="img" aria-label="脱骨侠全费用管理资金流转主流程"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#60818a"/></marker></defs><style>text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#17343d} .node{font-size:20px;font-weight:600}.label{font-size:16px;fill:#47636c}.phase{font-size:18px;font-weight:700;fill:#42676e}</style><rect width="1500" height="2160" fill="#f6f8fa"/><text x="50" y="49" font-size="30" font-weight="750">脱骨侠全费用管理资金流转主流程</text><text x="50" y="81" class="label">目标业务流程 · 实线为办理路径，虚线为条件触发或额度回流；金额以原政策及合同为准。</text><rect x="45" y="100" width="1410" height="510" rx="18" fill="#eaf4f1"/><text x="65" y="130" class="phase">01 政策、定价与销售贡献</text><rect x="45" y="625" width="1410" height="520" rx="18" fill="#edf2fc"/><text x="65" y="655" class="phase">02 客户费用预留与组织分池</text><rect x="45" y="1160" width="1410" height="440" rx="18" fill="#fff5e7"/><text x="65" y="1190" class="phase">03 活动及实物占用、执行与核销</text><rect x="45" y="1615" width="1410" height="435" rx="18" fill="#edf5ee"/><text x="65" y="1645" class="phase">04 费用确认、结算与清偿</text><path d="M750 202 L750 235" fill="none" stroke="#60818a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M750 307 L750 340" fill="none" stroke="#60818a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M750 412 L750 445" fill="none" stroke="#60818a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M750 517 L750 550" fill="none" stroke="#60818a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M750 622 L750 665" fill="none" stroke="#60818a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M870 715 L1120 715" fill="none" stroke="#60818a" stroke-width="2"  marker-end="url(#arrow)"/><rect x="978.5" y="686" width="33" height="25" rx="4" fill="#f6f8fa"/><text x="995" y="704" text-anchor="middle" class="label">是</text><path d="M1270 752 L1270 810" fill="none" stroke="#60818a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M1420 846 L1465 846 L1465 643 L750 643 L750 665" fill="none" stroke="#60818a" stroke-width="2"  marker-end="url(#arrow)"/><rect x="1219.5" y="615" width="101" height="25" rx="4" fill="#f6f8fa"/><text x="1270" y="633" text-anchor="middle" class="label">补足后复核</text><path d="M750 765 L750 815" fill="none" stroke="#60818a" stroke-width="2"  marker-end="url(#arrow)"/><rect x="759.5" y="775" width="33" height="25" rx="4" fill="#f6f8fa"/><text x="776" y="793" text-anchor="middle" class="label">否</text><path d="M600 586 L220 586 L220 760" fill="none" stroke="#60818a" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/><rect x="341" y="557" width="118" height="25" rx="4" fill="#f6f8fa"/><text x="400" y="575" text-anchor="middle" class="label">达成或履约后</text><path d="M220 832 L220 890" fill="none" stroke="#60818a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M70 926 L25 926 L25 1676 L600 1676" fill="none" stroke="#60818a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M750 887 L750 925" fill="none" stroke="#60818a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M750 997 L750 1030" fill="none" stroke="#60818a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M870 1080 L1120 1080" fill="none" stroke="#60818a" stroke-width="2"  marker-end="url(#arrow)"/><rect x="962.5" y="1050" width="67" height="25" rx="4" fill="#f6f8fa"/><text x="996" y="1068" text-anchor="middle" class="label">不通过</text><path d="M1420 1081 L1465 1081 L1465 961 L900 961" fill="none" stroke="#60818a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M750 1130 L750 1185" fill="none" stroke="#60818a" stroke-width="2"  marker-end="url(#arrow)"/><rect x="762" y="1142" width="50" height="25" rx="4" fill="#f6f8fa"/><text x="787" y="1160" text-anchor="middle" class="label">通过</text><path d="M750 1257 L750 1278 L550 1278 L550 1300" fill="none" stroke="#60818a" stroke-width="2"  marker-end="url(#arrow)"/><rect x="538" y="1253" width="50" height="25" rx="4" fill="#f6f8fa"/><text x="563" y="1271" text-anchor="middle" class="label">活动</text><path d="M750 1257 L750 1278 L980 1278 L980 1300" fill="none" stroke="#60818a" stroke-width="2"  marker-end="url(#arrow)"/><rect x="949" y="1253" width="50" height="25" rx="4" fill="#f6f8fa"/><text x="974" y="1271" text-anchor="middle" class="label">实物</text><path d="M550 1372 L550 1396 L750 1396 L750 1420" fill="none" stroke="#60818a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M980 1372 L980 1396 L750 1396 L750 1420" fill="none" stroke="#60818a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M750 1492 L750 1530" fill="none" stroke="#60818a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M600 1566 L370 1566" fill="none" stroke="#60818a" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/><rect x="443" y="1535" width="84" height="25" rx="4" fill="#f6f8fa"/><text x="485" y="1553" text-anchor="middle" class="label">释放余款</text><path d="M750 1602 L750 1640" fill="none" stroke="#60818a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M750 1712 L750 1750" fill="none" stroke="#60818a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M750 1822 L750 1860" fill="none" stroke="#60818a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M750 1932 L750 1970" fill="none" stroke="#60818a" stroke-width="2"  marker-end="url(#arrow)"/><rect x="600" y="130" width="300" height="72" rx="12" fill="#006d66" stroke="#006d66" stroke-width="1.5"/><text x="750" y="159" text-anchor="middle" class="node" style="fill:white">客户政策与活动方案</text><text x="750" y="187" text-anchor="middle" class="node" style="fill:white">审批生效</text><rect x="600" y="235" width="300" height="72" rx="12" fill="#fff" stroke="#93b2b8" stroke-width="1.5"/><text x="750" y="264" text-anchor="middle" class="node">确定成交价</text><text x="750" y="292" text-anchor="middle" class="node">应用价格类优惠</text><rect x="600" y="340" width="300" height="72" rx="12" fill="#fff" stroke="#93b2b8" stroke-width="1.5"/><text x="750" y="369" text-anchor="middle" class="node">有效签收</text><text x="750" y="397" text-anchor="middle" class="node">形成可追溯销售记录</text><rect x="600" y="445" width="300" height="72" rx="12" fill="#fff" stroke="#93b2b8" stroke-width="1.5"/><text x="750" y="474" text-anchor="middle" class="node">逐销售行计算</text><text x="750" y="502" text-anchor="middle" class="node">SKU 总费用贡献</text><rect x="600" y="550" width="300" height="72" rx="12" fill="#fff" stroke="#93b2b8" stroke-width="1.5"/><text x="750" y="579" text-anchor="middle" class="node">先预留客户费用</text><text x="750" y="607" text-anchor="middle" class="node">返利、服务等合同义务</text><path d="M750 665L870 715L750 765L630 715Z" fill="#fff5dc" stroke="#b59855" stroke-width="1.5"/><text x="750" y="722" text-anchor="middle" class="node">预留后是否超包</text><rect x="1120" y="680" width="300" height="72" rx="12" fill="#fff0df" stroke="#93b2b8" stroke-width="1.5"/><text x="1270" y="709" text-anchor="middle" class="node">登记缺口</text><text x="1270" y="737" text-anchor="middle" class="node">保留已成立合同义务</text><rect x="1120" y="810" width="300" height="72" rx="12" fill="#fff" stroke="#93b2b8" stroke-width="1.5"/><text x="1270" y="839" text-anchor="middle" class="node">批准专项补足或调拨</text><text x="1270" y="867" text-anchor="middle" class="node">不伪造销售贡献</text><rect x="600" y="815" width="300" height="72" rx="12" fill="#fff" stroke="#93b2b8" stroke-width="1.5"/><text x="750" y="844" text-anchor="middle" class="node">按条件解锁剩余额度</text><text x="750" y="872" text-anchor="middle" class="node">分配总部、中心、大区、省区</text><rect x="70" y="760" width="300" height="72" rx="12" fill="#fff" stroke="#93b2b8" stroke-width="1.5"/><text x="220" y="789" text-anchor="middle" class="node">返利达成 / 服务履约</text><text x="220" y="817" text-anchor="middle" class="node">审核条件与计费依据</text><rect x="70" y="890" width="300" height="72" rx="12" fill="#fff" stroke="#93b2b8" stroke-width="1.5"/><text x="220" y="919" text-anchor="middle" class="node">预留转已确认费用</text><text x="220" y="947" text-anchor="middle" class="node">不再次扣可用额度</text><rect x="600" y="925" width="300" height="72" rx="12" fill="#fff" stroke="#93b2b8" stroke-width="1.5"/><text x="750" y="954" text-anchor="middle" class="node">发起活动或实物申请</text><text x="750" y="982" text-anchor="middle" class="node">关联策略、方案及预算来源</text><path d="M750 1030L870 1080L750 1130L630 1080Z" fill="#fff5dc" stroke="#b59855" stroke-width="1.5"/><text x="750" y="1073" text-anchor="middle" class="node">额度、上限与授权</text><text x="750" y="1101" text-anchor="middle" class="node">是否全部通过</text><rect x="1120" y="1045" width="300" height="72" rx="12" fill="#fff0df" stroke="#93b2b8" stroke-width="1.5"/><text x="1270" y="1074" text-anchor="middle" class="node">调整申请或申请补足</text><text x="1270" y="1102" text-anchor="middle" class="node">未通过不形成占用</text><rect x="600" y="1185" width="300" height="72" rx="12" fill="#fff" stroke="#93b2b8" stroke-width="1.5"/><text x="750" y="1214" text-anchor="middle" class="node">审批通过形成占用</text><text x="750" y="1242" text-anchor="middle" class="node">可用额度转未核销占用</text><rect x="400" y="1300" width="300" height="72" rx="12" fill="#fff" stroke="#93b2b8" stroke-width="1.5"/><text x="550" y="1329" text-anchor="middle" class="node">市场活动执行</text><text x="550" y="1357" text-anchor="middle" class="node">凭证与履约验收</text><rect x="830" y="1300" width="300" height="72" rx="12" fill="#fff" stroke="#93b2b8" stroke-width="1.5"/><text x="980" y="1329" text-anchor="middle" class="node">赠品物料领用出库</text><text x="980" y="1357" text-anchor="middle" class="node">按批准成本验收</text><rect x="600" y="1420" width="300" height="72" rx="12" fill="#fff" stroke="#93b2b8" stroke-width="1.5"/><text x="750" y="1449" text-anchor="middle" class="node">核销确认费用</text><text x="750" y="1477" text-anchor="middle" class="node">占用转已用</text><rect x="600" y="1530" width="300" height="72" rx="12" fill="#fff" stroke="#93b2b8" stroke-width="1.5"/><text x="750" y="1559" text-anchor="middle" class="node">活动结项</text><text x="750" y="1587" text-anchor="middle" class="node">释放未使用差额</text><rect x="70" y="1530" width="300" height="72" rx="12" fill="#e8f4ef" stroke="#93b2b8" stroke-width="1.5"/><text x="220" y="1559" text-anchor="middle" class="node">余款回到组织活动可用</text><text x="220" y="1587" text-anchor="middle" class="node">仅释放差额，不重复入池</text><rect x="600" y="1640" width="300" height="72" rx="12" fill="#fff" stroke="#93b2b8" stroke-width="1.5"/><text x="750" y="1669" text-anchor="middle" class="node">已确认费用</text><text x="750" y="1697" text-anchor="middle" class="node">不等同于已经付款</text><rect x="600" y="1750" width="300" height="72" rx="12" fill="#fff" stroke="#93b2b8" stroke-width="1.5"/><text x="750" y="1779" text-anchor="middle" class="node">结算审核</text><text x="750" y="1807" text-anchor="middle" class="node">形成有效应付</text><rect x="600" y="1860" width="300" height="72" rx="12" fill="#fff" stroke="#93b2b8" stroke-width="1.5"/><text x="750" y="1889" text-anchor="middle" class="node">现金、抵扣及合同扣点</text><text x="750" y="1917" text-anchor="middle" class="node">按合同方向清偿应付</text><rect x="550" y="1970" width="400" height="72" rx="12" fill="#e0f1e8" stroke="#93b2b8" stroke-width="1.5"/><text x="750" y="1999" text-anchor="middle" class="node">更新客户台账与清偿记录</text><text x="750" y="2027" text-anchor="middle" class="node">来源、受益、承担、收款分别保留</text><rect x="70" y="1000" width="350" height="79" rx="10" fill="#e8f4ef"/><text x="245" y="1029" text-anchor="middle" class="label">价格让利先影响成交基数</text><text x="245" y="1057" text-anchor="middle" class="label">不再按优惠金额重复扣费用包</text><rect x="1015" y="1735" width="400" height="106" rx="10" fill="#e8f4ef"/><text x="1215" y="1764" text-anchor="middle" class="label">结算与付款仅转移应付状态</text><text x="1215" y="1792" text-anchor="middle" class="label">不再次扣活动额度</text><text x="1215" y="1820" text-anchor="middle" class="label">合同扣点不自动恢复预算</text><rect x="70" y="1835" width="350" height="79" rx="10" fill="#e8f4ef"/><text x="245" y="1864" text-anchor="middle" class="label">草稿、测算不入账</text><text x="245" y="1892" text-anchor="middle" class="label">方案审批通过不等于注入资金</text><rect x="390" y="2080" width="1060" height="52" rx="10" fill="#e8f4ef"/><text x="920" y="2109" text-anchor="middle" class="label">演示：可用 3000 → 占用 1000 后 2000 → 核销 600 后仍 2000 → 释放 400 后 2400 → 支付后仍 2400</text></svg>