<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1430" viewBox="0 0 1500 1430" role="img" aria-label="退货、退款与政策调整流程"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#60818a"/></marker></defs><style>text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#17343d} .node{font-size:20px;font-weight:600}.label{font-size:16px;fill:#47636c}.phase{font-size:18px;font-weight:700;fill:#42676e}</style><rect width="1500" height="1430" fill="#f6f8fa"/><text x="50" y="49" font-size="30" font-weight="750">退货、退款与政策调整流程</text><text x="50" y="81" class="label">反向处理保留原记录、原政策版本及审批依据；关账期通过当前开放期间调整。</text><path d="M750 192 L750 250" fill="none" stroke="#60818a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M630 300 L210 300 L210 420" fill="none" stroke="#60818a" stroke-width="2"  marker-end="url(#arrow)"/><rect x="320.5" y="270" width="169" height="25" rx="4" fill="#f6f8fa"/><text x="405" y="288" text-anchor="middle" class="label">退货或累计档位变化</text><path d="M750 350 L750 420" fill="none" stroke="#60818a" stroke-width="2"  marker-end="url(#arrow)"/><rect x="758" y="372" width="84" height="25" rx="4" fill="#f6f8fa"/><text x="800" y="390" text-anchor="middle" class="label">费用撤销</text><path d="M870 300 L1270 300 L1270 420" fill="none" stroke="#60818a" stroke-width="2"  marker-end="url(#arrow)"/><rect x="1048" y="270" width="84" height="25" rx="4" fill="#f6f8fa"/><text x="1090" y="288" text-anchor="middle" class="label">政策变更</text><path d="M210 492 L210 550" fill="none" stroke="#60818a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M210 622 L210 680" fill="none" stroke="#60818a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M210 752 L210 810" fill="none" stroke="#60818a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M210 910 L210 970" fill="none" stroke="#60818a" stroke-width="2"  marker-end="url(#arrow)"/><rect x="225.5" y="925" width="67" height="25" rx="4" fill="#f6f8fa"/><text x="259" y="943" text-anchor="middle" class="label">有缺口</text><path d="M330 860 L440 860 L440 1276 L600 1276" fill="none" stroke="#60818a" stroke-width="2"  marker-end="url(#arrow)"/><rect x="366.5" y="829" width="67" height="25" rx="4" fill="#f6f8fa"/><text x="400" y="847" text-anchor="middle" class="label">无缺口</text><path d="M210 1042 L25 1042 L25 1276 L600 1276" fill="none" stroke="#60818a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M750 492 L750 550" fill="none" stroke="#60818a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M750 650 L750 700" fill="none" stroke="#60818a" stroke-width="2"  marker-end="url(#arrow)"/><rect x="758.5" y="663" width="67" height="25" rx="4" fill="#f6f8fa"/><text x="792" y="681" text-anchor="middle" class="label">已支付</text><path d="M870 600 L1010 600 L1010 996 L900 996" fill="none" stroke="#60818a" stroke-width="2"  marker-end="url(#arrow)"/><rect x="921" y="568" width="84" height="25" rx="4" fill="#f6f8fa"/><text x="963" y="586" text-anchor="middle" class="label">尚未支付</text><path d="M750 772 L750 830" fill="none" stroke="#60818a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M750 902 L750 960" fill="none" stroke="#60818a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M750 1032 L750 1090" fill="none" stroke="#60818a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M750 1162 L750 1240" fill="none" stroke="#60818a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M1270 492 L1270 550" fill="none" stroke="#60818a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M1270 622 L1270 655 L1460 655 L1460 1276 L900 1276" fill="none" stroke="#60818a" stroke-width="2"  marker-end="url(#arrow)"/><rect x="600" y="120" width="300" height="72" rx="12" fill="#e8f4ef" stroke="#93b2b8" stroke-width="1.5"/><text x="750" y="149" text-anchor="middle" class="node">发生退货、费用撤销</text><text x="750" y="177" text-anchor="middle" class="node">或政策及跨期调整</text><path d="M750 250L870 300L750 350L630 300Z" fill="#fff5dc" stroke="#b59855" stroke-width="1.5"/><text x="750" y="307" text-anchor="middle" class="node">调整类型</text><rect x="60" y="420" width="300" height="72" rx="12" fill="#fff" stroke="#93b2b8" stroke-width="1.5"/><text x="210" y="449" text-anchor="middle" class="node">引用原销售与原单据</text><text x="210" y="477" text-anchor="middle" class="node">锁定原政策及合同版本</text><rect x="60" y="550" width="300" height="72" rx="12" fill="#fff" stroke="#93b2b8" stroke-width="1.5"/><text x="210" y="579" text-anchor="middle" class="node">重算销售贡献</text><text x="210" y="607" text-anchor="middle" class="node">及累计应预留金额</text><rect x="60" y="680" width="300" height="72" rx="12" fill="#fff" stroke="#93b2b8" stroke-width="1.5"/><text x="210" y="709" text-anchor="middle" class="node">仅释放合同允许的</text><text x="210" y="737" text-anchor="middle" class="node">未确认预留</text><path d="M210 810L330 860L210 910L90 860Z" fill="#fff5dc" stroke="#b59855" stroke-width="1.5"/><text x="210" y="867" text-anchor="middle" class="node">调整后是否有缺口</text><rect x="60" y="970" width="300" height="72" rx="12" fill="#fff" stroke="#93b2b8" stroke-width="1.5"/><text x="210" y="999" text-anchor="middle" class="node">保留已用及合同义务</text><text x="210" y="1027" text-anchor="middle" class="node">登记缺口并审批补足</text><rect x="600" y="420" width="300" height="72" rx="12" fill="#fff" stroke="#93b2b8" stroke-width="1.5"/><text x="750" y="449" text-anchor="middle" class="node">确认撤销费用</text><text x="750" y="477" text-anchor="middle" class="node">核对冲销依据</text><path d="M750 550L870 600L750 650L630 600Z" fill="#fff5dc" stroke="#b59855" stroke-width="1.5"/><text x="750" y="607" text-anchor="middle" class="node">费用是否已支付</text><rect x="600" y="700" width="300" height="72" rx="12" fill="#fff" stroke="#93b2b8" stroke-width="1.5"/><text x="750" y="729" text-anchor="middle" class="node">追偿或退款到账</text><text x="750" y="757" text-anchor="middle" class="node">保留历史支付记录</text><rect x="600" y="830" width="300" height="72" rx="12" fill="#fff" stroke="#93b2b8" stroke-width="1.5"/><text x="750" y="859" text-anchor="middle" class="node">登记已收回待冲销</text><text x="750" y="887" text-anchor="middle" class="node">不直接恢复可用预算</text><rect x="600" y="960" width="300" height="72" rx="12" fill="#fff" stroke="#93b2b8" stroke-width="1.5"/><text x="750" y="989" text-anchor="middle" class="node">审批通过后冲销费用</text><text x="750" y="1017" text-anchor="middle" class="node">关联原确认及清偿记录</text><rect x="600" y="1090" width="300" height="72" rx="12" fill="#fff" stroke="#93b2b8" stroke-width="1.5"/><text x="750" y="1119" text-anchor="middle" class="node">恢复可用额度</text><text x="750" y="1147" text-anchor="middle" class="node">或优先减少缺口</text><rect x="1120" y="420" width="300" height="72" rx="12" fill="#fff" stroke="#93b2b8" stroke-width="1.5"/><text x="1270" y="449" text-anchor="middle" class="node">新政策版本审批生效</text><text x="1270" y="477" text-anchor="middle" class="node">旧版本保留归档</text><rect x="1120" y="550" width="300" height="72" rx="12" fill="#fff" stroke="#93b2b8" stroke-width="1.5"/><text x="1270" y="579" text-anchor="middle" class="node">存量沿用原版本</text><text x="1270" y="607" text-anchor="middle" class="node">追溯变更使用差额调整单</text><rect x="600" y="1240" width="300" height="72" rx="12" fill="#e0f1e8" stroke="#93b2b8" stroke-width="1.5"/><text x="750" y="1269" text-anchor="middle" class="node">更新调整链并重新对平</text><text x="750" y="1297" text-anchor="middle" class="node">预算、费用与清偿分别核对</text><rect x="60" y="1120" width="350" height="79" rx="10" fill="#e8f4ef"/><text x="235" y="1149" text-anchor="middle" class="label">缺口存在时暂停新增释放</text><text x="235" y="1177" text-anchor="middle" class="label">不把已用费用直接删掉</text><rect x="1030" y="800" width="400" height="79" rx="10" fill="#e8f4ef"/><text x="1230" y="829" text-anchor="middle" class="label">退款到账与预算恢复分两步</text><text x="1230" y="857" text-anchor="middle" class="label">先确认资金收回，再审批冲销</text><rect x="345" y="1360" width="900" height="52" rx="10" fill="#e8f4ef"/><text x="795" y="1389" text-anchor="middle" class="label">所有差额、释放和冲回均保留审计链；重复事件不重复入账。</text></svg>