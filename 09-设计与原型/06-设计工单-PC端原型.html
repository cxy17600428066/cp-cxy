<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>设计工单系统统一原型</title>
  <style>
    :root {
      --panel: #ffffff;
      --panel-soft: #f8fafc;
      --ink: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --brand: #c2410c;
      --brand-deep: #9a3412;
      --brand-soft: rgba(194, 65, 12, 0.08);
      --good: #047857;
      --good-soft: rgba(4, 120, 87, 0.08);
      --warn: #b45309;
      --warn-soft: rgba(180, 83, 9, 0.08);
      --info: #1d4ed8;
      --info-soft: rgba(29, 78, 216, 0.08);
      --shadow: 0 18px 42px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Microsoft YaHei UI", "PingFang SC", "Source Han Sans SC", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top right, rgba(194, 65, 12, 0.08), transparent 26%),
        linear-gradient(180deg, #f8fafc 0%, #f3f5f7 100%);
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: 82px 1fr;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 24px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }

    .brand strong {
      display: block;
      font-size: 20px;
      font-weight: 800;
    }

    .brand span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .top-actions,
    .tabs,
    .filters,
    .actions,
    .port-switch,
    .role-switch {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .content {
      padding: 16px;
    }

    .page {
      max-width: 1440px;
      margin: 0 auto;
      display: none;
      gap: 16px;
    }

    .page.active {
      display: grid;
    }

    .list-page {
      grid-template-columns: 1fr;
    }

    .detail-page {
      grid-template-columns: minmax(0, 1fr) 340px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-head {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
    }

    .panel-head h2,
    .panel-head h3 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
    }

    .panel-head p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .tab,
    .filter,
    .port-btn,
    .role-btn,
    .btn,
    .step-pill,
    .pill {
      border: 0;
      border-radius: 999px;
    }

    .tab,
    .filter,
    .port-btn,
    .role-btn {
      padding: 10px 16px;
      background: #fff;
      border: 1px solid var(--line);
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
    }

    .tab.active,
    .filter.active,
    .port-btn.active,
    .role-btn.active {
      color: var(--brand-deep);
      background: var(--brand-soft);
      border-color: rgba(194, 65, 12, 0.24);
    }

    .toolbar {
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-soft);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .stats {
      padding: 18px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      border-bottom: 1px solid var(--line);
      background: #fcfcfd;
    }

    .stat {
      padding: 16px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: var(--panel-soft);
    }

    .stat span {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .stat strong {
      display: block;
      font-size: 24px;
      font-weight: 800;
    }

    .list-wrap {
      padding: 18px;
      display: grid;
      gap: 12px;
    }

    .ticket {
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 16px;
      background: linear-gradient(180deg, #ffffff 0%, #fafbfc 100%);
      display: grid;
      gap: 12px;
    }

    .ticket-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
    }

    .ticket h4 {
      margin: 0;
      font-size: 17px;
      line-height: 1.5;
    }

    .meta {
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 800;
    }

    .pill.warn {
      color: var(--warn);
      background: var(--warn-soft);
    }

    .pill.info {
      color: var(--info);
      background: var(--info-soft);
    }

    .pill.brand {
      color: var(--brand-deep);
      background: var(--brand-soft);
    }

    .pill.good {
      color: var(--good);
      background: var(--good-soft);
    }

    .btn {
      padding: 11px 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-primary {
      color: #fff;
      background: linear-gradient(135deg, var(--brand), #ea580c);
    }

    .btn-secondary {
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
    }

    .btn-ghost {
      color: var(--muted);
      background: var(--panel-soft);
      border: 1px solid var(--line);
    }

    .detail-main,
    .detail-side {
      display: grid;
      gap: 16px;
    }

    .card {
      padding: 18px;
      border-radius: 24px;
      border: 1px solid var(--line);
      background: #fff;
    }

    .steps {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .step-pill {
      padding: 10px 14px;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 13px;
      font-weight: 700;
    }

    .step-pill.done {
      background: var(--good-soft);
      border-color: rgba(4, 120, 87, 0.22);
    }

    .step-pill.active {
      background: var(--brand-soft);
      border-color: rgba(194, 65, 12, 0.24);
      color: var(--brand-deep);
    }

    .summary-grid,
    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .summary-item {
      padding: 14px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: var(--panel-soft);
    }

    .summary-item span {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .summary-item strong {
      display: block;
      font-size: 15px;
      line-height: 1.6;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      padding: 11px 12px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
    }

    .field textarea {
      min-height: 98px;
      resize: vertical;
      line-height: 1.7;
    }

    .section-title {
      margin: 0 0 12px;
      font-size: 18px;
      font-weight: 800;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .list-box {
      display: grid;
      gap: 10px;
    }

    .list-item {
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: #fff;
    }

    .list-item strong {
      display: block;
      margin-bottom: 4px;
      font-size: 14px;
    }

    .empty {
      padding: 16px;
      border-radius: 16px;
      border: 1px dashed #d1d5db;
      background: #fafbfc;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
    }

    @media (max-width: 1180px) {
      .detail-page {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 900px) {
      .stats,
      .summary-grid,
      .field-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <strong id="systemTitle">设计工单系统</strong>
        <span id="systemDesc">统一切换端口后，列表页与详情页的数据、文案和操作同步联动。</span>
      </div>
      <div class="top-actions">
        <div class="port-switch" id="portSwitch"></div>
        <button class="btn btn-secondary" id="resetData">恢复演示数据</button>
      </div>
    </header>

    <main class="content">
      <section class="page list-page active" id="listPage">
        <div class="panel">
          <div class="panel-head">
            <div>
              <h2 id="listTitle">工单列表</h2>
              <p id="listDesc">先查看工单列表，再进入详情页执行提交、确认、上传和关闭等动作。</p>
            </div>
            <div class="tabs">
              <button class="tab active" data-page="list">列表页</button>
              <button class="tab" data-page="detail">详情页</button>
            </div>
          </div>
          <div class="stats" id="statsRow"></div>
          <div class="toolbar">
            <div class="filters" id="filterBar"></div>
            <div class="actions">
              <button class="btn btn-primary" id="createTicket">新建工单</button>
            </div>
          </div>
          <div class="list-wrap" id="ticketContainer"></div>
        </div>
      </section>

      <section class="page detail-page" id="detailPage">
        <div class="detail-main">
          <div class="panel">
            <div class="panel-head">
              <div>
                <h2 id="detailTitle">工单详情</h2>
                <p id="detailDesc">查看工单详情并按流程完成当前操作。</p>
              </div>
              <div class="tabs">
                <button class="tab" data-page="list">列表页</button>
                <button class="tab active" data-page="detail">详情页</button>
              </div>
            </div>
            <div class="card" style="border:0; border-radius:0;">
              <div class="steps" id="stepRow"></div>
              <div class="actions" style="justify-content:space-between; align-items:center; margin-top:14px; flex-wrap:wrap;">
                <div class="role-switch" id="roleBar"></div>
                <div class="pill brand" id="roleHint">当前角色：提需求方</div>
              </div>
            </div>
          </div>

          <div class="panel">
            <div class="card" style="border:0; border-radius:0;">
              <h3 class="section-title">基础信息</h3>
              <div class="summary-grid" id="summaryGrid"></div>
            </div>
          </div>

          <div class="panel">
            <div class="card" style="border:0; border-radius:0;" id="formPanel"></div>
          </div>
        </div>

        <aside class="detail-side">
          <div class="panel">
            <div class="card" style="border:0; border-radius:0;">
              <h3 class="section-title">设计文件</h3>
              <div class="list-box" id="fileBox"></div>
            </div>
          </div>
          <div class="panel">
            <div class="card" style="border:0; border-radius:0;">
              <h3 class="section-title">处理记录</h3>
              <div class="list-box" id="historyBox"></div>
            </div>
          </div>
        </aside>
      </section>
    </main>
  </div>

  <script>
    const steps = [
      { key: "submitted", label: "提交需求" },
      { key: "accepted", label: "设计确认" },
      { key: "scheduled", label: "确认时间" },
      { key: "delivered", label: "上传文件" },
      { key: "closed", label: "关闭工单" }
    ];

    const roles = [
      { key: "requester", label: "提需求方" },
      { key: "designer", label: "设计部门" }
    ];

    const statusMap = {
      pending_confirm: { label: "待设计确认", step: "submitted", tone: "warn" },
      confirming_time: { label: "待确认完成时间", step: "accepted", tone: "info" },
      designing: { label: "设计中", step: "scheduled", tone: "brand" },
      waiting_acceptance: { label: "待确认设计文件", step: "delivered", tone: "info" },
      closed: { label: "已关闭", step: "closed", tone: "good" }
    };

    const portConfigs = {
      pc: {
        label: "PC端",
        systemTitle: "设计工单系统 PC端",
        systemDesc: "面向公司员工与设计部门的桌面端工单处理台。",
        listTitle: "PC端工单列表",
        listDesc: "用于后台查看、筛选、分配和进入处理工单。",
        detailDescPrefix: "PC端详情页",
        createLabel: "新建PC工单",
        requesterActions: {
          save: "保存草稿",
          submit: "提交需求",
          confirmTime: "确认完成时间",
          confirmFile: "确认设计文件",
          close: "关闭工单"
        },
        designerActions: {
          accept: "确认需求",
          estimate: "提交完成时间",
          upload: "上传设计文件"
        }
      },
      applet: {
        label: "小程序端",
        systemTitle: "设计工单系统 小程序端",
        systemDesc: "面向员工移动提单与设计部门移动处理的小程序端页面。",
        listTitle: "小程序端工单列表",
        listDesc: "用于移动端快速查看我的工单、进入详情并确认处理。",
        detailDescPrefix: "小程序端详情页",
        createLabel: "新建小程序工单",
        requesterActions: {
          save: "保存需求",
          submit: "提交需求",
          confirmTime: "确认时间",
          confirmFile: "确认文件",
          close: "关闭工单"
        },
        designerActions: {
          accept: "确认接单",
          estimate: "反馈时间",
          upload: "上传文件"
        }
      }
    };

    const initialData = {
      pc: [
        {
          id: "PC-DES-20260419-001",
          title: "五一活动海报设计",
          applicant: "市场部 / 李晓",
          designer: "品牌设计组 / 陈可",
          type: "海报设计",
          channel: "PC后台活动投放",
          priority: "高",
          due: "2026-04-22 18:00",
          attachment: "活动方案_v3.pdf",
          desc: "需产出五一活动主海报 1 张、活动长图 1 张，用于公众号和朋友圈投放。",
          status: "waiting_acceptance",
          files: [
            { name: "五一活动海报_预览.jpg", note: "客户确认用预览图", type: "预览图" },
            { name: "五一活动海报_源文件.psd", note: "可继续编辑的源文件", type: "源文件" }
          ],
          history: [
            "04-19 09:30 提需求方提交需求",
            "04-19 10:20 设计部门确认需求",
            "04-19 10:35 设计部门反馈预计完成时间",
            "04-19 10:48 提需求方确认完成时间",
            "04-21 17:36 设计部门上传设计文件"
          ]
        },
        {
          id: "PC-DES-20260419-002",
          title: "新品详情页长图设计",
          applicant: "电商部 / 周静",
          designer: "电商设计组 / 王卓",
          type: "详情页设计",
          channel: "PC电商运营后台",
          priority: "中",
          due: "2026-04-24 12:00",
          attachment: "新品卖点梳理.xlsx",
          desc: "新品无骨鸡爪需输出一版电商详情页长图，包含卖点首屏、口味介绍、工艺说明和场景图。",
          status: "designing",
          files: [],
          history: [
            "04-19 11:20 提需求方提交需求",
            "04-19 12:05 设计部门确认需求",
            "04-19 12:15 提需求方确认预计完成时间"
          ]
        }
      ],
      applet: [
        {
          id: "MP-DES-20260419-001",
          title: "门店开业展架设计",
          applicant: "渠道部 / 何洋",
          designer: "平面设计组 / 林安",
          type: "物料设计",
          channel: "小程序移动提单",
          priority: "紧急",
          due: "",
          attachment: "门店开业需求说明.docx",
          desc: "门店开业需要一套展架和吊旗设计，需突出新品试吃和门店活动权益。",
          status: "pending_confirm",
          files: [],
          history: [
            "04-19 14:10 提需求方提交需求"
          ]
        },
        {
          id: "MP-DES-20260419-002",
          title: "朋友圈海报快速修改",
          applicant: "品牌部 / 徐宁",
          designer: "平面设计组 / 赵羽",
          type: "海报设计",
          channel: "小程序移动审批",
          priority: "高",
          due: "2026-04-20 16:00",
          attachment: "朋友圈文案.txt",
          desc: "需要对现有朋友圈海报做主题替换和日期更新，移动端快速确认。",
          status: "confirming_time",
          files: [],
          history: [
            "04-19 15:10 提需求方提交需求",
            "04-19 15:22 设计部门确认需求"
          ]
        }
      ]
    };

    let currentPort = "pc";
    let currentPage = "list";
    let currentFilter = "all";
    let currentRole = "requester";
    let ticketsByPort = cloneAllData();
    let activeIds = {
      pc: ticketsByPort.pc[0].id,
      applet: ticketsByPort.applet[0].id
    };

    const listPage = document.getElementById("listPage");
    const detailPage = document.getElementById("detailPage");
    const systemTitle = document.getElementById("systemTitle");
    const systemDesc = document.getElementById("systemDesc");
    const portSwitch = document.getElementById("portSwitch");
    const listTitle = document.getElementById("listTitle");
    const listDesc = document.getElementById("listDesc");
    const statsRow = document.getElementById("statsRow");
    const filterBar = document.getElementById("filterBar");
    const ticketContainer = document.getElementById("ticketContainer");
    const createTicketBtn = document.getElementById("createTicket");
    const detailTitle = document.getElementById("detailTitle");
    const detailDesc = document.getElementById("detailDesc");
    const stepRow = document.getElementById("stepRow");
    const roleBar = document.getElementById("roleBar");
    const roleHint = document.getElementById("roleHint");
    const summaryGrid = document.getElementById("summaryGrid");
    const formPanel = document.getElementById("formPanel");
    const fileBox = document.getElementById("fileBox");
    const historyBox = document.getElementById("historyBox");

    function cloneAllData() {
      return JSON.parse(JSON.stringify(initialData));
    }

    function currentConfig() {
      return portConfigs[currentPort];
    }

    function currentTickets() {
      return ticketsByPort[currentPort];
    }

    function getActiveTicket() {
      const list = currentTickets();
      return list.find(ticket => ticket.id === activeIds[currentPort]) || list[0];
    }

    function getStatusPill(status) {
      const meta = statusMap[status];
      return `<span class="pill ${meta.tone}">${meta.label}</span>`;
    }

    function appendHistory(ticket, text) {
      ticket.history.push(`04-19 16:30 ${text}`);
    }

    function switchPage(page) {
      currentPage = page;
      listPage.classList.toggle("active", page === "list");
      detailPage.classList.toggle("active", page === "detail");
      [...document.querySelectorAll("[data-page]")].forEach(button => {
        button.classList.toggle("active", button.dataset.page === page);
      });
    }

    function renderPortSwitch() {
      portSwitch.innerHTML = Object.entries(portConfigs).map(([key, config]) => `
        <button class="port-btn ${key === currentPort ? "active" : ""}" data-port="${key}">${config.label}</button>
      `).join("");

      [...portSwitch.querySelectorAll("[data-port]")].forEach(button => {
        button.addEventListener("click", () => {
          currentPort = button.dataset.port;
          currentFilter = "all";
          currentRole = "requester";
          renderAll();
        });
      });
    }

    function renderHeaderCopy() {
      const config = currentConfig();
      systemTitle.textContent = config.systemTitle;
      systemDesc.textContent = config.systemDesc;
      listTitle.textContent = config.listTitle;
      listDesc.textContent = config.listDesc;
      createTicketBtn.textContent = config.createLabel;
    }

    function renderStats() {
      const list = currentTickets();
      const counts = {
        total: list.length,
        pending: list.filter(item => item.status !== "closed").length,
        confirm: list.filter(item => item.status === "waiting_acceptance").length,
        closed: list.filter(item => item.status === "closed").length
      };

      statsRow.innerHTML = `
        <div class="stat"><span>全部工单</span><strong>${counts.total}</strong></div>
        <div class="stat"><span>处理中</span><strong>${counts.pending}</strong></div>
        <div class="stat"><span>待确认文件</span><strong>${counts.confirm}</strong></div>
        <div class="stat"><span>已关闭</span><strong>${counts.closed}</strong></div>
      `;
    }

    function renderFilters() {
      const filters = [
        { key: "all", label: "全部" },
        { key: "pending_confirm", label: "待设计确认" },
        { key: "confirming_time", label: "待确认时间" },
        { key: "designing", label: "设计中" },
        { key: "waiting_acceptance", label: "待确认文件" },
        { key: "closed", label: "已关闭" }
      ];

      filterBar.innerHTML = filters.map(item => `
        <button class="filter ${item.key === currentFilter ? "active" : ""}" data-filter="${item.key}">${item.label}</button>
      `).join("");

      [...filterBar.querySelectorAll("[data-filter]")].forEach(button => {
        button.addEventListener("click", () => {
          currentFilter = button.dataset.filter;
          renderList();
        });
      });
    }

    function renderList() {
      renderHeaderCopy();
      renderStats();
      renderFilters();

      const config = currentConfig();
      const list = currentTickets().filter(ticket => currentFilter === "all" || ticket.status === currentFilter);
      if (!list.length) {
        ticketContainer.innerHTML = `<div class="empty">当前端口和筛选条件下暂无工单。</div>`;
        return;
      }

      ticketContainer.innerHTML = list.map(ticket => `
        <article class="ticket">
          <div class="ticket-head">
            <div>
              <h4>${ticket.title}</h4>
              <div class="meta">
                <span>${ticket.id}</span>
                <span>${ticket.applicant}</span>
                <span>${ticket.due ? `预计完成：${ticket.due}` : "待确认完成时间"}</span>
                <span>${ticket.channel}</span>
              </div>
            </div>
            <div class="actions">
              ${getStatusPill(ticket.status)}
              <span class="pill brand">${ticket.type}</span>
            </div>
          </div>
          <div class="actions">
            <button class="btn btn-secondary" data-view="${ticket.id}">查看详情</button>
            <button class="btn btn-primary" data-open="${ticket.id}">进入${config.label}处理</button>
          </div>
        </article>
      `).join("");

      [...ticketContainer.querySelectorAll("[data-view], [data-open]")].forEach(button => {
        button.addEventListener("click", () => {
          activeIds[currentPort] = button.dataset.view || button.dataset.open;
          switchPage("detail");
          renderDetail();
        });
      });
    }

    function renderSteps(ticket) {
      const currentStep = statusMap[ticket.status].step;
      const currentIndex = steps.findIndex(item => item.key === currentStep);
      stepRow.innerHTML = steps.map((item, index) => `
        <div class="step-pill ${index < currentIndex ? "done" : index === currentIndex ? "active" : ""}">
          ${item.label}
        </div>
      `).join("");
    }

    function renderRoles() {
      roleBar.innerHTML = roles.map(role => `
        <button class="role-btn ${role.key === currentRole ? "active" : ""}" data-role="${role.key}">${role.label}</button>
      `).join("");

      [...roleBar.querySelectorAll("[data-role]")].forEach(button => {
        button.addEventListener("click", () => {
          currentRole = button.dataset.role;
          renderDetail();
        });
      });
    }

    function renderSummary(ticket) {
      summaryGrid.innerHTML = `
        <div class="summary-item"><span>工单编号</span><strong>${ticket.id}</strong></div>
        <div class="summary-item"><span>当前状态</span><strong>${statusMap[ticket.status].label}</strong></div>
        <div class="summary-item"><span>需求部门 / 提交人</span><strong>${ticket.applicant}</strong></div>
        <div class="summary-item"><span>设计负责人</span><strong>${ticket.designer || "待分配"}</strong></div>
        <div class="summary-item"><span>需求类型</span><strong>${ticket.type}</strong></div>
        <div class="summary-item"><span>提交端口</span><strong>${currentConfig().label}</strong></div>
      `;
    }

    function commonFields(ticket, readonly) {
      const disabled = readonly ? "disabled" : "";
      return `
        <div class="field-grid">
          <div class="field">
            <label>需求标题</label>
            <input id="field-title" value="${ticket.title}" ${disabled} />
          </div>
          <div class="field">
            <label>需求部门 / 提交人</label>
            <input id="field-applicant" value="${ticket.applicant}" ${disabled} />
          </div>
          <div class="field">
            <label>设计负责人</label>
            <input id="field-designer" value="${ticket.designer}" ${disabled} />
          </div>
          <div class="field">
            <label>需求类型</label>
            <select id="field-type" ${disabled}>
              ${["海报设计", "详情页设计", "物料设计", "包装设计", "其它"].map(item => `<option value="${item}" ${ticket.type === item ? "selected" : ""}>${item}</option>`).join("")}
            </select>
          </div>
          <div class="field">
            <label>提单端口</label>
            <input value="${currentConfig().label}" disabled />
          </div>
          <div class="field">
            <label>优先级</label>
            <input id="field-priority" value="${ticket.priority}" ${disabled} />
          </div>
          <div class="field">
            <label>预计完成时间</label>
            <input id="field-due" value="${ticket.due}" placeholder="例如：2026-04-24 18:00" ${disabled} />
          </div>
          <div class="field">
            <label>需求附件</label>
            <input id="field-attachment" value="${ticket.attachment}" ${disabled} />
          </div>
          <div class="field full">
            <label>需求说明</label>
            <textarea id="field-desc" ${disabled}>${ticket.desc}</textarea>
          </div>
        </div>
      `;
    }

    function renderRequesterForm(ticket) {
      const labels = currentConfig().requesterActions;

      if (ticket.status === "pending_confirm") {
        return `
          <h3 class="section-title">提交需求</h3>
          <p class="hint">当前为${currentConfig().label}提需求方操作界面，可先保存再提交。</p>
          ${commonFields(ticket, false)}
          <div class="actions" style="margin-top:14px;">
            <button class="btn btn-ghost" data-action="save-request">${labels.save}</button>
            <button class="btn btn-primary" data-action="submit-request">${labels.submit}</button>
          </div>
        `;
      }

      if (ticket.status === "confirming_time") {
        return `
          <h3 class="section-title">确认完成时间</h3>
          <p class="hint">当前由提需求方确认设计部门反馈的完成时间。</p>
          ${commonFields(ticket, true)}
          <div class="actions" style="margin-top:14px;">
            <button class="btn btn-primary" data-action="confirm-time">${labels.confirmTime}</button>
          </div>
        `;
      }

      if (ticket.status === "waiting_acceptance") {
        return `
          <h3 class="section-title">确认设计文件</h3>
          <p class="hint">请确认设计文件，确认无误后关闭工单。</p>
          ${commonFields(ticket, true)}
          <div class="actions" style="margin-top:14px;">
            <button class="btn btn-secondary" data-action="confirm-file">${labels.confirmFile}</button>
            <button class="btn btn-primary" data-action="close-ticket">${labels.close}</button>
          </div>
        `;
      }

      return `
        <h3 class="section-title">工单详情</h3>
        <p class="hint">当前步骤无需提需求方继续处理，可查看工单信息与记录。</p>
        ${commonFields(ticket, true)}
      `;
    }

    function renderDesignerForm(ticket) {
      const labels = currentConfig().designerActions;

      if (ticket.status === "pending_confirm") {
        return `
          <h3 class="section-title">确认需求</h3>
          <p class="hint">设计部门确认需求可承接后，进入完成时间确认环节。</p>
          ${commonFields(ticket, false)}
          <div class="actions" style="margin-top:14px;">
            <button class="btn btn-primary" data-action="accept-ticket">${labels.accept}</button>
          </div>
        `;
      }

      if (ticket.status === "confirming_time") {
        return `
          <h3 class="section-title">反馈完成时间</h3>
          <p class="hint">请填写预计完成时间并提交给提需求方确认。</p>
          ${commonFields(ticket, false)}
          <div class="actions" style="margin-top:14px;">
            <button class="btn btn-primary" data-action="estimate-time">${labels.estimate}</button>
          </div>
        `;
      }

      if (ticket.status === "designing") {
        return `
          <h3 class="section-title">上传设计文件</h3>
          <p class="hint">上传预览图与源文件后，工单进入提需求方确认阶段。</p>
          ${commonFields(ticket, true)}
          <div class="field-grid" style="margin-top:14px;">
            <div class="field">
              <label>预览图文件名</label>
              <input id="upload-preview" placeholder="例如：活动海报_预览.jpg" />
            </div>
            <div class="field">
              <label>源文件名</label>
              <input id="upload-source" placeholder="例如：活动海报_源文件.psd" />
            </div>
            <div class="field full">
              <label>交付说明</label>
              <textarea id="upload-note" placeholder="填写设计版本或交付说明。"></textarea>
            </div>
          </div>
          <div class="actions" style="margin-top:14px;">
            <button class="btn btn-primary" data-action="upload-files">${labels.upload}</button>
          </div>
        `;
      }

      return `
        <h3 class="section-title">工单详情</h3>
        <p class="hint">当前步骤无需设计部门继续处理，可查看工单信息与记录。</p>
        ${commonFields(ticket, true)}
      `;
    }

    function saveCommonFields(ticket) {
      const keys = ["title", "applicant", "designer", "type", "priority", "due", "attachment", "desc"];
      keys.forEach(key => {
        const node = document.getElementById(`field-${key}`);
        if (node) {
          ticket[key] = node.value.trim();
        }
      });
    }

    function bindFormActions(ticket) {
      [...formPanel.querySelectorAll("[data-action]")].forEach(button => {
        button.addEventListener("click", () => {
          const action = button.dataset.action;

          if (action === "save-request") {
            saveCommonFields(ticket);
            appendHistory(ticket, `${currentConfig().label}提需求方保存需求草稿`);
          }

          if (action === "submit-request") {
            saveCommonFields(ticket);
            appendHistory(ticket, `${currentConfig().label}提需求方提交需求`);
          }

          if (action === "accept-ticket") {
            saveCommonFields(ticket);
            ticket.status = "confirming_time";
            appendHistory(ticket, `${currentConfig().label}设计部门确认需求`);
          }

          if (action === "estimate-time") {
            saveCommonFields(ticket);
            if (!ticket.due) {
              ticket.due = "2026-04-23 18:00";
            }
            appendHistory(ticket, `${currentConfig().label}设计部门反馈预计完成时间 ${ticket.due}`);
          }

          if (action === "confirm-time") {
            ticket.status = "designing";
            appendHistory(ticket, `${currentConfig().label}提需求方确认完成时间`);
          }

          if (action === "upload-files") {
            const previewName = document.getElementById("upload-preview")?.value.trim() || "设计预览图.jpg";
            const sourceName = document.getElementById("upload-source")?.value.trim() || "设计源文件.psd";
            const note = document.getElementById("upload-note")?.value.trim() || "设计部门已上传设计文件";
            ticket.files = [
              { name: previewName, note, type: "预览图" },
              { name: sourceName, note, type: "源文件" }
            ];
            ticket.status = "waiting_acceptance";
            appendHistory(ticket, `${currentConfig().label}设计部门上传设计文件`);
          }

          if (action === "confirm-file") {
            appendHistory(ticket, `${currentConfig().label}提需求方确认设计文件`);
          }

          if (action === "close-ticket") {
            ticket.status = "closed";
            appendHistory(ticket, `${currentConfig().label}提需求方关闭工单`);
          }

          renderAll();
          switchPage("detail");
        });
      });
    }

    function renderFiles(ticket) {
      fileBox.innerHTML = ticket.files.length ? ticket.files.map(file => `
        <div class="list-item">
          <strong>${file.name}</strong>
          <div class="hint">${file.type} · ${file.note}</div>
        </div>
      `).join("") : `<div class="empty">当前端口下该工单暂无已上传设计文件。</div>`;
    }

    function renderHistory(ticket) {
      historyBox.innerHTML = ticket.history.map(item => `
        <div class="list-item">
          <strong>${item.split(" ").slice(0, 2).join(" ")}</strong>
          <div class="hint">${item.split(" ").slice(2).join(" ")}</div>
        </div>
      `).join("");
    }

    function renderDetail() {
      const ticket = getActiveTicket();
      if (!ticket) {
        return;
      }

      detailTitle.textContent = `${currentConfig().label}工单详情`;
      detailDesc.textContent = `${currentConfig().detailDescPrefix} · ${ticket.id} · ${statusMap[ticket.status].label} · ${ticket.applicant}`;
      roleHint.textContent = `当前角色：${roles.find(role => role.key === currentRole).label}`;

      renderSteps(ticket);
      renderRoles();
      renderSummary(ticket);
      formPanel.innerHTML = currentRole === "requester" ? renderRequesterForm(ticket) : renderDesignerForm(ticket);
      renderFiles(ticket);
      renderHistory(ticket);
      bindFormActions(ticket);
    }

    function bindPageTabs() {
      [...document.querySelectorAll("[data-page]")].forEach(button => {
        button.addEventListener("click", () => {
          switchPage(button.dataset.page);
          if (button.dataset.page === "detail") {
            renderDetail();
          }
        });
      });
    }

    function createTicket() {
      const nextIndex = currentTickets().length + 1;
      const prefix = currentPort === "pc" ? "PC" : "MP";
      const next = {
        id: `${prefix}-DES-20260419-00${nextIndex}`,
        title: currentPort === "pc" ? "新建PC设计需求" : "新建小程序设计需求",
        applicant: currentPort === "pc" ? "待填写部门 / 待填写" : "移动提交人 / 待填写",
        designer: "待分配",
        type: "海报设计",
        channel: `${currentConfig().label}新建工单`,
        priority: "中",
        due: "",
        attachment: "",
        desc: "",
        status: "pending_confirm",
        files: [],
        history: [`04-19 16:30 系统创建${currentConfig().label}新工单`]
      };
      currentTickets().unshift(next);
      activeIds[currentPort] = next.id;
      currentRole = "requester";
      renderAll();
      switchPage("detail");
    }

    function renderAll() {
      renderPortSwitch();
      renderHeaderCopy();
      renderList();
      renderDetail();
    }

    document.getElementById("createTicket").addEventListener("click", createTicket);
    document.getElementById("resetData").addEventListener("click", () => {
      ticketsByPort = cloneAllData();
      currentPort = "pc";
      currentFilter = "all";
      currentRole = "requester";
      activeIds = {
        pc: ticketsByPort.pc[0].id,
        applet: ticketsByPort.applet[0].id
      };
      renderAll();
      switchPage("list");
    });

    bindPageTabs();
    renderAll();
    switchPage("list");
  </script>
</body>
</html>
