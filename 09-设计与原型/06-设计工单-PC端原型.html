<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>设计需求工单系统 PC端</title>
  <style>
    :root {
      --bg: #eef1f6;
      --panel: #ffffff;
      --panel-soft: #f8fafc;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --brand: #0f766e;
      --brand-strong: #0b5f58;
      --brand-soft: rgba(15, 118, 110, 0.1);
      --info: #1d4ed8;
      --info-soft: rgba(29, 78, 216, 0.12);
      --warn: #b45309;
      --warn-soft: rgba(180, 83, 9, 0.12);
      --good: #047857;
      --good-soft: rgba(4, 120, 87, 0.12);
      --danger: #b91c1c;
      --danger-soft: rgba(185, 28, 28, 0.12);
      --shadow: 0 18px 44px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: radial-gradient(circle at top right, rgba(15, 118, 110, 0.15), transparent 28%), linear-gradient(180deg, #f8fafc 0%, #eef1f6 100%);
      font-family: "Microsoft YaHei UI", "PingFang SC", "Source Han Sans SC", sans-serif;
    }

    button, input, textarea, select { font: inherit; }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding: 14px 22px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }

    .brand strong {
      display: block;
      font-size: 21px;
      font-weight: 900;
      letter-spacing: 0.02em;
    }

    .brand span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .top-actions,
    .switch-row,
    .filters,
    .actions,
    .page-tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .switch-group {
      display: grid;
      gap: 6px;
    }

    .switch-group label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
    }

    .switch,
    .btn,
    .pill,
    .step-pill {
      border-radius: 999px;
      border: 0;
    }

    .switch {
      cursor: pointer;
      background: #fff;
      border: 1px solid var(--line);
      color: var(--ink);
      padding: 9px 15px;
      font-size: 13px;
      font-weight: 700;
    }

    .switch.active {
      color: var(--brand-strong);
      background: var(--brand-soft);
      border-color: rgba(15, 118, 110, 0.3);
    }

    .content { padding: 16px; }

    .view {
      display: none;
      max-width: 1460px;
      margin: 0 auto;
      gap: 16px;
    }

    .view.active { display: grid; }

    .list-view { grid-template-columns: 1fr; }

    .detail-view {
      grid-template-columns: minmax(0, 1fr) 340px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-head {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
    }

    .panel-head h2,
    .panel-head h3 {
      margin: 0;
      font-size: 20px;
      font-weight: 900;
    }

    .panel-head p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .toolbar {
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
      padding: 18px;
      border-bottom: 1px solid var(--line);
      background: #fcfdff;
    }

    .stat {
      padding: 14px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: var(--panel-soft);
    }

    .stat span {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .stat strong {
      font-size: 22px;
      font-weight: 900;
    }

    .tickets {
      padding: 18px;
      display: grid;
      gap: 12px;
    }

    .ticket {
      padding: 16px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #fff 0%, #f8fbff 100%);
      display: grid;
      gap: 10px;
    }

    .ticket-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
    }

    .ticket h4 {
      margin: 0;
      font-size: 17px;
      line-height: 1.5;
    }

    .meta {
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 800;
    }

    .pill.info { color: var(--info); background: var(--info-soft); }
    .pill.warn { color: var(--warn); background: var(--warn-soft); }
    .pill.good { color: var(--good); background: var(--good-soft); }
    .pill.brand { color: var(--brand-strong); background: var(--brand-soft); }
    .pill.danger { color: var(--danger); background: var(--danger-soft); }

    .btn {
      cursor: pointer;
      font-weight: 800;
      padding: 10px 16px;
    }

    .btn-primary {
      color: #fff;
      background: linear-gradient(135deg, var(--brand), #0d9488);
    }

    .btn-secondary {
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
    }

    .btn-ghost {
      color: var(--muted);
      background: var(--panel-soft);
      border: 1px solid var(--line);
    }

    .btn-danger {
      color: #fff;
      background: linear-gradient(135deg, #b91c1c, #ef4444);
    }

    .card {
      padding: 18px;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: #fff;
    }

    .detail-main,
    .detail-side {
      display: grid;
      gap: 16px;
    }

    .steps {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .step-pill {
      padding: 9px 13px;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 12px;
      font-weight: 800;
    }

    .step-pill.done {
      background: var(--good-soft);
      border-color: rgba(4, 120, 87, 0.24);
    }

    .step-pill.active {
      color: var(--brand-strong);
      background: var(--brand-soft);
      border-color: rgba(15, 118, 110, 0.28);
    }

    .summary-grid,
    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .summary-item,
    .stack-item {
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #fff;
    }

    .summary-item span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 4px;
    }

    .summary-item strong {
      font-size: 14px;
      line-height: 1.6;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field.full { grid-column: 1 / -1; }

    .field label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
    }

    .field textarea {
      min-height: 98px;
      resize: vertical;
      line-height: 1.7;
    }

    .section-title {
      margin: 0 0 10px;
      font-size: 17px;
      font-weight: 900;
    }

    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .stack {
      display: grid;
      gap: 10px;
    }

    .stack-item strong {
      display: block;
      margin-bottom: 4px;
      font-size: 14px;
    }

    .empty {
      padding: 14px;
      border-radius: 12px;
      border: 1px dashed #cbd5e1;
      color: var(--muted);
      background: #f8fafc;
      font-size: 13px;
      line-height: 1.7;
    }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.9);
      color: #fff;
      font-size: 13px;
      opacity: 0;
      transform: translateY(8px);
      transition: all .18s ease;
      pointer-events: none;
      z-index: 40;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 1240px) {
      .detail-view { grid-template-columns: 1fr; }
    }

    @media (max-width: 900px) {
      .stats,
      .summary-grid,
      .field-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <strong>设计需求工单系统 · PC端</strong>
        <span id="systemDesc">当前演示：PC端，支持提需求方与设计部门的分角色处理。</span>
      </div>
      <div class="top-actions">
        <div class="switch-group">
          <label>当前角色</label>
          <div class="switch-row" id="roleSwitch"></div>
        </div>
        <button class="btn btn-secondary" id="resetData">恢复演示数据</button>
      </div>
    </header>

    <main class="content">
      <section class="view list-view active" id="listView">
        <div class="panel">
          <div class="panel-head">
            <div>
              <h2>PC端工单列表</h2>
              <p id="listDesc">提需求方提交需求，设计部门处理并上传文件，提需求方确认后关闭需求。</p>
            </div>
            <div class="page-tabs">
              <button class="switch active" data-view="list">列表页</button>
              <button class="switch" data-view="detail">详情页</button>
            </div>
          </div>

          <div class="stats" id="statsRow"></div>

          <div class="toolbar">
            <div class="filters" id="filterBar"></div>
            <button class="btn btn-primary" id="createTicket">新建PC端需求</button>
          </div>

          <div class="tickets" id="ticketList"></div>
        </div>
      </section>

      <section class="view detail-view" id="detailView">
        <div class="detail-main">
          <div class="panel">
            <div class="panel-head">
              <div>
                <h2 id="detailTitle">工单详情</h2>
                <p id="detailDesc">查看字段、流转步骤和当前角色可执行动作。</p>
              </div>
              <div class="page-tabs">
                <button class="switch" data-view="list">列表页</button>
                <button class="switch active" data-view="detail">详情页</button>
              </div>
            </div>
            <div class="card" style="border:0; border-radius:0;">
              <div class="steps" id="stepRow"></div>
              <div class="actions" style="margin-top:12px; justify-content:space-between;">
                <span class="pill brand" id="contextHint">当前：提需求方</span>
                <span class="pill info" id="statusHint"></span>
              </div>
            </div>
          </div>

          <div class="panel">
            <div class="card" style="border:0; border-radius:0;">
              <h3 class="section-title">基础信息</h3>
              <div class="summary-grid" id="summaryGrid"></div>
            </div>
          </div>

          <div class="panel">
            <div class="card" style="border:0; border-radius:0;" id="formPanel"></div>
          </div>
        </div>

        <aside class="detail-side">
          <div class="panel">
            <div class="card" style="border:0; border-radius:0;">
              <h3 class="section-title">设计文件</h3>
              <div class="stack" id="fileBox"></div>
            </div>
          </div>
          <div class="panel">
            <div class="card" style="border:0; border-radius:0;">
              <h3 class="section-title">处理记录</h3>
              <div class="stack" id="historyBox"></div>
            </div>
          </div>
        </aside>
      </section>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const CHANNEL = "PC端";
    const roles = [
      { key: "requester", label: "提需求方" },
      { key: "design", label: "设计部门" }
    ];

    const steps = [
      { key: "submit", label: "提需求" },
      { key: "accept", label: "确认需求" },
      { key: "estimate", label: "预计完成时间" },
      { key: "confirmTime", label: "确认完成时间" },
      { key: "upload", label: "上传设计文件" },
      { key: "confirmFile", label: "确认设计文件" },
      { key: "close", label: "关闭需求" }
    ];

    const statusMeta = {
      pending_accept: { label: "待设计部门确认需求", tone: "warn", step: 1 },
      pending_estimate: { label: "待设计部门提交预计完成时间", tone: "info", step: 2 },
      pending_time_confirm: { label: "待提需求方确认完成时间", tone: "info", step: 3 },
      designing: { label: "设计中，待上传设计文件", tone: "brand", step: 4 },
      pending_file_confirm: { label: "待提需求方确认设计文件", tone: "info", step: 5 },
      file_confirmed: { label: "设计文件已确认，待关闭需求", tone: "good", step: 6 },
      closed: { label: "已关闭", tone: "good", step: 7 }
    };

    const typeOptions = ["海报设计", "详情页设计", "活动物料", "包装设计", "其他"];

    const baseTickets = [
      {
        id: "PC-DES-20260419-001",
        title: "五一活动主视觉与长图",
        requestDept: "市场部",
        requester: "李晓",
        designOwner: "品牌设计组 / 陈可",
        type: "海报设计",
        priority: "高",
        due: "2026-04-22 18:00",
        attachment: "五一活动brief_v3.pdf",
        desc: "用于公众号和朋友圈投放，需输出1张主视觉海报+1张活动长图。",
        status: "pending_file_confirm",
        files: [
          { name: "五一活动海报_预览.jpg", type: "预览图", note: "用于业务确认" },
          { name: "五一活动海报_源文件.psd", type: "源文件", note: "可继续编辑" }
        ],
        history: [
          "04-19 09:30 提需求方提交需求",
          "04-19 10:10 设计部门确认需求",
          "04-19 10:22 设计部门反馈预计完成时间 2026-04-22 18:00",
          "04-19 10:35 提需求方确认完成时间",
          "04-21 17:20 设计部门上传设计文件"
        ]
      },
      {
        id: "PC-DES-20260419-002",
        title: "新品详情页首屏优化",
        requestDept: "电商部",
        requester: "周静",
        designOwner: "电商设计组 / 王卓",
        type: "详情页设计",
        priority: "中",
        due: "",
        attachment: "新品卖点梳理.xlsx",
        desc: "首屏需要强化利益点表达，适配PC商城详情页头图。",
        status: "pending_accept",
        files: [],
        history: [
          "04-19 11:15 提需求方提交需求"
        ]
      },
      {
        id: "PC-DES-20260419-003",
        title: "渠道会展折页物料",
        requestDept: "渠道部",
        requester: "何洋",
        designOwner: "物料设计组 / 林安",
        type: "活动物料",
        priority: "紧急",
        due: "2026-04-21 12:00",
        attachment: "会展素材包.zip",
        desc: "三折页双面设计，需保留统一品牌规范。",
        status: "designing",
        files: [],
        history: [
          "04-19 08:40 提需求方提交需求",
          "04-19 09:05 设计部门确认需求",
          "04-19 09:16 设计部门反馈预计完成时间 2026-04-21 12:00",
          "04-19 09:22 提需求方确认完成时间"
        ]
      }
    ];

    let tickets = deepClone(baseTickets);
    let currentRole = "requester";
    let currentView = "list";
    let currentFilter = "all";
    let activeId = tickets[0] ? tickets[0].id : "";

    const roleSwitch = document.getElementById("roleSwitch");
    const listDesc = document.getElementById("listDesc");
    const statsRow = document.getElementById("statsRow");
    const filterBar = document.getElementById("filterBar");
    const ticketList = document.getElementById("ticketList");
    const listView = document.getElementById("listView");
    const detailView = document.getElementById("detailView");
    const detailDesc = document.getElementById("detailDesc");
    const contextHint = document.getElementById("contextHint");
    const statusHint = document.getElementById("statusHint");
    const stepRow = document.getElementById("stepRow");
    const summaryGrid = document.getElementById("summaryGrid");
    const formPanel = document.getElementById("formPanel");
    const fileBox = document.getElementById("fileBox");
    const historyBox = document.getElementById("historyBox");
    const toast = document.getElementById("toast");

    function deepClone(data) {
      return JSON.parse(JSON.stringify(data));
    }

    function esc(text) {
      return String(text || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;");
    }

    function nowStamp() {
      const now = new Date();
      const mm = String(now.getMonth() + 1).padStart(2, "0");
      const dd = String(now.getDate()).padStart(2, "0");
      const hh = String(now.getHours()).padStart(2, "0");
      const mi = String(now.getMinutes()).padStart(2, "0");
      return `${mm}-${dd} ${hh}:${mi}`;
    }

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 1300);
    }

    function roleLabel() {
      const hit = roles.find(item => item.key === currentRole);
      return hit ? hit.label : "";
    }

    function getTicket(id) {
      const target = id || activeId;
      const hit = tickets.find(item => item.id === target);
      return hit || tickets[0];
    }

    function statusPill(status) {
      const meta = statusMeta[status];
      return `<span class="pill ${meta.tone}">${meta.label}</span>`;
    }

    function appendHistory(ticket, text) {
      ticket.history.push(`${nowStamp()} ${text}`);
    }

    function switchView(view) {
      currentView = view;
      listView.classList.toggle("active", view === "list");
      detailView.classList.toggle("active", view === "detail");
      document.querySelectorAll("[data-view]").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.view === view);
      });
      if (view === "detail") renderDetail();
    }

    function renderRoleSwitch() {
      roleSwitch.innerHTML = roles.map(role =>
        `<button class="switch ${role.key === currentRole ? "active" : ""}" data-role="${role.key}">${role.label}</button>`
      ).join("");
      roleSwitch.querySelectorAll("[data-role]").forEach(btn => {
        btn.addEventListener("click", () => {
          currentRole = btn.dataset.role;
          renderAll();
          switchView(currentView);
        });
      });
    }

    function renderStats() {
      const countBy = key => tickets.filter(item => item.status === key).length;
      statsRow.innerHTML = `
        <div class="stat"><span>全部工单</span><strong>${tickets.length}</strong></div>
        <div class="stat"><span>待确认需求</span><strong>${countBy("pending_accept")}</strong></div>
        <div class="stat"><span>待确认时间</span><strong>${countBy("pending_time_confirm")}</strong></div>
        <div class="stat"><span>待确认文件</span><strong>${countBy("pending_file_confirm")}</strong></div>
        <div class="stat"><span>已关闭</span><strong>${countBy("closed")}</strong></div>
      `;
    }

    function renderFilters() {
      const filters = [
        { key: "all", label: "全部" },
        { key: "pending_accept", label: "待确认需求" },
        { key: "pending_time_confirm", label: "待确认时间" },
        { key: "designing", label: "设计中" },
        { key: "pending_file_confirm", label: "待确认文件" },
        { key: "file_confirmed", label: "待关闭" },
        { key: "closed", label: "已关闭" }
      ];
      filterBar.innerHTML = filters.map(item =>
        `<button class="switch ${item.key === currentFilter ? "active" : ""}" data-filter="${item.key}">${item.label}</button>`
      ).join("");
      filterBar.querySelectorAll("[data-filter]").forEach(btn => {
        btn.addEventListener("click", () => {
          currentFilter = btn.dataset.filter;
          renderList();
        });
      });
    }

    function renderList() {
      listDesc.textContent = `${roleLabel()}在PC端查看并处理设计需求工单。`;
      renderStats();
      renderFilters();
      const rows = tickets.filter(item => currentFilter === "all" || item.status === currentFilter);
      if (!rows.length) {
        ticketList.innerHTML = `<div class="empty">当前筛选条件下暂无工单。</div>`;
        return;
      }
      ticketList.innerHTML = rows.map(ticket => `
        <article class="ticket">
          <div class="ticket-head">
            <div>
              <h4>${esc(ticket.title)}</h4>
              <div class="meta">
                <span>${ticket.id}</span>
                <span>提需求方：${esc(ticket.requestDept)} / ${esc(ticket.requester)}</span>
                <span>设计部门：${esc(ticket.designOwner || "待分配")}</span>
                <span>${ticket.due ? `预计完成：${esc(ticket.due)}` : "待填写预计完成时间"}</span>
                <span>渠道：${CHANNEL}提交</span>
              </div>
            </div>
            <div class="actions">
              ${statusPill(ticket.status)}
              <span class="pill brand">${esc(ticket.type)}</span>
              <span class="pill info">${esc(ticket.priority)}</span>
            </div>
          </div>
          <div class="actions">
            <button class="btn btn-secondary" data-open="${ticket.id}">查看详情</button>
            <button class="btn btn-primary" data-enter="${ticket.id}">进入${roleLabel()}处理</button>
          </div>
        </article>
      `).join("");

      ticketList.querySelectorAll("[data-open], [data-enter]").forEach(btn => {
        btn.addEventListener("click", () => {
          activeId = btn.dataset.open || btn.dataset.enter;
          switchView("detail");
        });
      });
    }

    function renderSteps(ticket) {
      const meta = statusMeta[ticket.status];
      const activeStep = Math.max(1, Math.min(meta.step, steps.length));
      stepRow.innerHTML = steps.map((step, idx) => {
        const n = idx + 1;
        const cls = n < activeStep ? "done" : n === activeStep ? "active" : "";
        return `<span class="step-pill ${cls}">${n}. ${step.label}</span>`;
      }).join("");
    }

    function renderSummary(ticket) {
      summaryGrid.innerHTML = `
        <div class="summary-item"><span>工单编号</span><strong>${ticket.id}</strong></div>
        <div class="summary-item"><span>当前状态</span><strong>${statusMeta[ticket.status].label}</strong></div>
        <div class="summary-item"><span>渠道</span><strong>${CHANNEL}</strong></div>
        <div class="summary-item"><span>当前角色</span><strong>${roleLabel()}</strong></div>
        <div class="summary-item"><span>提需求方</span><strong>${esc(ticket.requestDept)} / ${esc(ticket.requester)}</strong></div>
        <div class="summary-item"><span>设计部门</span><strong>${esc(ticket.designOwner || "待分配")}</strong></div>
      `;
    }

    function commonFields(ticket, readonly) {
      const disabled = readonly ? "disabled" : "";
      return `
        <div class="field-grid">
          <div class="field">
            <label>需求标题</label>
            <input id="field-title" value="${esc(ticket.title)}" ${disabled} />
          </div>
          <div class="field">
            <label>需求类型</label>
            <select id="field-type" ${disabled}>
              ${typeOptions.map(item => `<option value="${item}" ${ticket.type === item ? "selected" : ""}>${item}</option>`).join("")}
            </select>
          </div>
          <div class="field">
            <label>提需求部门</label>
            <input id="field-requestDept" value="${esc(ticket.requestDept)}" ${disabled} />
          </div>
          <div class="field">
            <label>提需求人</label>
            <input id="field-requester" value="${esc(ticket.requester)}" ${disabled} />
          </div>
          <div class="field">
            <label>设计负责人</label>
            <input id="field-designOwner" value="${esc(ticket.designOwner)}" ${disabled} />
          </div>
          <div class="field">
            <label>优先级</label>
            <input id="field-priority" value="${esc(ticket.priority)}" ${disabled} />
          </div>
          <div class="field">
            <label>预计完成时间</label>
            <input id="field-due" value="${esc(ticket.due)}" placeholder="例如：2026-04-24 18:00" ${disabled} />
          </div>
          <div class="field">
            <label>需求附件</label>
            <input id="field-attachment" value="${esc(ticket.attachment)}" ${disabled} />
          </div>
          <div class="field full">
            <label>需求说明</label>
            <textarea id="field-desc" ${disabled}>${esc(ticket.desc)}</textarea>
          </div>
        </div>
      `;
    }

    function renderRequesterForm(ticket) {
      if (ticket.status === "pending_accept") {
        return `
          <h3 class="section-title">提需求</h3>
          <p class="hint">提需求方补充并提交需求，等待设计部门确认需求。</p>
          ${commonFields(ticket, false)}
          <div class="actions" style="margin-top:12px;">
            <button class="btn btn-ghost" data-action="save-request">保存需求</button>
            <button class="btn btn-primary" data-action="submit-request">提交需求</button>
          </div>
        `;
      }
      if (ticket.status === "pending_time_confirm") {
        return `
          <h3 class="section-title">确认完成时间</h3>
          <p class="hint">设计部门已反馈预计完成时间，提需求方确认后进入设计执行。</p>
          ${commonFields(ticket, true)}
          <div class="actions" style="margin-top:12px;">
            <button class="btn btn-primary" data-action="confirm-time">确认完成时间</button>
          </div>
        `;
      }
      if (ticket.status === "pending_file_confirm") {
        return `
          <h3 class="section-title">确认设计文件</h3>
          <p class="hint">提需求方确认设计文件无误后，工单转为待关闭。</p>
          ${commonFields(ticket, true)}
          <div class="actions" style="margin-top:12px;">
            <button class="btn btn-primary" data-action="confirm-file">确认设计文件</button>
          </div>
        `;
      }
      if (ticket.status === "file_confirmed") {
        return `
          <h3 class="section-title">关闭需求</h3>
          <p class="hint">文件已确认，可由提需求方关闭需求。</p>
          ${commonFields(ticket, true)}
          <div class="actions" style="margin-top:12px;">
            <button class="btn btn-danger" data-action="close-ticket">关闭需求</button>
          </div>
        `;
      }
      return `
        <h3 class="section-title">工单详情</h3>
        <p class="hint">当前状态无需提需求方操作，可查看处理进度。</p>
        ${commonFields(ticket, true)}
      `;
    }

    function renderDesignForm(ticket) {
      if (ticket.status === "pending_accept") {
        return `
          <h3 class="section-title">确认需求</h3>
          <p class="hint">设计部门确认需求可承接，进入预计完成时间填写阶段。</p>
          ${commonFields(ticket, false)}
          <div class="actions" style="margin-top:12px;">
            <button class="btn btn-primary" data-action="accept-ticket">确认需求</button>
          </div>
        `;
      }
      if (ticket.status === "pending_estimate") {
        return `
          <h3 class="section-title">预计完成时间</h3>
          <p class="hint">设计部门填写预计完成时间，提交给提需求方确认。</p>
          ${commonFields(ticket, false)}
          <div class="actions" style="margin-top:12px;">
            <button class="btn btn-primary" data-action="estimate-time">提交预计完成时间</button>
          </div>
        `;
      }
      if (ticket.status === "designing") {
        return `
          <h3 class="section-title">上传设计文件</h3>
          <p class="hint">上传预览图和源文件后，流转至提需求方确认设计文件。</p>
          ${commonFields(ticket, true)}
          <div class="field-grid" style="margin-top:12px;">
            <div class="field">
              <label>预览图文件名</label>
              <input id="upload-preview" placeholder="例如：活动海报_预览.jpg" />
            </div>
            <div class="field">
              <label>源文件名</label>
              <input id="upload-source" placeholder="例如：活动海报_源文件.psd" />
            </div>
            <div class="field full">
              <label>交付说明</label>
              <textarea id="upload-note" placeholder="例如：已按品牌规范出稿，字体已转曲"></textarea>
            </div>
          </div>
          <div class="actions" style="margin-top:12px;">
            <button class="btn btn-primary" data-action="upload-files">上传设计文件</button>
          </div>
        `;
      }
      return `
        <h3 class="section-title">工单详情</h3>
        <p class="hint">当前状态无需设计部门操作，可查看处理进度。</p>
        ${commonFields(ticket, true)}
      `;
    }

    function saveCommonFields(ticket) {
      const map = {
        title: "field-title",
        type: "field-type",
        requestDept: "field-requestDept",
        requester: "field-requester",
        designOwner: "field-designOwner",
        priority: "field-priority",
        due: "field-due",
        attachment: "field-attachment",
        desc: "field-desc"
      };
      Object.keys(map).forEach(key => {
        const node = document.getElementById(map[key]);
        if (node) ticket[key] = node.value.trim();
      });
    }

    function bindFormActions(ticket) {
      formPanel.querySelectorAll("[data-action]").forEach(btn => {
        btn.addEventListener("click", () => {
          const action = btn.dataset.action;

          if (action === "save-request") {
            saveCommonFields(ticket);
            appendHistory(ticket, `${CHANNEL}提需求方保存需求`);
            showToast("已保存需求");
          }

          if (action === "submit-request") {
            saveCommonFields(ticket);
            ticket.status = "pending_accept";
            appendHistory(ticket, `${CHANNEL}提需求方提交需求`);
            showToast("需求已提交");
          }

          if (action === "accept-ticket") {
            saveCommonFields(ticket);
            ticket.status = "pending_estimate";
            appendHistory(ticket, `${CHANNEL}设计部门确认需求`);
            showToast("已确认需求");
          }

          if (action === "estimate-time") {
            saveCommonFields(ticket);
            if (!ticket.due) {
              showToast("请先填写预计完成时间");
              return;
            }
            ticket.status = "pending_time_confirm";
            appendHistory(ticket, `${CHANNEL}设计部门提交预计完成时间 ${ticket.due}`);
            showToast("预计完成时间已提交");
          }

          if (action === "confirm-time") {
            ticket.status = "designing";
            appendHistory(ticket, `${CHANNEL}提需求方确认完成时间`);
            showToast("已确认完成时间");
          }

          if (action === "upload-files") {
            const preview = (document.getElementById("upload-preview") || {}).value || "设计稿_预览.jpg";
            const source = (document.getElementById("upload-source") || {}).value || "设计稿_源文件.psd";
            const note = (document.getElementById("upload-note") || {}).value || "设计部门完成交付";
            ticket.files = [
              { name: preview.trim(), type: "预览图", note: note.trim() },
              { name: source.trim(), type: "源文件", note: note.trim() }
            ];
            ticket.status = "pending_file_confirm";
            appendHistory(ticket, `${CHANNEL}设计部门上传设计文件`);
            showToast("设计文件已上传");
          }

          if (action === "confirm-file") {
            ticket.status = "file_confirmed";
            appendHistory(ticket, `${CHANNEL}提需求方确认设计文件`);
            showToast("设计文件已确认");
          }

          if (action === "close-ticket") {
            ticket.status = "closed";
            appendHistory(ticket, `${CHANNEL}提需求方关闭需求`);
            showToast("需求已关闭");
          }

          renderAll();
          switchView("detail");
        });
      });
    }

    function renderFiles(ticket) {
      if (!ticket.files.length) {
        fileBox.innerHTML = `<div class="empty">当前暂无已上传设计文件。</div>`;
        return;
      }
      fileBox.innerHTML = ticket.files.map(file => `
        <div class="stack-item">
          <strong>${esc(file.name)}</strong>
          <div class="hint">${esc(file.type)} · ${esc(file.note)}</div>
        </div>
      `).join("");
    }

    function renderHistory(ticket) {
      historyBox.innerHTML = ticket.history.map(row => {
        const parts = row.split(" ");
        return `
          <div class="stack-item">
            <strong>${esc(parts.slice(0, 2).join(" "))}</strong>
            <div class="hint">${esc(parts.slice(2).join(" "))}</div>
          </div>
        `;
      }).join("");
    }

    function renderDetail() {
      const ticket = getTicket();
      if (!ticket) return;
      const meta = statusMeta[ticket.status];
      detailDesc.textContent = `${ticket.id} · ${meta.label} · 当前角色：${roleLabel()}`;
      contextHint.textContent = `当前角色：${roleLabel()}`;
      statusHint.textContent = meta.label;

      renderSteps(ticket);
      renderSummary(ticket);
      formPanel.innerHTML = currentRole === "requester" ? renderRequesterForm(ticket) : renderDesignForm(ticket);
      renderFiles(ticket);
      renderHistory(ticket);
      bindFormActions(ticket);
    }

    function renderAll() {
      renderRoleSwitch();
      renderList();
      renderDetail();
    }

    function createTicket() {
      const seq = String(tickets.length + 1).padStart(3, "0");
      const id = `PC-DES-20260419-${seq}`;
      const next = {
        id,
        title: "新建PC端设计需求",
        requestDept: "待填写部门",
        requester: "待填写姓名",
        designOwner: "待分配",
        type: "海报设计",
        priority: "中",
        due: "",
        attachment: "",
        desc: "",
        status: "pending_accept",
        files: [],
        history: [`${nowStamp()} 系统创建工单`]
      };
      tickets.unshift(next);
      activeId = id;
      currentRole = "requester";
      currentFilter = "all";
      renderAll();
      switchView("detail");
    }

    document.querySelectorAll("[data-view]").forEach(btn => {
      btn.addEventListener("click", () => switchView(btn.dataset.view));
    });

    document.getElementById("createTicket").addEventListener("click", createTicket);

    document.getElementById("resetData").addEventListener("click", () => {
      tickets = deepClone(baseTickets);
      activeId = tickets[0] ? tickets[0].id : "";
      currentRole = "requester";
      currentFilter = "all";
      renderAll();
      switchView("list");
      showToast("已恢复演示数据");
    });

    renderAll();
    switchView("list");
  </script>
</body>
</html>
