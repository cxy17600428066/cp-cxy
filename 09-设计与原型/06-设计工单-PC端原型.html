<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>设计工单系统 PC 端</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --panel-soft: #fafbfc;
      --ink: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --brand: #c2410c;
      --brand-deep: #9a3412;
      --good: #047857;
      --warn: #b45309;
      --info: #1d4ed8;
      --shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Microsoft YaHei UI", "PingFang SC", "Source Han Sans SC", sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #f7f8fb 0%, #f2f4f7 100%);
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: 72px 1fr;
    }

    .topbar {
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .brand strong {
      display: block;
      font-size: 20px;
      font-weight: 800;
    }

    .brand span {
      font-size: 12px;
      color: var(--muted);
    }

    .top-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      border: 0;
      border-radius: 12px;
      padding: 11px 16px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--brand), #ea580c);
      color: #fff;
    }

    .btn-secondary {
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .main {
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      gap: 16px;
      padding: 16px;
    }

    .sidebar,
    .workspace {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      min-height: 0;
    }

    .sidebar {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      overflow: hidden;
    }

    .sidebar-head,
    .workspace-head {
      padding: 18px 18px 14px;
      border-bottom: 1px solid var(--line);
    }

    .sidebar-head h2,
    .workspace-head h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
    }

    .sidebar-head p,
    .workspace-head p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .filter-row {
      padding: 14px 18px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--line);
      background: var(--panel-soft);
    }

    .chip {
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .chip.active {
      background: rgba(194, 65, 12, 0.1);
      color: var(--brand-deep);
      border-color: rgba(194, 65, 12, 0.22);
    }

    .ticket-list {
      overflow: auto;
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .ticket-card {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      background: #fff;
      cursor: pointer;
      transition: border-color 0.18s ease, transform 0.18s ease;
    }

    .ticket-card:hover {
      transform: translateY(-1px);
      border-color: #d6dbe2;
    }

    .ticket-card.active {
      border-color: rgba(194, 65, 12, 0.26);
      background: linear-gradient(180deg, #fffdfb, #fff7f2);
      box-shadow: inset 0 0 0 1px rgba(194, 65, 12, 0.08);
    }

    .ticket-card h3 {
      margin: 0 0 8px;
      font-size: 15px;
      line-height: 1.45;
    }

    .ticket-meta {
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .pill-row {
      margin-top: 10px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      background: #f8fafc;
      border: 1px solid var(--line);
    }

    .pill.warn { color: var(--warn); }
    .pill.info { color: var(--info); }
    .pill.good { color: var(--good); }
    .pill.brand { color: var(--brand-deep); }

    .workspace {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      overflow: hidden;
    }

    .stepbar {
      padding: 14px 18px;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-soft);
    }

    .step {
      border-radius: 14px;
      padding: 12px;
      border: 1px solid var(--line);
      background: #fff;
    }

    .step.active {
      border-color: rgba(194, 65, 12, 0.22);
      background: rgba(194, 65, 12, 0.08);
    }

    .step.done {
      border-color: rgba(4, 120, 87, 0.18);
      background: rgba(4, 120, 87, 0.08);
    }

    .step small {
      display: block;
      color: var(--muted);
      margin-bottom: 4px;
      font-size: 11px;
    }

    .step strong {
      display: block;
      font-size: 13px;
      line-height: 1.4;
    }

    .toolbar {
      padding: 14px 18px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--line);
    }

    .toolbar .seg {
      padding: 9px 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .toolbar .seg.active {
      background: rgba(194, 65, 12, 0.1);
      color: var(--brand-deep);
      border-color: rgba(194, 65, 12, 0.22);
    }

    .form-area {
      overflow: auto;
      padding: 18px;
      display: grid;
      gap: 16px;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      padding: 16px;
      display: grid;
      gap: 14px;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .card-head h3 {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
    }

    .card-head p {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      padding: 11px 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      font: inherit;
    }

    .field textarea {
      min-height: 96px;
      resize: vertical;
    }

    .upload-box,
    .history-box {
      border: 1px dashed #d6dbe2;
      border-radius: 16px;
      background: #fbfcfd;
      padding: 14px;
    }

    .upload-list,
    .history-list {
      display: grid;
      gap: 10px;
    }

    .upload-item,
    .history-item {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
      background: #fff;
    }

    .upload-item strong,
    .history-item strong {
      display: block;
      margin-bottom: 4px;
      font-size: 14px;
    }

    .footbar {
      padding: 16px 18px;
      border-top: 1px solid var(--line);
      background: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .footbar small {
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 1200px) {
      .main {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 760px) {
      .main {
        padding: 10px;
      }
      .stepbar {
        grid-template-columns: 1fr;
      }
      .field-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <strong>设计工单系统</strong>
        <span>设计需求提交 / 确认 / 交付 / 验收</span>
      </div>
      <div class="top-actions">
        <button class="btn btn-secondary" id="resetDemo">恢复演示数据</button>
        <button class="btn btn-primary" id="quickForward">推进当前工单</button>
      </div>
    </header>

    <main class="main">
      <aside class="sidebar">
        <div class="sidebar-head">
          <h2>工单列表</h2>
          <p>按状态筛选，点击任一工单进入处理表单。</p>
        </div>
        <div class="filter-row" id="statusFilters"></div>
        <div class="ticket-list" id="ticketList"></div>
      </aside>

      <section class="workspace">
        <div class="workspace-head">
          <h2 id="workspaceTitle">设计工单处理</h2>
          <p id="workspaceDesc">当前表单会根据角色和工单状态切换可操作内容。</p>
        </div>
        <div class="stepbar" id="stepbar"></div>
        <div class="toolbar" id="roleSwitch"></div>
        <div class="form-area" id="formArea"></div>
        <div class="footbar">
          <small id="footHint">请按当前状态完成表单，并提交下一步。</small>
          <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <button class="btn btn-secondary" id="saveBtn">保存</button>
            <button class="btn btn-primary" id="submitBtn">提交当前步骤</button>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
