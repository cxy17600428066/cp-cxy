<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>设计工单系统 PC 端</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --panel-soft: #fafbfc;
      --ink: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --brand: #c2410c;
      --brand-deep: #9a3412;
      --good: #047857;
      --warn: #b45309;
      --info: #1d4ed8;
      --shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Microsoft YaHei UI", "PingFang SC", "Source Han Sans SC", sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #f7f8fb 0%, #f2f4f7 100%);
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: 72px 1fr;
    }

    .topbar {
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .brand strong {
      display: block;
      font-size: 20px;
      font-weight: 800;
    }

    .brand span {
      font-size: 12px;
      color: var(--muted);
    }

    .top-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      border: 0;
      border-radius: 12px;
      padding: 11px 16px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--brand), #ea580c);
      color: #fff;
    }

    .btn-secondary {
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .main {
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      gap: 16px;
      padding: 16px;
    }

    .sidebar,
    .workspace {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      min-height: 0;
    }

    .sidebar {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      overflow: hidden;
    }

    .sidebar-head,
    .workspace-head {
      padding: 18px 18px 14px;
      border-bottom: 1px solid var(--line);
    }

    .sidebar-head h2,
    .workspace-head h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
    }

    .sidebar-head p,
    .workspace-head p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .filter-row {
      padding: 14px 18px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--line);
      background: var(--panel-soft);
    }

    .chip {
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .chip.active {
      background: rgba(194, 65, 12, 0.1);
      color: var(--brand-deep);
      border-color: rgba(194, 65, 12, 0.22);
    }

    .ticket-list {
      overflow: auto;
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .ticket-card {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      background: #fff;
      cursor: pointer;
      transition: border-color 0.18s ease, transform 0.18s ease;
    }

    .ticket-card:hover {
      transform: translateY(-1px);
      border-color: #d6dbe2;
    }

    .ticket-card.active {
      border-color: rgba(194, 65, 12, 0.26);
      background: linear-gradient(180deg, #fffdfb, #fff7f2);
      box-shadow: inset 0 0 0 1px rgba(194, 65, 12, 0.08);
    }

    .ticket-card h3 {
      margin: 0 0 8px;
      font-size: 15px;
      line-height: 1.45;
    }

    .ticket-meta {
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .pill-row {
      margin-top: 10px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      background: #f8fafc;
      border: 1px solid var(--line);
    }

    .pill.warn { color: var(--warn); }
    .pill.info { color: var(--info); }
    .pill.good { color: var(--good); }
    .pill.brand { color: var(--brand-deep); }

    .workspace {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      overflow: hidden;
    }

    .stepbar {
      padding: 14px 18px;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-soft);
    }

    .step {
      border-radius: 14px;
      padding: 12px;
      border: 1px solid var(--line);
      background: #fff;
    }

    .step.active {
      border-color: rgba(194, 65, 12, 0.22);
      background: rgba(194, 65, 12, 0.08);
    }

    .step.done {
      border-color: rgba(4, 120, 87, 0.18);
      background: rgba(4, 120, 87, 0.08);
    }

    .step small {
      display: block;
      color: var(--muted);
      margin-bottom: 4px;
      font-size: 11px;
    }

    .step strong {
      display: block;
      font-size: 13px;
      line-height: 1.4;
    }

    .toolbar {
      padding: 14px 18px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--line);
    }

    .toolbar .seg {
      padding: 9px 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .toolbar .seg.active {
      background: rgba(194, 65, 12, 0.1);
      color: var(--brand-deep);
      border-color: rgba(194, 65, 12, 0.22);
    }

    .form-area {
      overflow: auto;
      padding: 18px;
      display: grid;
      gap: 16px;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      padding: 16px;
      display: grid;
      gap: 14px;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .card-head h3 {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
    }

    .card-head p {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      padding: 11px 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      font: inherit;
    }

    .field textarea {
      min-height: 96px;
      resize: vertical;
    }

    .upload-box,
    .history-box {
      border: 1px dashed #d6dbe2;
      border-radius: 16px;
      background: #fbfcfd;
      padding: 14px;
    }

    .upload-list,
    .history-list {
      display: grid;
      gap: 10px;
    }

    .upload-item,
    .history-item {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
      background: #fff;
    }

    .upload-item strong,
    .history-item strong {
      display: block;
      margin-bottom: 4px;
      font-size: 14px;
    }

    .footbar {
      padding: 16px 18px;
      border-top: 1px solid var(--line);
      background: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .footbar small {
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 1200px) {
      .main {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 760px) {
      .main {
        padding: 10px;
      }
      .stepbar {
        grid-template-columns: 1fr;
      }
      .field-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <strong>设计工单系统</strong>
        <span>设计需求提交 / 确认 / 交付 / 验收</span>
      </div>
      <div class="top-actions">
        <button class="btn btn-secondary" id="resetDemo">恢复演示数据</button>
        <button class="btn btn-primary" id="quickForward">推进当前工单</button>
      </div>
    </header>

    <main class="main">
      <aside class="sidebar">
        <div class="sidebar-head">
          <h2>工单列表</h2>
          <p>按状态筛选，点击任一工单进入处理表单。</p>
        </div>
        <div class="filter-row" id="statusFilters"></div>
        <div class="ticket-list" id="ticketList"></div>
      </aside>

      <section class="workspace">
        <div class="workspace-head">
          <h2 id="workspaceTitle">设计工单处理</h2>
          <p id="workspaceDesc">当前表单会根据角色和工单状态切换可操作内容。</p>
        </div>
        <div class="stepbar" id="stepbar"></div>
        <div class="toolbar" id="roleSwitch"></div>
        <div class="form-area" id="formArea"></div>
        <div class="footbar">
          <small id="footHint">请按当前状态完成表单，并提交下一步。</small>
          <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <button class="btn btn-secondary" id="saveBtn">保存</button>
            <button class="btn btn-primary" id="submitBtn">提交当前步骤</button>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script>
    const roles = [
      { key: "requester", label: "提需求方" },
      { key: "designer", label: "设计部门" }
    ];

    const stepOrder = ["submitted", "accepted", "scheduled", "delivered", "closed"];
    const stepConfig = {
      submitted: "提交需求",
      accepted: "设计确认",
      scheduled: "确认时间",
      delivered: "上传文件",
      closed: "关闭工单"
    };

    const statusMap = {
      pending_confirm: { label: "待设计确认", step: "submitted", tone: "warn" },
      confirming_time: { label: "待确认完成时间", step: "accepted", tone: "info" },
      designing: { label: "设计中", step: "scheduled", tone: "brand" },
      waiting_acceptance: { label: "待确认设计文件", step: "delivered", tone: "info" },
      closed: { label: "已关闭", step: "closed", tone: "good" }
    };

    const initialTickets = [
      {
        id: "DES-20260419-001",
        title: "五一活动海报设计",
        applicant: "市场部 / 李晓",
        designer: "品牌设计组 / 陈可",
        type: "海报设计",
        channel: "线上活动",
        due: "2026-04-22 18:00",
        desc: "需产出五一促销主海报 1 张、活动长图 1 张，用于公众号和朋友圈。",
        attachment: "活动方案_v3.pdf",
        status: "waiting_acceptance",
        files: [
          { name: "五一活动海报_预览.jpg", note: "客户确认用预览图", type: "预览图" },
          { name: "五一活动海报_源文件.psd", note: "可继续编辑的源文件", type: "源文件" }
        ],
        history: [
          "04-19 09:30 提需求方提交需求",
          "04-19 10:20 设计部门确认需求",
          "04-19 10:35 设计部门反馈完成时间",
          "04-19 10:48 提需求方确认完成时间",
          "04-21 17:36 设计部门上传设计文件"
        ]
      },
      {
        id: "DES-20260419-002",
        title: "新品详情页长图设计",
        applicant: "电商部 / 周静",
        designer: "电商设计组 / 王卓",
        type: "详情页设计",
        channel: "天猫 / 京东",
        due: "2026-04-24 12:00",
        desc: "新品无骨鸡爪需要 1 套电商详情页，包含卖点首屏、口味说明、工艺说明、场景图。",
        attachment: "新品卖点梳理.xlsx",
        status: "designing",
        files: [],
        history: [
          "04-19 11:20 提需求方提交需求",
          "04-19 12:05 设计部门确认需求",
          "04-19 12:15 设计部门反馈完成时间",
          "04-19 13:02 提需求方确认完成时间"
        ]
      },
      {
        id: "DES-20260419-003",
        title: "门店展架物料需求",
        applicant: "销售部 / 杨帆",
        designer: "平面设计组 / 何婷",
        type: "线下物料",
        channel: "门店活动",
        due: "",
        desc: "需要门店展架、台卡、价格签，供周末路演使用。",
        attachment: "门店路演需求.docx",
        status: "pending_confirm",
        files: [],
        history: ["04-19 14:06 提需求方提交需求"]
      },
      {
        id: "DES-20260419-004",
        title: "企业宣传册封面优化",
        applicant: "总经办 / 许蕾",
        designer: "品牌设计组 / 陈可",
        type: "宣传册优化",
        channel: "品牌招商",
        due: "2026-04-18 18:00",
        desc: "优化品牌宣传册封面及首页版式，用于招商资料更新。",
        attachment: "招商手册旧版.pdf",
        status: "closed",
        files: [
          { name: "招商手册封面_终稿.pdf", note: "对外使用版本", type: "PDF" },
          { name: "招商手册封面_源文件.ai", note: "可编辑源文件", type: "源文件" }
        ],
        history: [
          "04-16 09:10 提需求方提交需求",
          "04-16 09:46 设计部门确认需求",
          "04-16 10:02 设计部门反馈完成时间",
          "04-16 10:16 提需求方确认完成时间",
          "04-18 16:30 设计部门上传设计文件",
          "04-18 17:05 提需求方确认设计文件",
          "04-18 17:08 工单关闭"
        ]
      }
    ];

    let tickets = JSON.parse(JSON.stringify(initialTickets));
    let activeId = tickets[0].id;
    let currentRole = "requester";
    let currentFilter = "all";

    const statusFilters = document.getElementById("statusFilters");
    const ticketList = document.getElementById("ticketList");
    const stepbar = document.getElementById("stepbar");
    const roleSwitch = document.getElementById("roleSwitch");
    const formArea = document.getElementById("formArea");
    const workspaceTitle = document.getElementById("workspaceTitle");
    const workspaceDesc = document.getElementById("workspaceDesc");
    const footHint = document.getElementById("footHint");

    function getActiveTicket() {
      return tickets.find(item => item.id === activeId) || tickets[0];
    }

    function renderFilters() {
      const filters = [
        { key: "all", label: "全部" },
        { key: "pending_confirm", label: "待设计确认" },
        { key: "designing", label: "设计中" },
        { key: "waiting_acceptance", label: "待确认文件" },
        { key: "closed", label: "已关闭" }
      ];
      statusFilters.innerHTML = filters.map(item => `
        <button class="chip ${item.key === currentFilter ? "active" : ""}" data-filter="${item.key}">${item.label}</button>
      `).join("");
      [...statusFilters.querySelectorAll("[data-filter]")].forEach(btn => {
        btn.addEventListener("click", () => {
          currentFilter = btn.dataset.filter;
          renderTicketList();
        });
      });
    }

    function renderTicketList() {
      const filtered = currentFilter === "all" ? tickets : tickets.filter(item => item.status === currentFilter);
      if (!filtered.some(item => item.id === activeId) && filtered.length) activeId = filtered[0].id;
      ticketList.innerHTML = filtered.map(ticket => `
        <article class="ticket-card ${ticket.id === activeId ? "active" : ""}" data-id="${ticket.id}">
          <h3>${ticket.title}</h3>
          <div class="ticket-meta">
            <span>${ticket.applicant}</span>
            <span>${ticket.id}</span>
          </div>
          <div class="pill-row">
            <span class="pill ${statusMap[ticket.status].tone}">${statusMap[ticket.status].label}</span>
            <span class="pill brand">${ticket.type}</span>
          </div>
        </article>
      `).join("") || `<div style="padding:12px;color:var(--muted);">暂无符合条件的工单</div>`;

      [...ticketList.querySelectorAll("[data-id]")].forEach(card => {
        card.addEventListener("click", () => {
          activeId = card.dataset.id;
          renderWorkspace();
          renderTicketList();
        });
      });
    }

    function renderRoles() {
      roleSwitch.innerHTML = roles.map(role => `
        <button class="seg ${role.key === currentRole ? "active" : ""}" data-role="${role.key}">${role.label}</button>
      `).join("");
      [...roleSwitch.querySelectorAll("[data-role]")].forEach(btn => {
        btn.addEventListener("click", () => {
          currentRole = btn.dataset.role;
          renderWorkspace();
        });
      });
    }

    function renderSteps(ticket) {
      const currentStep = statusMap[ticket.status].step;
      const currentIndex = stepOrder.indexOf(currentStep);
      stepbar.innerHTML = stepOrder.map((step, index) => `
        <div class="step ${index < currentIndex ? "done" : ""} ${step === currentStep ? "active" : ""}">
          <small>步骤 ${index + 1}</small>
          <strong>${stepConfig[step]}</strong>
        </div>
      `).join("");
    }

    function renderRequesterForm(ticket) {
      if (ticket.status === "pending_confirm") {
        return `
          <section class="card">
            <div class="card-head"><div><h3>提交需求</h3><p>填写完整需求信息后提交给设计部门。</p></div></div>
            <div class="field-grid">
              <div class="field"><label>需求标题</label><input id="fTitle" value="${ticket.title}" /></div>
              <div class="field"><label>需求类型</label><input id="fType" value="${ticket.type}" /></div>
              <div class="field"><label>使用渠道</label><input id="fChannel" value="${ticket.channel}" /></div>
              <div class="field"><label>需求附件</label><input id="fAttachment" value="${ticket.attachment}" /></div>
              <div class="field full"><label>需求说明</label><textarea id="fDesc">${ticket.desc}</textarea></div>
            </div>
          </section>
        `;
      }
      if (ticket.status === "confirming_time") {
        return `
          <section class="card">
            <div class="card-head"><div><h3>确认完成时间</h3><p>设计部门已反馈预计完成时间，请确认是否接受。</p></div></div>
            <div class="field-grid">
              <div class="field"><label>工单编号</label><input value="${ticket.id}" disabled /></div>
              <div class="field"><label>设计负责人</label><input value="${ticket.designer}" disabled /></div>
              <div class="field full"><label>预计完成时间</label><input id="fDue" value="${ticket.due}" /></div>
            </div>
          </section>
        `;
      }
      if (ticket.status === "waiting_acceptance") {
        return `
          <section class="card">
            <div class="card-head"><div><h3>确认设计文件</h3><p>查看设计部门上传的文件，确认无误后关闭工单。</p></div></div>
            <div class="upload-box">
              <div class="upload-list">
                ${ticket.files.map(file => `<div class="upload-item"><strong>${file.name}</strong><span style="color:var(--muted);font-size:13px;">${file.type} · ${file.note}</span></div>`).join("")}
              </div>
            </div>
          </section>
        `;
      }
      if (ticket.status === "closed") {
        return `
          <section class="card">
            <div class="card-head"><div><h3>工单已关闭</h3><p>当前工单已完成全部流程。</p></div></div>
            <div class="history-box"><div class="history-list">${ticket.history.map(item => `<div class="history-item"><strong>${item}</strong></div>`).join("")}</div></div>
          </section>
        `;
      }
      return `
        <section class="card">
          <div class="card-head"><div><h3>等待设计处理</h3><p>当前工单已由需求方完成操作，等待设计部门继续流转。</p></div></div>
          <div class="history-box"><div class="history-list">${ticket.history.map(item => `<div class="history-item"><strong>${item}</strong></div>`).join("")}</div></div>
        </section>
      `;
    }

    function renderDesignerForm(ticket) {
      if (ticket.status === "pending_confirm") {
        return `
          <section class="card">
            <div class="card-head"><div><h3>确认需求</h3><p>检查需求是否完整，确认后进入时间评估。</p></div></div>
            <div class="field-grid">
              <div class="field"><label>提需求方</label><input value="${ticket.applicant}" disabled /></div>
              <div class="field"><label>需求类型</label><input value="${ticket.type}" disabled /></div>
              <div class="field full"><label>需求说明</label><textarea disabled>${ticket.desc}</textarea></div>
            </div>
          </section>
        `;
      }
      if (ticket.status === "confirming_time") {
        return `
          <section class="card">
            <div class="card-head"><div><h3>反馈预计完成时间</h3><p>填写排期时间并提交给提需求方确认。</p></div></div>
            <div class="field-grid">
              <div class="field"><label>设计负责人</label><input id="fDesigner" value="${ticket.designer}" /></div>
              <div class="field"><label>预计完成时间</label><input id="fDue" value="${ticket.due}" placeholder="2026-04-23 18:00" /></div>
            </div>
          </section>
        `;
      }
      if (ticket.status === "designing") {
        return `
          <section class="card">
            <div class="card-head"><div><h3>上传设计文件</h3><p>完成设计后上传预览图、源文件或交付说明。</p></div></div>
            <div class="field-grid">
              <div class="field"><label>文件名称</label><input id="fFileName" placeholder="如：首页终稿.fig" /></div>
              <div class="field"><label>文件类型</label><select id="fFileType"><option>预览图</option><option>源文件</option><option>PDF</option><option>交付文件</option></select></div>
              <div class="field full"><label>交付说明</label><textarea id="fFileNote" placeholder="填写本次交付说明"></textarea></div>
            </div>
          </section>
        `;
      }
      return `
        <section class="card">
          <div class="card-head"><div><h3>当前无需设计操作</h3><p>请切换到其他待处理工单，或等待需求方完成确认。</p></div></div>
          <div class="history-box"><div class="history-list">${ticket.history.map(item => `<div class="history-item"><strong>${item}</strong></div>`).join("")}</div></div>
        </section>
      `;
    }

    function renderCommonInfo(ticket) {
      return `
        <section class="card">
          <div class="card-head">
            <div>
              <h3>${ticket.title}</h3>
              <p>${ticket.id} · ${ticket.applicant} · ${ticket.designer}</p>
            </div>
            <div class="pill ${statusMap[ticket.status].tone}">${statusMap[ticket.status].label}</div>
          </div>
          <div class="field-grid">
            <div class="field"><label>需求方</label><input value="${ticket.applicant}" disabled /></div>
            <div class="field"><label>设计负责人</label><input value="${ticket.designer}" disabled /></div>
            <div class="field"><label>需求类型</label><input value="${ticket.type}" disabled /></div>
            <div class="field"><label>使用渠道</label><input value="${ticket.channel}" disabled /></div>
          </div>
        </section>
      `;
    }

    function renderHistory(ticket) {
      return `
        <section class="card">
          <div class="card-head"><div><h3>处理记录</h3><p>仅展示业务记录，不做讲解性信息展示。</p></div></div>
          <div class="history-box">
            <div class="history-list">
              ${ticket.history.map(item => `<div class="history-item"><strong>${item}</strong></div>`).join("")}
            </div>
          </div>
        </section>
      `;
    }

    function renderWorkspace() {
      const ticket = getActiveTicket();
      renderSteps(ticket);
      renderRoles();
      workspaceTitle.textContent = currentRole === "requester" ? "提需求方处理表单" : "设计部门处理表单";
      workspaceDesc.textContent = currentRole === "requester"
        ? "按当前工单状态完成对应表单操作。"
        : "按当前工单状态确认需求、时间或交付文件。";
      footHint.textContent = `当前工单状态：${statusMap[ticket.status].label}`;

      formArea.innerHTML = `
        ${renderCommonInfo(ticket)}
        ${currentRole === "requester" ? renderRequesterForm(ticket) : renderDesignerForm(ticket)}
        ${renderHistory(ticket)}
      `;

      bindFieldChanges(ticket);
    }

    function bindFieldChanges(ticket) {
      const bind = (id, field) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener("input", () => {
          ticket[field] = el.value;
          if (field === "title" || field === "type" || field === "channel") renderTicketList();
        });
      };
      bind("fTitle", "title");
      bind("fType", "type");
      bind("fChannel", "channel");
      bind("fAttachment", "attachment");
      bind("fDesc", "desc");
      bind("fDesigner", "designer");
      bind("fDue", "due");
    }

    function saveCurrent() {
      renderWorkspace();
      renderTicketList();
    }

    function submitCurrentStep() {
      const ticket = getActiveTicket();
      if (currentRole === "requester") {
        if (ticket.status === "confirming_time") {
          ticket.status = "designing";
          ticket.history.push("04-19 16:30 提需求方确认完成时间");
        } else if (ticket.status === "waiting_acceptance") {
          ticket.status = "closed";
          ticket.history.push("04-19 16:30 提需求方确认设计文件");
          ticket.history.push("04-19 16:31 工单关闭");
        } else if (ticket.status === "pending_confirm") {
          ticket.history.push("04-19 16:30 提需求方更新需求内容并提交");
        }
      } else {
        if (ticket.status === "pending_confirm") {
          ticket.status = "confirming_time";
          ticket.history.push("04-19 16:30 设计部门确认需求");
        } else if (ticket.status === "confirming_time") {
          ticket.status = "designing";
          ticket.history.push(`04-19 16:30 设计部门反馈完成时间：${ticket.due || "待补充"}`);
        } else if (ticket.status === "designing") {
          const fileName = document.getElementById("fFileName")?.value || "设计稿_终版.fig";
          const fileType = document.getElementById("fFileType")?.value || "交付文件";
          const fileNote = document.getElementById("fFileNote")?.value || "设计部门上传的交付文件";
          ticket.files.push({ name: fileName, note: fileNote, type: fileType });
          ticket.status = "waiting_acceptance";
          ticket.history.push(`04-19 16:30 设计部门上传文件：${fileName}`);
        }
      }
      renderTicketList();
      renderWorkspace();
    }

    function quickForward() {
      const ticket = getActiveTicket();
      if (ticket.status === "pending_confirm") {
        ticket.status = "confirming_time";
        ticket.history.push("04-19 16:30 设计部门确认需求");
      } else if (ticket.status === "confirming_time") {
        ticket.status = "designing";
        ticket.due = ticket.due || "2026-04-23 18:00";
        ticket.history.push(`04-19 16:30 确认完成时间：${ticket.due}`);
      } else if (ticket.status === "designing") {
        ticket.status = "waiting_acceptance";
        ticket.files.push({ name: "设计稿_终版.fig", note: "系统演示自动生成文件", type: "交付文件" });
        ticket.history.push("04-19 16:30 设计部门上传设计文件");
      } else if (ticket.status === "waiting_acceptance") {
        ticket.status = "closed";
        ticket.history.push("04-19 16:30 提需求方确认设计文件");
        ticket.history.push("04-19 16:31 工单关闭");
      }
      renderTicketList();
      renderWorkspace();
    }

    function render() {
      renderFilters();
      renderTicketList();
      renderWorkspace();
    }

    document.getElementById("saveBtn").addEventListener("click", saveCurrent);
    document.getElementById("submitBtn").addEventListener("click", submitCurrentStep);
    document.getElementById("quickForward").addEventListener("click", quickForward);
    document.getElementById("resetDemo").addEventListener("click", () => {
      tickets = JSON.parse(JSON.stringify(initialTickets));
      activeId = tickets[0].id;
      currentRole = "requester";
      currentFilter = "all";
      render();
    });

    render();
  </script>
</body>
</html>
