<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>设计工单系统桌面预览</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --panel: #ffffff;
      --panel-soft: #f8fafc;
      --ink: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --brand: #c2410c;
      --brand-deep: #9a3412;
      --brand-soft: rgba(194, 65, 12, 0.08);
      --info: #1d4ed8;
      --info-soft: rgba(29, 78, 216, 0.08);
      --warn: #b45309;
      --warn-soft: rgba(180, 83, 9, 0.08);
      --good: #047857;
      --good-soft: rgba(4, 120, 87, 0.08);
      --shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Microsoft YaHei UI", "PingFang SC", "Source Han Sans SC", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top right, rgba(194, 65, 12, 0.08), transparent 26%),
        linear-gradient(180deg, #f8fafc 0%, #f4f6f9 100%);
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: 88px 1fr;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 0 24px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }

    .brand strong {
      display: block;
      font-size: 21px;
      font-weight: 800;
    }

    .brand span {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      color: var(--muted);
    }

    .port-switch,
    .page-tabs,
    .role-switch,
    .filters,
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .content {
      padding: 16px;
    }

    .view {
      display: none;
      max-width: 1440px;
      margin: 0 auto;
      gap: 16px;
    }

    .view.active {
      display: grid;
    }

    .list-view {
      grid-template-columns: 1fr;
    }

    .detail-view {
      grid-template-columns: minmax(0, 1fr) 340px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-head {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
    }

    .panel-head h2,
    .panel-head h3 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
    }

    .panel-head p {
      margin: 6px 0 0;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.7;
    }

    .switch,
    .btn,
    .pill,
    .step-pill {
      border: 0;
      border-radius: 999px;
    }

    .switch {
      padding: 10px 16px;
      background: #fff;
      border: 1px solid var(--line);
      color: var(--ink);
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
    }

    .switch.active {
      color: var(--brand-deep);
      background: var(--brand-soft);
      border-color: rgba(194, 65, 12, 0.22);
    }

    .toolbar {
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-soft);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .stats {
      padding: 18px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      border-bottom: 1px solid var(--line);
      background: #fcfcfd;
    }

    .stat {
      padding: 16px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: var(--panel-soft);
    }

    .stat span {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .stat strong {
      display: block;
      font-size: 24px;
      font-weight: 800;
    }

    .tickets {
      padding: 18px;
      display: grid;
      gap: 12px;
    }

    .ticket {
      padding: 16px;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #ffffff 0%, #fafbfc 100%);
      display: grid;
      gap: 12px;
    }

    .ticket-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
    }

    .ticket h4 {
      margin: 0;
      font-size: 17px;
      line-height: 1.5;
    }

    .meta {
      display: grid;
      gap: 4px;
      font-size: 12px;
      color: var(--muted);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 800;
    }

    .pill.warn {
      color: var(--warn);
      background: var(--warn-soft);
    }

    .pill.info {
      color: var(--info);
      background: var(--info-soft);
    }

    .pill.good {
      color: var(--good);
      background: var(--good-soft);
    }

    .pill.brand {
      color: var(--brand-deep);
      background: var(--brand-soft);
    }

    .btn {
      padding: 11px 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-primary {
      color: #fff;
      background: linear-gradient(135deg, var(--brand), #ea580c);
    }

    .btn-secondary {
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
    }

    .btn-ghost {
      color: var(--muted);
      background: var(--panel-soft);
      border: 1px solid var(--line);
    }

    .detail-main,
    .detail-side {
      display: grid;
      gap: 16px;
    }

    .card {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: #fff;
    }

    .steps {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .step-pill {
      padding: 10px 14px;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 13px;
      font-weight: 700;
    }

    .step-pill.done {
      background: var(--good-soft);
      border-color: rgba(4, 120, 87, 0.24);
    }

    .step-pill.active {
      background: var(--brand-soft);
      border-color: rgba(194, 65, 12, 0.24);
      color: var(--brand-deep);
    }

    .summary-grid,
    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .summary-item {
      padding: 14px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: var(--panel-soft);
    }

    .summary-item span {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      color: var(--muted);
    }

    .summary-item strong {
      display: block;
      font-size: 15px;
      line-height: 1.6;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      padding: 11px 12px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
    }

    .field textarea {
      min-height: 96px;
      resize: vertical;
      line-height: 1.7;
    }

    .section-title {
      margin: 0 0 12px;
      font-size: 18px;
      font-weight: 800;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .stack {
      display: grid;
      gap: 10px;
    }

    .stack-item {
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: #fff;
    }

    .stack-item strong {
      display: block;
      margin-bottom: 4px;
      font-size: 14px;
    }

    .empty {
      padding: 16px;
      border-radius: 16px;
      border: 1px dashed #d1d5db;
      background: #fafbfc;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
    }

    @media (max-width: 1180px) {
      .detail-view {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 900px) {
      .stats,
      .summary-grid,
      .field-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <strong id="systemTitle">设计工单系统桌面预览</strong>
        <span id="systemDesc">端口切换为移动端 / 小程序端，角色切换为需求端 / 设计端。</span>
      </div>
      <div class="actions">
        <div class="port-switch" id="portSwitch"></div>
        <button class="btn btn-secondary" id="resetData">恢复演示数据</button>
      </div>
    </header>

    <main class="content">
      <section class="view list-view active" id="listView">
        <div class="panel">
          <div class="panel-head">
            <div>
              <h2 id="listTitle">工单列表</h2>
              <p id="listDesc">先查看列表，再进入详情页处理当前工单。</p>
            </div>
            <div class="page-tabs">
              <button class="switch active" data-view="list">列表页</button>
              <button class="switch" data-view="detail">详情页</button>
            </div>
          </div>

          <div class="stats" id="statsRow"></div>

          <div class="toolbar">
            <div class="filters" id="filterBar"></div>
            <div class="actions">
              <button class="btn btn-primary" id="createTicket">新建工单</button>
            </div>
          </div>

          <div class="tickets" id="ticketList"></div>
        </div>
      </section>

      <section class="view detail-view" id="detailView">
        <div class="detail-main">
          <div class="panel">
            <div class="panel-head">
              <div>
                <h2 id="detailTitle">工单详情</h2>
                <p id="detailDesc">按角色完成提交、确认、上传和关闭等动作。</p>
              </div>
              <div class="page-tabs">
                <button class="switch" data-view="list">列表页</button>
                <button class="switch active" data-view="detail">详情页</button>
              </div>
            </div>
            <div class="card" style="border:0; border-radius:0;">
              <div class="steps" id="stepRow"></div>
              <div class="actions" style="justify-content:space-between; align-items:center; margin-top:14px;">
                <div class="role-switch" id="roleSwitch"></div>
                <div class="pill brand" id="roleHint">当前角色：需求端</div>
              </div>
            </div>
          </div>

          <div class="panel">
            <div class="card" style="border:0; border-radius:0;">
              <h3 class="section-title">基础信息</h3>
              <div class="summary-grid" id="summaryGrid"></div>
            </div>
          </div>

          <div class="panel">
            <div class="card" style="border:0; border-radius:0;" id="formPanel"></div>
          </div>
        </div>

        <aside class="detail-side">
          <div class="panel">
            <div class="card" style="border:0; border-radius:0;">
              <h3 class="section-title">设计文件</h3>
              <div class="stack" id="fileBox"></div>
            </div>
          </div>

          <div class="panel">
            <div class="card" style="border:0; border-radius:0;">
              <h3 class="section-title">处理记录</h3>
              <div class="stack" id="historyBox"></div>
            </div>
          </div>
        </aside>
      </section>
    </main>
  </div>

  <script>
    const steps = [
      { key: "submitted", label: "提交需求" },
      { key: "accepted", label: "确认需求" },
      { key: "scheduled", label: "确认时间" },
      { key: "delivered", label: "上传文件" },
      { key: "closed", label: "关闭工单" }
    ];

    const roles = [
      { key: "demand", label: "需求端" },
      { key: "design", label: "设计端" }
    ];

    const statusMap = {
      pending_confirm: { label: "待设计端确认", step: "submitted", tone: "warn" },
      confirming_time: { label: "待需求端确认时间", step: "accepted", tone: "info" },
      designing: { label: "设计处理中", step: "scheduled", tone: "brand" },
      waiting_acceptance: { label: "待需求端确认文件", step: "delivered", tone: "info" },
      closed: { label: "已关闭", step: "closed", tone: "good" }
    };

    const portConfigs = {
      mobile: {
        label: "移动端",
        systemTitle: "设计工单系统桌面预览 · 移动端",
        systemDesc: "模拟移动端业务数据，在桌面宽屏中查看完整流程。",
        listTitle: "移动端工单列表",
        listDesc: "展示员工通过移动端发起和查看的工单。",
        createText: "新建移动端工单",
        detailPrefix: "移动端详情页",
        demandText: {
          save: "保存需求",
          submit: "提交需求",
          confirmTime: "确认时间",
          confirmFile: "确认文件",
          close: "关闭工单"
        },
        designText: {
          accept: "确认需求",
          estimate: "反馈时间",
          upload: "上传文件"
        }
      },
      applet: {
        label: "小程序端",
        systemTitle: "设计工单系统桌面预览 · 小程序端",
        systemDesc: "模拟小程序端业务数据，在桌面宽屏中查看完整流程。",
        listTitle: "小程序端工单列表",
        listDesc: "展示员工通过小程序端发起和查看的工单。",
        createText: "新建小程序工单",
        detailPrefix: "小程序端详情页",
        demandText: {
          save: "保存草稿",
          submit: "提交需求",
          confirmTime: "确认完成时间",
          confirmFile: "确认设计文件",
          close: "关闭工单"
        },
        designText: {
          accept: "确认接单",
          estimate: "提交完成时间",
          upload: "上传设计文件"
        }
      }
    };

    const initialData = {
      mobile: [
        {
          id: "M-DES-20260419-001",
          title: "门店开业展架设计",
          demandOwner: "渠道部 / 何洋",
          designOwner: "平面设计组 / 林安",
          type: "物料设计",
          channel: "移动端提单",
          priority: "紧急",
          due: "",
          attachment: "门店开业需求说明.docx",
          desc: "门店开业需要一套展架和吊旗设计，需突出新品试吃和门店活动权益。",
          status: "pending_confirm",
          files: [],
          history: [
            "04-19 14:10 需求端提交需求"
          ]
        },
        {
          id: "M-DES-20260419-002",
          title: "朋友圈海报快速修改",
          demandOwner: "品牌部 / 徐宁",
          designOwner: "平面设计组 / 赵羽",
          type: "海报设计",
          channel: "移动端催办",
          priority: "高",
          due: "2026-04-20 16:00",
          attachment: "朋友圈文案.txt",
          desc: "对现有朋友圈海报做主题替换和日期更新，需要移动端快速确认。",
          status: "confirming_time",
          files: [],
          history: [
            "04-19 15:10 需求端提交需求",
            "04-19 15:22 设计端确认需求",
            "04-19 15:30 设计端反馈预计完成时间"
          ]
        }
      ],
      applet: [
        {
          id: "A-DES-20260419-001",
          title: "五一活动海报设计",
          demandOwner: "市场部 / 李晓",
          designOwner: "品牌设计组 / 陈可",
          type: "海报设计",
          channel: "小程序端提单",
          priority: "高",
          due: "2026-04-22 18:00",
          attachment: "活动方案_v3.pdf",
          desc: "需产出五一活动主海报 1 张、活动长图 1 张，用于公众号和朋友圈投放。",
          status: "waiting_acceptance",
          files: [
            { name: "五一活动海报_预览.jpg", note: "客户确认用预览图", type: "预览图" },
            { name: "五一活动海报_源文件.psd", note: "可继续编辑的源文件", type: "源文件" }
          ],
          history: [
            "04-19 09:30 需求端提交需求",
            "04-19 10:20 设计端确认需求",
            "04-19 10:35 设计端反馈预计完成时间",
            "04-19 10:48 需求端确认完成时间",
            "04-21 17:36 设计端上传设计文件"
          ]
        },
        {
          id: "A-DES-20260419-002",
          title: "新品详情页长图设计",
          demandOwner: "电商部 / 周静",
          designOwner: "电商设计组 / 王卓",
          type: "详情页设计",
          channel: "小程序端流转",
          priority: "中",
          due: "2026-04-24 12:00",
          attachment: "新品卖点梳理.xlsx",
          desc: "新品无骨鸡爪需输出一版电商详情页长图，包含卖点首屏、口味介绍、工艺说明和场景图。",
          status: "designing",
          files: [],
          history: [
            "04-19 11:20 需求端提交需求",
            "04-19 12:05 设计端确认需求",
            "04-19 12:15 需求端确认预计完成时间"
          ]
        }
      ]
    };

    let dataByPort = cloneData();
    let currentPort = "mobile";
    let currentView = "list";
    let currentRole = "demand";
    let currentFilter = "all";
    let activeIds = {
      mobile: dataByPort.mobile[0].id,
      applet: dataByPort.applet[0].id
    };

    const systemTitle = document.getElementById("systemTitle");
    const systemDesc = document.getElementById("systemDesc");
    const portSwitch = document.getElementById("portSwitch");
    const listTitle = document.getElementById("listTitle");
    const listDesc = document.getElementById("listDesc");
    const statsRow = document.getElementById("statsRow");
    const filterBar = document.getElementById("filterBar");
    const ticketList = document.getElementById("ticketList");
    const createTicketBtn = document.getElementById("createTicket");
    const listView = document.getElementById("listView");
    const detailView = document.getElementById("detailView");
    const detailTitle = document.getElementById("detailTitle");
    const detailDesc = document.getElementById("detailDesc");
    const roleSwitch = document.getElementById("roleSwitch");
    const roleHint = document.getElementById("roleHint");
    const stepRow = document.getElementById("stepRow");
    const summaryGrid = document.getElementById("summaryGrid");
    const formPanel = document.getElementById("formPanel");
    const fileBox = document.getElementById("fileBox");
    const historyBox = document.getElementById("historyBox");

    function cloneData() {
      return JSON.parse(JSON.stringify(initialData));
    }

    function getConfig() {
      return portConfigs[currentPort];
    }

    function getTickets() {
      return dataByPort[currentPort];
    }

    function getActiveTicket() {
      const list = getTickets();
      return list.find(item => item.id === activeIds[currentPort]) || list[0];
    }

    function getStatusPill(status) {
      const meta = statusMap[status];
      return `<span class="pill ${meta.tone}">${meta.label}</span>`;
    }

    function appendHistory(ticket, text) {
      ticket.history.push(`04-19 16:30 ${text}`);
    }

    function renderPortSwitch() {
      portSwitch.innerHTML = Object.entries(portConfigs).map(([key, config]) => `
        <button class="switch ${key === currentPort ? "active" : ""}" data-port="${key}">${config.label}</button>
      `).join("");

      [...portSwitch.querySelectorAll("[data-port]")].forEach(button => {
        button.addEventListener("click", () => {
          currentPort = button.dataset.port;
          currentRole = "demand";
          currentFilter = "all";
          renderAll();
          switchView(currentView);
        });
      });
    }

    function renderHeader() {
      const config = getConfig();
      systemTitle.textContent = config.systemTitle;
      systemDesc.textContent = config.systemDesc;
      listTitle.textContent = config.listTitle;
      listDesc.textContent = config.listDesc;
      createTicketBtn.textContent = config.createText;
    }

    function renderStats() {
      const tickets = getTickets();
      const counts = {
        total: tickets.length,
        pending: tickets.filter(item => item.status !== "closed").length,
        awaiting: tickets.filter(item => item.status === "waiting_acceptance").length,
        closed: tickets.filter(item => item.status === "closed").length
      };

      statsRow.innerHTML = `
        <div class="stat"><span>全部工单</span><strong>${counts.total}</strong></div>
        <div class="stat"><span>处理中</span><strong>${counts.pending}</strong></div>
        <div class="stat"><span>待确认文件</span><strong>${counts.awaiting}</strong></div>
        <div class="stat"><span>已关闭</span><strong>${counts.closed}</strong></div>
      `;
    }

    function renderFilters() {
      const filters = [
        { key: "all", label: "全部" },
        { key: "pending_confirm", label: "待确认需求" },
        { key: "confirming_time", label: "待确认时间" },
        { key: "designing", label: "设计处理中" },
        { key: "waiting_acceptance", label: "待确认文件" },
        { key: "closed", label: "已关闭" }
      ];

      filterBar.innerHTML = filters.map(item => `
        <button class="switch ${item.key === currentFilter ? "active" : ""}" data-filter="${item.key}">${item.label}</button>
      `).join("");

      [...filterBar.querySelectorAll("[data-filter]")].forEach(button => {
        button.addEventListener("click", () => {
          currentFilter = button.dataset.filter;
          renderList();
        });
      });
    }

    function renderList() {
      renderHeader();
      renderStats();
      renderFilters();

      const config = getConfig();
      const list = getTickets().filter(item => currentFilter === "all" || item.status === currentFilter);

      if (!list.length) {
        ticketList.innerHTML = `<div class="empty">当前端口与筛选条件下暂无工单。</div>`;
        return;
      }

      ticketList.innerHTML = list.map(ticket => `
        <article class="ticket">
          <div class="ticket-head">
            <div>
              <h4>${ticket.title}</h4>
              <div class="meta">
                <span>${ticket.id}</span>
                <span>需求端：${ticket.demandOwner}</span>
                <span>设计端：${ticket.designOwner || "待分配"}</span>
                <span>${ticket.due ? `预计完成：${ticket.due}` : "待确认完成时间"}</span>
                <span>${ticket.channel}</span>
              </div>
            </div>
            <div class="actions">
              ${getStatusPill(ticket.status)}
              <span class="pill brand">${ticket.type}</span>
            </div>
          </div>
          <div class="actions">
            <button class="btn btn-secondary" data-open="${ticket.id}">查看详情</button>
            <button class="btn btn-primary" data-enter="${ticket.id}">进入${config.label}处理</button>
          </div>
        </article>
      `).join("");

      [...ticketList.querySelectorAll("[data-open], [data-enter]")].forEach(button => {
        button.addEventListener("click", () => {
          activeIds[currentPort] = button.dataset.open || button.dataset.enter;
          switchView("detail");
          renderDetail();
        });
      });
    }

    function switchView(view) {
      currentView = view;
      listView.classList.toggle("active", view === "list");
      detailView.classList.toggle("active", view === "detail");
      [...document.querySelectorAll("[data-view]")].forEach(button => {
        button.classList.toggle("active", button.dataset.view === view);
      });
    }

    function renderRoles() {
      roleSwitch.innerHTML = roles.map(role => `
        <button class="switch ${role.key === currentRole ? "active" : ""}" data-role="${role.key}">${role.label}</button>
      `).join("");

      [...roleSwitch.querySelectorAll("[data-role]")].forEach(button => {
        button.addEventListener("click", () => {
          currentRole = button.dataset.role;
          renderDetail();
        });
      });
    }

    function renderSteps(ticket) {
      const currentStep = statusMap[ticket.status].step;
      const currentIndex = steps.findIndex(item => item.key === currentStep);
      stepRow.innerHTML = steps.map((step, index) => `
        <div class="step-pill ${index < currentIndex ? "done" : index === currentIndex ? "active" : ""}">
          ${step.label}
        </div>
      `).join("");
    }

    function renderSummary(ticket) {
      summaryGrid.innerHTML = `
        <div class="summary-item"><span>工单编号</span><strong>${ticket.id}</strong></div>
        <div class="summary-item"><span>当前状态</span><strong>${statusMap[ticket.status].label}</strong></div>
        <div class="summary-item"><span>端口</span><strong>${getConfig().label}</strong></div>
        <div class="summary-item"><span>需求类型</span><strong>${ticket.type}</strong></div>
        <div class="summary-item"><span>需求端</span><strong>${ticket.demandOwner}</strong></div>
        <div class="summary-item"><span>设计端</span><strong>${ticket.designOwner || "待分配"}</strong></div>
      `;
    }

    function commonFields(ticket, readonly) {
      const disabled = readonly ? "disabled" : "";
      return `
        <div class="field-grid">
          <div class="field">
            <label>需求标题</label>
            <input id="field-title" value="${ticket.title}" ${disabled} />
          </div>
          <div class="field">
            <label>需求端</label>
            <input id="field-demandOwner" value="${ticket.demandOwner}" ${disabled} />
          </div>
          <div class="field">
            <label>设计端</label>
            <input id="field-designOwner" value="${ticket.designOwner}" ${disabled} />
          </div>
          <div class="field">
            <label>需求类型</label>
            <select id="field-type" ${disabled}>
              ${["海报设计", "详情页设计", "物料设计", "包装设计", "其它"].map(item => `<option value="${item}" ${ticket.type === item ? "selected" : ""}>${item}</option>`).join("")}
            </select>
          </div>
          <div class="field">
            <label>端口</label>
            <input value="${getConfig().label}" disabled />
          </div>
          <div class="field">
            <label>优先级</label>
            <input id="field-priority" value="${ticket.priority}" ${disabled} />
          </div>
          <div class="field">
            <label>预计完成时间</label>
            <input id="field-due" value="${ticket.due}" placeholder="例如：2026-04-24 18:00" ${disabled} />
          </div>
          <div class="field">
            <label>需求附件</label>
            <input id="field-attachment" value="${ticket.attachment}" ${disabled} />
          </div>
          <div class="field full">
            <label>需求说明</label>
            <textarea id="field-desc" ${disabled}>${ticket.desc}</textarea>
          </div>
        </div>
      `;
    }

    function renderDemandForm(ticket) {
      const text = getConfig().demandText;

      if (ticket.status === "pending_confirm") {
        return `
          <h3 class="section-title">提交需求</h3>
          <p class="hint">当前为需求端操作，可先保存再提交给设计端。</p>
          ${commonFields(ticket, false)}
          <div class="actions" style="margin-top:14px;">
            <button class="btn btn-ghost" data-action="save-demand">${text.save}</button>
            <button class="btn btn-primary" data-action="submit-demand">${text.submit}</button>
          </div>
        `;
      }

      if (ticket.status === "confirming_time") {
        return `
          <h3 class="section-title">确认完成时间</h3>
          <p class="hint">当前由需求端确认设计端反馈的预计完成时间。</p>
          ${commonFields(ticket, true)}
          <div class="actions" style="margin-top:14px;">
            <button class="btn btn-primary" data-action="confirm-time">${text.confirmTime}</button>
          </div>
        `;
      }

      if (ticket.status === "waiting_acceptance") {
        return `
          <h3 class="section-title">确认设计文件</h3>
          <p class="hint">请确认设计文件，确认无误后关闭工单。</p>
          ${commonFields(ticket, true)}
          <div class="actions" style="margin-top:14px;">
            <button class="btn btn-secondary" data-action="confirm-file">${text.confirmFile}</button>
            <button class="btn btn-primary" data-action="close-ticket">${text.close}</button>
          </div>
        `;
      }

      return `
        <h3 class="section-title">工单详情</h3>
        <p class="hint">当前步骤无需需求端继续操作，可查看工单信息与记录。</p>
        ${commonFields(ticket, true)}
      `;
    }

    function renderDesignForm(ticket) {
      const text = getConfig().designText;

      if (ticket.status === "pending_confirm") {
        return `
          <h3 class="section-title">确认需求</h3>
          <p class="hint">设计端确认需求可承接后，进入时间确认环节。</p>
          ${commonFields(ticket, false)}
          <div class="actions" style="margin-top:14px;">
            <button class="btn btn-primary" data-action="accept-demand">${text.accept}</button>
          </div>
        `;
      }

      if (ticket.status === "confirming_time") {
        return `
          <h3 class="section-title">反馈完成时间</h3>
          <p class="hint">请填写预计完成时间并提交给需求端确认。</p>
          ${commonFields(ticket, false)}
          <div class="actions" style="margin-top:14px;">
            <button class="btn btn-primary" data-action="estimate-time">${text.estimate}</button>
          </div>
        `;
      }

      if (ticket.status === "designing") {
        return `
          <h3 class="section-title">上传设计文件</h3>
          <p class="hint">上传预览图与源文件后，进入需求端确认阶段。</p>
          ${commonFields(ticket, true)}
          <div class="field-grid" style="margin-top:14px;">
            <div class="field">
              <label>预览图文件名</label>
              <input id="upload-preview" placeholder="例如：活动海报_预览.jpg" />
            </div>
            <div class="field">
              <label>源文件名</label>
              <input id="upload-source" placeholder="例如：活动海报_源文件.psd" />
            </div>
            <div class="field full">
              <label>交付说明</label>
              <textarea id="upload-note" placeholder="填写交付版本与备注。"></textarea>
            </div>
          </div>
          <div class="actions" style="margin-top:14px;">
            <button class="btn btn-primary" data-action="upload-files">${text.upload}</button>
          </div>
        `;
      }

      return `
        <h3 class="section-title">工单详情</h3>
        <p class="hint">当前步骤无需设计端继续操作，可查看工单信息与记录。</p>
        ${commonFields(ticket, true)}
      `;
    }

    function saveCommonFields(ticket) {
      const keys = ["title", "demandOwner", "designOwner", "type", "priority", "due", "attachment", "desc"];
      keys.forEach(key => {
        const node = document.getElementById(`field-${key}`);
        if (node) {
          ticket[key] = node.value.trim();
        }
      });
    }

    function bindActions(ticket) {
      [...formPanel.querySelectorAll("[data-action]")].forEach(button => {
        button.addEventListener("click", () => {
          const action = button.dataset.action;

          if (action === "save-demand") {
            saveCommonFields(ticket);
            appendHistory(ticket, `${getConfig().label}需求端保存需求`);
          }

          if (action === "submit-demand") {
            saveCommonFields(ticket);
            appendHistory(ticket, `${getConfig().label}需求端提交需求`);
          }

          if (action === "accept-demand") {
            saveCommonFields(ticket);
            ticket.status = "confirming_time";
            appendHistory(ticket, `${getConfig().label}设计端确认需求`);
          }

          if (action === "estimate-time") {
            saveCommonFields(ticket);
            if (!ticket.due) {
              ticket.due = "2026-04-23 18:00";
            }
            appendHistory(ticket, `${getConfig().label}设计端反馈预计完成时间 ${ticket.due}`);
          }

          if (action === "confirm-time") {
            ticket.status = "designing";
            appendHistory(ticket, `${getConfig().label}需求端确认完成时间`);
          }

          if (action === "upload-files") {
            const previewName = document.getElementById("upload-preview")?.value.trim() || "设计预览图.jpg";
            const sourceName = document.getElementById("upload-source")?.value.trim() || "设计源文件.psd";
            const note = document.getElementById("upload-note")?.value.trim() || "设计端已上传交付文件";
            ticket.files = [
              { name: previewName, note, type: "预览图" },
              { name: sourceName, note, type: "源文件" }
            ];
            ticket.status = "waiting_acceptance";
            appendHistory(ticket, `${getConfig().label}设计端上传设计文件`);
          }

          if (action === "confirm-file") {
            appendHistory(ticket, `${getConfig().label}需求端确认设计文件`);
          }

          if (action === "close-ticket") {
            ticket.status = "closed";
            appendHistory(ticket, `${getConfig().label}需求端关闭工单`);
          }

          renderAll();
          switchView("detail");
        });
      });
    }

    function renderFiles(ticket) {
      fileBox.innerHTML = ticket.files.length ? ticket.files.map(file => `
        <div class="stack-item">
          <strong>${file.name}</strong>
          <div class="hint">${file.type} · ${file.note}</div>
        </div>
      `).join("") : `<div class="empty">当前暂无已上传设计文件。</div>`;
    }

    function renderHistory(ticket) {
      historyBox.innerHTML = ticket.history.map(item => `
        <div class="stack-item">
          <strong>${item.split(" ").slice(0, 2).join(" ")}</strong>
          <div class="hint">${item.split(" ").slice(2).join(" ")}</div>
        </div>
      `).join("");
    }

    function renderDetail() {
      const ticket = getActiveTicket();
      if (!ticket) {
        return;
      }

      detailTitle.textContent = `${getConfig().label}工单详情`;
      detailDesc.textContent = `${getConfig().detailPrefix} · ${ticket.id} · ${statusMap[ticket.status].label} · 需求端：${ticket.demandOwner}`;
      roleHint.textContent = `当前角色：${roles.find(role => role.key === currentRole).label}`;

      renderRoles();
      renderSteps(ticket);
      renderSummary(ticket);
      formPanel.innerHTML = currentRole === "demand" ? renderDemandForm(ticket) : renderDesignForm(ticket);
      renderFiles(ticket);
      renderHistory(ticket);
      bindActions(ticket);
    }

    function bindViewSwitch() {
      [...document.querySelectorAll("[data-view]")].forEach(button => {
        button.addEventListener("click", () => {
          switchView(button.dataset.view);
          if (button.dataset.view === "detail") {
            renderDetail();
          }
        });
      });
    }

    function createTicket() {
      const prefix = currentPort === "mobile" ? "M" : "A";
      const next = {
        id: `${prefix}-DES-20260419-00${getTickets().length + 1}`,
        title: currentPort === "mobile" ? "新建移动端需求" : "新建小程序端需求",
        demandOwner: "待填写需求端",
        designOwner: "待分配设计端",
        type: "海报设计",
        channel: `${getConfig().label}新建工单`,
        priority: "中",
        due: "",
        attachment: "",
        desc: "",
        status: "pending_confirm",
        files: [],
        history: [`04-19 16:30 系统创建${getConfig().label}新工单`]
      };
      getTickets().unshift(next);
      activeIds[currentPort] = next.id;
      currentRole = "demand";
      renderAll();
      switchView("detail");
    }

    function renderAll() {
      renderPortSwitch();
      renderHeader();
      renderList();
      renderDetail();
    }

    document.getElementById("createTicket").addEventListener("click", createTicket);
    document.getElementById("resetData").addEventListener("click", () => {
      dataByPort = cloneData();
      currentPort = "mobile";
      currentView = "list";
      currentRole = "demand";
      currentFilter = "all";
      activeIds = {
        mobile: dataByPort.mobile[0].id,
        applet: dataByPort.applet[0].id
      };
      renderAll();
      switchView("list");
    });

    bindViewSwitch();
    renderAll();
    switchView("list");
  </script>
</body>
</html>
