<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>设计工单系统 PC 端原型</title>
  <style>
    :root {
      --bg: #f3f5f7;
      --panel: #ffffff;
      --panel-soft: #f8fafc;
      --ink: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --brand: #c2410c;
      --brand-deep: #9a3412;
      --brand-soft: rgba(194, 65, 12, 0.08);
      --good: #047857;
      --good-soft: rgba(4, 120, 87, 0.08);
      --warn: #b45309;
      --warn-soft: rgba(180, 83, 9, 0.08);
      --info: #1d4ed8;
      --info-soft: rgba(29, 78, 216, 0.08);
      --shadow: 0 18px 42px rgba(15, 23, 42, 0.08);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Microsoft YaHei UI", "PingFang SC", "Source Han Sans SC", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top right, rgba(194, 65, 12, 0.08), transparent 26%),
        linear-gradient(180deg, #f8fafc 0%, #f3f5f7 100%);
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: 74px 1fr;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }

    .brand strong {
      display: block;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .brand span {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      color: var(--muted);
    }

    .top-actions {
      display: flex;
      gap: 10px;
    }

    .main {
      display: grid;
      grid-template-columns: 344px minmax(0, 1fr);
      gap: 16px;
      padding: 16px;
      min-height: 0;
    }

    .sidebar,
    .workspace {
      min-height: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .sidebar {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
    }

    .panel-head {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--line);
    }

    .panel-head h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
    }

    .panel-head p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .filter-row,
    .role-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding: 14px 18px;
      background: var(--panel-soft);
      border-bottom: 1px solid var(--line);
    }

    .ticket-list {
      overflow: auto;
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .ticket-card {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      background: #fff;
      cursor: pointer;
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .ticket-card:hover {
      transform: translateY(-1px);
      border-color: #d4dae2;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.04);
    }

    .ticket-card.active {
      border-color: rgba(194, 65, 12, 0.28);
      background: linear-gradient(180deg, #fffdfb 0%, #fff8f3 100%);
      box-shadow: inset 0 0 0 1px rgba(194, 65, 12, 0.08);
    }

    .ticket-card h3 {
      margin: 0;
      font-size: 15px;
      line-height: 1.5;
    }

    .ticket-meta {
      margin-top: 10px;
      display: grid;
      gap: 4px;
      font-size: 12px;
      color: var(--muted);
    }

    .pill-row {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill,
    .chip,
    .seg,
    .btn {
      border: 0;
      border-radius: 999px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 800;
      border: 1px solid transparent;
    }

    .pill.warn {
      color: var(--warn);
      background: var(--warn-soft);
    }

    .pill.info {
      color: var(--info);
      background: var(--info-soft);
    }

    .pill.brand {
      color: var(--brand-deep);
      background: var(--brand-soft);
    }

    .pill.good {
      color: var(--good);
      background: var(--good-soft);
    }

    .chip,
    .seg {
      padding: 9px 14px;
      background: #fff;
      border: 1px solid var(--line);
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .chip.active,
    .seg.active {
      color: var(--brand-deep);
      background: var(--brand-soft);
      border-color: rgba(194, 65, 12, 0.24);
    }

    .workspace {
      display: grid;
      grid-template-rows: auto auto auto minmax(0, 1fr) auto;
    }

    .workspace-head {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
    }

    .workspace-head h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
    }

    .workspace-head p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .workspace-head .badge {
      display: inline-flex;
      align-items: center;
      padding: 10px 14px;
      border-radius: 14px;
      background: var(--panel-soft);
      border: 1px solid var(--line);
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
    }

    .stepbar {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      padding: 16px 18px;
      background: var(--panel-soft);
      border-bottom: 1px solid var(--line);
    }

    .step {
      padding: 12px;
      border-radius: 16px;
      background: #fff;
      border: 1px solid var(--line);
    }

    .step small {
      display: block;
      margin-bottom: 4px;
      font-size: 11px;
      color: var(--muted);
    }

    .step strong {
      display: block;
      font-size: 13px;
      line-height: 1.45;
    }

    .step.done {
      border-color: rgba(4, 120, 87, 0.24);
      background: var(--good-soft);
    }

    .step.active {
      border-color: rgba(194, 65, 12, 0.24);
      background: var(--brand-soft);
    }

    .summary-bar {
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .summary-item {
      padding: 14px;
      border-radius: 18px;
      background: var(--panel-soft);
      border: 1px solid var(--line);
    }

    .summary-item span {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      color: var(--muted);
    }

    .summary-item strong {
      display: block;
      font-size: 15px;
      line-height: 1.5;
    }

    .form-area {
      overflow: auto;
      padding: 18px;
      display: grid;
      gap: 16px;
      background: #fcfcfd;
    }

    .card {
      padding: 18px;
      border-radius: var(--radius);
      background: #fff;
      border: 1px solid var(--line);
      display: grid;
      gap: 14px;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
    }

    .card-head h3 {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
    }

    .card-head p {
      margin: 6px 0 0;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.7;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      padding: 11px 12px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
    }

    .field textarea {
      min-height: 98px;
      resize: vertical;
      line-height: 1.7;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .upload-box,
    .history-box {
      padding: 14px;
      border-radius: 16px;
      border: 1px dashed #d5dae1;
      background: #fbfcfd;
    }

    .upload-list,
    .history-list {
      display: grid;
      gap: 10px;
    }

    .upload-item,
    .history-item {
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #fff;
    }

    .upload-item strong,
    .history-item strong {
      display: block;
      margin-bottom: 4px;
      font-size: 14px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 11px 16px;
      cursor: pointer;
      font-weight: 800;
    }

    .btn-primary {
      color: #fff;
      background: linear-gradient(135deg, var(--brand), #ea580c);
    }

    .btn-secondary {
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
    }

    .btn-ghost {
      color: var(--muted);
      background: var(--panel-soft);
      border: 1px solid var(--line);
    }

    .footbar {
      padding: 16px 18px;
      border-top: 1px solid var(--line);
      background: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .footbar small {
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 1200px) {
      .main {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 860px) {
      .stepbar,
      .summary-bar,
      .field-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <strong>设计工单系统</strong>
        <span>提需求、确认排期、上传设计文件、确认交付、关闭工单</span>
      </div>
      <div class="top-actions">
        <button class="btn btn-secondary" id="resetDemo">恢复演示数据</button>
        <button class="btn btn-primary" id="quickForward">推进当前工单</button>
      </div>
    </header>

    <main class="main">
      <aside class="sidebar">
        <div class="panel-head">
          <h2>工单列表</h2>
          <p>按状态查看当前工单，点击进入处理。</p>
        </div>
        <div class="filter-row" id="statusFilters"></div>
        <div class="ticket-list" id="ticketList"></div>
      </aside>

      <section class="workspace">
        <div class="workspace-head">
          <div>
            <h2 id="workspaceTitle">设计工单处理台</h2>
            <p id="workspaceDesc">根据当前角色与工单状态展示对应表单与操作。</p>
          </div>
          <div class="badge" id="workspaceBadge">当前角色：提需求方</div>
        </div>
        <div class="stepbar" id="stepbar"></div>
        <div class="role-row" id="roleSwitch"></div>
        <div class="summary-bar" id="summaryBar"></div>
        <div class="form-area" id="formArea"></div>
        <div class="footbar">
          <small id="footHint">请按当前步骤完成处理后提交。</small>
          <div class="actions">
            <button class="btn btn-ghost" id="saveBtn">保存</button>
            <button class="btn btn-primary" id="submitBtn">提交当前步骤</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const roles = [
      { key: "requester", label: "提需求方" },
      { key: "designer", label: "设计部门" }
    ];

    const steps = [
      { key: "submitted", label: "提交需求" },
      { key: "accepted", label: "设计确认" },
      { key: "scheduled", label: "确认时间" },
      { key: "delivered", label: "上传文件" },
      { key: "closed", label: "关闭工单" }
    ];

    const statusMap = {
      pending_confirm: { label: "待设计确认", step: "submitted", tone: "warn" },
      confirming_time: { label: "待确认完成时间", step: "accepted", tone: "info" },
      designing: { label: "设计中", step: "scheduled", tone: "brand" },
      waiting_acceptance: { label: "待确认设计文件", step: "delivered", tone: "info" },
      closed: { label: "已关闭", step: "closed", tone: "good" }
    };

    const initialTickets = [
      {
        id: "DES-20260419-001",
        title: "五一活动海报设计",
        applicant: "市场部 / 李晓",
        designer: "品牌设计组 / 陈可",
        type: "海报设计",
        channel: "线上活动",
        priority: "高",
        due: "2026-04-22 18:00",
        desc: "需产出五一活动主海报 1 张、活动长图 1 张，用于公众号和朋友圈投放。",
        attachment: "活动方案_v3.pdf",
        status: "waiting_acceptance",
        files: [
          { name: "五一活动海报_预览.jpg", note: "客户确认用预览图", type: "预览图" },
          { name: "五一活动海报_源文件.psd", note: "可继续编辑的源文件", type: "源文件" }
        ],
        history: [
          "04-19 09:30 提需求方提交需求",
          "04-19 10:20 设计部门确认需求",
          "04-19 10:35 设计部门反馈预计完成时间",
          "04-19 10:48 提需求方确认完成时间",
          "04-21 17:36 设计部门上传设计文件"
        ]
      },
      {
        id: "DES-20260419-002",
        title: "新品详情页长图设计",
        applicant: "电商部 / 周静",
        designer: "电商设计组 / 王卓",
        type: "详情页设计",
        channel: "天猫 / 京东",
        priority: "中",
        due: "2026-04-24 12:00",
        desc: "新品无骨鸡爪需输出一版电商详情页长图，包含卖点首屏、口味介绍、工艺说明和场景图。",
        attachment: "新品卖点梳理.xlsx",
        status: "designing",
        files: [],
        history: [
          "04-19 11:20 提需求方提交需求",
          "04-19 12:05 设计部门确认需求",
          "04-19 12:15 提需求方确认预计完成时间"
        ]
      },
      {
        id: "DES-20260419-003",
        title: "门店开业展架设计",
        applicant: "渠道部 / 何洋",
        designer: "平面设计组 / 林安",
        type: "物料设计",
        channel: "线下门店",
        priority: "紧急",
        due: "",
        desc: "门店开业需要一套展架和吊旗设计，需突出新品试吃和门店活动权益。",
        attachment: "门店开业需求说明.docx",
        status: "pending_confirm",
        files: [],
        history: [
          "04-19 14:10 提需求方提交需求"
        ]
      }
    ];

    let tickets = cloneTickets();
    let currentRole = "requester";
    let currentFilter = "all";
    let activeId = tickets[0].id;

    const statusFilters = document.getElementById("statusFilters");
    const ticketList = document.getElementById("ticketList");
    const stepbar = document.getElementById("stepbar");
    const roleSwitch = document.getElementById("roleSwitch");
    const summaryBar = document.getElementById("summaryBar");
    const formArea = document.getElementById("formArea");
    const workspaceTitle = document.getElementById("workspaceTitle");
    const workspaceDesc = document.getElementById("workspaceDesc");
    const workspaceBadge = document.getElementById("workspaceBadge");
    const footHint = document.getElementById("footHint");

    function cloneTickets() {
      return JSON.parse(JSON.stringify(initialTickets));
    }

    function getActiveTicket() {
      const list = getFilteredTickets();
      const matched = tickets.find(ticket => ticket.id === activeId);
      if (matched && (currentFilter === "all" || matched.status === currentFilter)) {
        return matched;
      }
      if (list.length) {
        activeId = list[0].id;
        return list[0];
      }
      activeId = tickets[0] ? tickets[0].id : "";
      return tickets[0];
    }

    function getFilteredTickets() {
      return tickets.filter(ticket => currentFilter === "all" || ticket.status === currentFilter);
    }

    function getStatusPill(status) {
      const meta = statusMap[status];
      return `<span class="pill ${meta.tone}">${meta.label}</span>`;
    }

    function appendHistory(ticket, text) {
      ticket.history.push(`04-19 16:30 ${text}`);
    }

    function saveCommonFields(ticket) {
      const ids = ["title", "applicant", "designer", "type", "channel", "priority", "due", "attachment", "desc"];
      ids.forEach(id => {
        const node = document.getElementById(`field-${id}`);
        if (node) {
          ticket[id] = node.value.trim();
        }
      });
    }

    function renderFilters() {
      const filters = [
        { key: "all", label: "全部" },
        { key: "pending_confirm", label: "待设计确认" },
        { key: "confirming_time", label: "待确认时间" },
        { key: "designing", label: "设计中" },
        { key: "waiting_acceptance", label: "待确认文件" },
        { key: "closed", label: "已关闭" }
      ];

      statusFilters.innerHTML = filters.map(item => `
        <button class="chip ${item.key === currentFilter ? "active" : ""}" data-filter="${item.key}">${item.label}</button>
      `).join("");

      [...statusFilters.querySelectorAll("[data-filter]")].forEach(button => {
        button.addEventListener("click", () => {
          currentFilter = button.dataset.filter;
          renderAll();
        });
      });
    }

    function renderTicketList() {
      const list = getFilteredTickets();
      if (!list.length) {
        ticketList.innerHTML = `<div class="ticket-card"><div class="ticket-meta">当前筛选条件下暂无工单。</div></div>`;
        return;
      }

      ticketList.innerHTML = list.map(ticket => `
        <article class="ticket-card ${ticket.id === activeId ? "active" : ""}" data-id="${ticket.id}">
          <h3>${ticket.title}</h3>
          <div class="ticket-meta">
            <span>${ticket.id}</span>
            <span>${ticket.applicant}</span>
            <span>${ticket.due ? `预计完成：${ticket.due}` : "待确认完成时间"}</span>
          </div>
          <div class="pill-row">
            ${getStatusPill(ticket.status)}
            <span class="pill brand">${ticket.type}</span>
          </div>
        </article>
      `).join("");

      [...ticketList.querySelectorAll("[data-id]")].forEach(card => {
        card.addEventListener("click", () => {
          activeId = card.dataset.id;
          renderAll();
        });
      });
    }

    function renderSteps(ticket) {
      const currentIndex = steps.findIndex(step => step.key === statusMap[ticket.status].step);
      stepbar.innerHTML = steps.map((step, index) => {
        const state = index < currentIndex ? "done" : index === currentIndex ? "active" : "";
        return `
          <div class="step ${state}">
            <small>步骤 ${index + 1}</small>
            <strong>${step.label}</strong>
          </div>
        `;
      }).join("");
    }

    function renderRoles() {
      roleSwitch.innerHTML = roles.map(role => `
        <button class="seg ${role.key === currentRole ? "active" : ""}" data-role="${role.key}">${role.label}</button>
      `).join("");

      [...roleSwitch.querySelectorAll("[data-role]")].forEach(button => {
        button.addEventListener("click", () => {
          currentRole = button.dataset.role;
          renderAll();
        });
      });
    }

    function renderSummary(ticket) {
      summaryBar.innerHTML = `
        <div class="summary-item">
          <span>工单编号</span>
          <strong>${ticket.id}</strong>
        </div>
        <div class="summary-item">
          <span>当前状态</span>
          <strong>${statusMap[ticket.status].label}</strong>
        </div>
        <div class="summary-item">
          <span>需求部门</span>
          <strong>${ticket.applicant}</strong>
        </div>
        <div class="summary-item">
          <span>设计负责人</span>
          <strong>${ticket.designer || "待分配"}</strong>
        </div>
      `;
    }

    function commonFields(ticket, readonly = false) {
      const disabled = readonly ? "disabled" : "";
      return `
        <div class="field-grid">
          <div class="field">
            <label>需求标题</label>
            <input id="field-title" value="${ticket.title}" ${disabled} />
          </div>
          <div class="field">
            <label>需求部门 / 提交人</label>
            <input id="field-applicant" value="${ticket.applicant}" ${disabled} />
          </div>
          <div class="field">
            <label>设计负责人</label>
            <input id="field-designer" value="${ticket.designer}" ${disabled} />
          </div>
          <div class="field">
            <label>需求类型</label>
            <select id="field-type" ${disabled}>
              ${["海报设计", "详情页设计", "物料设计", "包装设计", "其它"].map(item => `<option value="${item}" ${ticket.type === item ? "selected" : ""}>${item}</option>`).join("")}
            </select>
          </div>
          <div class="field">
            <label>投放渠道</label>
            <input id="field-channel" value="${ticket.channel}" ${disabled} />
          </div>
          <div class="field">
            <label>优先级</label>
            <select id="field-priority" ${disabled}>
              ${["高", "中", "紧急"].map(item => `<option value="${item}" ${ticket.priority === item ? "selected" : ""}>${item}</option>`).join("")}
            </select>
          </div>
          <div class="field">
            <label>预计完成时间</label>
            <input id="field-due" value="${ticket.due}" placeholder="例如：2026-04-24 18:00" ${disabled} />
          </div>
          <div class="field">
            <label>需求附件</label>
            <input id="field-attachment" value="${ticket.attachment}" ${disabled} />
          </div>
          <div class="field full">
            <label>需求说明</label>
            <textarea id="field-desc" ${disabled}>${ticket.desc}</textarea>
          </div>
        </div>
      `;
    }

    function fileListBlock(ticket) {
      return ticket.files.length ? `
        <div class="upload-list">
          ${ticket.files.map(file => `
            <div class="upload-item">
              <strong>${file.name}</strong>
              <div class="hint">${file.type} · ${file.note}</div>
            </div>
          `).join("")}
        </div>
      ` : `<div class="hint">当前暂无已上传设计文件。</div>`;
    }

    function historyBlock(ticket) {
      return `
        <div class="history-list">
          ${ticket.history.map(item => `
            <div class="history-item">
              <strong>${item.split(" ").slice(0, 2).join(" ")}</strong>
              <div class="hint">${item.split(" ").slice(2).join(" ")}</div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderRequesterForm(ticket) {
      const status = ticket.status;
      const actionHintMap = {
        pending_confirm: "当前已提交需求，等待设计部门确认。",
        confirming_time: "请确认设计部门反馈的完成时间。",
        designing: "当前设计执行中，可继续查看需求内容。",
        waiting_acceptance: "请确认设计文件，确认无误后关闭工单。",
        closed: "当前工单已完成关闭。"
      };

      let actionCard = "";
      if (status === "pending_confirm") {
        actionCard = `
          <div class="card">
            <div class="card-head">
              <div>
                <h3>提交需求</h3>
                <p>提需求方填写完整信息后提交至设计部门。</p>
              </div>
              ${getStatusPill(status)}
            </div>
            ${commonFields(ticket, false)}
          </div>
        `;
      } else if (status === "confirming_time") {
        actionCard = `
          <div class="card">
            <div class="card-head">
              <div>
                <h3>确认完成时间</h3>
                <p>当前需要提需求方确认设计部门给出的交付时间。</p>
              </div>
              ${getStatusPill(status)}
            </div>
            ${commonFields(ticket, true)}
            <div class="actions">
              <button class="btn btn-primary" data-action="confirm-time">确认完成时间</button>
            </div>
          </div>
        `;
      } else if (status === "waiting_acceptance") {
        actionCard = `
          <div class="card">
            <div class="card-head">
              <div>
                <h3>确认设计文件</h3>
                <p>请先查看设计部门上传的文件，再确认交付并关闭工单。</p>
              </div>
              ${getStatusPill(status)}
            </div>
            ${commonFields(ticket, true)}
            <div class="upload-box">
              <div class="card-head">
                <div>
                  <h3>已上传文件</h3>
                  <p>预览图与源文件均可在此查看。</p>
                </div>
              </div>
              ${fileListBlock(ticket)}
            </div>
            <div class="actions">
              <button class="btn btn-secondary" data-action="confirm-file">确认设计文件</button>
              <button class="btn btn-primary" data-action="close-ticket">关闭工单</button>
            </div>
          </div>
        `;
      } else {
        actionCard = `
          <div class="card">
            <div class="card-head">
              <div>
                <h3>工单信息</h3>
                <p>${actionHintMap[status]}</p>
              </div>
              ${getStatusPill(status)}
            </div>
            ${commonFields(ticket, true)}
          </div>
        `;
      }

      formArea.innerHTML = `
        ${actionCard}
        <div class="card">
          <div class="card-head">
            <div>
              <h3>处理记录</h3>
              <p>按时间查看本工单的流转过程。</p>
            </div>
          </div>
          <div class="history-box">
            ${historyBlock(ticket)}
          </div>
        </div>
      `;
    }

    function renderDesignerForm(ticket) {
      const status = ticket.status;
      let actionCard = "";

      if (status === "pending_confirm") {
        actionCard = `
          <div class="card">
            <div class="card-head">
              <div>
                <h3>确认需求</h3>
                <p>设计部门确认工单可承接后进入排期确认环节。</p>
              </div>
              ${getStatusPill(status)}
            </div>
            ${commonFields(ticket, false)}
            <div class="actions">
              <button class="btn btn-primary" data-action="accept-ticket">确认需求</button>
            </div>
          </div>
        `;
      } else if (status === "confirming_time") {
        actionCard = `
          <div class="card">
            <div class="card-head">
              <div>
                <h3>反馈完成时间</h3>
                <p>设计部门填写预计完成时间，等待提需求方确认。</p>
              </div>
              ${getStatusPill(status)}
            </div>
            ${commonFields(ticket, false)}
            <div class="actions">
              <button class="btn btn-primary" data-action="estimate-time">反馈完成时间</button>
            </div>
          </div>
        `;
      } else if (status === "designing") {
        actionCard = `
          <div class="card">
            <div class="card-head">
              <div>
                <h3>上传设计文件</h3>
                <p>交付预览图与源文件后，进入提需求方确认阶段。</p>
              </div>
              ${getStatusPill(status)}
            </div>
            ${commonFields(ticket, true)}
            <div class="field-grid">
              <div class="field">
                <label>预览图文件名</label>
                <input id="upload-preview" placeholder="例如：活动海报_预览.jpg" />
              </div>
              <div class="field">
                <label>源文件名</label>
                <input id="upload-source" placeholder="例如：活动海报_源文件.psd" />
              </div>
              <div class="field full">
                <label>交付说明</label>
                <textarea id="upload-note" placeholder="填写设计版本、注意事项或修改建议。"></textarea>
              </div>
            </div>
            <div class="actions">
              <button class="btn btn-primary" data-action="upload-files">上传设计文件</button>
            </div>
          </div>
        `;
      } else {
        actionCard = `
          <div class="card">
            <div class="card-head">
              <div>
                <h3>工单信息</h3>
                <p>当前步骤无需设计部门继续处理，可查看完整信息与记录。</p>
              </div>
              ${getStatusPill(status)}
            </div>
            ${commonFields(ticket, true)}
          </div>
        `;
      }

      formArea.innerHTML = `
        ${actionCard}
        <div class="card">
          <div class="card-head">
            <div>
              <h3>设计文件</h3>
              <p>当前工单已上传文件列表。</p>
            </div>
          </div>
          <div class="upload-box">
            ${fileListBlock(ticket)}
          </div>
        </div>
        <div class="card">
          <div class="card-head">
            <div>
              <h3>处理记录</h3>
              <p>按时间查看本工单处理过程。</p>
            </div>
          </div>
          <div class="history-box">
            ${historyBlock(ticket)}
          </div>
        </div>
      `;
    }

    function bindActionButtons(ticket) {
      const handlers = {
        "accept-ticket": () => {
          saveCommonFields(ticket);
          ticket.status = "confirming_time";
          appendHistory(ticket, "设计部门确认需求");
        },
        "estimate-time": () => {
          saveCommonFields(ticket);
          if (!ticket.due) {
            ticket.due = "2026-04-23 18:00";
          }
          appendHistory(ticket, `设计部门反馈预计完成时间 ${ticket.due}`);
        },
        "confirm-time": () => {
          saveCommonFields(ticket);
          ticket.status = "designing";
          appendHistory(ticket, "提需求方确认完成时间");
        },
        "upload-files": () => {
          const previewName = document.getElementById("upload-preview")?.value.trim() || "设计预览图.jpg";
          const sourceName = document.getElementById("upload-source")?.value.trim() || "设计源文件.fig";
          const note = document.getElementById("upload-note")?.value.trim() || "设计部门提交交付文件";
          ticket.files = [
            { name: previewName, note, type: "预览图" },
            { name: sourceName, note, type: "源文件" }
          ];
          ticket.status = "waiting_acceptance";
          appendHistory(ticket, "设计部门上传设计文件");
        },
        "confirm-file": () => {
          appendHistory(ticket, "提需求方确认设计文件");
        },
        "close-ticket": () => {
          ticket.status = "closed";
          appendHistory(ticket, "提需求方关闭工单");
        }
      };

      [...formArea.querySelectorAll("[data-action]")].forEach(button => {
        button.addEventListener("click", () => {
          const action = button.dataset.action;
          if (handlers[action]) {
            handlers[action]();
            renderAll();
          }
        });
      });
    }

    function renderWorkspace() {
      const ticket = getActiveTicket();
      if (!ticket) {
        formArea.innerHTML = `<div class="card"><div class="hint">暂无可展示工单。</div></div>`;
        return;
      }

      workspaceTitle.textContent = ticket.title;
      workspaceDesc.textContent = `${ticket.id} · ${ticket.type} · ${ticket.channel}`;
      workspaceBadge.textContent = `当前角色：${roles.find(role => role.key === currentRole).label}`;
      footHint.textContent = currentRole === "requester"
        ? "提需求方可提交需求、确认完成时间、确认设计文件并关闭工单。"
        : "设计部门可确认需求、反馈预计完成时间并上传设计文件。";

      renderSteps(ticket);
      renderSummary(ticket);

      if (currentRole === "requester") {
        renderRequesterForm(ticket);
      } else {
        renderDesignerForm(ticket);
      }

      bindActionButtons(ticket);
    }

    function nextStatus(status) {
      const map = {
        pending_confirm: "confirming_time",
        confirming_time: "designing",
        designing: "waiting_acceptance",
        waiting_acceptance: "closed",
        closed: "closed"
      };
      return map[status] || status;
    }

    function quickForward() {
      const ticket = getActiveTicket();
      if (!ticket || ticket.status === "closed") {
        return;
      }

      if (ticket.status === "designing" && !ticket.files.length) {
        ticket.files = [
          { name: `${ticket.title}_预览.jpg`, note: "系统演示自动生成", type: "预览图" },
          { name: `${ticket.title}_源文件.psd`, note: "系统演示自动生成", type: "源文件" }
        ];
      }

      ticket.status = nextStatus(ticket.status);
      appendHistory(ticket, `系统演示推进至${statusMap[ticket.status].label}`);
      renderAll();
    }

    function saveCurrent() {
      const ticket = getActiveTicket();
      if (!ticket) {
        return;
      }
      saveCommonFields(ticket);
      appendHistory(ticket, "当前表单已保存");
      renderAll();
    }

    function submitCurrent() {
      const ticket = getActiveTicket();
      if (!ticket) {
        return;
      }

      const actionMap = {
        requester: {
          pending_confirm: () => appendHistory(ticket, "提需求方更新了需求内容"),
          confirming_time: () => {
            saveCommonFields(ticket);
            ticket.status = "designing";
            appendHistory(ticket, "提需求方确认完成时间");
          },
          waiting_acceptance: () => {
            ticket.status = "closed";
            appendHistory(ticket, "提需求方确认文件并关闭工单");
          }
        },
        designer: {
          pending_confirm: () => {
            saveCommonFields(ticket);
            ticket.status = "confirming_time";
            appendHistory(ticket, "设计部门确认需求");
          },
          confirming_time: () => {
            saveCommonFields(ticket);
            appendHistory(ticket, `设计部门反馈预计完成时间 ${ticket.due || "待补充"}`);
          },
          designing: () => {
            ticket.files = [
              { name: "设计预览图.jpg", note: "默认演示文件", type: "预览图" },
              { name: "设计源文件.fig", note: "默认演示文件", type: "源文件" }
            ];
            ticket.status = "waiting_acceptance";
            appendHistory(ticket, "设计部门上传设计文件");
          }
        }
      };

      const runner = actionMap[currentRole][ticket.status];
      if (runner) {
        runner();
      } else {
        appendHistory(ticket, "当前步骤无需提交");
      }
      renderAll();
    }

    function renderAll() {
      renderFilters();
      renderTicketList();
      renderRoles();
      renderWorkspace();
    }

    document.getElementById("resetDemo").addEventListener("click", () => {
      tickets = cloneTickets();
      currentRole = "requester";
      currentFilter = "all";
      activeId = tickets[0].id;
      renderAll();
    });

    document.getElementById("quickForward").addEventListener("click", quickForward);
    document.getElementById("saveBtn").addEventListener("click", saveCurrent);
    document.getElementById("submitBtn").addEventListener("click", submitCurrent);

    renderAll();
  </script>
</body>
</html>
