<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>设计工单系统小程序预览</title>
  <style>
    :root {
      --page: #f5f7fa;
      --card: rgba(255, 255, 255, 0.94);
      --card-soft: #f8fafc;
      --ink: #111827;
      --muted: #6b7280;
      --line: rgba(148, 163, 184, 0.2);
      --brand: #c2410c;
      --brand-deep: #9a3412;
      --brand-soft: rgba(194, 65, 12, 0.08);
      --good: #047857;
      --good-soft: rgba(4, 120, 87, 0.08);
      --info: #1d4ed8;
      --info-soft: rgba(29, 78, 216, 0.08);
      --warn: #b45309;
      --warn-soft: rgba(180, 83, 9, 0.08);
      --shadow: 0 20px 54px rgba(15, 23, 42, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Microsoft YaHei UI", "PingFang SC", "Source Han Sans SC", sans-serif;
      background: radial-gradient(circle at top center, rgba(194, 65, 12, 0.12), transparent 28%), linear-gradient(180deg, #eef2f7 0%, #f5f7fa 100%);
      color: var(--ink);
    }

    button, input, textarea, select { font: inherit; }

    .page {
      width: min(100%, 430px);
      min-height: 100vh;
      margin: 0 auto;
      background: rgba(245, 247, 250, 0.94);
      box-shadow: var(--shadow);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 14px 16px 12px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }

    .topbar small {
      display: block;
      margin-bottom: 8px;
      font-size: 12px;
      color: var(--muted);
    }

    .topbar strong {
      display: block;
      font-size: 20px;
      font-weight: 900;
    }

    .topbar span {
      display: block;
      margin-top: 6px;
      font-size: 12px;
      line-height: 1.7;
      color: var(--muted);
    }

    .switch-block {
      display: grid;
      gap: 6px;
      margin-top: 12px;
    }

    .switch-block label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .switch-row,
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .content { padding: 14px; }

    .view { display: none; }
    .view.active { display: grid; gap: 14px; }

    .card {
      padding: 16px;
      border-radius: 22px;
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.04);
      display: grid;
      gap: 12px;
    }

    .hero {
      padding: 20px 18px;
      border-radius: 28px;
      color: #fff7f3;
      background: linear-gradient(155deg, #561d14 0%, #a23517 58%, #de7a2f 100%);
    }

    .hero small {
      display: block;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.82;
    }

    .hero h1 {
      margin: 10px 0 8px;
      font-size: 28px;
      line-height: 1.08;
    }

    .hero p {
      margin: 0;
      font-size: 13px;
      line-height: 1.8;
      color: rgba(255, 247, 243, 0.92);
    }

    .section-title {
      margin: 0;
      font-size: 17px;
      font-weight: 900;
    }

    .sub {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .switch,
    .btn,
    .pill,
    .step-item {
      border: 0;
      border-radius: 999px;
    }

    .switch {
      padding: 10px 14px;
      background: #fff;
      border: 1px solid var(--line);
      color: var(--ink);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .switch.active {
      color: var(--brand-deep);
      background: var(--brand-soft);
      border-color: rgba(194, 65, 12, 0.22);
    }

    .ticket-list,
    .step-list,
    .file-list,
    .record-list {
      display: grid;
      gap: 10px;
    }

    .ticket {
      padding: 14px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #ffffff 0%, #fafbfc 100%);
      display: grid;
      gap: 10px;
    }

    .ticket h3 {
      margin: 0;
      font-size: 15px;
      line-height: 1.5;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 900;
    }

    .pill.warn { color: var(--warn); background: var(--warn-soft); }
    .pill.info { color: var(--info); background: var(--info-soft); }
    .pill.good { color: var(--good); background: var(--good-soft); }
    .pill.brand { color: var(--brand-deep); background: var(--brand-soft); }

    .step-item {
      padding: 12px 14px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 800;
    }

    .step-item.done {
      background: var(--good-soft);
      border-color: rgba(4, 120, 87, 0.2);
    }

    .step-item.active {
      background: var(--brand-soft);
      border-color: rgba(194, 65, 12, 0.24);
      color: var(--brand-deep);
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      padding: 11px 12px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
    }

    .field textarea {
      min-height: 92px;
      resize: vertical;
      line-height: 1.7;
    }

    .btn {
      width: 100%;
      padding: 13px 16px;
      cursor: pointer;
      font-weight: 900;
    }

    .btn-primary { color: #fff; background: linear-gradient(135deg, var(--brand), #ea580c); }
    .btn-secondary { color: var(--ink); background: #fff; border: 1px solid var(--line); }
    .btn-ghost { color: var(--muted); background: var(--card-soft); border: 1px solid var(--line); }

    .file-item,
    .record-item {
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: #fff;
    }

    .file-item strong,
    .record-item strong {
      display: block;
      margin-bottom: 4px;
      font-size: 14px;
    }

    .empty {
      padding: 14px;
      border-radius: 16px;
      border: 1px dashed #d1d5db;
      background: #fafbfc;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .bottom-bar {
      position: sticky;
      bottom: 0;
      padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--line);
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <small>设计工单系统</small>
      <strong id="systemTitle">小程序端预览</strong>
      <span id="systemDesc">访问端口和使用端独立切换。</span>
      <div class="switch-block">
        <label>访问端口</label>
        <div class="switch-row" id="accessSwitch"></div>
      </div>
      <div class="switch-block">
        <label>使用端</label>
        <div class="switch-row" id="sideSwitch"></div>
      </div>
      <div class="switch-block">
        <label>页面</label>
        <div class="switch-row">
          <button class="switch active" data-view="list">列表页</button>
          <button class="switch" data-view="detail">详情页</button>
        </div>
      </div>
    </header>

    <div class="content">
      <section class="view active" id="listView">
        <div class="hero">
          <small>Design Ticket</small>
          <h1 id="heroTitle">工单列表</h1>
          <p id="heroDesc">根据访问端口和使用端展示对应工单。</p>
        </div>

        <div class="card">
          <h2 class="section-title" id="listTitle">工单列表</h2>
          <div class="switch-row" id="filterBar"></div>
          <div class="ticket-list" id="ticketList"></div>
          <button class="btn btn-primary" id="createTicket">新建工单</button>
        </div>
      </section>

      <section class="view" id="detailView">
        <div class="card">
          <div class="sub" id="detailHead"></div>
          <div class="step-list" id="stepList"></div>
        </div>

        <div class="card" id="formBox"></div>

        <div class="card">
          <h2 class="section-title">设计文件</h2>
          <div class="file-list" id="fileList"></div>
        </div>

        <div class="card">
          <h2 class="section-title">处理记录</h2>
          <div class="record-list" id="recordList"></div>
        </div>
      </section>
    </div>

    <div class="bottom-bar" id="bottomBar"></div>
  </main>

  <script>
    const steps = [
      { key: "submitted", label: "提交需求" },
      { key: "accepted", label: "确认需求" },
      { key: "scheduled", label: "确认时间" },
      { key: "delivered", label: "上传文件" },
      { key: "closed", label: "关闭工单" }
    ];

    const accessPorts = [
      { key: "pc", label: "PC端" },
      { key: "mini", label: "小程序端" }
    ];

    const useSides = [
      { key: "demand", label: "需求端" },
      { key: "design", label: "设计端" }
    ];

    const statusMap = {
      pending_confirm: { label: "待设计端确认", step: "submitted", tone: "warn" },
      confirming_time: { label: "待需求端确认时间", step: "accepted", tone: "info" },
      designing: { label: "设计处理中", step: "scheduled", tone: "brand" },
      waiting_acceptance: { label: "待需求端确认文件", step: "delivered", tone: "info" },
      closed: { label: "已关闭", step: "closed", tone: "good" }
    };

    const initialData = {
      pc: [
        {
          id: "PC-DES-20260419-001",
          title: "五一活动海报设计",
          demandOwner: "市场部 / 李晓",
          designOwner: "品牌设计组 / 陈可",
          type: "海报设计",
          channel: "PC端提交",
          priority: "高",
          due: "2026-04-22 18:00",
          attachment: "活动方案_v3.pdf",
          desc: "需产出五一活动主海报 1 张、活动长图 1 张，用于公众号和朋友圈投放。",
          status: "waiting_acceptance",
          files: [
            { name: "五一活动海报_预览.jpg", note: "客户确认用预览图", type: "预览图" },
            { name: "五一活动海报_源文件.psd", note: "可继续编辑的源文件", type: "源文件" }
          ],
          history: [
            "04-19 09:30 需求端提交需求",
            "04-19 10:20 设计端确认需求",
            "04-19 10:35 设计端反馈预计完成时间",
            "04-19 10:48 需求端确认完成时间",
            "04-21 17:36 设计端上传设计文件"
          ]
        },
        {
          id: "PC-DES-20260419-002",
          title: "新品详情页长图设计",
          demandOwner: "电商部 / 周静",
          designOwner: "电商设计组 / 王卓",
          type: "详情页设计",
          channel: "PC端提交",
          priority: "中",
          due: "2026-04-24 12:00",
          attachment: "新品卖点梳理.xlsx",
          desc: "新品无骨鸡爪需输出一版电商详情页长图，包含卖点首屏、口味介绍、工艺说明和场景图。",
          status: "designing",
          files: [],
          history: [
            "04-19 11:20 需求端提交需求",
            "04-19 12:05 设计端确认需求",
            "04-19 12:15 需求端确认预计完成时间"
          ]
        }
      ],
      mini: [
        {
          id: "MP-DES-20260419-001",
          title: "门店开业展架设计",
          demandOwner: "渠道部 / 何洋",
          designOwner: "平面设计组 / 林安",
          type: "物料设计",
          channel: "小程序端提交",
          priority: "紧急",
          due: "",
          attachment: "门店开业需求说明.docx",
          desc: "门店开业需要一套展架和吊旗设计，需突出新品试吃和门店活动权益。",
          status: "pending_confirm",
          files: [],
          history: [
            "04-19 14:10 需求端提交需求"
          ]
        },
        {
          id: "MP-DES-20260419-002",
          title: "朋友圈海报快速修改",
          demandOwner: "品牌部 / 徐宁",
          designOwner: "平面设计组 / 赵羽",
          type: "海报设计",
          channel: "小程序端提交",
          priority: "高",
          due: "2026-04-20 16:00",
          attachment: "朋友圈文案.txt",
          desc: "对现有朋友圈海报做主题替换和日期更新，需要移动端快速确认。",
          status: "confirming_time",
          files: [],
          history: [
            "04-19 15:10 需求端提交需求",
            "04-19 15:22 设计端确认需求",
            "04-19 15:30 设计端反馈预计完成时间"
          ]
        }
      ]
    };

    const actionText = {
      demand: {
        save: "保存需求",
        submit: "提交需求",
        confirmTime: "确认完成时间",
        confirmFile: "确认设计文件",
        close: "关闭工单"
      },
      design: {
        accept: "确认需求",
        estimate: "提交完成时间",
        upload: "上传设计文件"
      }
    };

    let data = JSON.parse(JSON.stringify(initialData));
    let currentAccess = "mini";
    let currentSide = "demand";
    let currentView = "list";
    let currentFilter = "all";
    let activeIds = {
      pc: data.pc[0].id,
      mini: data.mini[0].id
    };

    const systemTitle = document.getElementById("systemTitle");
    const systemDesc = document.getElementById("systemDesc");
    const accessSwitch = document.getElementById("accessSwitch");
    const sideSwitch = document.getElementById("sideSwitch");
    const listView = document.getElementById("listView");
    const detailView = document.getElementById("detailView");
    const heroTitle = document.getElementById("heroTitle");
    const heroDesc = document.getElementById("heroDesc");
    const listTitle = document.getElementById("listTitle");
    const filterBar = document.getElementById("filterBar");
    const ticketList = document.getElementById("ticketList");
    const createTicketBtn = document.getElementById("createTicket");
    const detailHead = document.getElementById("detailHead");
    const stepList = document.getElementById("stepList");
    const formBox = document.getElementById("formBox");
    const fileList = document.getElementById("fileList");
    const recordList = document.getElementById("recordList");
    const bottomBar = document.getElementById("bottomBar");

    function getAccessLabel() {
      return accessPorts.find(item => item.key === currentAccess).label;
    }

    function getSideLabel() {
      return useSides.find(item => item.key === currentSide).label;
    }

    function getTickets() {
      return data[currentAccess];
    }

    function getActiveTicket() {
      return getTickets().find(item => item.id === activeIds[currentAccess]) || getTickets()[0];
    }

    function appendHistory(ticket, text) {
      ticket.history.push(`04-19 16:30 ${text}`);
    }

    function statusPill(status) {
      const meta = statusMap[status];
      return `<span class="pill ${meta.tone}">${meta.label}</span>`;
    }

    function switchView(view) {
      currentView = view;
      listView.classList.toggle("active", view === "list");
      detailView.classList.toggle("active", view === "detail");
      [...document.querySelectorAll("[data-view]")].forEach(button => {
        button.classList.toggle("active", button.dataset.view === view);
      });
      if (view === "detail") renderDetail();
    }

    function renderSwitches() {
      accessSwitch.innerHTML = accessPorts.map(item => `
        <button class="switch ${item.key === currentAccess ? "active" : ""}" data-access="${item.key}">${item.label}</button>
      `).join("");

      sideSwitch.innerHTML = useSides.map(item => `
        <button class="switch ${item.key === currentSide ? "active" : ""}" data-side="${item.key}">${item.label}</button>
      `).join("");

      [...accessSwitch.querySelectorAll("[data-access]")].forEach(button => {
        button.addEventListener("click", () => {
          currentAccess = button.dataset.access;
          currentFilter = "all";
          renderAll();
          switchView(currentView);
        });
      });

      [...sideSwitch.querySelectorAll("[data-side]")].forEach(button => {
        button.addEventListener("click", () => {
          currentSide = button.dataset.side;
          renderAll();
          switchView(currentView);
        });
      });
    }

    function renderHeader() {
      systemTitle.textContent = `${getAccessLabel()}预览`;
      systemDesc.textContent = `当前使用端：${getSideLabel()}。列表和详情会跟随两个切换条件变化。`;
      heroTitle.innerHTML = `${getAccessLabel()}<br />${getSideLabel()}工单`;
      heroDesc.textContent = `${getSideLabel()}在${getAccessLabel()}查看和处理设计工单。`;
      listTitle.textContent = `${getAccessLabel()}工单列表`;
      createTicketBtn.textContent = currentAccess === "pc" ? "新建PC工单" : "新建小程序工单";
    }

    function renderFilters() {
      const filters = [
        { key: "all", label: "全部" },
        { key: "pending_confirm", label: "待确认" },
        { key: "confirming_time", label: "待时间" },
        { key: "designing", label: "设计中" },
        { key: "waiting_acceptance", label: "待文件" },
        { key: "closed", label: "已关闭" }
      ];
      filterBar.innerHTML = filters.map(item => `
        <button class="switch ${item.key === currentFilter ? "active" : ""}" data-filter="${item.key}">${item.label}</button>
      `).join("");
      [...filterBar.querySelectorAll("[data-filter]")].forEach(button => {
        button.addEventListener("click", () => {
          currentFilter = button.dataset.filter;
          renderList();
        });
      });
    }

    function renderList() {
      renderHeader();
      renderFilters();
      const list = getTickets().filter(item => currentFilter === "all" || item.status === currentFilter);
      if (!list.length) {
        ticketList.innerHTML = `<div class="empty">当前条件下暂无工单。</div>`;
        return;
      }

      ticketList.innerHTML = list.map(ticket => `
        <article class="ticket">
          <h3>${ticket.title}</h3>
          <div class="sub">${ticket.id} · ${ticket.channel}</div>
          <div class="sub">需求端：${ticket.demandOwner}</div>
          <div class="sub">设计端：${ticket.designOwner || "待分配"}</div>
          <div class="sub">${ticket.due ? `预计完成：${ticket.due}` : "待确认完成时间"}</div>
          <div class="actions">
            ${statusPill(ticket.status)}
            <span class="pill brand">${ticket.type}</span>
          </div>
          <button class="btn btn-primary" data-open="${ticket.id}">进入${getSideLabel()}详情</button>
        </article>
      `).join("");

      [...ticketList.querySelectorAll("[data-open]")].forEach(button => {
        button.addEventListener("click", () => {
          activeIds[currentAccess] = button.dataset.open;
          switchView("detail");
        });
      });
    }

    function renderSteps(ticket) {
      const currentStep = statusMap[ticket.status].step;
      const currentIndex = steps.findIndex(item => item.key === currentStep);
      stepList.innerHTML = steps.map((item, index) => `
        <div class="step-item ${index < currentIndex ? "done" : index === currentIndex ? "active" : ""}">${item.label}</div>
      `).join("");
    }

    function commonFields(ticket, readonly) {
      const disabled = readonly ? "disabled" : "";
      return `
        <div class="field">
          <label>需求标题</label>
          <input id="field-title" value="${ticket.title}" ${disabled} />
        </div>
        <div class="field">
          <label>需求端</label>
          <input id="field-demandOwner" value="${ticket.demandOwner}" ${disabled} />
        </div>
        <div class="field">
          <label>设计端</label>
          <input id="field-designOwner" value="${ticket.designOwner}" ${disabled} />
        </div>
        <div class="field">
          <label>访问端口</label>
          <input value="${getAccessLabel()}" disabled />
        </div>
        <div class="field">
          <label>预计完成时间</label>
          <input id="field-due" value="${ticket.due}" placeholder="例如：2026-04-24 18:00" ${disabled} />
        </div>
        <div class="field">
          <label>需求附件</label>
          <input id="field-attachment" value="${ticket.attachment}" ${disabled} />
        </div>
        <div class="field">
          <label>需求说明</label>
          <textarea id="field-desc" ${disabled}>${ticket.desc}</textarea>
        </div>
      `;
    }

    function demandForm(ticket) {
      if (ticket.status === "pending_confirm") {
        return `
          <h2 class="section-title">提交需求</h2>
          <div class="sub">需求端在${getAccessLabel()}填写需求并提交。</div>
          ${commonFields(ticket, false)}
        `;
      }
      if (ticket.status === "confirming_time") {
        return `
          <h2 class="section-title">确认完成时间</h2>
          <div class="sub">需求端确认设计端反馈的预计完成时间。</div>
          ${commonFields(ticket, true)}
        `;
      }
      if (ticket.status === "waiting_acceptance") {
        return `
          <h2 class="section-title">确认设计文件</h2>
          <div class="sub">需求端确认设计文件，确认后关闭工单。</div>
          ${commonFields(ticket, true)}
        `;
      }
      return `
        <h2 class="section-title">工单详情</h2>
        <div class="sub">当前步骤无需需求端继续操作。</div>
        ${commonFields(ticket, true)}
      `;
    }

    function designForm(ticket) {
      if (ticket.status === "pending_confirm") {
        return `
          <h2 class="section-title">确认需求</h2>
          <div class="sub">设计端确认需求后，进入完成时间确认环节。</div>
          ${commonFields(ticket, false)}
        `;
      }
      if (ticket.status === "confirming_time") {
        return `
          <h2 class="section-title">反馈完成时间</h2>
          <div class="sub">设计端填写预计完成时间并提交。</div>
          ${commonFields(ticket, false)}
        `;
      }
      if (ticket.status === "designing") {
        return `
          <h2 class="section-title">上传设计文件</h2>
          <div class="sub">设计端上传预览图与源文件。</div>
          ${commonFields(ticket, true)}
          <div class="field">
            <label>预览图文件名</label>
            <input id="upload-preview" placeholder="例如：活动海报_预览.jpg" />
          </div>
          <div class="field">
            <label>源文件名</label>
            <input id="upload-source" placeholder="例如：活动海报_源文件.psd" />
          </div>
          <div class="field">
            <label>交付说明</label>
            <textarea id="upload-note" placeholder="填写版本说明或交付备注。"></textarea>
          </div>
        `;
      }
      return `
        <h2 class="section-title">工单详情</h2>
        <div class="sub">当前步骤无需设计端继续操作。</div>
        ${commonFields(ticket, true)}
      `;
    }

    function saveFields(ticket) {
      ["title", "demandOwner", "designOwner", "due", "attachment", "desc"].forEach(key => {
        const node = document.getElementById(`field-${key}`);
        if (node) ticket[key] = node.value.trim();
      });
    }

    function getBottomAction(ticket) {
      if (currentSide === "demand") {
        if (ticket.status === "pending_confirm") return { label: actionText.demand.submit, action: "submit-request" };
        if (ticket.status === "confirming_time") return { label: actionText.demand.confirmTime, action: "confirm-time" };
        if (ticket.status === "waiting_acceptance") return { label: actionText.demand.close, action: "close-ticket" };
        return { label: "返回列表", action: "back-list" };
      }
      if (ticket.status === "pending_confirm") return { label: actionText.design.accept, action: "accept-ticket" };
      if (ticket.status === "confirming_time") return { label: actionText.design.estimate, action: "estimate-time" };
      if (ticket.status === "designing") return { label: actionText.design.upload, action: "upload-files" };
      return { label: "返回列表", action: "back-list" };
    }

    function handleAction(action, ticket) {
      if (action === "back-list") {
        switchView("list");
        return;
      }
      if (action === "submit-request") {
        saveFields(ticket);
        appendHistory(ticket, `${getAccessLabel()}需求端提交需求`);
      }
      if (action === "accept-ticket") {
        saveFields(ticket);
        ticket.status = "confirming_time";
        appendHistory(ticket, `${getAccessLabel()}设计端确认需求`);
      }
      if (action === "estimate-time") {
        saveFields(ticket);
        if (!ticket.due) ticket.due = "2026-04-23 18:00";
        appendHistory(ticket, `${getAccessLabel()}设计端反馈预计完成时间 ${ticket.due}`);
      }
      if (action === "confirm-time") {
        ticket.status = "designing";
        appendHistory(ticket, `${getAccessLabel()}需求端确认完成时间`);
      }
      if (action === "upload-files") {
        const previewName = document.getElementById("upload-preview")?.value.trim() || "设计预览图.jpg";
        const sourceName = document.getElementById("upload-source")?.value.trim() || "设计源文件.psd";
        const note = document.getElementById("upload-note")?.value.trim() || "设计端已上传交付文件";
        ticket.files = [
          { name: previewName, note, type: "预览图" },
          { name: sourceName, note, type: "源文件" }
        ];
        ticket.status = "waiting_acceptance";
        appendHistory(ticket, `${getAccessLabel()}设计端上传设计文件`);
      }
      if (action === "close-ticket") {
        ticket.status = "closed";
        appendHistory(ticket, `${getAccessLabel()}需求端关闭工单`);
      }
      renderAll();
      switchView("detail");
    }

    function renderFiles(ticket) {
      fileList.innerHTML = ticket.files.length ? ticket.files.map(file => `
        <div class="file-item">
          <strong>${file.name}</strong>
          <div class="sub">${file.type} · ${file.note}</div>
        </div>
      `).join("") : `<div class="empty">当前暂无已上传设计文件。</div>`;
    }

    function renderRecords(ticket) {
      recordList.innerHTML = ticket.history.map(item => `
        <div class="record-item">
          <strong>${item.split(" ").slice(0, 2).join(" ")}</strong>
          <div class="sub">${item.split(" ").slice(2).join(" ")}</div>
        </div>
      `).join("");
    }

    function renderBottom(ticket) {
      const config = getBottomAction(ticket);
      bottomBar.innerHTML = `<button class="btn btn-primary" data-action="${config.action}">${config.label}</button>`;
      bottomBar.querySelector("[data-action]").addEventListener("click", () => handleAction(config.action, ticket));
    }

    function renderDetail() {
      const ticket = getActiveTicket();
      if (!ticket) return;
      detailHead.innerHTML = `${getAccessLabel()} / ${getSideLabel()}<br />${ticket.title}<br />${ticket.id} · ${statusMap[ticket.status].label}`;
      renderSteps(ticket);
      formBox.innerHTML = currentSide === "demand" ? demandForm(ticket) : designForm(ticket);
      renderFiles(ticket);
      renderRecords(ticket);
      renderBottom(ticket);
    }

    function createTicket() {
      const prefix = currentAccess === "pc" ? "PC" : "MP";
      const next = {
        id: `${prefix}-DES-20260419-00${getTickets().length + 1}`,
        title: currentAccess === "pc" ? "新建PC端设计需求" : "新建小程序端设计需求",
        demandOwner: "待填写需求端",
        designOwner: "待分配设计端",
        type: "海报设计",
        channel: `${getAccessLabel()}提交`,
        priority: "中",
        due: "",
        attachment: "",
        desc: "",
        status: "pending_confirm",
        files: [],
        history: [`04-19 16:30 系统创建${getAccessLabel()}工单`]
      };
      getTickets().unshift(next);
      activeIds[currentAccess] = next.id;
      currentSide = "demand";
      renderAll();
      switchView("detail");
    }

    function renderAll() {
      renderSwitches();
      renderHeader();
      renderList();
      renderDetail();
    }

    [...document.querySelectorAll("[data-view]")].forEach(button => {
      button.addEventListener("click", () => switchView(button.dataset.view));
    });

    document.getElementById("createTicket").addEventListener("click", createTicket);

    renderAll();
    switchView("list");
  </script>
</body>
</html>
