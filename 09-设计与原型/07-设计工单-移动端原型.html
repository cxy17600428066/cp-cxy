<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>设计工单移动端原型</title>
  <style>
    :root {
      --paper: #fbf5eb;
      --panel: rgba(255, 251, 246, 0.92);
      --ink: #231511;
      --muted: #7d6458;
      --line: rgba(85, 44, 25, 0.12);
      --brand: #b83d1e;
      --brand-deep: #6f1b12;
      --shadow: 0 24px 54px rgba(76, 34, 15, 0.14);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Source Han Sans SC", "Microsoft YaHei UI", "PingFang SC", sans-serif;
      background:
        radial-gradient(circle at top center, rgba(214,162,81,.22), transparent 26%),
        linear-gradient(180deg,#efe4d3 0%,#f8f2e8 100%);
      color: var(--ink);
    }
    .page {
      width: min(100%, 430px);
      margin: 0 auto;
      min-height: 100vh;
      background: var(--paper);
      box-shadow: var(--shadow);
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 8;
      padding: 14px 16px 12px;
      background: rgba(251,245,235,.88);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(85,44,25,.08);
    }
    .topline, .head-row, .seg-row, .task-meta, .timeline-item, .bottom-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .topline { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
    .head-row strong { display: block; font-size: 18px; font-weight: 900; }
    .head-row span { font-size: 12px; color: var(--muted); }
    .seg-row { margin-top: 12px; }
    .seg-btn, .chip, .btn {
      border: 0;
      cursor: pointer;
      font: inherit;
    }
    .seg-btn, .chip {
      padding: 10px 13px;
      border-radius: 999px;
      background: rgba(255,255,255,.86);
      border: 1px solid rgba(85,44,25,.08);
      font-size: 13px;
      font-weight: 800;
      color: var(--ink);
    }
    .seg-btn.active, .chip.active {
      background: linear-gradient(135deg,var(--brand),#d56b2f);
      color: #fff;
    }
    .content {
      padding: 14px;
      display: grid;
      gap: 14px;
    }
    .hero {
      border-radius: 28px;
      padding: 22px 18px;
      color: #fff9f2;
      background: linear-gradient(160deg,#4f1d15 0%,#ab3419 58%,#df8b3c 100%);
    }
    .hero small { letter-spacing: .2em; text-transform: uppercase; opacity: .8; }
    .hero h1 { margin: 12px 0 8px; font-size: 30px; line-height: 1.04; }
    .hero p { margin: 0; font-size: 13px; line-height: 1.8; color: rgba(255,249,242,.92); }
    .card, .detail-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 16px;
      box-shadow: 0 10px 24px rgba(77,43,27,.05);
    }
    .section-title { margin: 0 0 10px; font-size: 17px; font-weight: 900; }
    .sub, .hint, .field label { color: var(--muted); font-size: 13px; line-height: 1.7; }
    .chip-row, .timeline, .file-list { display: grid; gap: 10px; }
    .task-card {
      padding: 14px;
      border-radius: 18px;
      background: linear-gradient(180deg,#fffaf5,#fff4ea);
      border: 1px solid rgba(85,44,25,.08);
      cursor: pointer;
    }
    .task-card.active { outline: 2px solid rgba(184,61,30,.18); }
    .task-card h3 { margin: 0 0 8px; font-size: 16px; line-height: 1.4; }
    .pill {
      display: inline-flex;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(184,61,30,.08);
      color: var(--brand-deep);
      font-size: 12px;
      font-weight: 900;
    }
    .field { display: grid; gap: 6px; margin-top: 10px; }
    .field input, .field textarea {
      width: 100%;
      padding: 11px 12px;
      border-radius: 14px;
      border: 1px solid rgba(85,44,25,.12);
      background: #fffdf9;
      color: var(--ink);
      font: inherit;
    }
    .field textarea { min-height: 92px; resize: vertical; }
    .btn {
      padding: 12px 16px;
      border-radius: 14px;
      font-weight: 900;
    }
    .btn-primary { background: linear-gradient(135deg,var(--brand),#d56b2f); color: #fff; }
    .btn-secondary { background: rgba(35,21,17,.06); color: var(--ink); border: 1px solid rgba(35,21,17,.08); }
    .timeline-item, .file-item {
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(255,255,255,.78);
      border: 1px solid rgba(85,44,25,.08);
      align-items: flex-start;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--brand);
      margin-top: 5px;
      flex: 0 0 auto;
    }
    .timeline-item strong, .file-item strong { display: block; margin-bottom: 4px; font-size: 14px; }
    .empty {
      padding: 16px;
      border-radius: 18px;
      border: 1px dashed rgba(85,44,25,.18);
      color: var(--muted);
      background: rgba(255,251,246,.58);
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="topline">
        <span>设计工单小程序端</span>
        <span>员工发起 / 查看 / 确认</span>
      </div>
      <div class="head-row">
        <div>
          <strong>设计需求提交</strong>
          <span>提需求方与设计部门协作工单</span>
        </div>
      </div>
      <div class="seg-row" id="mobileRoleTabs"></div>
    </header>
    <div class="content">
      <section class="hero">
        <small>Design Ticket</small>
        <h1>提交设计需求<br />查看工单进度</h1>
        <p>员工可在移动端提交需求、查看预计完成时间、确认设计文件；设计部门可确认排期和上传交付文件。</p>
      </section>
      <section class="card">
        <div class="section-title">我的工单</div>
        <div class="chip-row" id="mobileTaskList"></div>
      </section>
      <section class="detail-card" id="mobileDetail"></section>
      <section class="card">
        <div class="section-title">流程轨迹</div>
        <div class="timeline" id="mobileTimeline"></div>
      </section>
      <section class="card">
        <div class="section-title">设计文件</div>
        <div class="file-list" id="mobileFiles"></div>
      </section>
    </div>
  </main>
</body>
</html>
