<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>设计工单系统 移动端原型</title>
  <style>
    :root {
      --page: #f5f7fa;
      --card: rgba(255, 255, 255, 0.94);
      --card-soft: #f8fafc;
      --ink: #111827;
      --muted: #6b7280;
      --line: rgba(148, 163, 184, 0.2);
      --brand: #c2410c;
      --brand-deep: #9a3412;
      --brand-soft: rgba(194, 65, 12, 0.08);
      --good: #047857;
      --good-soft: rgba(4, 120, 87, 0.08);
      --info: #1d4ed8;
      --info-soft: rgba(29, 78, 216, 0.08);
      --warn: #b45309;
      --warn-soft: rgba(180, 83, 9, 0.08);
      --shadow: 0 20px 54px rgba(15, 23, 42, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Microsoft YaHei UI", "PingFang SC", "Source Han Sans SC", sans-serif;
      background:
        radial-gradient(circle at top center, rgba(194, 65, 12, 0.12), transparent 28%),
        linear-gradient(180deg, #eef2f7 0%, #f5f7fa 100%);
      color: var(--ink);
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    .page {
      width: min(100%, 430px);
      min-height: 100vh;
      margin: 0 auto;
      background: rgba(245, 247, 250, 0.92);
      box-shadow: var(--shadow);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 14px 16px 12px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }

    .topbar small {
      display: block;
      margin-bottom: 8px;
      font-size: 12px;
      color: var(--muted);
    }

    .topbar strong {
      display: block;
      font-size: 20px;
      font-weight: 900;
    }

    .topbar span {
      display: block;
      margin-top: 6px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
    }

    .tabs,
    .filters,
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tabs {
      margin-top: 12px;
    }

    .content {
      padding: 14px;
    }

    .view {
      display: none;
    }

    .view.active {
      display: grid;
      gap: 14px;
    }

    .card {
      padding: 16px;
      border-radius: 22px;
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.04);
      display: grid;
      gap: 12px;
    }

    .hero {
      padding: 20px 18px;
      border-radius: 28px;
      color: #fff7f3;
      background: linear-gradient(155deg, #561d14 0%, #a23517 58%, #de7a2f 100%);
    }

    .hero small {
      display: block;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.82;
    }

    .hero h1 {
      margin: 10px 0 8px;
      font-size: 28px;
      line-height: 1.08;
    }

    .hero p {
      margin: 0;
      font-size: 13px;
      line-height: 1.8;
      color: rgba(255, 247, 243, 0.92);
    }

    .section-title {
      margin: 0;
      font-size: 17px;
      font-weight: 900;
    }

    .sub {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .tab,
    .filter,
    .role-btn,
    .btn,
    .pill,
    .step-item {
      border: 0;
      border-radius: 999px;
    }

    .tab,
    .filter,
    .role-btn {
      padding: 10px 14px;
      background: #fff;
      border: 1px solid var(--line);
      color: var(--ink);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .tab.active,
    .filter.active,
    .role-btn.active {
      color: var(--brand-deep);
      background: var(--brand-soft);
      border-color: rgba(194, 65, 12, 0.24);
    }

    .ticket-list,
    .step-list,
    .file-list,
    .record-list {
      display: grid;
      gap: 10px;
    }

    .ticket {
      padding: 14px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #ffffff 0%, #fafbfc 100%);
      display: grid;
      gap: 10px;
    }

    .ticket h3 {
      margin: 0;
      font-size: 15px;
      line-height: 1.5;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 900;
    }

    .pill.warn {
      color: var(--warn);
      background: var(--warn-soft);
    }

    .pill.info {
      color: var(--info);
      background: var(--info-soft);
    }

    .pill.brand {
      color: var(--brand-deep);
      background: var(--brand-soft);
    }

    .pill.good {
      color: var(--good);
      background: var(--good-soft);
    }

    .step-item {
      padding: 12px 14px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 800;
    }

    .step-item.done {
      background: var(--good-soft);
      border-color: rgba(4, 120, 87, 0.2);
    }

    .step-item.active {
      background: var(--brand-soft);
      border-color: rgba(194, 65, 12, 0.24);
      color: var(--brand-deep);
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      padding: 11px 12px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
    }

    .field textarea {
      min-height: 92px;
      resize: vertical;
      line-height: 1.7;
    }

    .btn {
      width: 100%;
      padding: 13px 16px;
      font-weight: 900;
      cursor: pointer;
    }

    .btn-primary {
      color: #fff;
      background: linear-gradient(135deg, var(--brand), #ea580c);
    }

    .btn-secondary {
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
    }

    .btn-ghost {
      color: var(--muted);
      background: var(--card-soft);
      border: 1px solid var(--line);
    }

    .file-item,
    .record-item {
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: #fff;
    }

    .file-item strong,
    .record-item strong {
      display: block;
      margin-bottom: 4px;
      font-size: 14px;
    }

    .empty {
      padding: 14px;
      border-radius: 16px;
      border: 1px dashed #d1d5db;
      background: #fafbfc;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .bottom-bar {
      position: sticky;
      bottom: 0;
      padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--line);
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <small>移动端工单系统</small>
      <strong>设计需求提交</strong>
      <span>列表页和详情页拆分，通过顶部按钮切换查看与处理。</span>
      <div class="tabs">
        <button class="tab active" data-page="list">列表页</button>
        <button class="tab" data-page="detail">详情页</button>
      </div>
    </header>

    <div class="content">
      <section class="view active" id="listView">
        <div class="hero">
          <small>Design Ticket</small>
          <h1>先看列表<br />再进详情处理</h1>
          <p>移动端以两页形式呈现：列表负责浏览和进入，详情负责提交、确认、上传和关闭。</p>
        </div>

        <div class="card">
          <h2 class="section-title">工单列表</h2>
          <div class="filters" id="filterBar"></div>
          <div class="ticket-list" id="ticketList"></div>
          <button class="btn btn-primary" id="createTicket">新建需求工单</button>
        </div>
      </section>

      <section class="view" id="detailView">
        <div class="card">
          <div class="actions" id="roleBar"></div>
          <div class="sub" id="detailHead"></div>
          <div class="step-list" id="stepList"></div>
        </div>

        <div class="card" id="formBox"></div>

        <div class="card">
          <h2 class="section-title">设计文件</h2>
          <div class="file-list" id="fileList"></div>
        </div>

        <div class="card">
          <h2 class="section-title">处理记录</h2>
          <div class="record-list" id="recordList"></div>
        </div>
      </section>
    </div>

    <div class="bottom-bar" id="bottomBar"></div>
  </main>

  <script>
    const steps = [
      { key: "submitted", label: "提交需求" },
      { key: "accepted", label: "设计确认" },
      { key: "scheduled", label: "确认时间" },
      { key: "delivered", label: "上传文件" },
      { key: "closed", label: "关闭工单" }
    ];

    const roles = [
      { key: "requester", label: "提需求方" },
      { key: "designer", label: "设计部门" }
    ];

    const statusMap = {
      pending_confirm: { label: "待设计确认", step: "submitted", tone: "warn" },
      confirming_time: { label: "待确认完成时间", step: "accepted", tone: "info" },
      designing: { label: "设计中", step: "scheduled", tone: "brand" },
      waiting_acceptance: { label: "待确认设计文件", step: "delivered", tone: "info" },
      closed: { label: "已关闭", step: "closed", tone: "good" }
    };

    const initialTickets = [
      {
        id: "DES-20260419-001",
        title: "五一活动海报设计",
        applicant: "市场部 / 李晓",
        designer: "品牌设计组 / 陈可",
        type: "海报设计",
        due: "2026-04-22 18:00",
        attachment: "活动方案_v3.pdf",
        desc: "需产出五一活动主海报 1 张、活动长图 1 张，用于公众号和朋友圈投放。",
        status: "waiting_acceptance",
        files: [
          { name: "五一活动海报_预览.jpg", note: "客户确认用预览图", type: "预览图" },
          { name: "五一活动海报_源文件.psd", note: "可继续编辑的源文件", type: "源文件" }
        ],
        history: [
          "04-19 09:30 提需求方提交需求",
          "04-19 10:20 设计部门确认需求",
          "04-19 10:35 设计部门反馈预计完成时间",
          "04-19 10:48 提需求方确认完成时间",
          "04-21 17:36 设计部门上传设计文件"
        ]
      },
      {
        id: "DES-20260419-002",
        title: "新品详情页长图设计",
        applicant: "电商部 / 周静",
        designer: "电商设计组 / 王卓",
        type: "详情页设计",
        due: "2026-04-24 12:00",
        attachment: "新品卖点梳理.xlsx",
        desc: "新品无骨鸡爪需输出一版电商详情页长图，包含卖点首屏、口味介绍、工艺说明和场景图。",
        status: "designing",
        files: [],
        history: [
          "04-19 11:20 提需求方提交需求",
          "04-19 12:05 设计部门确认需求",
          "04-19 12:15 提需求方确认预计完成时间"
        ]
      },
      {
        id: "DES-20260419-003",
        title: "门店开业展架设计",
        applicant: "渠道部 / 何洋",
        designer: "平面设计组 / 林安",
        type: "物料设计",
        due: "",
        attachment: "门店开业需求说明.docx",
        desc: "门店开业需要一套展架和吊旗设计，需突出新品试吃和门店活动权益。",
        status: "pending_confirm",
        files: [],
        history: [
          "04-19 14:10 提需求方提交需求"
        ]
      }
    ];

    let tickets = JSON.parse(JSON.stringify(initialTickets));
    let currentPage = "list";
    let currentFilter = "all";
    let currentRole = "requester";
    let activeId = tickets[0].id;

    const listView = document.getElementById("listView");
    const detailView = document.getElementById("detailView");
    const filterBar = document.getElementById("filterBar");
    const ticketList = document.getElementById("ticketList");
    const roleBar = document.getElementById("roleBar");
    const detailHead = document.getElementById("detailHead");
    const stepList = document.getElementById("stepList");
    const formBox = document.getElementById("formBox");
    const fileList = document.getElementById("fileList");
    const recordList = document.getElementById("recordList");
    const bottomBar = document.getElementById("bottomBar");

    function switchPage(page) {
      currentPage = page;
      listView.classList.toggle("active", page === "list");
      detailView.classList.toggle("active", page === "detail");
      [...document.querySelectorAll("[data-page]")].forEach(button => {
        button.classList.toggle("active", button.dataset.page === page);
      });
    }

    function getActiveTicket() {
      return tickets.find(ticket => ticket.id === activeId) || tickets[0];
    }

    function appendHistory(ticket, text) {
      ticket.history.push(`04-19 16:30 ${text}`);
    }

    function getStatusPill(status) {
      const meta = statusMap[status];
      return `<span class="pill ${meta.tone}">${meta.label}</span>`;
    }

    function saveCommonFields(ticket) {
      const keys = ["title", "applicant", "designer", "type", "due", "attachment", "desc"];
      keys.forEach(key => {
        const node = document.getElementById(`field-${key}`);
        if (node) {
          ticket[key] = node.value.trim();
        }
      });
    }

    function renderFilters() {
      const filters = [
        { key: "all", label: "全部" },
        { key: "pending_confirm", label: "待设计确认" },
        { key: "confirming_time", label: "待确认时间" },
        { key: "designing", label: "设计中" },
        { key: "waiting_acceptance", label: "待确认文件" },
        { key: "closed", label: "已关闭" }
      ];

      filterBar.innerHTML = filters.map(item => `
        <button class="filter ${item.key === currentFilter ? "active" : ""}" data-filter="${item.key}">${item.label}</button>
      `).join("");

      [...filterBar.querySelectorAll("[data-filter]")].forEach(button => {
        button.addEventListener("click", () => {
          currentFilter = button.dataset.filter;
          renderList();
        });
      });
    }

    function renderList() {
      renderFilters();
      const list = tickets.filter(ticket => currentFilter === "all" || ticket.status === currentFilter);
      if (!list.length) {
        ticketList.innerHTML = `<div class="empty">当前筛选条件下暂无工单。</div>`;
        return;
      }

      ticketList.innerHTML = list.map(ticket => `
        <article class="ticket">
          <h3>${ticket.title}</h3>
          <div class="sub">${ticket.id} · ${ticket.applicant}</div>
          <div class="sub">${ticket.due ? `预计完成：${ticket.due}` : "待确认完成时间"}</div>
          <div class="actions">
            ${getStatusPill(ticket.status)}
            <span class="pill brand">${ticket.type}</span>
          </div>
          <div class="actions">
            <button class="btn btn-secondary" data-view="${ticket.id}">查看详情</button>
            <button class="btn btn-primary" data-open="${ticket.id}">进入处理</button>
          </div>
        </article>
      `).join("");

      [...ticketList.querySelectorAll("[data-view], [data-open]")].forEach(button => {
        button.addEventListener("click", () => {
          activeId = button.dataset.view || button.dataset.open;
          switchPage("detail");
          renderDetail();
        });
      });
    }

    function renderRoles() {
      roleBar.innerHTML = roles.map(role => `
        <button class="role-btn ${role.key === currentRole ? "active" : ""}" data-role="${role.key}">${role.label}</button>
      `).join("");

      [...roleBar.querySelectorAll("[data-role]")].forEach(button => {
        button.addEventListener("click", () => {
          currentRole = button.dataset.role;
          renderDetail();
        });
      });
    }

    function renderSteps(ticket) {
      const currentStep = statusMap[ticket.status].step;
      const currentIndex = steps.findIndex(item => item.key === currentStep);
      stepList.innerHTML = steps.map((item, index) => `
        <div class="step-item ${index < currentIndex ? "done" : index === currentIndex ? "active" : ""}">
          ${item.label}
        </div>
      `).join("");
    }

    function commonFields(ticket, readonly) {
      const disabled = readonly ? "disabled" : "";
      return `
        <div class="field">
          <label>需求标题</label>
          <input id="field-title" value="${ticket.title}" ${disabled} />
        </div>
        <div class="field">
          <label>需求部门 / 提交人</label>
          <input id="field-applicant" value="${ticket.applicant}" ${disabled} />
        </div>
        <div class="field">
          <label>设计负责人</label>
          <input id="field-designer" value="${ticket.designer}" ${disabled} />
        </div>
        <div class="field">
          <label>需求类型</label>
          <select id="field-type" ${disabled}>
            ${["海报设计", "详情页设计", "物料设计", "包装设计", "其它"].map(item => `<option value="${item}" ${ticket.type === item ? "selected" : ""}>${item}</option>`).join("")}
          </select>
        </div>
        <div class="field">
          <label>预计完成时间</label>
          <input id="field-due" value="${ticket.due}" placeholder="例如：2026-04-24 18:00" ${disabled} />
        </div>
        <div class="field">
          <label>需求附件</label>
          <input id="field-attachment" value="${ticket.attachment}" ${disabled} />
        </div>
        <div class="field">
          <label>需求说明</label>
          <textarea id="field-desc" ${disabled}>${ticket.desc}</textarea>
        </div>
      `;
    }

    function requesterForm(ticket) {
      if (ticket.status === "pending_confirm") {
        return `
          <h2 class="section-title">提交需求</h2>
          <div class="sub">提需求方可在详情页填写并提交当前需求。</div>
          ${commonFields(ticket, false)}
        `;
      }

      if (ticket.status === "confirming_time") {
        return `
          <h2 class="section-title">确认完成时间</h2>
          <div class="sub">请确认设计部门反馈的完成时间。</div>
          ${commonFields(ticket, true)}
        `;
      }

      if (ticket.status === "waiting_acceptance") {
        return `
          <h2 class="section-title">确认设计文件</h2>
          <div class="sub">请查看已上传文件，确认无误后关闭工单。</div>
          ${commonFields(ticket, true)}
        `;
      }

      return `
        <h2 class="section-title">工单详情</h2>
        <div class="sub">当前步骤无需提需求方继续操作，可查看工单内容。</div>
        ${commonFields(ticket, true)}
      `;
    }

    function designerForm(ticket) {
      if (ticket.status === "pending_confirm") {
        return `
          <h2 class="section-title">确认需求</h2>
          <div class="sub">设计部门确认当前工单可承接后进入下一步。</div>
          ${commonFields(ticket, false)}
        `;
      }

      if (ticket.status === "confirming_time") {
        return `
          <h2 class="section-title">反馈完成时间</h2>
          <div class="sub">请填写预计完成时间并提交。</div>
          ${commonFields(ticket, false)}
        `;
      }

      if (ticket.status === "designing") {
        return `
          <h2 class="section-title">上传设计文件</h2>
          <div class="sub">请上传预览图与源文件，供提需求方确认。</div>
          ${commonFields(ticket, true)}
          <div class="field">
            <label>预览图文件名</label>
            <input id="upload-preview" placeholder="例如：活动海报_预览.jpg" />
          </div>
          <div class="field">
            <label>源文件名</label>
            <input id="upload-source" placeholder="例如：活动海报_源文件.psd" />
          </div>
          <div class="field">
            <label>交付说明</label>
            <textarea id="upload-note" placeholder="填写版本说明或交付备注。"></textarea>
          </div>
        `;
      }

      return `
        <h2 class="section-title">工单详情</h2>
        <div class="sub">当前步骤无需设计部门继续处理，可查看工单内容。</div>
        ${commonFields(ticket, true)}
      `;
    }

    function renderFiles(ticket) {
      fileList.innerHTML = ticket.files.length ? ticket.files.map(file => `
        <div class="file-item">
          <strong>${file.name}</strong>
          <div class="sub">${file.type} · ${file.note}</div>
        </div>
      `).join("") : `<div class="empty">当前暂无已上传设计文件。</div>`;
    }

    function renderRecords(ticket) {
      recordList.innerHTML = ticket.history.map(item => `
        <div class="record-item">
          <strong>${item.split(" ").slice(0, 2).join(" ")}</strong>
          <div class="sub">${item.split(" ").slice(2).join(" ")}</div>
        </div>
      `).join("");
    }

    function getBottomAction(ticket) {
      if (currentRole === "requester") {
        if (ticket.status === "pending_confirm") {
          return { label: "提交需求", action: "submit-request" };
        }
        if (ticket.status === "confirming_time") {
          return { label: "确认完成时间", action: "confirm-time" };
        }
        if (ticket.status === "waiting_acceptance") {
          return { label: "关闭工单", action: "close-ticket" };
        }
        return { label: "返回列表", action: "back-list" };
      }

      if (ticket.status === "pending_confirm") {
        return { label: "确认需求", action: "accept-ticket" };
      }
      if (ticket.status === "confirming_time") {
        return { label: "提交完成时间", action: "estimate-time" };
      }
      if (ticket.status === "designing") {
        return { label: "上传设计文件", action: "upload-files" };
      }
      return { label: "返回列表", action: "back-list" };
    }

    function handleAction(action, ticket) {
      if (action === "back-list") {
        switchPage("list");
        return;
      }

      if (action === "submit-request") {
        saveCommonFields(ticket);
        appendHistory(ticket, "提需求方提交需求");
      }

      if (action === "accept-ticket") {
        saveCommonFields(ticket);
        ticket.status = "confirming_time";
        appendHistory(ticket, "设计部门确认需求");
      }

      if (action === "estimate-time") {
        saveCommonFields(ticket);
        if (!ticket.due) {
          ticket.due = "2026-04-23 18:00";
        }
        appendHistory(ticket, `设计部门反馈预计完成时间 ${ticket.due}`);
      }

      if (action === "confirm-time") {
        ticket.status = "designing";
        appendHistory(ticket, "提需求方确认完成时间");
      }

      if (action === "upload-files") {
        const previewName = document.getElementById("upload-preview")?.value.trim() || "设计预览图.jpg";
        const sourceName = document.getElementById("upload-source")?.value.trim() || "设计源文件.psd";
        const note = document.getElementById("upload-note")?.value.trim() || "设计部门已上传设计文件";
        ticket.files = [
          { name: previewName, note, type: "预览图" },
          { name: sourceName, note, type: "源文件" }
        ];
        ticket.status = "waiting_acceptance";
        appendHistory(ticket, "设计部门上传设计文件");
      }

      if (action === "close-ticket") {
        ticket.status = "closed";
        appendHistory(ticket, "提需求方关闭工单");
      }

      renderList();
      renderDetail();
    }

    function renderBottom(ticket) {
      const config = getBottomAction(ticket);
      bottomBar.innerHTML = `<button class="btn btn-primary" data-action="${config.action}">${config.label}</button>`;
      bottomBar.querySelector("[data-action]").addEventListener("click", () => {
        handleAction(config.action, ticket);
      });
    }

    function renderDetail() {
      const ticket = getActiveTicket();
      if (!ticket) {
        return;
      }

      renderRoles();
      detailHead.innerHTML = `${ticket.title}<br />${ticket.id} · ${statusMap[ticket.status].label} · ${ticket.applicant}`;
      renderSteps(ticket);
      formBox.innerHTML = currentRole === "requester" ? requesterForm(ticket) : designerForm(ticket);
      renderFiles(ticket);
      renderRecords(ticket);
      renderBottom(ticket);
    }

    function createTicket() {
      const next = {
        id: `DES-20260419-00${tickets.length + 1}`,
        title: "新建设计需求",
        applicant: "待填写",
        designer: "待分配",
        type: "海报设计",
        due: "",
        attachment: "",
        desc: "",
        status: "pending_confirm",
        files: [],
        history: ["04-19 16:30 系统创建新工单"]
      };
      tickets.unshift(next);
      activeId = next.id;
      currentRole = "requester";
      renderList();
      switchPage("detail");
      renderDetail();
    }

    [...document.querySelectorAll("[data-page]")].forEach(button => {
      button.addEventListener("click", () => {
        switchPage(button.dataset.page);
        if (button.dataset.page === "detail") {
          renderDetail();
        }
      });
    });

    document.getElementById("createTicket").addEventListener("click", createTicket);

    renderList();
    renderDetail();
    switchPage("list");
  </script>
</body>
</html>
