<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>设计工单双端原型入口</title>
  <style>
    :root {
      --bg: #edf2f7;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #dbe3ee;
      --brand: #0f766e;
      --brand-soft: rgba(15, 118, 110, 0.12);
      --card: #ffffff;
      --shadow: 0 22px 56px rgba(15, 23, 42, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: radial-gradient(circle at top right, rgba(15, 118, 110, 0.18), transparent 28%), linear-gradient(180deg, #f7fafc 0%, var(--bg) 100%);
      font-family: "Microsoft YaHei UI", "PingFang SC", "Source Han Sans SC", sans-serif;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .shell {
      width: min(100%, 980px);
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 26px;
      display: grid;
      gap: 20px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 900;
      line-height: 1.3;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.8;
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      background: var(--card);
      display: grid;
      gap: 10px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      border-radius: 999px;
      padding: 6px 10px;
      background: var(--brand-soft);
      color: #0b5f58;
      font-size: 12px;
      font-weight: 800;
    }

    .title {
      margin: 0;
      font-size: 18px;
      font-weight: 900;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      font-weight: 800;
      padding: 10px 14px;
      width: fit-content;
    }

    .btn:hover {
      border-color: rgba(15, 118, 110, 0.35);
      background: var(--brand-soft);
    }

    ul {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
    }

    @media (max-width: 820px) {
      .grid { grid-template-columns: 1fr; }
      .shell { padding: 18px; }
      h1 { font-size: 23px; }
    }
  </style>
</head>
<body>
  <section class="shell">
    <div>
      <h1>设计需求提交流程 · 双端交互原型</h1>
      <p>流程覆盖：提需求方提需求、设计部门确认需求与预计完成时间、设计部门上传设计文件、提需求方确认设计文件、关闭需求。</p>
    </div>

    <div class="grid">
      <article class="card">
        <span class="tag">PC端</span>
        <h2 class="title">06-设计工单-PC端原型</h2>
        <p>适合后台管理、部门协同和详情字段编辑。</p>
        <a class="btn" href="./06-设计工单-PC端原型.html">打开PC端原型</a>
      </article>

      <article class="card">
        <span class="tag">小程序端</span>
        <h2 class="title">07-设计工单-移动端原型</h2>
        <p>适合移动审批与快速确认设计文件。</p>
        <a class="btn" href="./07-设计工单-移动端原型.html">打开小程序端原型</a>
      </article>
    </div>

    <div class="card">
      <span class="tag">演示建议</span>
      <ul>
        <li>先在列表页切换角色（提需求方 / 设计部门），看同一工单不同操作权限。</li>
        <li>在详情页按顺序点击动作按钮，验证完整状态流转。</li>
        <li>可用“恢复演示数据”快速回到初始状态进行重复演示。</li>
      </ul>
    </div>
  </section>
</body>
</html>
