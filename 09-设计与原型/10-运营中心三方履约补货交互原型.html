<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>运营中心三方履约补货交互原型</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --line: #dbe4ef;
      --line-strong: #b8c6d8;
      --ink: #102033;
      --muted: #607086;
      --brand: #0f766e;
      --brand-dark: #0b5f58;
      --brand-soft: #e8f5f3;
      --blue: #1d4ed8;
      --blue-soft: #eaf1ff;
      --green: #047857;
      --green-soft: #e8f7ef;
      --amber: #b45309;
      --amber-soft: #fff4e5;
      --red: #b91c1c;
      --red-soft: #fff0f0;
      --gray-soft: #eef2f7;
      --shadow: 0 16px 42px rgba(16, 32, 51, 0.12);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--bg);
      font-family: "Microsoft YaHei UI", "PingFang SC", "Source Han Sans SC", "Segoe UI", sans-serif;
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: grid;
      grid-template-columns: minmax(260px, 1fr) auto;
      gap: 16px;
      align-items: center;
      padding: 14px 22px;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 10px 28px rgba(16, 32, 51, 0.05);
    }

    .brand {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .brand strong {
      font-size: 20px;
      line-height: 1.25;
      font-weight: 900;
      color: var(--ink);
    }

    .brand span {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-actions,
    .role-switch,
    .toolbar,
    .filters,
    .row-actions,
    .inline-actions,
    .form-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .role-switch {
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-soft);
    }

    .role-switch button,
    .nav button,
    .seg button,
    .btn,
    .icon-btn {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: 8px;
      min-height: 36px;
      transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease, transform 0.18s ease;
    }

    .role-switch button {
      padding: 8px 12px;
      border-color: transparent;
      background: transparent;
      font-size: 13px;
      font-weight: 800;
    }

    .role-switch button.active,
    .nav button.active,
    .seg button.active {
      color: var(--brand-dark);
      background: var(--brand-soft);
      border-color: rgba(15, 118, 110, 0.32);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
    }

    .btn.primary {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
    }

    .btn.blue {
      background: var(--blue-soft);
      border-color: rgba(29, 78, 216, 0.2);
      color: var(--blue);
    }

    .btn.warn {
      background: var(--amber-soft);
      border-color: rgba(180, 83, 9, 0.24);
      color: var(--amber);
    }

    .btn.danger {
      background: var(--red-soft);
      border-color: rgba(185, 28, 28, 0.24);
      color: var(--red);
    }

    .btn.ghost {
      background: transparent;
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.52;
    }

    .icon {
      width: 18px;
      height: 18px;
      display: inline-grid;
      place-items: center;
      line-height: 1;
      font-weight: 900;
      flex: 0 0 auto;
    }

    .workspace {
      display: grid;
      grid-template-columns: 236px minmax(0, 1fr);
      min-height: 0;
    }

    .sidebar {
      padding: 16px 12px;
      border-right: 1px solid var(--line);
      background: #fbfdff;
      display: grid;
      align-content: start;
      gap: 14px;
    }

    .nav-group {
      display: grid;
      gap: 8px;
    }

    .nav-title {
      padding: 0 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }

    .nav {
      display: grid;
      gap: 6px;
    }

    .nav button {
      width: 100%;
      padding: 10px;
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      text-align: left;
      font-size: 13px;
      font-weight: 800;
    }

    .nav small {
      min-width: 24px;
      height: 22px;
      display: inline-grid;
      place-items: center;
      border-radius: 8px;
      color: var(--muted);
      background: var(--gray-soft);
      font-size: 11px;
      font-weight: 900;
    }

    .main {
      min-width: 0;
      padding: 18px;
      display: grid;
      gap: 14px;
      align-content: start;
    }

    .page {
      display: none;
      gap: 14px;
    }

    .page.active { display: grid; }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(16, 32, 51, 0.04);
    }

    .panel-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 15px 16px;
      border-bottom: 1px solid var(--line);
    }

    .panel-title {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .panel-title h1,
    .panel-title h2,
    .panel-title h3 {
      margin: 0;
      font-size: 18px;
      line-height: 1.35;
      font-weight: 900;
    }

    .panel-title p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .panel-body {
      padding: 15px 16px;
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 10px;
    }

    .metric {
      min-height: 92px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      display: grid;
      align-content: space-between;
      gap: 8px;
    }

    .metric span {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      font-weight: 700;
    }

    .metric strong {
      font-size: 24px;
      line-height: 1;
      font-weight: 900;
    }

    .metric.good strong { color: var(--green); }
    .metric.warn strong { color: var(--amber); }
    .metric.danger strong { color: var(--red); }
    .metric.brand strong { color: var(--brand-dark); }
    .metric.blue strong { color: var(--blue); }

    .seg {
      display: flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-soft);
    }

    .seg button {
      padding: 7px 10px;
      min-height: 32px;
      border-color: transparent;
      background: transparent;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      min-height: 36px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
    }

    .field textarea {
      min-height: 96px;
      resize: vertical;
      line-height: 1.7;
    }

    .search {
      min-width: 260px;
    }

    .table-wrap {
      width: 100%;
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 980px;
      font-size: 13px;
    }

    th, td {
      padding: 11px 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
      white-space: nowrap;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--surface-soft);
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }

    tr {
      transition: background 0.16s ease;
    }

    tbody tr:hover {
      background: #f8fbfd;
    }

    tbody tr.selected {
      background: var(--brand-soft);
    }

    .link {
      border: 0;
      background: transparent;
      color: var(--blue);
      padding: 0;
      font-weight: 900;
      text-align: left;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 24px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
      line-height: 1;
      border: 1px solid transparent;
    }

    .status.blue { color: var(--blue); background: var(--blue-soft); border-color: rgba(29, 78, 216, 0.14); }
    .status.green { color: var(--green); background: var(--green-soft); border-color: rgba(4, 120, 87, 0.14); }
    .status.amber { color: var(--amber); background: var(--amber-soft); border-color: rgba(180, 83, 9, 0.16); }
    .status.red { color: var(--red); background: var(--red-soft); border-color: rgba(185, 28, 28, 0.16); }
    .status.gray { color: var(--muted); background: var(--gray-soft); border-color: rgba(96, 112, 134, 0.14); }
    .status.brand { color: var(--brand-dark); background: var(--brand-soft); border-color: rgba(15, 118, 110, 0.18); }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .summary-item {
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-soft);
      min-width: 0;
    }

    .summary-item span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      font-weight: 800;
    }

    .summary-item strong {
      display: block;
      margin-top: 6px;
      font-size: 14px;
      line-height: 1.45;
      word-break: break-word;
    }

    .task-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .task {
      padding: 14px;
      min-height: 118px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      display: grid;
      align-content: space-between;
      gap: 10px;
    }

    .task h3 {
      margin: 0;
      font-size: 14px;
      line-height: 1.4;
    }

    .task p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .task strong {
      font-size: 26px;
      line-height: 1;
    }

    .config-grid {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 12px;
      align-items: start;
    }

    .center-list,
    .timeline,
    .log-list,
    .customer-flow {
      display: grid;
      gap: 8px;
    }

    .center-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-soft);
    }

    .center-row strong {
      display: block;
      font-size: 14px;
    }

    .center-row span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .drawer {
      position: fixed;
      inset: 0;
      z-index: 60;
      pointer-events: none;
      background: rgba(16, 32, 51, 0);
      transition: background 0.18s ease;
    }

    .drawer.open {
      pointer-events: auto;
      background: rgba(16, 32, 51, 0.28);
    }

    .drawer-panel {
      position: absolute;
      top: 0;
      right: 0;
      width: min(620px, calc(100vw - 24px));
      height: 100%;
      background: var(--surface);
      border-left: 1px solid var(--line);
      box-shadow: var(--shadow);
      transform: translateX(100%);
      transition: transform 0.2s ease;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .drawer.open .drawer-panel { transform: translateX(0); }

    .drawer-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: start;
      padding: 16px;
      border-bottom: 1px solid var(--line);
    }

    .drawer-head h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.35;
    }

    .drawer-head p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      display: inline-grid;
      place-items: center;
      padding: 0;
      font-size: 18px;
      font-weight: 900;
    }

    .drawer-body {
      padding: 16px;
      overflow: auto;
      display: grid;
      gap: 12px;
      align-content: start;
    }

    .section-title {
      margin: 0 0 9px;
      font-size: 14px;
      font-weight: 900;
    }

    .detail-section {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      padding: 12px;
    }

    .timeline-item {
      position: relative;
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr);
      gap: 9px;
    }

    .timeline-item:not(:last-child)::before {
      content: "";
      position: absolute;
      left: 8px;
      top: 18px;
      bottom: -8px;
      width: 2px;
      background: var(--line);
    }

    .dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 4px solid var(--gray-soft);
      background: var(--line-strong);
      margin-top: 2px;
      z-index: 1;
    }

    .dot.done { border-color: var(--green-soft); background: var(--green); }
    .dot.now { border-color: var(--brand-soft); background: var(--brand); }
    .dot.warn { border-color: var(--amber-soft); background: var(--amber); }

    .timeline-item strong {
      display: block;
      font-size: 13px;
      line-height: 1.4;
    }

    .timeline-item span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .log-item {
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-soft);
      display: grid;
      gap: 4px;
    }

    .log-item strong {
      font-size: 13px;
      line-height: 1.4;
    }

    .log-item span {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: none;
      place-items: center;
      padding: 16px;
      background: rgba(16, 32, 51, 0.36);
    }

    .modal-backdrop.open { display: grid; }

    .modal {
      width: min(560px, 100%);
      max-height: calc(100vh - 32px);
      overflow: auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .modal-head,
    .modal-foot {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .modal-head h3 {
      margin: 0;
      font-size: 17px;
    }

    .modal-body {
      padding: 16px;
      display: grid;
      gap: 12px;
    }

    .modal-foot {
      border-top: 1px solid var(--line);
      border-bottom: 0;
      justify-content: flex-end;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 100;
      display: none;
      width: min(360px, calc(100vw - 36px));
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid rgba(15, 118, 110, 0.24);
      background: #f3fbf9;
      color: var(--brand-dark);
      box-shadow: var(--shadow);
      font-size: 13px;
      font-weight: 800;
      line-height: 1.6;
    }

    .toast.show { display: block; }

    .flow-line {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      align-items: stretch;
    }

    .flow-step {
      position: relative;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      min-height: 86px;
    }

    .flow-step:not(:last-child)::after {
      content: ">";
      position: absolute;
      right: -8px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      z-index: 2;
    }

    .flow-step strong {
      display: block;
      font-size: 13px;
      line-height: 1.45;
    }

    .flow-step span {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .customer-card {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(320px, 0.9fr);
      gap: 12px;
      align-items: start;
    }

    .proof-box {
      display: grid;
      gap: 8px;
    }

    .proof-preview {
      min-height: 180px;
      border: 1px dashed var(--line-strong);
      border-radius: 8px;
      background: repeating-linear-gradient(135deg, #f8fafc, #f8fafc 10px, #eef2f7 10px, #eef2f7 20px);
      display: grid;
      place-items: center;
      padding: 16px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .empty {
      padding: 24px;
      border: 1px dashed var(--line-strong);
      border-radius: 8px;
      background: var(--surface-soft);
      color: var(--muted);
      text-align: center;
      line-height: 1.7;
      font-size: 13px;
    }

    @media (max-width: 1280px) {
      .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .task-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .flow-line { grid-template-columns: 1fr; }
      .flow-step::after { display: none !important; }
      .config-grid,
      .customer-card { grid-template-columns: 1fr; }
    }

    @media (max-width: 900px) {
      .topbar { grid-template-columns: 1fr; }
      .workspace { grid-template-columns: 1fr; }
      .sidebar { border-right: 0; border-bottom: 1px solid var(--line); }
      .nav { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .main { padding: 12px; }
      .kpis,
      .task-grid,
      .summary-grid { grid-template-columns: 1fr; }
      .toolbar { align-items: stretch; }
      .toolbar .field,
      .toolbar .search { width: 100%; min-width: 0; }
    }

    @media (max-width: 560px) {
      .role-switch,
      .top-actions,
      .filters,
      .inline-actions,
      .row-actions { width: 100%; }
      .role-switch button,
      .seg button,
      .btn { flex: 1; }
      .nav { grid-template-columns: 1fr; }
      .panel-head { display: grid; }
      .drawer-panel { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <strong>运营中心三方履约与补货</strong>
        <span>卓希集团、合作商运营中心、客户之间的订单发货、签收凭证和补货闭环原型</span>
      </div>
      <div class="top-actions">
        <div class="role-switch" aria-label="角色切换">
          <button type="button" data-role="zhuoxi" class="active">卓希集团</button>
          <button type="button" data-role="center">运营中心</button>
          <button type="button" data-role="customer">客户视角</button>
        </div>
        <button type="button" class="btn blue" data-action="reset-demo"><span class="icon">↻</span>重置演示</button>
      </div>
    </header>

    <div class="workspace">
      <aside class="sidebar">
        <div class="nav-group">
          <div class="nav-title">三方履约主线</div>
          <nav class="nav" id="mainNav"></nav>
        </div>
        <div class="panel">
          <div class="panel-body">
            <div class="flow-line" style="grid-template-columns: 1fr;">
              <div class="flow-step">
                <strong>客户下单</strong>
                <span>订单确认后进入履约判断。</span>
              </div>
              <div class="flow-step">
                <strong>运营中心发货</strong>
                <span>有货合作商先行履约。</span>

      return document.querySelector(selector);

      return document.getElementById(id);

      return orders.find(order => order.id === id);
    }

    function getRestock(id) {
      return restocks.find(item => item.id === id);
    }

    function statusTone(value) {
      if (["履约完成", "审核通过", "已签收", "已入库", "正常"].includes(value)) return "green";
      if (["待接单", "待发货", "待上传", "待生成", "待确认"].includes(value)) return "blue";
      if (["凭证待审核", "待审核", "运输中", "部分发货", "补货在途"].includes(value)) return "amber";
      if (["异常", "审核驳回", "暂停", "预警"].includes(value)) return "red";
      if (["已发货"].includes(value)) return "brand";
      return "gray";
    }

    function statusTag(value) {
      return `<span class="status ${statusTone(value)}">${value || "无"}</span>`;
    }

    function totalQty(order) {
      return order.items.reduce((sum, item) => sum + item.qty, 0);
    }

    function nowText() {
      return "2026-04-30 " + new Date().toTimeString().slice(0, 5);
    }

    function orderVisibleForRole(order) {
      return state.role !== "center" || order.center === state.centerName;
    }

    function restockVisibleForRole(restock) {
      return state.role !== "center" || restock.center === state.centerName;
    }

    function filteredOrders() {
      const keyword = state.search.trim().toLowerCase();
      return orders.filter(order => {
        if (!orderVisibleForRole(order)) return false;
        if (state.orderFilter !== "全部") {
          const hit = order.orderStatus === state.orderFilter || order.shipStatus === state.orderFilter || order.proofStatus === state.orderFilter || order.restockStatus === state.orderFilter;
          if (!hit) return false;
        }
        if (!keyword) return true;
        const haystack = [order.id, order.customerOrder, order.customer, order.center, order.region, order.items.map(i => i.name).join(" ")].join(" ").toLowerCase();
        return haystack.includes(keyword);
      });
    }

      renderRoleSwitch();
      renderNav();
      renderKpis();
      renderPages();
      renderDrawer();
      renderModal();

    function renderRoleSwitch() {
      document.querySelectorAll("[data-role]").forEach(btn => {

      const done = visible.filter(o => o.orderStatus === "履约完成").length;
      const abnormal = visible.filter(o => o.orderStatus === "异常" || o.abnormal).length;

      const data = [
        ["运营中心订单", visible.length, "brand"],
        ["待接单", waiting, "blue"],
        ["已发货", shipped, "brand"],
        ["凭证待审核", review, "warn"],
        ["待处理补货", restockTodo, "green"],
        ["异常订单", abnormal, "danger"]

      byId("kpis").innerHTML = data.map(([label, value, tone]) => `

          <span>${label}</span>
          <strong>${value}</strong>
        </div>
      `).join("");

        { title: order.signStatus === "已签收" ? "客户已签收" : "运输中", note: order.signStatus === "已签收" ? "感谢签收，如需售后请从订单进入。" : "物流运输中，请留意收货通知。", done: order.signStatus === "已签收" }

            <div class="summary-item"><span>收货地址</span><strong>${order.address}</strong></div>
            <div class="summary-item"><span>订单金额</span><strong>${order.amount} 元</strong></div>
            <div class="summary-item"><span>分配时间</span><strong>${order.assignedAt}</strong></div>
          </div>
        </div>
        <div class="detail-section">
          <h3 class="section-title">商品明细</h3>
          <div class="table-wrap">
            <table style="min-width: 520px;">
              <thead><tr><th>SKU</th><th>商品</th><th>规格</th><th>数量</th></tr></thead>
              <tbody>
                ${order.items.map(item => `<tr><td>${item.sku}</td><td>${item.name}</td><td>${item.spec}</td><td>${item.qty}</td></tr>`).join("")}
              </tbody>
            </table>
          </div>
        </div>
        <div class="detail-section">
          <h3 class="section-title">物流与签收凭证</h3>
          <div class="proof-box">
            <div class="summary-grid">
              <div class="summary-item"><span>物流公司</span><strong>${order.logistics ? order.logistics.company : "未填写"}</strong></div>
              <div class="summary-item"><span>物流单号</span><strong>${order.logistics ? order.logistics.no : "未填写"}</strong></div>
              <div class="summary-item"><span>发货时间</span><strong>${order.logistics ? order.logistics.shippedAt : "未发货"}</strong></div>
              <div class="summary-item"><span>包裹数</span><strong>${order.logistics ? `${order.logistics.packages} 件` : "未填写"}</strong></div>
            </div>
            <div class="proof-preview">
              ${order.proofStatus === "待上传" ? "暂无签收凭证。运营中心发货并客户签收后，需要上传凭证。" : `签收凭证已提交<br>${order.proofNote || "凭证说明待补充"}`}
            </div>
          </div>
        </div>
        <div class="detail-section">
          <h3 class="section-title">履约时间线</h3>
          <div class="timeline">
            ${buildTimeline(order).map(item => `
              <div class="timeline-item">
                <i class="dot ${item.tone}"></i>
                <div><strong>${item.title}</strong><span>${item.time}<br>${item.note}</span></div>
              </div>
            `).join("")}
          </div>
        </div>
        <div class="detail-section">
          <h3 class="section-title">操作日志</h3>
          <div class="log-list">
            ${order.history.slice().reverse().map(item => `<div class="log-item"><strong>${item.title}</strong><span>${item.time} · ${item.note}</span></div>`).join("")}
          </div>
        </div>
      `;
    }

    function detailActions(order) {
      const actions = [];
      if (order.orderStatus === "待接单") actions.push(`<button type="button" class="btn primary" data-action="accept" data-id="${order.id}"><span class="icon">✓</span>确认接单</button>`);
      if (order.orderStatus === "待发货") actions.push(`<button type="button" class="btn primary" data-action="ship" data-id="${order.id}"><span class="icon">↗</span>填写物流</button>`);
      if (order.shipStatus === "已发货" && order.proofStatus === "待上传") actions.push(`<button type="button" class="btn primary" data-action="upload-proof" data-id="${order.id}"><span class="icon">↑</span>上传凭证</button>`);
      if (order.proofStatus === "待审核") {
        actions.push(`<button type="button" class="btn primary" data-action="approve-proof" data-id="${order.id}"><span class="icon">✓</span>审核通过</button>`);
        actions.push(`<button type="button" class="btn danger" data-action="reject-proof" data-id="${order.id}"><span class="icon">×</span>驳回凭证</button>`);
      }
      if (order.proofStatus === "审核通过" && order.restockStatus === "待生成") actions.push(`<button type="button" class="btn primary" data-action="create-restock" data-id="${order.id}"><span class="icon">+</span>生成补货单</button>`);
      actions.push(`<button type="button" class="btn warn" data-action="mark-abnormal" data-id="${order.id}"><span class="icon">!</span>标记异常</button>`);
      actions.push(`<button type="button" class="btn ghost" data-action="urge" data-id="${order.id}"><span class="icon">→</span>催办</button>`);
      return actions.join("");
    }

    function buildTimeline(order) {
      const base = [
        { title: "客户下单", time: order.history[0]?.time || order.assignedAt, note: "客户订单已确认。", tone: "done" },
        { title: "分配运营中心", time: order.assignedAt, note: `${order.center} 承接履约。`, tone: "done" },
        { title: "运营中心接单", time: findHistory(order, "接单") || "待处理", note: order.orderStatus === "待接单" ? "等待运营中心确认。" : "运营中心已确认履约。", tone: order.orderStatus === "待接单" ? "now" : "done" },
        { title: "运营中心发货", time: order.logistics?.shippedAt || "待处理", note: order.logistics ? `${order.logistics.company} ${order.logistics.no}` : "等待填写物流。", tone: order.shipStatus === "待发货" ? "now" : "done" },
        { title: "客户签收/凭证", time: findHistory(order, "上传凭证") || "待处理", note: order.proofStatus === "待上传" ? "等待签收凭证。" : order.proofStatus, tone: order.proofStatus === "审核通过" ? "done" : "now" },
        { title: "生成补货单", time: findHistory(order, "生成补货单") || "待处理", note: order.restockStatus, tone: order.restockStatus === "未生成" ? "now" : "done" }
      ];
      if (order.abnormal) base.push({ title: "异常处理", time: findHistory(order, "标记异常") || "待处理", note: order.abnormal, tone: "warn" });
      return base;
    }

    function findHistory(order, keyword) {
      const item = order.history.find(h => h.title.includes(keyword));
      return item ? item.time : "";
    }

    function renderModal() {
      const root = byId("modalRoot");
      if (!state.modal) {
        root.classList.remove("open");
        root.innerHTML = "";
        return;
      }
      root.classList.add("open");
      root.innerHTML = `
        <div class="modal" role="dialog" aria-modal="true">
          <div class="modal-head">
            <h3>${state.modal.title}</h3>
            <button type="button" class="icon-btn" data-action="close-modal" aria-label="关闭弹窗">×</button>
          </div>
          <div class="modal-body">${state.modal.body}</div>
          <div class="modal-foot">
            <button type="button" class="btn" data-action="close-modal">取消</button>
            <button type="button" class="btn primary" data-action="modal-primary">${state.modal.primary}</button>
          </div>
        </div>
      `;
    }

    function openModal(kind, id) {
      if (kind === "ship") {
        state.modal = {
          kind, id, title: "填写物流信息", primary: "确认发货",
          body: `
            <div class="field"><label>物流公司</label><input id="modalCompany" value="顺丰速运"></div>
            <div class="field"><label>物流单号</label><input id="modalNo" value="SF${Math.floor(7000000000 + Math.random() * 999999999)}"></div>
            <div class="field"><label>包裹数</label><input id="modalPackages" type="number" min="1" value="4"></div>
          `
        };
      }
      if (kind === "upload-proof") {
        state.modal = {
          kind, id, title: "上传签收凭证", primary: "提交审核",
          body: `
            <div class="field"><label>凭证类型</label><select id="modalProofType"><option>客户签收单</option><option>物流签收截图</option><option>盖章收货单</option></select></div>
            <div class="field"><label>凭证说明</label><textarea id="modalProofNote">客户已签收，签收数量与发货数量一致。</textarea></div>
            <div class="proof-preview">演示原型：此处模拟上传凭证文件，真实系统支持图片/PDF。</div>
          `
        };
      }
      if (kind === "reject-proof") {
        state.modal = {
          kind, id, title: "驳回签收凭证", primary: "确认驳回",
          body: `
            <div class="field"><label>驳回原因</label><select id="modalRejectReason"><option>凭证不清晰</option><option>凭证信息不完整</option><option>数量不一致</option><option>未体现客户签收</option><option>其他</option></select></div>
            <div class="field"><label>补充说明</label><textarea id="modalRejectNote">请重新上传包含客户签收信息和数量的凭证。</textarea></div>
          `
        };
      }
      if (kind === "mark-abnormal") {
        state.modal = {
          kind, id, title: "标记异常", primary: "确认标记",
          body: `
            <div class="field"><label>异常类型</label><select id="modalAbnormalType"><option>库存不足</option><option>超时未接单</option><option>超时未发货</option><option>物流异常</option><option>凭证异常</option></select></div>
            <div class="field"><label>异常说明</label><textarea id="modalAbnormalNote">需要卓希订单运营介入处理。</textarea></div>
          `
        };
      }
      if (kind === "ship-restock") {
        state.modal = {
          kind, id, title: "补货发货", primary: "确认补货发货",
          body: `
            <div class="field"><label>补货物流公司</label><input id="modalCompany" value="德邦快递"></div>
            <div class="field"><label>补货物流单号</label><input id="modalNo" value="DB${Math.floor(8000000000 + Math.random() * 999999999)}"></div>
          `
        };
      }
      render();
    }

    function handleModalPrimary() {
      const modal = state.modal;
      if (!modal) return;
      if (modal.kind === "ship") {
        const order = getOrder(modal.id);
        order.logistics = {
          company: byId("modalCompany").value || "顺丰速运",
          no: byId("modalNo").value || "SF0000000000",
          packages: Number(byId("modalPackages").value || 1),
          shippedAt: nowText()
        };
        order.orderStatus = "已发货";
        order.shipStatus = "已发货";
        order.signStatus = "运输中";
        order.history.push({ title: "运营中心发货", time: nowText(), note: `${order.logistics.company} ${order.logistics.no}` });
        toast("物流已回填，订单进入运输中。");
      }
      if (modal.kind === "upload-proof") {
        const order = getOrder(modal.id);
        order.signStatus = "已签收";
        order.proofStatus = "待审核";
        order.orderStatus = "凭证待审核";
        order.proofNote = byId("modalProofNote").value || "签收凭证已上传。";
        order.history.push({ title: "上传凭证", time: nowText(), note: order.proofNote });
        state.page = "review";
        toast("签收凭证已提交，等待卓希审核。");
      }
      if (modal.kind === "reject-proof") {
        const order = getOrder(modal.id);
        const reason = byId("modalRejectReason").value;
        const note = byId("modalRejectNote").value;
        order.proofStatus = "审核驳回";
        order.orderStatus = "异常";
        order.abnormal = `凭证驳回：${reason}`;
        order.history.push({ title: "驳回凭证", time: nowText(), note: note || reason });
        toast("凭证已驳回，运营中心需重新上传。");
      }
      if (modal.kind === "mark-abnormal") {
        const order = getOrder(modal.id);
        const type = byId("modalAbnormalType").value;
        const note = byId("modalAbnormalNote").value;
        order.orderStatus = "异常";
        order.abnormal = `${type}：${note}`;
        order.history.push({ title: "标记异常", time: nowText(), note: order.abnormal });
        toast("异常已记录，后台可继续改派或关闭。");
      }
      if (modal.kind === "ship-restock") {
        const restock = getRestock(modal.id);
        restock.status = "补货在途";
        restock.logistics = {
          company: byId("modalCompany").value || "德邦快递",
          no: byId("modalNo").value || "DB0000000000",
          shippedAt: nowText()
        };
        const order = getOrder(restock.orderId);
        if (order) order.restockStatus = "补货在途";
        toast("补货物流已填写，等待运营中心确认入库。");
      }
      state.modal = null;
      render();
    }

    function acceptOrder(id) {
      const order = getOrder(id);
      order.orderStatus = "待发货";
      order.history.push({ title: "运营中心接单", time: nowText(), note: `${order.center} 已确认库存并接单。` });
      toast("运营中心已接单，下一步填写物流发货。");
      render();
    }

    function approveProof(id) {
      const order = getOrder(id);
      order.proofStatus = "审核通过";
      order.orderStatus = "履约完成";
      order.restockStatus = "待生成";
      order.history.push({ title: "凭证审核通过", time: nowText(), note: "签收凭证有效，允许生成补货单。" });
      toast("凭证审核通过，可以生成补货单。");
      render();
    }

    function createRestock(id) {
      const order = getOrder(id);
      if (restocks.some(r => r.orderId === id && r.status !== "已关闭")) {
        toast("该运营中心订单已有有效补货单，系统已阻断重复生成。");
        return;
      }
      const nextId = "RP-20260430-" + String(restocks.length + 1).padStart(3, "0");
      restocks.unshift({
        id: nextId,
        orderId: order.id,
        center: order.center,
        status: "待确认",
        qty: totalQty(order),
        source: "签收凭证审核通过",
        createdAt: nowText(),
        logistics: null
      });
      order.restockStatus = "待确认";
      order.history.push({ title: "生成补货单", time: nowText(), note: `补货单 ${nextId} 已生成。` });
      state.selectedRestockId = nextId;
      state.page = "restock";
      toast("补货单已生成，等待卓希供应链确认。");
      render();
    }

    function confirmRestock(id) {
      const restock = getRestock(id);
      restock.status = "待发货";
      const order = getOrder(restock.orderId);
      if (order) order.restockStatus = "待发货";
      toast("补货单已确认，下一步安排补货发货。");
      render();
    }

    function receiveRestock(id) {
      const restock = getRestock(id);
      restock.status = "已入库";
      const order = getOrder(restock.orderId);
      if (order) {
        order.restockStatus = "已完成";
        order.history.push({ title: "补货入库", time: nowText(), note: `${restock.center} 已确认收到补货。` });
      }
      toast("运营中心已确认入库，履约补货闭环完成。");
      render();
    }

    function createDemoOrder() {
      const id = "OC-20260430-" + String(orders.length + 1).padStart(3, "0");
      orders.unshift({
        id,
        customerOrder: "SO-20260430-" + Math.floor(8600 + Math.random() * 300),
        customer: "新增长沙渠道客户",
        contact: "测试客户 138****0000",
        address: "湖南省长沙市岳麓区测试地址 1 号",
        center: "华中运营中心",
        region: "华中",
        items: [{ sku: "ZX-SKU-1099", name: "测试商品组合", spec: "240g*24", qty: 72 }],
        qty: 72,
        amount: "10,800",
        orderStatus: "待接单",
        shipStatus: "待发货",
        signStatus: "待签收",
        proofStatus: "待上传",
        restockStatus: "未生成",
        abnormal: "",
        assignedAt: nowText(),
        logistics: null,
        proofNote: "",
        history: [
          { title: "客户下单", time: nowText(), note: "模拟客户订单已确认。" },
          { title: "分配运营中心", time: nowText(), note: "系统推荐华中运营中心，卓希确认分配。" }
        ]
      });
      state.selectedOrderId = id;
      toast("已模拟生成一条新的运营中心订单。");
      render();
    }

    function toast(text) {
      const el = byId("toast");
      el.textContent = text;
      el.classList.add("show");
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
    }

    document.addEventListener("click", event => {
      const roleBtn = event.target.closest("[data-role]");
      if (roleBtn) {
        state.role = roleBtn.dataset.role;
        state.page = state.role === "zhuoxi" ? "orders" : state.role === "center" ? "center" : "customer";
        state.selectedOrderId = null;
        render();
        return;
      }

      const pageBtn = event.target.closest("[data-page]");
      if (pageBtn) {
        state.page = pageBtn.dataset.page;
        render();
        return;
      }

      const filterBtn = event.target.closest("[data-order-filter]");
      if (filterBtn) {
        state.orderFilter = filterBtn.dataset.orderFilter;
        render();
        return;
      }

      const reviewBtn = event.target.closest("[data-review-filter]");
      if (reviewBtn) {
        state.reviewFilter = reviewBtn.dataset.reviewFilter;
        render();
        return;
      }

      const restockFilterBtn = event.target.closest("[data-restock-filter]");
      if (restockFilterBtn) {
        state.restockFilter = restockFilterBtn.dataset.restockFilter;
        render();
        return;
      }

      const orderBtn = event.target.closest("[data-order]");
      if (orderBtn) {
        state.selectedOrderId = orderBtn.dataset.order;
        renderDrawer();
        return;
      }

      const restockBtn = event.target.closest("[data-restock]");
      if (restockBtn) {
        state.selectedRestockId = restockBtn.dataset.restock;
        render();
        return;
      }

      const actionBtn = event.target.closest("[data-action]");
      if (!actionBtn) return;
      const action = actionBtn.dataset.action;
      const id = actionBtn.dataset.id;
      if (action === "close-drawer") {
        state.selectedOrderId = null;
        byId("drawer").classList.remove("open");
        return;
      }
      if (action === "close-modal") {
        state.modal = null;
        renderModal();
        return;
      }
      if (action === "modal-primary") {
        handleModalPrimary();
        return;
      }
      if (action === "accept") acceptOrder(id);
      if (action === "ship") openModal("ship", id);
      if (action === "upload-proof") openModal("upload-proof", id);
      if (action === "approve-proof") approveProof(id);
      if (action === "reject-proof") openModal("reject-proof", id);
      if (action === "create-restock") createRestock(id);
      if (action === "confirm-restock") confirmRestock(id);
      if (action === "ship-restock") openModal("ship-restock", id);
      if (action === "receive-restock") receiveRestock(id);
      if (action === "mark-abnormal") openModal("mark-abnormal", id);
      if (action === "urge") toast("已记录催办动作，实际系统可通知运营中心。");
      if (action === "export") toast("演示原型：已模拟导出当前列表。");
      if (action === "save-config") toast("配置已模拟保存。");
      if (action === "create-demo-order") createDemoOrder();
      if (action === "reset-demo") {
        orders = structuredClone(initialOrders);
        restocks = structuredClone(initialRestocks);
        state.selectedOrderId = null;
        state.selectedRestockId = restocks[0].id;
        state.orderFilter = "全部";
        state.search = "";
        toast("演示数据已重置。");
        render();
      }
    });

    document.addEventListener("input", event => {
      if (event.target.matches("[data-action='search-input']")) {
        state.search = event.target.value;
        renderPages();
      }
    });

    document.addEventListener("change", event => {
      if (event.target.matches("[data-action='center-select']")) {
        state.centerName = event.target.value;
        render();
      }
    });

    byId("drawer").addEventListener("click", event => {
      if (event.target.id === "drawer") {
        state.selectedOrderId = null;
        byId("drawer").classList.remove("open");
      }
    });

    render();
  </script>
</body>
</html>
