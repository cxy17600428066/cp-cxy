<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --bg: #f3f6fb;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --line: #d8e1ec;
      --line-strong: #b8c5d6;
      --ink: #102033;
      --muted: #607086;
      --brand: #0f766e;
      --brand-soft: #e8f5f3;
      --blue: #1d4ed8;
      --blue-soft: #eaf1ff;
      --amber: #b45309;
      --amber-soft: #fff4e5;
      --red: #b91c1c;
      --red-soft: #fff0f0;
      --green: #047857;
      --green-soft: #e9f8ef;
      --shadow: 0 14px 34px rgba(16, 32, 51, 0.09);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Microsoft YaHei UI", "PingFang SC", "Segoe UI", sans-serif;
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 14px 22px;
      background: rgba(255, 255, 255, 0.95);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }

    .title {
      display: grid;
      gap: 4px;
    }

    .title strong {
      font-size: 20px;
      line-height: 1.2;
    }

    .title span {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .shell {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      min-height: 0;
    }

    .sidebar {
      border-right: 1px solid var(--line);
      background: #fbfcfe;
      padding: 16px 12px;
      display: grid;
      align-content: start;
      gap: 14px;
    }

    .nav-title {
      padding: 0 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .nav {
      display: grid;
      gap: 6px;
    }

    .nav button,
    .seg button,
    .btn {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      min-height: 36px;
      transition: 0.18s ease;
    }

    .nav button {
      padding: 10px 12px;
      text-align: left;
      font-size: 13px;
      font-weight: 800;
    }

    .nav button small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
      font-weight: 600;
    }

    .nav button.active,
    .seg button.active {
      background: var(--brand-soft);
      border-color: rgba(15, 118, 110, 0.3);
      color: var(--brand);
    }

    .main {
      padding: 18px;
      overflow: auto;
    }

    .page {
      display: none;
      gap: 16px;
    }

    .page.active {
      display: grid;
    }

    .hero,
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .hero {
      padding: 18px 20px;
      display: grid;
      gap: 12px;
    }

    .hero h1,
    .card h2,
    .card h3 {
      margin: 0;
    }

    .hero p,
    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-soft);
      padding: 14px;
      display: grid;
      gap: 6px;
    }

    .stat span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .stat strong {
      font-size: 28px;
      line-height: 1;
    }

    .layout-2 {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(300px, 0.8fr);
      gap: 16px;
    }

    .card {
      padding: 16px;
      display: grid;
      gap: 14px;
      min-width: 0;
    }

    .row,
    .toolbar,
    .seg,
    .actions,
    .tag-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .toolbar {
      justify-content: space-between;
    }

    .seg {
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-soft);
    }

    .seg button {
      padding: 8px 10px;
      border-color: transparent;
      background: transparent;
      font-size: 12px;
      font-weight: 800;
    }

    .btn {
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn.primary {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
    }

    .btn.blue {
      background: var(--blue-soft);
      border-color: rgba(29, 78, 216, 0.2);
      color: var(--blue);
    }

    .btn.warn {
      background: var(--amber-soft);
      border-color: rgba(180, 83, 9, 0.22);
      color: var(--amber);
    }

    .btn.danger {
      background: var(--red-soft);
      border-color: rgba(185, 28, 28, 0.22);
      color: var(--red);
    }

    .btn.ghost {
      background: transparent;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      padding: 9px 11px;
      outline: none;
    }

    textarea {
      min-height: 88px;
      resize: vertical;
      line-height: 1.6;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    table {
      width: 100%;
      min-width: 980px;
      border-collapse: collapse;
      background: var(--surface);
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      font-size: 13px;
      line-height: 1.55;
    }

    th {
      background: #f9fbfd;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }

    .name {
      display: grid;
      gap: 3px;
    }

    .name strong {
      font-size: 13px;
    }

    .name span {
      color: var(--muted);
      font-size: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .gray { color: #475569; background: #edf2f7; }
    .blue { color: var(--blue); background: var(--blue-soft); }
    .amber { color: var(--amber); background: var(--amber-soft); }
    .red { color: var(--red); background: var(--red-soft); }
    .green { color: var(--green); background: var(--green-soft); }

    .list {
      display: grid;
      gap: 10px;
    }

    .list-item {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-soft);
      padding: 12px;
      display: grid;
      gap: 8px;
    }

    .list-item h3 {
      font-size: 14px;
      line-height: 1.4;
      margin: 0;
    }

    .list-item p {
      font-size: 12px;
    }

    .flow {
      display: grid;
      grid-template-columns: repeat(7, minmax(100px, 1fr));
      gap: 8px;
    }

    .flow-node {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-soft);
      padding: 10px;
      display: grid;
      gap: 4px;
    }

    .flow-node.active {
      background: var(--brand-soft);
      border-color: rgba(15, 118, 110, 0.3);
    }

    .flow-node strong {
      font-size: 12px;
      line-height: 1.4;
    }

    .flow-node span {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .timeline {
      display: grid;
      gap: 10px;
    }

    .timeline-item {
      border-left: 3px solid var(--brand);
      padding-left: 12px;
      display: grid;
      gap: 4px;
    }

    .timeline-item strong {
      font-size: 13px;
    }

    .timeline-item span,
    .timeline-item p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .drawer {
      position: fixed;
      inset: 0;
      background: rgba(16, 32, 51, 0.34);
      display: none;
      justify-content: flex-end;
      z-index: 20;
    }

    .drawer.open {
      display: flex;
    }

    .drawer-panel {
      width: min(520px, 100%);
      height: 100%;
      background: var(--surface);
      box-shadow: -20px 0 36px rgba(16, 32, 51, 0.18);
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .drawer-head,
    .drawer-body,
    .drawer-foot {
      padding: 16px;
    }

    .drawer-head,
    .drawer-foot {
      border-bottom: 1px solid var(--line);
    }

    .drawer-foot {
      border-top: 1px solid var(--line);
      border-bottom: none;
    }

    .drawer-body {
      overflow: auto;
      display: grid;
      gap: 16px;
    }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      background: rgba(16, 32, 51, 0.92);
      color: #fff;
      padding: 11px 14px;
      border-radius: 8px;
      font-size: 13px;
      opacity: 0;
      transform: translateY(6px);
      transition: 0.2s ease;
      pointer-events: none;
      z-index: 30;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 1080px) {
      .shell {
        grid-template-columns: 1fr;
      }

      .sidebar {
        border-right: none;
        border-bottom: 1px solid var(--line);
      }

      .layout-2,
      .stats,
      .field-grid {
        grid-template-columns: 1fr;
      }

      .flow {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>

    function priorityClass(priority) {
      if (priority === "重大") return "red";
      if (priority === "紧急") return "amber";
      return "blue";
    }

    function countClosed() {
      return cases.filter(item => item.status === "督办办结").length;
    }

    function countOpen() {
      return cases.filter(item => item.status !== "督办办结").length;
    }

    function countOverdue() {
      return cases.filter(item => item.level === "red").length;
    }

    function onePassRate() {
      const closed = countClosed();
      if (!closed) return 0;
      return Math.round(cases.filter(item => item.customerResult === "接受").length / closed * 100);
    }

    function visibleCases() {
      return cases.filter(item => {
        const hitFilter = state.filter === "全部" || item.status === state.filter;
        const q = state.search.trim();
        const hitSearch = !q || [item.id, item.approvalNo, item.orderNo, item.customer, item.type, item.issue, item.owner, item.stuckNode].join(" ").includes(q);
        return hitFilter && hitSearch;
      });
    }

    function getSelectedApproval() {
      return oaApprovals.find(item => item.approvalNo === state.form.approvalNo) || oaApprovals[0];
    }

        customerResult: "",
        logs: [
          { title: "发现卡点", time: "2026-05-27 14:30", note: `原审批单 ${approval.approvalNo} 停留在 ${approval.currentNode} 节点 ${approval.stuckHours} 小时。` },
          { title: "生成督办", time: "2026-05-27 14:31", note: `督办对象为 ${approval.nodeOwner}，通知方式为 ${state.form.urgeMethod}。` }
        ]
      });
      state.page = "accept";
      toast("已关联原审批单并生成节点督办单");
      render();
    }

    function acceptCase(id) {
      const item = cases.find(entry => entry.id === id);
      if (!item) return;
      item.owner = item.stuckOwner || item.owner;
      item.status = item.level === "red" || item.priority === "重大" ? "升级处理" : "节点处理";
      item.stage = item.status === "升级处理" ? 3 : 4;
      item.deadline = item.status === "升级处理" ? "升级处理中" : "节点处理剩余 2小时";
      item.logs.push({ title: "督办受理", time: "2026-05-27 14:36", note: "售后主管确认原审批单、卡点节点和督办对象无误。" });
      state.page = item.status === "升级处理" ? "approval" : "execute";
      render();
      toast("受理完成");
    }

    function approveCase(id) {
      const item = cases.find(entry => entry.id === id);
      if (!item) return;
      item.status = "节点处理";
      item.stage = 4;
      item.deadline = "节点处理剩余 2小时";
      item.level = "blue";
      item.logs.push({ title: "升级确认", time: "2026-05-27 14:42", note: "升级处理完成，已通知卡点人回到原审批单处理当前节点。" });
      state.page = "execute";
      render();
      toast("升级处理已确认");
    }

    function completeCase(id) {
      const item = cases.find(entry => entry.id === id);
      if (!item) return;
      item.status = "反馈确认";
      item.stage = 5;
      item.deadline = "待确认原审批流转";
      item.level = "blue";
      item.customerResult = "待确认";
      item.logs.push({ title: "原节点已处理", time: "2026-05-27 15:10", note: `卡点人已反馈 ${item.stuckNode} 节点处理完成，等待主管确认原审批单是否恢复流转。` });
      state.page = "callback";
      render();
      toast("已进入反馈确认");
    }

    function acceptResult(id) {
      const item = cases.find(entry => entry.id === id);
      if (!item) return;
      item.status = "督办办结";
      item.stage = 6;
      item.deadline = "已办结";
      item.level = "green";
      item.customerResult = "原审批已流转";
      item.logs.push({ title: "确认流转", time: "2026-05-27 15:26", note: "售后主管确认原审批单已离开卡点节点，督办闭环。" });
      state.page = "closed";
      render();
      toast("督办单已办结");
    }

    function returnResult(id) {
      const item = cases.find(entry => entry.id === id);
      if (!item) return;
      item.status = "节点处理";
      item.stage = 4;
      item.deadline = "退回后剩余 1小时";
      item.level = "red";
      item.customerResult = "原审批未流转";
      item.logs.push({ title: "确认退回", time: "2026-05-27 15:28", note: "原审批单仍停留在卡点节点，退回卡点人继续处理。" });
      state.page = "execute";
      render();
      toast("已退回节点处理");
    }

    function urgeCase(id) {
      const item = cases.find(entry => entry.id === id);
      if (!item) return;
      item.logs.push({ title: "人工催办", time: "2026-05-27 15:00", note: "主管已发起催办提醒。" });
      toast("已记录催办动作");
      renderDrawer();
    }

    function render() {
      renderNav();
      renderPages();
      renderDrawer();
    }

    document.addEventListener("click", event => {
      const pageBtn = event.target.closest("button[data-page]");
      if (pageBtn) {
        state.page = pageBtn.dataset.page;
        render();
        return;
      }

      const filterBtn = event.target.closest("[data-filter]");
      if (filterBtn) {
        state.filter = filterBtn.dataset.filter;
        renderOverview();
        return;
      }

      const openBtn = event.target.closest("[data-open]");
      if (openBtn) {
        state.selectedId = openBtn.dataset.open;
        renderDrawer();
        return;
      }

      const actionBtn = event.target.closest("[data-action]");
      if (!actionBtn) return;
      const action = actionBtn.dataset.action;
      const id = actionBtn.dataset.id;

      if (action === "close-drawer") {
        state.selectedId = "";
        renderDrawer();
        return;
      }
      if (action === "submit") {
        submitCase();
        return;
      }
      if (action === "accept") {
        acceptCase(id);
        return;
      }
      if (action === "approve") {
        approveCase(id);
        return;
      }
      if (action === "reject") {
        toast("已模拟驳回，实际可退回受理节点");
        return;
      }
      if (action === "complete") {
        completeCase(id);
        return;
      }
      if (action === "accept-result") {
        acceptResult(id);
        return;
      }
      if (action === "return-result") {
        returnResult(id);
        return;
      }
      if (action === "urge") {
        urgeCase(id);
        return;
      }
      if (action === "reset") {
        cases = structuredClone(seedCases);
        state.page = "overview";
        state.filter = "全部";
        state.selectedId = "";
        state.search = "";
        state.form = {
          approvalNo: "SHOA-20260527-0091",
          superviseLevel: "紧急督办",
          dueTime: "2026-05-27 17:30",
          urgeMethod: "系统消息 + 短信",
          plan: "请节点处理人在 2 小时内完成原审批单处理，或提交明确卡点原因。",
          reason: "当前节点已超过承诺处理时间，需要生成督办单跟进。"
        };
        render();
        toast("数据已重置");
      }
    });

    document.addEventListener("input", event => {
      if (!event.target.matches("[data-form]")) return;
      state.form[event.target.dataset.form] = event.target.value;
      renderCreate();
    });

    byId("drawer").addEventListener("click", event => {
      if (event.target.id === "drawer") {
        state.selectedId = "";
        renderDrawer();
      }
    });

    render();
  </script>
</body>
</html>
