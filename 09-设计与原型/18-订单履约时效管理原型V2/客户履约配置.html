<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>客户履约配置</title><link rel="stylesheet" href="履约界面主题.css?v=3"><link rel="stylesheet" href="履约V2扩展.css?v=1"><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#303133;font:14px "Microsoft YaHei","PingFang SC",sans-serif}.top{height:60px;background:#fff;border-bottom:1px solid #dcdfe6;display:flex;align-items:center;padding:0 26px;gap:36px}.top b{font-size:16px}.sys{height:59px;display:flex;align-items:center;padding:0 22px;background:#ecf5ff;color:#409eff}.side{position:fixed;top:60px;bottom:0;left:0;width:200px;background:#fff;border-right:1px solid #e4e7ed;padding:18px 12px}.side h2{font-size:12px;color:#909399;font-weight:400;padding:0 12px}.side a{display:block;padding:12px;border-radius:5px;text-decoration:none;color:#606266;margin:3px 0}.side a.active,.side a:hover{background:#ecf5ff;color:#409eff}.page{margin-left:200px;padding:22px}.head,.panel{background:#fff;border:1px solid #dcdfe6;border-radius:5px}.head{padding:16px 20px;margin-bottom:16px}.head h1{font-size:20px;margin:0 0 6px}.head p{margin:0;color:#909399}.panel{padding:18px}.v2-card h2{font-size:17px;margin:0 0 6px}.v2-card>p{color:#909399;margin:0 0 18px}.cfg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 22px}.cfg label span{display:block;color:#606266;margin-bottom:7px}.cfg input,.cfg select,.cfg textarea{width:100%;border:1px solid #dcdfe6;border-radius:4px;padding:9px 10px;font:inherit}.cfg .wide{grid-column:1/-1}.section{grid-column:1/-1;border-top:1px solid #ebeef5;padding-top:16px;margin-top:6px;font-weight:700}.help{font-size:12px;color:#909399;font-weight:400;margin-left:8px}.foot{display:flex;justify-content:flex-end;align-items:center;gap:10px;border-top:1px solid #ebeef5;margin-top:20px;padding-top:16px}.btn{border:1px solid #dcdfe6;background:#fff;border-radius:4px;padding:9px 15px}.primary{background:#409eff;border-color:#409eff;color:#fff}.msg{margin-right:auto;color:#67c23a}@media(max-width:800px){.side{position:static;width:auto}.page{margin:0}.v2-two,.cfg{grid-template-columns:1fr}.cfg .wide{grid-column:auto}}
</style></head><body><header class="top"><b>卓希综合管理系统</b><span class="sys">OMS订单系统</span></header><nav class="side"><h2>订单管理</h2><a href="发货时效预警策略.html#orders">订单列表</a><a href="发货时效预警策略.html#accept">订单接单列表</a><a href="发货时效预警策略.html#flow">履约总览</a><h2>时效设置</h2><a href="商品发货时效配置.html">商品时效配置</a><a href="履约节点配置.html">履约节点配置</a><a class="active" href="客户履约配置.html">客户履约配置</a></nav><main class="page"><header class="head"><h1>客户履约配置</h1><p>按集团公司、公司/仓、门店维护收货信息、到货时效、签约主体与费用。</p></header><section class="panel"><div class="v2-strip"><strong>配置规则</strong><span>下级默认继承上级设置，可按收货主体单独覆盖。</span><span class="v2-tag push">三级客户模型</span></div><div class="v2-two"><aside class="v2-tree"><button class="active" onclick="selectNode(this,'集团公司','盒马集团','大客')">▾ 一级　盒马集团</button><button class="l2" onclick="selectNode(this,'公司 / 仓','华东公司','大客')">└ 二级　华东公司</button><button class="l2" onclick="selectNode(this,'公司 / 仓','上海仓','大客')">└ 二级　上海仓</button><button class="l3" onclick="selectNode(this,'门店','浦东门店','大客')">└ 三级　浦东门店</button><button onclick="selectNode(this,'集团公司','华东经销集团','经销商')">▸ 一级　华东经销集团</button><button class="btn" style="margin-top:14px;border:1px dashed #409eff;color:#409eff" onclick="addNode()">＋ 新增下级客户</button></aside><form id="form" class="v2-card" onsubmit="save(event)"><h2 id="title">盒马集团</h2><p id="level">一级 · 集团公司</p><div class="cfg"><div class="section">基础信息</div><label><span>客户名称</span><input name="name" value="盒马集团" required></label><label><span>客户类型</span><select name="type"><option>大客</option><option>经销商</option></select></label><label><span>收货地址</span><input name="address" placeholder="请输入该层级对应的收货地址"></label><label><span>收货联系人</span><input name="contact" placeholder="姓名 / 手机号"></label><div class="section">到货时效与接单方式</div><label><span>下单默认时效</span><select name="sla"><option>客户指定时间</option><option>工厂默认时间</option></select></label><label><span>接单方式</span><select name="mode"><option>标准接单</option><option>快速接单</option></select></label><label><span>指定到货时间规则</span><select><option>从客户档案自动带出</option><option>下单时选择</option></select></label><label><span>快速接单监控节点</span><input value="发货、揽收、签收" placeholder="请选择监控节点"></label><div class="section">签约主体与费用 <span class="help">确认签约主体后收取对应费用</span></div><label><span>签约主体</span><input name="contract" value="卓希供应链管理有限公司" required></label><label><span>费用承担方</span><select name="payer"><option>客户承担</option><option>公司承担</option><option>按合同约定</option></select></label><label><span>费用项目</span><input name="fee" placeholder="配送费、服务费等"></label><label><span>费率 / 金额</span><input name="rate" placeholder="例如：2% 或 300 元/月"></label><label><span>生效日期</span><input type="date" name="start"></label><label><span>失效日期</span><input type="date" name="end"></label><label class="wide"><span>合同附件</span><input type="file" accept=".pdf,.doc,.docx,.png,.jpg"></label><div class="section">关注设置</div><label><span>重点客户订单关注</span><select><option>开启</option><option>关闭</option></select></label><label><span>企微提醒对象</span><input value="客户负责人、订单员"></label></div><footer class="foot"><span id="msg" class="msg"></span><button type="button" class="btn" onclick="location.reload()">重置</button><button class="btn primary">保存配置</button></footer></form></div></section></main><script>
const storeKey='shipping-customer-fulfillment-v2';function selectNode(btn,level,name,type){document.querySelectorAll('.v2-tree button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');title.textContent=name;document.querySelector('#level').textContent=(level==='集团公司'?'一级 · ':'')+level;form.elements.name.value=name;form.elements.type.value=type;form.elements.sla.value=type==='大客'?'客户指定时间':'工厂默认时间';msg.textContent=''}function save(e){e.preventDefault();const data=Object.fromEntries(new FormData(form).entries());data.level=document.querySelector('#level').textContent;localStorage.setItem(storeKey,JSON.stringify(data));msg.textContent='已保存 '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}function addNode(){const name=prompt('请输入下级客户名称');if(!name)return;const b=document.createElement('button');b.className='l3';b.textContent='└ 三级　'+name;b.onclick=()=>selectNode(b,'门店',name,form.elements.type.value);document.querySelector('.v2-tree .btn').before(b);b.click()}
</script><script src="侧边栏菜单.js?v=2"></script></body></html>
