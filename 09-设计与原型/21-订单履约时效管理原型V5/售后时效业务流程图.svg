<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
<defs><style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#29415f}.title{font-size:34px;font-weight:700}.sub{font-size:15px;fill:#74869d}.h{font-size:19px;font-weight:700}.t{font-size:14px}.box{fill:#fff;stroke:#cbd9ea;stroke-width:2}.blue{fill:#eff5ff;stroke:#4f83ed}.green{fill:#eef9f4;stroke:#45a67b}.amber{fill:#fff8e8;stroke:#d99a32}.red{fill:#fff3f4;stroke:#dc6673}.purple{fill:#f7f1ff;stroke:#916bc7}.arrow{stroke:#7890ad;stroke-width:2.5;fill:none;marker-end:url(#a)}.dash{stroke-dasharray:8 7}</style><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7890ad"/></marker></defs>
<rect width="1600" height="760" fill="#f5f8fc"/><text x="60" y="60" class="title">售后时效管理流程</text><text x="60" y="92" class="sub">退货类售后从发起到仓库入库签收，节点独立计时并记录预计与实际时间</text>
<rect x="50" y="125" width="1500" height="220" rx="18" class="box"/>
<rect x="90" y="185" width="230" height="100" rx="12" class="blue"/><text x="205" y="220" text-anchor="middle" class="h">1 发起售后</text><text x="205" y="250" text-anchor="middle" class="t">关联原订单与商品</text><text x="205" y="274" text-anchor="middle" class="sub">创建成功即记录实际时间</text>
<path d="M320 235H395" class="arrow"/><rect x="395" y="185" width="230" height="100" rx="12" class="amber"/><text x="510" y="220" text-anchor="middle" class="h">2 售后审核</text><text x="510" y="250" text-anchor="middle" class="t">通过或填写原因驳回</text><text x="510" y="274" text-anchor="middle" class="sub">从售后创建开始计时</text>
<path d="M625 235H700" class="arrow"/><rect x="700" y="185" width="250" height="100" rx="12" class="purple"/><text x="825" y="220" text-anchor="middle" class="h">3 填写退货单号</text><text x="825" y="250" text-anchor="middle" class="t">物流公司与快递单号必填</text><text x="825" y="274" text-anchor="middle" class="sub">从审核通过开始计时</text>
<path d="M950 235H1025" class="arrow"/><rect x="1025" y="185" width="250" height="100" rx="12" class="green"/><text x="1150" y="220" text-anchor="middle" class="h">4 入库签收</text><text x="1150" y="250" text-anchor="middle" class="t">仓库确认实物与数量</text><text x="1150" y="274" text-anchor="middle" class="sub">从退货单号提交开始计时</text>
<path d="M1275 235H1340" class="arrow"/><rect x="1340" y="195" width="160" height="80" rx="12" class="green"/><text x="1420" y="228" text-anchor="middle" class="h">售后完成</text><text x="1420" y="255" text-anchor="middle" class="sub">全部商品已入库</text>
<rect x="50" y="380" width="1500" height="300" rx="18" class="box"/><text x="80" y="420" class="h">异常与分支</text>
<rect x="150" y="475" width="250" height="90" rx="12" class="red"/><text x="275" y="510" text-anchor="middle" class="h">审核驳回</text><text x="275" y="540" text-anchor="middle" class="t">原因必填，返回申请人修改</text>
<path d="M510 285C510 400 400 400 400 475" class="arrow"/><rect x="500" y="475" width="260" height="90" rx="12" class="blue"/><text x="630" y="510" text-anchor="middle" class="h">修改并重新提交</text><text x="630" y="540" text-anchor="middle" class="t">保留原申请与驳回历史</text><path d="M400 520H500" class="arrow"/><path d="M630 475C630 405 510 405 510 285" class="arrow dash"/>
<rect x="850" y="475" width="280" height="90" rx="12" class="amber"/><text x="990" y="510" text-anchor="middle" class="h">多包裹或部分入库</text><text x="990" y="540" text-anchor="middle" class="t">保留剩余待办，不关闭整单</text>
<path d="M1150 285V430H990V475" class="arrow"/><rect x="1230" y="475" width="260" height="90" rx="12" class="red"/><text x="1360" y="510" text-anchor="middle" class="h">入库异常</text><text x="1360" y="540" text-anchor="middle" class="t">少件、错货、破损需填说明</text><path d="M1150 430H1360V475" class="arrow"/>
<text x="60" y="725" class="sub">管理口径：完成节点显示实际时间，未完成节点显示预计截止；预警、超时与状态文字同时展示。</text>
</svg>
