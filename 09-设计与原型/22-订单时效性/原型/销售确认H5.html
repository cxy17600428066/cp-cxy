<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>脱骨侠 · 销售交期确认</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#23364c;font:15px/1.65 'Microsoft YaHei',sans-serif}main{max-width:480px;margin:auto;padding:0 16px 120px}header{padding:24px 4px 20px}header small{color:#426897}h1{font-size:25px;margin:8px 0}h2{font-size:17px;margin:0 0 16px}p{color:#62758b;margin:8px 0}.card{background:white;border:1px solid #e0e7f0;border-radius:12px;padding:20px;margin-bottom:16px}.row{display:flex;justify-content:space-between;gap:16px;margin:12px 0;font-size:14px}.row span{color:#667a90}.row b{text-align:right}.time{background:#edf4ff;padding:16px;border-radius:8px;margin-top:16px}.time b{font-size:21px;display:block;color:#2356b2}.choice{display:flex;gap:12px;align-items:flex-start;padding:16px;border:1px solid #d4deeb;border-radius:8px;margin:12px 0}.choice:has(input:checked){border-color:#326bce;background:#f1f6ff}input[type=radio]{margin-top:5px;accent-color:#2861c5}label small{display:block;color:#65798f;margin-top:4px;font-size:12px}.field{display:block;margin:16px 0}.field input,.field textarea{display:block;width:100%;margin-top:8px;border:1px solid #bbcadd;border-radius:8px;padding:12px;font:inherit;font-size:16px;background:white;color:#23364c;min-height:48px}button{font:inherit;cursor:pointer;min-height:48px;border-radius:8px;border:1px solid #b8c8dd;background:white;padding:12px 16px;color:#29466a}button.primary{background:#2861c5;color:white;border-color:#2861c5}button:disabled{opacity:.6;cursor:default}:focus-visible{outline:3px solid #91b7f2;outline-offset:3px}.footer{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #e0e7f0}.footer button{width:100%}.notice{background:#fff7df;color:#805b16;padding:12px 16px;border-radius:8px;font-size:12px;margin-bottom:16px}.error{color:#b42318;font-size:14px}.status{background:#edf4ff;color:#2856a5;padding:4px 10px;border-radius:6px;font-size:12px}[hidden]{display:none!important}</style><main><header><small>脱骨侠 · 卓希工厂</small><h1>销售交期确认</h1><p>请确认工厂提出的时间，或反馈客户可接受的时间。</p></header><div class="notice">H5 交互演示 · 不发送真实通知。同浏览器确认后可回到 PC 查看结果；跨设备同步需接入服务端。</div><section class="card"><span class="status" id="status">待销售确认</span><h2 style="margin-top:16px">订单交期协商</h2><div class="row"><span>订单号</span><b id="order"></b></div><div class="row"><span>客户</span><b id="salesCustomer">华东经销商 · 上海门店（示例）</b></div><div class="row"><span>业务类型</span><b id="type"></b></div><div class="time"><span>工厂提出的<span id="timeLabel"></span></span><b id="factoryTime"></b></div><p style="font-size:12px">工厂说明：原料到厂延迟，需要增加生产和质检时间（示例）。</p></section><form id="confirmForm"><section class="card"><h2>确认结果</h2><label class="choice"><input type="radio" name="decision" value="accept" checked><span><b>确认工厂时间</b><small>已与客户确认，接受工厂提出的交期。</small></span></label><label class="choice"><input type="radio" name="decision" value="adjust"><span><b>调整时间</b><small>填写客户期望时间，提交后由工厂再次确认。</small></span></label><div id="adjustFields" hidden><label class="field">建议<span id="adjustLabel"></span><input type="datetime-local" name="adjustedAt"></label><label class="field">调整原因<textarea name="reason" maxlength="500" rows="3" placeholder="请说明客户要求及调整原因"></textarea></label></div><p class="error" id="error" role="alert"></p></section><div class="footer"><button class="primary" id="submit">确认并提交</button></div></form><section class="card" id="result" hidden aria-live="polite"></section></main><script>
const params=new URLSearchParams(location.search),id=params.get('order')||'demo-negotiation-001',kind='到货时间',raw=params.get('factoryTime')||'2026-11-06T18:00',factory=new Date(raw),key='oms-v5-sales-confirmation:'+id;
document.querySelector('#order').textContent=id;if(params.get('customer'))document.querySelector('#salesCustomer').textContent=params.get('customer');document.querySelector('#type').textContent=params.get('type')==='system'?'系统客户 · 协商到货时间':'非系统客户指定交期 · 协商到货时间';document.querySelector('#timeLabel').textContent=kind;document.querySelector('#adjustLabel').textContent=kind;document.querySelector('#factoryTime').textContent=Number.isNaN(factory.getTime())?'时间无效，请联系发送人':raw.replace('T',' ');
const form=document.querySelector('form');form.addEventListener('change',()=>{let on=form.elements.decision.value==='adjust';document.querySelector('#adjustFields').hidden=!on;form.elements.adjustedAt.required=on;form.elements.reason.required=on;document.querySelector('#submit').textContent=on?'提交调整，等待工厂确认':'确认并提交'});
function showResult(data){document.querySelector('#status').textContent=data.decision==='accept'?'销售已确认':'已提交调整';form.hidden=true;let result=document.querySelector('#result');result.hidden=false;result.innerHTML='<h2>✓ 提交成功</h2><p></p><p></p>';result.children[1].textContent=(data.decision==='accept'?'已接受工厂时间：':'建议调整时间：')+data.time.replace('T',' ');result.children[2].textContent=data.decision==='accept'?'确认结果已保存，等待后续接单处理。':'调整意见已保存，等待工厂再次确认，尚未修改生效交期。'}
form.onsubmit=e=>{e.preventDefault();const error=document.querySelector('#error');if(Number.isNaN(factory.getTime())){error.textContent='链接中的时间无效，请联系发送人重新发送。';return}if(!form.reportValidity())return;let decision=form.elements.decision.value,time=decision==='accept'?raw:form.elements.adjustedAt.value,reason=form.elements.reason.value.trim();if(decision==='adjust'&&!reason){error.textContent='请填写调整原因。';return}const data={order:id,decision,time,reason,actor:'销售',at:new Date().toISOString()};try{localStorage.setItem(key,JSON.stringify(data));showResult(data)}catch(err){error.textContent='未能保存，请检查浏览器存储权限后重试；已填写内容已保留。'}};try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved)showResult(saved)}catch(e){}
</script></html>
