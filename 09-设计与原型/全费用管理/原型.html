:root{--bg:#f4f6f8;--paper:#fff;--ink:#172d35;--muted:#536873;--line:#dee6e9;--brand:#006d66;--tint:#e8f4f1;--warn:#8b5308;--red:#b33131;--nav:#152f36;--r:12px}*{box-sizing:border-box}body{margin:0;font:14px/1.6 'Microsoft YaHei','PingFang SC',sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:3px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #147fbc}button{cursor:pointer;min-height:40px;padding:8px 16px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink);font-weight:600}button:hover{background:#eef4f4}button.primary{background:var(--brand);border-color:var(--brand);color:#fff}button.primary:hover{background:#005750}button:disabled{cursor:not-allowed;color:#66757b;background:#e8edef}button.danger{color:var(--red)}button.small{min-height:34px;padding:4px 12px;font-size:12px}.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}.sidebar{background:var(--nav);color:#fff;padding:28px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.brand{font-size:24px;font-weight:800;letter-spacing:1px;padding:0 16px}.brand small{display:block;color:#b9cfd2;font-size:11px;letter-spacing:2px;font-weight:400;margin-top:2px}.nav-label{color:#b9cfd2;font-size:11px;letter-spacing:2px;margin:32px 16px 12px}.nav button{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:transparent;color:#d9e7e9;border:0;font-weight:400;margin:4px 0;padding:12px 16px}.nav button span:first-child{font-size:12px;opacity:.75;font-variant-numeric:tabular-nums}.nav button:hover{background:#26434a}.nav button[aria-current=page]{background:#f0faf7;color:#064f49;font-weight:700}.side-foot{margin-top:auto;padding:24px 16px 0;color:#c0d1d4;font-size:12px}.side-foot strong{color:#fff;display:block}.main{min-width:0}.topbar{padding:14px 32px;background:white;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.topbar small{color:var(--muted)}.topbar select{min-width:190px;background:#f6f8fa}.demo{background:#fff8e9;border-bottom:1px solid #ead8b1;padding:8px 32px;color:#765019;font-size:12px}.content{padding:28px 32px 48px;max-width:1600px;margin:auto}.heading{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px}.eyebrow{font-size:11px;color:var(--brand);letter-spacing:2px;font-weight:700}.heading h1{font-size:27px;line-height:1.4;margin:4px 0 8px;letter-spacing:-.5px}.heading p{margin:0;color:var(--muted)}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin:20px 0}.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:24px}.stat{padding:20px 24px}.stat .label{color:var(--muted);font-size:12px}.stat .number{font-size:28px;line-height:1.4;font-weight:750;margin:8px 0 4px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}.stat small{font-size:12px;color:var(--muted)}.stat.accent{background:var(--brand);color:white;border-color:var(--brand)}.stat.accent .label,.stat.accent small{color:#d5efea}.split{grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr)}h2{font-size:17px;margin:0 0 16px}h3{font-size:14px;margin:20px 0 10px}p{margin:8px 0}small,.muted{color:var(--muted)}.tag{display:inline-block;border-radius:6px;background:#edf1f4;color:#405b66;padding:3px 9px;font-size:11px;white-space:nowrap}.tag.ok{background:#e4f3eb;color:#126241}.tag.warn{background:#fff2d8;color:#83510b}.tag.bad{background:#fdeaea;color:#9a2929}.tag.blue{background:#e9effc;color:#31569a}.tagline{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.banner{background:#eef7f5;color:#235c56;border:1px solid #cde3dd;padding:12px 16px;border-radius:8px;margin:16px 0}.banner.warn{background:#fff7e8;color:#80500e;border-color:#ead9b4}.banner.error{background:#fff0ef;color:#9a2929;border-color:#e8b9b6}.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin:24px 0 20px;overflow:auto}.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;padding:12px 0;white-space:nowrap;background:transparent;font-weight:400}.tabs button[aria-selected=true]{color:var(--brand);border-color:var(--brand);font-weight:700}.toolbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:16px}input,select,textarea{border:1px solid #bccbd0;border-radius:7px;padding:10px 12px;min-height:42px;background:white;color:var(--ink);max-width:100%}input[type=number]{font-variant-numeric:tabular-nums}label{display:block;font-size:12px;font-weight:600;margin-bottom:6px}textarea{min-height:88px;resize:vertical;width:100%}.field{display:flex;flex-direction:column;gap:3px}.field small{font-size:11px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field input,.field select{width:100%}.wide{grid-column:1/-1}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left;white-space:nowrap;font-size:13px}th{font-size:11px;color:var(--muted);background:#f6f8fa;font-weight:600}th,td{padding:14px 12px;border-bottom:1px solid #e6ecee}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}td.wrap{white-space:normal;min-width:180px;max-width:340px}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#f9fbfb}.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin:20px 0;gap:8px}.step{padding:12px;background:#f4f7f8;border-radius:8px;font-size:12px}.step strong{display:block;color:var(--brand);margin-bottom:5px;font-size:11px}.stack{display:flex;height:32px;border-radius:7px;overflow:hidden;margin:20px 0 12px}.stack span{min-width:2px}.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px}.dot{display:inline-block;width:8px;height:8px;margin-right:6px;border-radius:2px}.keyval{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid #edf1f3}.keyval:last-child{border:0}.keyval span{color:var(--muted)}.keyval strong{text-align:right;font-weight:600}.note{font-size:12px;color:var(--muted);margin-top:12px}.empty{text-align:center;padding:40px;color:var(--muted)}.empty strong{display:block;color:var(--ink);margin-bottom:8px}.activity{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);gap:16px}.activity:last-child{border:0}.activity small{display:block}.rule-item{margin-bottom:16px}.rule-item summary{font-size:16px;font-weight:700;cursor:pointer;padding:4px 0}.rule-item li{margin:10px 0}.rule-item ul{padding-left:22px}.rule-item table{white-space:normal;margin-top:16px}.flowline{font-size:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.flowline b{background:#eff4f5;padding:5px 10px;border-radius:6px;font-weight:500}.flowline .done{background:#dff2e8;color:#126241}.flowline .current{outline:1px solid var(--brand);color:var(--brand)}.toast{position:fixed;bottom:24px;right:24px;max-width:480px;z-index:30;padding:16px 24px;background:#183b36;color:white;border-radius:10px;box-shadow:0 8px 32px #172d3530}.toast.error{background:#852e2e}.hidden{display:none!important}dialog{width:min(700px,calc(100% - 32px));border:0;border-radius:16px;padding:0;box-shadow:0 16px 80px #142d3555;max-height:90vh;color:var(--ink)}dialog::backdrop{background:#142d3570}.dialog-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:20px 24px}.dialog-head h2{margin:0}.dialog-body{padding:24px}.dialog-foot{display:flex;justify-content:flex-end;gap:8px;padding:16px 24px;border-top:1px solid var(--line)}.error-text{color:var(--red);font-size:12px;min-height:20px}.progress{height:7px;border-radius:5px;background:#e9eff1;overflow:hidden;margin:12px 0}.progress span{display:block;background:var(--brand);height:100%}a{color:var(- <script id="rulesData" type="application/json">[{"id": "R01", "title": "有效销售与计提节点", "lead": "下单测算，签收计提。", "items": ["订单确认后展示预计贡献、预计返利和预计服务费，不增加正式可用额度。以 OMS 有效签收事件作为费用管理计提节点，部分签收按已签收部分计算。", "取消订单不计提。退货和折让引用原销售记录及原规则，通过反向或调整记录处理。", "回款作为回款奖励、结算或特殊政策的条件，默认不作为所有销售贡献的计提前提。", "订单确认时锁定价格和适用政策版本，签收计算引用锁定版本。保留销售明细、事件版本和计算快照，支持复算。", "示例：订单金额 100,000 元，已签收 60,000 元，只对已签收部分正式计提，其余保持预计。这里的计提是管理台账动作，财务收入和凭证按财务口径执行。"]}, {"id": "R02", "title": "总费用包边界", "lead": "费用归属随政策版本固定，余额不足不得临时变更归属。", "table": [["项目", "默认归属", "处理方式"], ["合同价 折扣 临时特价", "成交价格", "在成交额体现，不重复扣包"], ["年返 季返 增量返 回款奖励", "包内", "按批准条件预留和确认"], ["托盘及客户专属日常服务", "包内", "按合同预留和确认"], ["陈列 试吃 地推 新品推广", "包内", "活动额度先占用后核销"], ["营销赠品 样品 物料", "包内", "按成本管理，关联促销或活动"], ["已含在产品或履约成本的支出", "原成本项目", "可展示分析，不重复扣包"], ["总部战略 公共品牌 跨中心专项", "独立专项", "单列预算来源和受益对象"]], "items": ["仓储配送按事项区分：属于正常履约成本的不再扣包，额外购买的客户专项服务可经批准纳入包内。已有合同约定优先。", "同一服务事项只确认一次。服务商执行试吃属于活动执行费，不因收款方是服务商再计托盘费。现金、抵扣及实物交付不是新增费用。", "没有订单的公共活动或固定服务费关联项目、期间、批准预算或分摊依据，不虚构订单。"]}, {"id": "R03", "title": "金额与税口径", "lead": "统一管理计费基数，支付与费用保留税额桥接。", "items": ["默认销售计费基数为实际成交的不含税销售金额，扣除有效退货和销售折让。合同约定其他基数时单独配置并保留差异。", "保存原始含税金额、不含税金额、税额、币种及计费基数。费用占用和确认使用同一管理成本口径，支付与费用之间保留税额及其他差异明细。", "后续返利单独计算，不自动反向扣减自身计费基数。经营分析若已引用扣除返利后的财务收入，不再重复扣返利。", "管理费用分类不直接决定会计分类，应付客户对价可能涉及冲减交易价格，系统应保留财务映射能力。", "最终入账金额保留两位小数，中间计算保留更高精度。分摊先按分计算，尾差补到金额最大明细；相同金额按稳定明细编号顺序处理。拆分合计必须等于原金额。"]}, {"id": "R04", "title": "阶梯价格", "lead": "首期优先支持单次订单，周期累计价格独立配置。", "items": ["普通价格优先支持客户、SKU、单次订单数量的阶梯。合同未约定组合计量时，不合并不同 SKU 数量。", "全量享价与超量部分享价必须明确二选一。周期累计价格单列累计周期、SKU 范围和补差方式。", "订单确认后锁定成交价和政策版本。后续改价走审批调整，不直接覆盖历史。", "单次阶梯退货后按有效数量重新判断，是否追补价差依合同；累计阶梯重新计算累计有效数量，历史价差通过调整单处理。", "合同未约定退货补差时，进入人工处理，不自动向客户追加应收。"]}, {"id": "R05", "title": "返利预留与动态复核", "lead": "年度预测与正式预留分开，已发生销售触发正式计算。", "items": ["预测返利根据年度预测销售测算，仅用于分析；正式预留根据实际有效销售和批准政策计算，影响费用额度。", "默认按实际累计销售已达到档位计算正式预留，全额达档与分段返利采用不同算法。", "有效销售、退货、折让或批准调整后，重算累计应预留。差额与未确认预留及累计已确认金额比较；已支付金额仍包含在累计已确认中。", "累计应预留增加则补提，减少则释放可释放预留；已确认不可退义务不能自动取消，差额进入例外处理。预留转确认不再扣额度。", "跨档补提不足时登记缺口，暂停相关新活动额度释放，不压低返利义务。未到起返门槛默认正式预留为零，并展示预测风险；批准预估政策要求提前预留时从其规定。", "返利确认和结算前校验达成条件、期间和审批材料。示例：100 万元按 1% 已预留 1 万元，累计 200 万元适用全额 2% 时，应预留 4 万元，补提 3 万元。"]}, {"id": "R06", "title": "额度释放与组织分配", "lead": "先预留，再解锁，再分池，不允许账户透支。", "items": ["有效签收形成贡献，扣除包内客户预留后，校验政策及缺口。默认剩余额度全部解锁，再按组织比例分配。", "年度目标默认用于经营评估，不自动作为解锁门槛。合同或政策明确要求目标门槛时，未达部分进入待解锁。", "政策缺失、冲突、计算异常或超包缺口，暂停相关新额度释放，不自动收回已批准占用，不取消已成立合同义务。", "试算比例建议总部 10%、中心 20%、大区 20%、省区 50%，按中心和有效期配置，合计必须为 100%。这不是已批准正式比例。", "默认进入组织统筹池并保留来源客户。合同专属额度单独限制用途。允许批准后支持其他客户，记录实际受益客户。", "跨中心、跨法人和跨专项来源不得自动调拨。缺口独立记录，补足后才能新增占用。多池承担分别授权，最终占用作为一个整体提交。"]}, {"id": "R07", "title": "政策匹配与叠加", "lead": "同类政策唯一匹配，不同类型显式配置叠加关系。", "items": ["先校验法人、业务模式、客户或集团，再校验合同项目、SKU、区域、有效期、适用及排除条件。", "同类优先级为已批准项目专项、客户专项、集团政策、中心通用政策。同优先级仍有多条匹配时报冲突，不按创建时间或金额自动选择。", "基础价和数量阶梯价形成一个最终成交价。特价与额外折扣默认不叠加，年返与增量或结构返利默认不叠加，经政策批准可开放。", "返利与真实独立服务可并存；同一服务与活动不得重复确认；同一活动可多池承担，分别授权且总额受控。", "明确批准不返利或无服务商的，可按零费用处理。政策未知或未维护不得擅自按零。新版本不覆盖历史，追溯变更需审批并生成调整记录。"]}, {"id": "R08", "title": "实物费用成本与调整", "lead": "预算使用批准成本，实际确认关联库存成本。", "items": ["申请阶段按批准的标准或预计成本占用预算，出库关联库存系统实际出库成本。接口未具备时受控导入并标记成本待核对。", "核销确认一次费用，出库和供应商付款不新增第二笔费用。预算与实际成本差额通过追加或释放处理。", "退库关联原出库，按原成本或库存系统确认的冲回成本调整。报损需审批，不作为正常使用核销。", "随单赠品与活动领用分开识别，均绑定促销或活动编号；退库、报损和取消领用保留原记录关联。"]}, {"id": "R09", "title": "审批与岗位授权", "lead": "常规事项按金额授权，特殊事项强制升级，禁止自批。", "table": [["单笔申请或项目累计金额", "试点建议审批路径"], ["不超过 10,000 元", "各承担池负责人"], ["超过 10,000 元且不超过 50,000 元", "各承担池负责人及中心负责人"], ["超过 50,000 元", "各承担池负责人 中心负责人 总部授权负责人"]], "items": ["以上金额为原型和试点建议，现行授权制度优先，所有档位必须可配置。政策发布、确认、核销、结算按事项加入业务审核和财务复核。", "多池由各池分别授权。超预算、跨中心、跨法人、追溯改政策和缺口补足，无论金额均升级。收款主体或账户变更独立财务审核。", "申请人不得审批本人申请，负责人发起时转上级。同项目追加按累计金额判断权限，防止拆单绕过审批。付款按财务支付授权执行。", "全部审批完成时正式占用额度，最终提交中校验并锁定余额。待审仅展示预计影响，不保证额度；不足时保留单据和已审记录，转待补足，不留部分占用。", "驳回保留意见和输入。核销经执行确认与财务复核后转使用，结项释放差额；付款不再次扣费用池。"]}, {"id": "R10", "title": "期初与历史迁移", "lead": "首期采用切换日期初加未结业务，不默认重算全部历史。", "items": ["分别导入活动可用、待解锁、活动占用、未确认预留、已确认待结算、已结算未清偿。未结业务保留合同、政策、单据和来源关联。", "历史明细以查询或归档保留，确需重算另行专项处理。期初由业务与财务签认，迁移批次及核对结果可追溯。", "切换前业务不得再次生成贡献。历史订单切换后退货，关联原订单及已迁移余额后调整；未完成映射先进入异常，不自动冲减新账户。", "已关账不覆盖，调整记当前开放期并保留原业务期间。上线后差错通过调整单修正，不直接改历史余额。"]}, {"id": "R11", "title": "接口对账与恢复", "lead": "核心计算事件优先自动化，外围接口允许受控导入。", "table": [["接口", "首期建议"], ["SKU 组织 客户关系 政策版本", "受控同步，保证编码和版本一致"], ["签收 退货 折让 取消", "优先自动对接，支持去重 补拉 重放"], ["库存出库和退库", "自动回写或受控导入"], ["结算 支付 抵扣 退款", "自动回写或财务复核导入"], ["回款状态", "启用回款奖励或解锁政策前具备"]], "items": ["按来源、单据行、事件类型和版本识别唯一事件，同一事件只入账一次。更正走新版本或调整事件。", "贡献、预留及分池同批整体成功或失败。导入与重试记录来源、操作人、批次和结果。未收到支付或交付结果不标记完成。", "每日核对销售完整性、计算拆分、分池、流水余额、返利跨档、核销、实物及清偿。差异生成工单，明确责任与处理期限，月结前未解释差异为零。", "严重错误暂停相关新额度释放和申请，保留业务事件，修复后幂等重放。已确认、核销、结算或支付业务通过调整单恢复。"]}]</script>
<script>
'use strict';
const rules=JSON.parse(document.getElementById('rulesData').textContent),key='tgx-expense-prototype-v1';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'¥'+(n/100).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const cents=v=>Math.round(Number(v)*100),poolNames=['总部池','休食中心池','华东大区池','浙江省区池'],roles={sales:'销售 · 周敏',pool0:'总部池负责人',pool1:'中心池负责人',pool2:'大区池负责人',pool3:'省区池负责人',center:'中心授权负责人',hq:'总部授权负责人',business:'业务核销复核',finance:'财务复核'};
const pages=[['ledger','01','客户费用总台账'],['policies','02','客户政策'],['calculator','03','销售费用试算'],['pools','04','组织费用池'],['activities','05','活动与核销'],['approval','06','审核工作台'],['settlement','07','结算与清偿'],['exceptions','08','异常与对账'],['rules','09','规则说明']];
const seed=()=>({schema:1,policy:{total:10,rebate:2,service:3,ratios:[10,20,20,50]},activities:[{id:'ACT-001',name:'秋季新品试吃',customer:'杭州示例商贸 A',recipient:'杭州示例商贸 A',amount:150000,shares:[15000,30000,30000,75000],status:'closed',actual:150000,applicant:'sales',route:['pool0','pool1','pool2','pool3'],approved:['pool0','pool1','pool2','pool3'],reviews:['business','finance'],evidence:'演示执行记录和验收材料',purpose:'新品推广',payee:'示例执行服务商 C'},{id:'ACT-002',name:'十一月门店陈列',customer:'杭州示例商贸 A',recipient:'杭州示例商贸 A',amount:50000,shares:[5000,10000,10000,25000],status:'approved',actual:0,applicant:'sales',route:['pool0','pool1','pool2','pool3'],approved:['pool0','pool1','pool2','pool3'],reviews:[],purpose:'陈列支持',payee:'示例执行服务商 C'}],servicePaid:0,payments:[],logs:[{event:'初始化',detail:'导入演示期初；总贡献 ¥10,000.00，台账已对平。',time:'演示期初'}],exceptions:[{id:'EX-001',title:'客户政策尚未维护',source:'OMS-DEMO-009 / 行 1',detail:'尚未指定有效政策，不能按零费用计提。请补齐批准政策后重放。',status:'open'},{id:'EX-002',title:'重复签收事件已拦截',source:'OMS-DEMO-001 / V1',detail:'相同来源、单据行、事件和版本已处理，本次未新增流水。',status:'blocked'}]});
let state;try{state=JSON.parse(localStorage.getItem(key));if(!state||state.schema!==1)state=seed()}catch{state=seed();$('storageWarning').textContent=' 当前浏览器不支持持久保存，关闭页面将丢失模拟操作。'}
let page='ledger',tab='overview',filter='',statusFilter='all',returnFocus=null;
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch{$('storageWarning').textContent=' 保存受限，当前操作仅在本次打开期间有效。'}}
function log(event,detail){state.logs.unshift({event,detail,time:new Date().toLocaleString('zh-CN')});save()}
let toastTimer;function toast(msg,error=false){$('toast').textContent=msg;$('toast').className='toast'+(error?' error':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),6500)}
const sum=a=>a.reduce((x,y)=>x+y,0);
function splitAmount(total,weights){const out=weights.map(w=>Math.floor(total*w/100));let rest=total-sum(out);let index=weights.indexOf(Math.max(...weights));out[index]+=rest;return out}
function balances(){const b={used:[0,0,0,0],occupied:[0,0,0,0]};for(const a of state.activities){if(a.status==='closed'){const u=splitAmount(a.actual,a.shares.map(n=>n/a.amount*100));u.forEach((x,i)=>b.used[i]+=x)}else if(['approved','review'].includes(a.status)){a.shares.forEach((x,i)=>b.occupied[i]+=x)}}b.available=poolNames.map((_,i)=>[50000,100000,100000,250000][i]-b.used[i]-b.occupied[i]);return b}
function heading(kicker,title,desc,action=''){return `<div class="heading"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${action}</div></div>`}
function stat(label,value,desc,accent=false){return `<div class="card stat ${accent?'accent':''}"><div class="label">${label}</div><div class="number">${value}</div><small>${desc}</small></div>`}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${headers.length}"><div class="empty"><strong>没有符合条件的记录</strong>可清除筛选，或发起一笔演示申请。</div></td></tr>`}</tbody></table></div>`}
const tag=(t,c='')=>`<span class="tag ${c}">${t}</span>`;
function status(a){return ({pending:tag('待审批','warn'),approved:tag('已占用','blue'),review:tag('核销待复核','warn'),closed:tag('已结项','ok'),rejected:tag('已驳回','bad'),funding:tag('待补足额度','bad')})[a.status]}
function route(a){return `<div class="flowline">${a.route.map((r,i)=>`<b class="${a.approved.includes(r)?'done':i===a.approved.length?'current':''}">${a.approved.includes(r)?'✓ ':''}${roles[r]}</b>`).join('<span>→</span>')}</div>`}
function navigate(next){page=next;filter='';statusFilter='all';render();$('workspace').focus({preventScroll:true})}
function render(){
 ensureSchemes();
 ensurePrograms();
 $('nav').innerHTML=pages.map(([id,num,label])=>`<button data-nav="${id}" ${page===id?'aria-current="page"':''}><span>${num}</span><span>${label}</span></button>`).join('');$('crumb').textContent=pages.find(x=>x[0]===page)[2];
 const views={ledger:ledgerView,funding:fundingView,policies:policyView,programs:programListView,calculator:calcView,pools:poolsView,activities:activitiesView,approval:approvalView,settlement:settlementView,exceptions:exceptionsView,rules:rulesView};$('workspace').innerHTML=views[page]();if(page==='calculator'&&$('calcForm'))calculate();if(page==='activities')drawActivityRows();
}

function calcValues(t){const net=Math.round(cents(t.base)*t.signed/100)-cents(t.returns);if(net<0)return null;const total=Math.round(net*t.total/100),rebate=Math.round(net*t.rebate/100),service=Math.round(net*t.service/100),rest=total-rebate-service;return{net,total,rebate,service,rest,unlock:t.check==='valid'?Math.max(0,rest):0}}

n" class="primary" data-trial-save>保存试算方案</button></div><p class="note">调节费率仅用于当前试算，不修改政策。草稿方案结果仅供评审，不能用于正式计提。</p></form></section><section class="card" id="calcResult" aria-live="polite"></section></div></section>`}

function readTrial(){if(!$('calcForm').reportValidity())return null;const t={...clone(workTrial),name:$('trialName').value.trim(),customer:$('trialCustomer').value,policyId:$('trialPolicy').value,base:Number($('salesBase').value),signed:Number($('signed').value),returns:Number($('returns').value),total:Number($('totalRate').value),rebate:Number($('rebateRate').value),service:Number($('serviceRate').value),check:$('policyState').value};if(!t.name){$('calcError').textContent='请输入试算名称。';return null}if(t.snapshot.customer!==t.customer||t.snapshot.id!==t.policyId){$('calcError').textContent='客户与政策不匹配，请重新选择政策。';return null}return t}

function ruleValid(r){const p=r.params;if(r.fields.some(([k])=>!Number.isFinite(p[k])||p[k]<0))return'规则参数必须是非负有效数字。';for(const[k,label]of r.fields){if((/每档|每组数量|月份数|门槛|起减金额/.test(label)&&!k.startsWith('rate')&&p[k]===0))return'数量及门槛必须大于零。';if((/比例|%/.test(label))&&p[k]>100)return'比例不能超过100%。';if(/折扣/.test(label)&&p[k]>10)return'折扣不能超过10折。'}if('threshold1'in p&&!(p.threshold1<p.threshold2&&p.threshold2<p.threshold3))return'三个档位门槛必须依次递增。';if('repeat'in p&&![0,1].includes(p.repeat))return'循环满减只能填写0或1。';if('mode'in p&&![0,1].includes(p.mode))return'阶梯模式只能填写0或1。';return''}

function readProgram(){const f=$('programForm');if(!f.reportValidity())return null;const v=clone(programWorking);Object.assign(v,{name:$('gName').value.trim(),from:$('gFrom').value,to:$('gTo').value,budget:cents($('gBudget').value),cap:cents($('gCap').value),orderCap:cents($('gOrderCap').value),mode:$('gMode').value,basis:$('gBasis').value,cross:$('gCross').value,simAmount:Number($('gAmount').value),simFreight:Number($('gFreight').value),reason:$('gReason').value.trim()});v.items=state.dealerRules.filter(r=>$('pick_'+r.id).checked).map(r=>{const snap=clone(programWorking.items.find(s=>s.id===r.id)||r);snap.fields.forEach(([k])=>snap.params[k]=Number($('gp_'+r.id+'_'+k).value));snap.inputs.forEach(([k])=>snap.values[k]=Number($('gv_'+r.id+'_'+k).value));return snap});let error=v.budget<programUsed($('programForm').dataset.id)||v.cap<programUsed($('programForm').dataset.id)?'额度不能低于已使用及已占用金额。':v.from>v.to?'结束日期不能早于开始日期。':!v.items.length?'至少选择一项业务策略。':v.cap>v.budget||v.orderCap>v.cap?'额度应满足：单次 ≤ 客户累计 ≤ 方案总额。':v.items.map(ruleValid).find(Boolean);if(error){$('programError').textContent=error;return null}$('programError').textContent='';return v}

function saveProgram(submit){if($('role').value!=='sales')return $('programError').textContent='请切换为申请人销售角色提交方案。';const v=readProgram();if(!v)return;const id=$('programForm').dataset.id;let p=state.dealerPrograms.find(x=>x.id===id);if(p?.oa?.status==='pending')return $('programError').textContent='申请审批中，不能修改。';const cid=$('gCustomer').value,policy=state.policySchemes.find(s=>s.id===$('gPolicy').value);if(policy&&(v.from<policy.from||v.to>policy.to))return $('programError').textContent='方案有效期必须在所选商业政策期间内。';if(!policy||policy.customer!==cid)return $('programError').textContent='客户与商业政策不匹配。';if(!p){p={id:nextId('PRG-',state.dealerPrograms),customer:cid,policyId:policy.id};state.dealerPrograms.push(p)}v.version=(p.live?.version||0)+1;v.policyId=policy.id;v.policySnapshot=clone(policy);if(submit){if(p.oa){p.approvals=p.approvals||[];p.approvals.push(clone(p.oa))}p.oa={status:'pending',step:0,candidate:clone(v),applicant:'sales',logs:[{role:'sales',action:'提交申请',note:v.reason}]};delete p.draft}else p.draft=clone(v);log(submit?'提交活动方案审批':'保存活动方案草稿',p.id+'，原执行版本保持不变。');finishDetail();toast(submit?'已进入统一审核工作台，须逐节点批准。':'草稿已保存，尚未改变执行方案。')}

function actProgram(id,action){const p=state.dealerPrograms.find(p=>p.id===id),a=p.oa,role=$('role').value,note=$('programOpinion').value.trim(),err=$('programApprovalError');if(a?.status!=='pending')return;if(action==='withdraw'){if(role!==a.applicant)return err.textContent='仅申请人可撤回。';a.status='withdrawn';p.draft=clone(a.candidate)}else{if(role===a.applicant)return err.textContent='不能审批本人申请。';if(role!==['pool1','finance','business'][a.step])return err.textContent='当前节点需要 '+roles[['pool1','finance','business'][a.step]]+'。';if(action==='reject'&&!note)return err.textContent='请填写驳回原因。';if(action==='reject'){a.status='rejected';p.draft=clone(a.candidate)}else if(++a.step===3){p.versions=p.versions||[];if(p.live)p.versions.push(clone(p.live));p.live=clone(a.candidate);p.policyId=p.live.policyId||p.policyId;a.status='approved';delete p.draft}}a.logs.push({role,action:action==='approve'?'通过':action==='reject'?'驳回':'撤回',note});log('活动方案审批',id+' / '+a.status+'，未新增预算资金。');finishDetail();toast('已记录本节点结果，原账本金额不变。')}

function combinedQuote(v){
 const amount=cents(v.simAmount??30000),freight=cents(v.simFreight??150);let discount=0,shipping=0;const offers=[];
 for(const kind of ['进货折扣','满额减免','沉默经销商激活']){const r=v.items.find(r=>r.kind===kind);if(!r)continue;const basis=v.basis==='original'?amount:Math.max(0,amount-discount);const values={...r.values,amount:basis/100};let n=Math.min(amount,cents(evaluateRule(r,values)[0]));offers.push({kind,n});if(v.mode==='stack')discount=Math.min(amount,discount+n)}
 if(v.mode==='best')discount=Math.max(0,...offers.map(o=>o.n));const ship=v.items.find(r=>r.kind==='运费补贴');if(ship)shipping=Math.min(freight,cents(evaluateRule(ship,{...ship.values,amount:(amount-discount)/100,freight:freight/100})[0]));
 const max=Math.min(v.orderCap,v.cap,v.budget);if(discount+shipping>max){discount=Math.min(discount,max);shipping=Math.max(0,max-discount)}
 return `<div class="banner"><strong>订单组合报价预览</strong> · ${v.mode==='best'?'互斥择优':'按顺序叠加'}<br>商品原额 ${money(amount)} − 价格让利 ${money(discount)} + 运费 ${money(freight)} − 运费补贴 ${money(shipping)} = 预计实付 ${money(Math.max(0,amount-discount+freight-shipping))}<br>参与组合：${offers.map(o=>o.kind+'候选 '+money(o.n)).join('、')||'无订单价格优惠'}。金额受本方案单次、客户和总上限限制。</div><p class="note">仅对折扣、满减、激活减免及运费执行本单组合；其他业务保留各自输入及期间。未输入客户历史已领额度和跨方案命中情况，不据此批准实际优惠；资格按已核验情景预览。价格让利不重复扣费用包，返利不计入本单立减，赠品不折现。</p>`
}

function fundSandboxView(){const b=loadFundSandbox(),v=fundTotals(b),r=state.dealerRules.find(r=>r.id===fundRuleId)||state.dealerRules[0],policy=fundPolicy(r);return`<div class="banner warn"><strong>隔离沙盘 · 不入业务账本</strong>　${esc(b.baseNote)}<br>沙盘事件仅保存于本标签页；重置可重新读取当前演示期初。${v.gap?'存在缺口，禁止新增活动占用；已确认义务和原支付记录保留。':''}</div><div class="grid stats">${stat('有效来源合计',money(v.source),'销售贡献 + 专项补足 + 净调入')}${stat('客户未确认预留',money(b.r+b.s),'返利与服务分别记录')}${stat('可用活动额度',money(v.available),'尚未承诺和使用的来源',true)}${stat('待补足缺口',money(v.gap),'不形成负可用，不删除义务')}</div><div class="grid split"><section class="card"><h2>选择策略与业务事件</h2><form id="fundEventForm"><div class="fields"><div class="field wide"><label for="fundRule">策略业务</label><select id="fundRule">${state.dealerRules.map(s=>`<option value="${s.id}" ${s.id===fundRuleId?'selected':''}>${esc(s.kind)}</option>`).join('')}</select></div><div class="field wide"><label for="fundAction">业务节点</label><select id="fundAction">${[...new Set([...policy.actions,'inject','transfer_out'])].map(a=>`<option value="${a}">${fundActions[a]}</option>`).join('')}</select></div><div class="field"><label for="fundAmount">事件金额 / 累计返利目标（元）</label><input id="fundAmount" type="number" min="0" step="0.01" value="100" required><small>价格及退货填销售基数减少额；累计复核填累计应享目标；其他填本次变动。</small></div><div class="field"><label for="fundRef">业务单据号 *</label><input id="fundRef" value="SIM-001" maxlength="60" required></div><div class="field"><label for="fundProject">关联活动 / 项目 *</label><input id="fundProject" value="OPEN-ACT" maxlength="60" required><small>期初500元占用在 OPEN-ACT；新申请请使用新的项目号。</small></div><div class="field"><label for="fundVersion">事件版本 *</label><input id="fundVersion" type="number" min="1" step="1" value="1" required></div><div class="field"><label for="fundQty">实物数量</label><input id="fundQty" type="number" min="1" step="1" value="10"></div><div class="field"><label for="fundCost">实物单位成本（元）</label><input id="fundCost" type="number" min="0.01" step="0.01" value="20"></div></div><div class="banner">${esc(policy.flow)}<br>实物领用使用“数量 × 单位成本”；付款不扣池；累计返利比较时包含已确认和已支付部分。</div><p id="fundError" class="error-text" role="alert"></p><div class="actions"><button type="button" data-fund-preview>预览前后变化</button><button type="submit" class="primary">记入沙盘事件</button><button type="button" data-fund-reset>重置沙盘</button></div></form><div id="fundPreview" aria-live="polite"></div></section><section class="card"><h2>当前额度与清偿状态</h2>${fundStateTable(b)}<div class="banner">对平：${money(v.source)} + ${money(v.gap)} = ${money(b.r+b.s)}预留 + ${money(b.c)}已用 + ${money(b.h)}占用 + ${money(b.locked)}待解锁 + ${money(v.available)}可用<br>✓ 缺口单列；付款、应付与追偿不重复加进来源对平。</div><p class="note">价格调整按本沙盘10%总率、2%返利、3%服务比例演示，仅释放可调整的未确认预留；真实合同固定费和不可退义务须按原合同保留。</p></section></div><section class="card" style="margin-top:16px"><h2>事件流水与追溯</h2>${table(['事件 / 业务单据','策略及项目','本次金额 / 累计目标','可用前 → 后','预留前 → 后','缺口前 → 后'],b.events.map(e=>[esc(e.action)+'<br><small>'+esc(e.ref)+' / V'+e.version+'</small>',esc(e.kind)+'<br><small>'+esc(e.project)+'</small>',money(e.amount),money(e.before.available)+' → '+money(e.after.available),money(e.before.reserve)+' → '+money(e.after.reserve),money(e.before.gap)+' → '+money(e.after.gap)]))}</section>`}
function fundStateTable(b){return table(['记录层次','金额'],[['销售费用贡献',money(b.contribution)],['专项注入 / 净调入',money(b.topup)+' / '+money(b.transfer)],['未确认返利预留',money(b.r)],['未确认服务预留',money(b.s)],['未核销承诺占用',money(b.h)],['累计净确认费用',money(b.c)],['已确认待结算',money(b.unsettled)],['已结算未清偿',money(b.due)],['已支付 / 已抵扣',money(b.paid)],['已追回 / 待冲销退款',money(b.refunded||0)+' / '+money(b.refundPending||0)],['待冲销 / 追偿提示',money(b.claim)]])}
function reduceToState(b){const t=fundTotals(b);return{available:t.available,gap:t.gap,reserve:b.r+b.s}}
function simulateFundEvent(b,event){const n=clone(b),{action,amount,project}=event,t=fundTotals(n);if(!Number.isSafeInteger(amount)||amount<0)throw Error('请输入非负有效金额。');if(n.seen.includes(event.key))throw Error('该来源、单据、节点与版本已处理，不能重复入账。更正应使用新版本及原记录关联。');if(amount===0&&action!=='target')throw Error('本次变动金额须大于零。');if(event.source&& !['SKU总包','成交价格','合同结算'].includes(event.source)&&!['inject','transfer_out'].includes(action))throw Error('该策略不由当前 SKU 总包承担，请使用独立专项或包外成本账户，不能直接扣本沙盘总包。');const rebate=event.route==='rebate';let message='';
 if(action==='price'||action==='return'){const contribution=Math.round(amount*.10),r=Math.round(amount*.02),s=Math.round(amount*.03);if(contribution>n.contribution)throw Error('减少的贡献超过现有销售贡献，请核对原销售行。');n.contribution-=contribution;n.r-=Math.min(n.r,r);n.s-=Math.min(n.s,s);message='按比例重算贡献与可调整预留；已确认费用、已支付部分未被删除。'}
 else if(action==='reserve'){n.r+=amount;message='新增预留不够时保留合同义务并登记缺口。'}
 else if(action==='target'){n.r=Math.max(0,amount-n.rebateConfirmed);n.claim=Math.max(n.claim,n.rebateConfirmed-amount,0);message='目标扣除累计已确认返利后重算未确认预留；已支付仍包含在已确认中。低于已确认部分仅提示冲销 / 追偿。'}
 else if(action==='reserve_release'){if(amount>n.r)throw Error('不能释放超过未确认返利预留的金额。');n.r-=amount}
 else if(action==='confirm_rebate'){if(amount>n.r)throw Error('确认金额超过未确认返利预留，请先补提。');n.r-=amount;n.c+=amount;n.rebateConfirmed+=amount;n.unsettled+=amount;n.unsettledR=(n.unsettledR||0)+amount;message='预留转已用，总承诺不变，不再次减少可用。'}
 else if(action==='hold'||action==='physical_hold'){if(t.gap||amount>t.available)throw Error('可用额度不足或已有缺口，新增占用已拦截；请先补足或减少申请。');n.h+=amount;n.projects[project]=(n.projects[project]||0)+amount}
 else if(action==='use'||action==='release'){if(amount>(n.projects[project]||0))throw Error('超过该项目剩余占用，不能使用其他活动的占用。');n.projects[project]-=amount;n.h-=amount;if(action==='use'){n.c+=amount;n.unsettled+=amount;message='占用转已用，核销不再次扣可用。'}else message='只释放本项目未核销余款。'}
 else if(action==='settle'){if(amount>(rebate?(n.unsettledR||0):n.unsettled-(n.unsettledR||0)))throw Error('超过该类费用已确认待结算金额，不能占用其他费用。');n.unsettled-=amount;n.due+=amount;if(rebate){n.unsettledR-=amount;n.dueR=(n.dueR||0)+amount}message='确认费用转应付，费用池不变化。'}
 else if(action==='pay'||action==='deduct'){if(amount>(rebate?(n.dueR||0):n.due-(n.dueR||0)))throw Error('超过该类有效未清偿应付，请先完成费用确认与结算。');n.due-=amount;n.paid+=amount;if(rebate){n.dueR-=amount;n.paidR=(n.paidR||0)+amount}message=action==='deduct'?'按合同方向演示减少应付；不是新费用，也不自动返还预算。':'支付或抵扣只清偿应付，不再次扣费用池。'}
 else if(action==='reverse_fee'){if(amount>(rebate?(n.unsettledR||0)+(n.dueR||0):n.unsettled+n.due-(n.unsettledR||0)-(n.dueR||0)))throw Error('已支付部分不能直接冲销恢复预算。请先关联追偿及财务批准的冲销处理。');const take=Math.min(amount,rebate?(n.unsettledR||0):n.unsettled-(n.unsettledR||0));n.unsettled-=take;n.due-=amount-take;n.c-=amount;if(rebate){n.unsettledR-=take;n.dueR-=amount-take;n.rebateConfirmed-=amount;n.claim=Math.max(0,n.claim-amount)}message='本事件假设已有批准冲销凭证，仅冲销尚未清偿费用；已支付记录不删改。'}
 else if(action==='refund'){const max=rebate?(n.paidR||0)-(n.refundedR||0):n.paid-(n.paidR||0)-(n.refunded||0)+(n.refundedR||0);if(amount>max)throw Error('退款超过该类历史清偿的未追回金额。');n.refunded=(n.refunded||0)+amount;n.refundPending=(n.refundPending||0)+amount;if(rebate){n.refundedR=(n.refundedR||0)+amount;n.refundPendingR=(n.refundPendingR||0)+amount}message='已收回资金仅登记待冲销，历史支付不删除，可用额度不变。'}
 else if(action==='reverse_refunded'){const max=rebate?(n.refundPendingR||0):(n.refundPending||0)-(n.refundPendingR||0);if(amount>max)throw Error('超过该类已追回待冲销金额，请先登记真实退款到账。');n.refundPending-=amount;n.c-=amount;if(rebate){n.refundPendingR-=amount;n.rebateConfirmed-=amount}n.claim=Math.max(0,n.claim-amount);message='本事件假设已获冲销批准，冲减确认费用后才恢复额度或减少缺口。'}
 else if(action==='inject'){n.topup+=amount;message='专项补足来源单列，不计作销售贡献。'}
 else if(action==='transfer_out'){if(amount>t.available||t.gap)throw Error('只能调出可用额度，不能挪用预留、占用和已用。');n.transfer-=amount;message='实际调拨需调出、调入组织分别授权并同批对平。'}
 else throw Error('不支持的业务节点。');
 const before=reduceToState(b),after=reduceToState(n);n.events.unshift({...event,kind:event.kind,action:fundActions[action],before,after,message});n.seen.push(event.key);return{next:n,message,before,after}}
function readFundEvent(){if(!$('fundEventForm').reportValidity())return null;const rule=state.dealerRules.find(r=>r.id===$('fundRule').value),action=$('fundAction').value,ref=$('fundRef').value.trim(),project=$('fundProject').value.trim(),version=Number($('fundVersion').value);if(!ref||!project)throw Error('业务单据与关联项目不能为空。');let amount=cents($('fundAmount').value);if(action==='physical_hold'){const qty=Number($('fundQty').value),unit=cents($('fundCost').value);if(!Number.isInteger(qty)||qty<=0||unit<=0)throw Error('实物数量须为正整数，单位成本须大于零。');amount=qty*unit}return{action,amount,ref,project,version,kind:rule.kind,ruleId:rule.id,ruleVersion:rule.version,route:rule.route,source:fundPolicy(rule).source,key:['SANDBOX',ref,project,action,version].join('|')}}
function previewFundEvent(post=false){try{const event=readFundEvent();if(!event)return;const result=simulateFundEvent(loadFundSandbox(),event);$('fundError').textContent='';if(post){const draft=Object.fromEntries([...$('fundEventForm').querySelectorAll('input,select')].filter(el=>el.id).map(el=>[el.id,el.value]));fundSandbox=result.next;saveFundSandbox();render();for(const[id,value]of Object.entries(draft))if($(id))$(id).value=value;toast('沙盘事件已记录，未改动业务账本。')}else{$('fundPreview').innerHTML=`<h3>本次事件预计变化</h3>${table(['项目','事件前','事件后'],[['活动可用',money(result.before.available),money(result.after.available)],['客户预留',money(result.before.reserve),money(result.after.reserve)],['待补足缺口',money(result.before.gap),money(result.after.gap)]])}<div class="banner">${esc(result.message||'按批准节点转移状态。')} 本次不入账。</div>`}}catch(e){$('fundError').textContent=e.message}}
readRule=function(id){const r=existingReadRule(id);if($('ruleFundSource'))r.fund={...fundPolicy(r),source:$('ruleFundSource').value,trigger:$('ruleFundTrigger').value};return r};
openDealerRule=function(id){existingRuleOpen(id);const r=state.dealerRules.find(r=>r.id===id),p=fundPolicy(r);if($('dealerRuleForm')){const block=`<section><h3>资金池影响配置</h3><div class="fields"><div class="field"><label for="ruleFundSource">承担来源</label><select id="ruleFundSource" ${['price','deduction'].includes(r.route)?'disabled':''}>${[p.source,'SKU总包','独立专项预算','包外经营成本'].filter((v,i,a)=>a.indexOf(v)===i).map(v=>`<option>${esc(v)}</option>`).join('')}</select></div><div class="field"><label for="ruleFundTrigger">承诺或预留节点</label><input id="ruleFundTrigger" value="${esc(p.trigger)}" required></div></div><p class="note">${esc(p.flow)}。变更只适用于后续批准版本，不能为余额不足临时换来源。包外仍进入经营分析；专项额度须有独立来源。</p><button type="button" data-fund-detail="${id}">查看完整影响规则</button></section>`;$('dealerRuleForm').insertAdjacentHTML('afterbegin',block);detailPage.body=$('fullPageBody').innerHTML;detailPage.baseline=JSON.stringify(formSnapshot())}};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.fundTab){fundTab=b.dataset.fundTab;render()}if(b.dataset.fundDetail)openFundDetail(b.dataset.fundDetail);if(b.dataset.fundSim){fundRuleId=b.dataset.fundSim;fundTab='sandbox';navigate('pools')}if(b.hasAttribute('data-fund-preview'))previewFundEvent();if(b.hasAttribute('data-fund-reset'))showModal('重置资金流转沙盘','<p>清除沙盘事件并从当前客户 A 演示账本重新取期初。实际台账、活动与付款不受影响。</p><button data-fund-reset-confirm class="primary">确认重置沙盘</button>');if(b.hasAttribute('data-fund-reset-confirm')){fundSandbox=initialFundSandbox();saveFundSandbox();closeModal();render();toast('沙盘已重置。')}});

programSimulation=function(v){return priorFundProgramSimulation(v)+`<section class="card" style="margin-top:16px"><h2>所选策略的额度影响</h2>${table(['策略','承担来源与节点','额度变化','查看'],v.items.map(r=>{const p=fundPolicy(r);return[esc(r.kind),esc(p.source)+' / '+esc(p.trigger),`<span class="wrap">${esc(p.flow)}</span>`,`<button type="button" class="small" data-fund-detail="${r.id}">流转规则</button>`]}))}<p class="note">不同阶段和基数先分别计算金额；同一义务从预留到确认再到清偿只记录状态转移。此预览不向账本提交事件。</p></section>`};

// 销售获取与期间释放引擎。金额单位为分；新销售只产生一条有效信用流水。
const MAIN_POOL='POOL-MAIN',FUND_CUTOVER='2026-11-17';
function openingFundingRights(f){return[{id:'OPEN-REBATE-A-2026',customer:'A',base:10000000,reserve:200000,policy:clone(state.policySchemes.find(p=>p.id==='POL-001')),link:clone((f.bindingVersions||[]).find(l=>l.id==='LINK-001'&&l.version===1)||f.bindings.find(l=>l.id==='LINK-001')),period:{key:'2026',end:'2026-12-31'}}]}
function ensureFunding(){if(state.funding){if(!state.funding.openingRights){state.funding.openingRights=openingFundingRights(state.funding);save()}return;}ensureSchemes();state.funding={version:1,date:FUND_CUTOVER,pools:[{id:MAIN_POOL,name:'全费用总资金池',kind:'operating',initial:1000000,cap:100000000,status:'active',ratios:[10,20,20,50],from:'2026-01-01',to:'2026-12-31',legacy:true}],rules:[{id:'GET-001',version:1,name:'销售金额10%即时获取',pool:MAIN_POOL,customer:'*',sku:'*',method:'rate',rate:10,unit:100,tiers:[{min:5000000,rate:1},{min:10000000,rate:2},{min:20000000,rate:3}],timing:'instant',from:FUND_CUTOVER,to:'2026-12-31',status:'active'}],bindings:customers.map((c,i)=>({id:'LINK-00'+(i+1),version:1,customer:c.id,policyId:'POL-00'+(i+1),sourcePool:MAIN_POOL,rebateTiming:'year',rebateMethod:'rate',rebateRate:[2,1,0,0][i],tiers:[{min:50000000,rate:1},{min:100000000,rate:2},{min:200000000,rate:3}],tierMode:'whole',serviceRate:[3,5,2,1][i],lockEarly:false,from:FUND_CUTOVER,to:'2026-12-31',status:'active'})),sales:[],credits:[],transfers:[],batches:[],payouts:[]};state.funding.openingRights=openingFundingRights(state.funding);save()}
function fundPeriod(date,timing){const y=date.slice(0,4),m=+date.slice(5,7);if(timing==='instant')return{key:date,end:date};if(timing==='month'){const last=new Date(Date.UTC(+y,m,0)).toISOString().slice(0,10);return{key:date.slice(0,7),end:last}}if(timing==='quarter'){const q=Math.ceil(m/3);return{key:y+'-Q'+q,end:new Date(Date.UTC(+y,q*3,0)).toISOString().slice(0,10)}}return{key:y,end:y+'-12-31'}}

function fundingRulesView(){return`<div class="actions" style="margin-bottom:16px"><button class="primary" data-funding-rule-new>新建获取规则</button></div><section class="card">${table(['获取规则 / 版本','目标池 / 客户 / SKU','获取方式','入池时点','有效期','操作'],state.funding.rules.map(r=>[esc(r.name)+'<br><small>'+r.id+' / V'+r.version+'</small>',esc(r.pool)+'<br><small>'+(r.customer==='*'?'全部客户':customer(r.customer).name)+' / '+esc(r.sku)+'</small>',r.method==='quantity'?money(r.unit)+' / 数量':r.method==='tier'?'单笔金额阶梯，达档全额':r.rate+'% × 不含税净销售额',fundingTiming[r.timing],r.from+' 至 '+r.to,`<button class="small" data-funding-rule="${r.id}">新版本配置</button>`]))}</section><p class="note">同一销售行必须唯一匹配规则；保存新版本后，新销售使用新版本，原销售和退货继续引用原快照。</p>`}
function fundingBindingsView(){return`<section class="card">${table(['客户 / 商业政策','来源池','返利计提','返利入池时点','年内来源处理','服务预留','操作'],state.funding.bindings.map(l=>[customer(l.customer).name+'<br><small>'+l.policyId+' / 配置 V'+l.version+'</small>',l.sourcePool,l.rebateMethod==='tier'?'按期间净销售阶梯':l.rebateRate+'% × 净销售额',fundingTiming[l.rebateTiming],l.lockEarly?'先统计并锁定来源额度':'先统计，不提前增加返利池余额',l.serviceRate+'%',`<button class="small" data-funding-binding="${l.id}">配置时点与来源</button>`]))}</section><div class="banner">年返先累计应享权益，年末核验、审批后从来源池划入客户返利池；实际发放再清偿客户应付。可选择年内提前预留来源资金，但不能提前把预计返利当成客户可用额度。</div>`}
function fundingSalesView(){return`<div class="actions" style="margin-bottom:16px"><button class="primary" data-funding-sale-new>登记签收销售 / 退货</button></div><section class="card">${table(['事件 / 来源行','客户 / 日期','净销售 / 数量','规则与客户策略快照','计提获取额','状态','操作'],state.funding.sales.map(s=>[s.id+'<br><small>'+esc(s.doc)+' / '+esc(s.line)+' · '+(s.kind==='return'?'退货关联 '+s.original:'有效签收')+'</small>',customer(s.customer).name+'<br><small>'+s.date+'</small>',money(s.base)+' / '+s.qty,s.rule.id+' V'+s.rule.version+'<br><small>'+s.link.id+' V'+s.link.version+'</small>',money(s.earning),({posted:tag('已同步账本','ok'),period:tag('待期间入池','warn'),blocked:tag('超过上限，待处理','bad'),pendingOriginal:tag('等待原销售入池','warn')})[s.status],s.status==='blocked'?`<button data-funding-retry="${s.id}">重试入池</button>`:'—']))}</section>`}
function fundingPeriodView(){return`<section class="card">${table(['期间 / 类别','客户 / 来源','累计计费基数','累计应享 / 已释放','待入池或调整','截止日','操作'],fundingGroups().map(g=>[g.period.key+'<br><small>'+(g.kind==='earn'?'销售获取入池':'客户返利释放')+' · V'+g.version+'</small>',customer(g.customer).name+'<br><small>'+g.pool+'</small>',money(g.basis)+(g.openingReserve?'<br><small>含已确认迁移的期初销售权益</small>':''),money(g.target)+' / '+money(g.released),money(g.delta)+(g.delta<0?'<br>'+tag('需冲销或追偿','bad'):''),g.period.end, g.pending?`<button data-funding-batch="${g.pending.id}">查看待审</button>`:g.delta>0?`<button data-funding-prepare="${esc(g.key)}" ${g.ready?'':'disabled'}>${g.ready?'发起期间核验':'未到截止日'}</button>`:'—']))}</section><section class="card" style="margin-top:16px"><h2>期间核验批次</h2>${table(['批次','客户 / 类型','金额','状态','操作'],state.funding.batches.map(b=>[b.id,customer(b.customer).name+' / '+(b.kind==='earn'?'销售入池':'客户返利'),money(b.amount),({pending:tag('待'+roles[['business','finance'][b.step]],'warn'),approved:tag('已入池','ok'),rejected:tag('已驳回','bad')})[b.status],`<button data-funding-batch="${b.id}">审批记录</button>`]))}</section>`}
function fundingFlowsView(){const f=state.funding;return`<section class="card"><h2>销售获取入池流水</h2>${table(['流水','目标池 / 客户','来源销售或批次','入池 / 服务预留 / 即时返利预留','日期'],f.credits.map(c=>[c.id,c.pool+' / '+customer(c.customer).name,c.sale||c.batch,money(c.amount)+' / '+money(c.service||0)+' / '+money(c.rebate||0),c.date]))}<h2 style="margin-top:24px">返利来源划拨</h2>${table(['流水','来源 → 返利专属池','客户 / 批次','金额','日期'],f.transfers.map(t=>[t.id,t.source+' → '+t.target,customer(t.customer).name+' / '+t.batch,money(t.amount),t.date]))}<h2 style="margin-top:24px">已发放返利</h2>${table(['清偿流水','客户 / 批次','方式','金额','业务日期'],f.payouts.map(p=>[esc(p.ref),customer(p.customer).name+' / '+p.batch,p.method==='cash'?'现金':'货款抵扣',money(p.amount),p.date]))}</section>`}
function openFundingPool(id){const p=state.funding.pools.find(p=>p.id===id)||{name:'',initial:0,cap:10000000,from:FUND_CUTOVER,to:'2026-12-31',kind:'operating',status:'draft',ratios:[10,20,20,50]},active=p.status==='active';launchPage({kind:'fundingPool',id},()=>showModal(id?'资金池配置':'新建资金池',`<form id="fundingPoolForm" data-id="${id||''}"><div class="fields">${ff('fpName','资金池名称 *',p.name,'text','required maxlength="60"')}${ff('fpInitial','初始来源（元）',p.initial/100,'number',`min="0" step="0.01" required ${active?'readonly':''}`)}${ff('fpCap','预算上限（元）',p.kind==='rebate'?p.initial/100:p.cap/100,'number',`min="0" step="0.01" required ${p.kind==='rebate'?'readonly':''}`)}${ff('fpFrom','开始日期',p.from,'date','required')}${ff('fpTo','结束日期',p.to,'date','required')}${(p.ratios||[0,0,0,100]).map((v,i)=>ff('fpRatio'+i,['总部','中心','大区','省区'][i]+'分配 %',v,'number',`min="0" max="100" step="0.01" required ${active?'readonly':''}`)).join('')}</div><p class="note">启用后初始来源及组织比例固定，补充资金可新建独立来源池，避免改写历史。修改上限由财务角色处理，不能降到已使用和承诺之下。</p><p id="fundingError" class="error-text" role="alert"></p><button class="primary">保存资金池配置</button></form>`))}
function fundingTierFields(prefix,tiers){return tiers.map((t,i)=>`<div class="fields" style="margin-top:8px">${ff(prefix+'Min'+i,'第'+(i+1)+'档门槛（元）',t.min/100,'number','min="0" step="0.01" required')}${ff(prefix+'Rate'+i,'第'+(i+1)+'档比例 %',t.rate,'number','min="0" max="100" step="0.01" required')}</div>`).join('')}
function openFundingRule(id){const r=state.funding.rules.find(r=>r.id===id)||{name:'',pool:MAIN_POOL,customer:'*',sku:'*',method:'rate',rate:10,unit:100,timing:'instant',from:FUND_CUTOVER,to:'2026-12-31',tiers:[{min:5000000,rate:1},{min:10000000,rate:2},{min:20000000,rate:3}]};launchPage({kind:'fundingRule',id},()=>showModal('资金获取规则'+(id?'新版本':''),`<form id="fundingRuleForm" data-id="${id||''}"><div class="fields">${ff('frName','规则名称 *',r.name,'text','required')}${fs('frPool','目标资金池',state.funding.pools.filter(p=>p.kind==='operating'&&p.status==='active').map(p=>[p.id,p.name]),r.pool)}${fs('frCustomer','适用客户',[['*','全部客户'],...customers.map(c=>[c.id,c.name])],r.customer)}${ff('frSku','适用 SKU，* 为全部',r.sku,'text','required')}${fs('frMethod','获取方式',[['rate','销售金额比例'],['quantity','每数量固定金额'],['tier','单笔金额阶梯达档全额']],r.method)}${ff('frRate','金额比例 %',r.rate,'number','min="0" max="100" step="0.01" required')}${ff('frUnit','每数量获取（元）',r.unit/100,'number','min="0" step="0.01" required')}${fs('frTiming','入池时点',Object.entries(fundingTiming),r.timing)}${ff('frFrom','生效日期',r.from,'date','required')}${ff('frTo','结束日期',r.to,'date','required')}</div><h3>单笔阶梯（选择阶梯方式时生效）</h3>${fundingTierFields('fr',r.tiers)}<p class="note">完成签收后自动匹配。月、季、年末方式只先记录待入池，核验审批后才增加可用来源。保存新版本不会重算历史销售。</p><p id="fundingError" class="error-text" role="alert"></p><button class="primary">保存规则新版本</button></form>`))}
function openFundingBinding(id){const l=state.funding.bindings.find(l=>l.id===id);launchPage({kind:'fundingBinding',id},()=>showModal(customer(l.customer).name+' · 客户策略资金时点',`<form id="fundingBindingForm" data-id="${id}"><div class="banner">配置 V${l.version}；新销售使用新版本，既有销售及年返统计保留原快照。入池与给客户付款是两个独立步骤。</div><div class="fields">${fs('fbPolicy','客户商业政策',state.policySchemes.filter(p=>p.customer===l.customer&&p.status==='active').map(p=>[p.id,p.name+' V'+p.version]),l.policyId)}${fs('fbPool','返利来源池',state.funding.pools.filter(p=>p.kind==='operating'&&p.status==='active').map(p=>[p.id,p.name]),l.sourcePool)}${fs('fbTiming','客户返利核验释放时点',Object.entries(fundingTiming),l.rebateTiming)}${fs('fbMethod','返利计算',[['rate','期间净销售固定比例'],['tier','期间累计阶梯']],l.rebateMethod)}${ff('fbRate','固定返利比例 %',l.rebateRate,'number','min="0" max="100" step="0.01" required')}${fs('fbTierMode','累计阶梯方式',[['whole','达档全额'],['segment','按区间分段']],l.tierMode)}${fs('fbLock','入池前的来源处理',[['no','先记录，期末再从来源池划拨'],['yes','先记录并预留来源额度，期末释放']],l.lockEarly?'yes':'no')}${ff('fbService','服务费用销售预留 %',l.serviceRate,'number','min="0" max="100" step="0.01" required')}${ff('fbFrom','新配置生效日',l.from,'date','required')}${ff('fbTo','配置结束日',l.to,'date','required')}</div><h3>年返或期间累计阶梯</h3>${fundingTierFields('fb',l.tiers)}<div class="banner warn">客户返利默认进入该客户专属返利池，只能结算返利。来源池余额不足时保留客户应享权益，不能自动取消或少返。即时释放同样先核验应享，不直接冒充客户已收款。</div><p id="fundingError" class="error-text" role="alert"></p><button class="primary">保存客户资金策略新版本</button></form>`))}
function openFundingSale(){launchPage({kind:'fundingSale'},()=>showModal('登记销售完成事件',`<form id="fundingSaleForm"><div class="fields">${fs('saleKind','业务事件',[['sale','有效签收销售'],['return','关联原销售退货']],'sale')}${fs('saleCustomer','归属客户',customers.map(c=>[c.id,c.name]),'A')}${ff('saleDoc','来源订单 / 退货单号 *','','text','required maxlength="60"')}${ff('saleLine','来源行号 *','1','text','required maxlength="30"')}${ff('saleSku','销售 SKU *','TGX-DEMO-001','text','required')}${ff('saleAmount','不含税净销售 / 本次退货金额（元）',100000,'number','min="0.01" step="0.01" required')}${ff('saleQty','销售 / 退货数量',100,'number','min="0" step="0.01" required')}${ff('saleDate','签收 / 退货业务日期',state.funding.date,'date','required')}${fs('saleOriginal','退货关联原销售（销售事件时不使用）',[['','请选择'],...state.funding.sales.filter(s=>s.kind==='sale').map(s=>[s.id,s.id+' / '+customer(s.customer).name+' / '+s.doc])],'')}</div><p class="note">退货继承原客户、政策、获取规则及统计期间。提交后生成有来源的入池流水，重复订单行不会重复入池。</p><p id="fundingError" class="error-text" role="alert"></p><button class="primary">确认销售事件并同步资金池</button></form>`))}
function openFundingBatch(id){const b=state.funding.batches.find(b=>b.id===id);launchPage({kind:'fundingBatch',id},()=>showModal('期间核验 · '+b.id,`<h2>${b.kind==='earn'?'销售获取入池':'客户返利释放'} · ${customer(b.customer).name}</h2>${table(['事项','内容'],[['期间',b.period.key+'，截止 '+b.period.end],['累计计费基数',money(b.basis)],['本次审批差额',money(b.amount)],['目标',b.kind==='rebate'?'从 '+b.pool+' 划拨至客户返利专属池，形成返利应付':'增加 '+b.pool+' 已获取来源'],['当前状态',b.status==='pending'?'待 '+roles[['business','finance'][b.step]]:b.status]])}<h3>审批记录</h3>${table(['岗位','动作','业务日 / 意见'],b.logs.map(l=>[roles[l.who],l.action,l.date+' / '+esc(l.note||'—')]))}${b.status==='pending'?`<label for="fundingOpinion">意见（驳回必填）</label><textarea id="fundingOpinion"></textarea><p id="fundingError" class="error-text" role="alert"></p><div class="actions"><button data-funding-reject="${id}" class="danger">驳回</button><button data-funding-approve="${id}" class="primary">通过当前节点</button></div>`:''}<p class="note">核验通过不等于客户已收到款项。返利批次审批后，在结算与清偿中登记发放；原销售、统计快照及流水保留。</p>`))}
function openFundingPayout(id){const b=state.funding.batches.find(b=>b.id===id),paid=sum(state.funding.payouts.filter(p=>p.batch===id).map(p=>p.amount));if($('role').value!=='finance')return toast('请切换为财务角色登记返利发放。',true);showModal('客户返利发放',`<form id="fundingPayoutForm" data-id="${id}"><p>${customer(b.customer).name} / ${id}，尚未清偿 ${money(b.amount-paid)}</p>${ff('rebatePayAmount','本次发放（元）',(b.amount-paid)/100,'number','min="0.01" step="0.01" required')}${fs('rebatePayMethod','发放方式',[['cash','现金支付'],['offset','货款抵扣']],'cash')}${ff('rebatePayRef','财务回写流水号 *','','text','required')}<p id="fundingError" class="error-text" role="alert"></p><button class="primary">确认返利清偿回写</button></form>`)}

function fundingFail(error){const node=$('fundingError');if(node)node.textContent=error.message||error;else toast(error.message||error,true)}
function readFundingTiers(prefix){const t=[0,1,2].map(i=>({min:cents($(prefix+'Min'+i).value),rate:Number($(prefix+'Rate'+i).value)}));if(!(t[0].min<t[1].min&&t[1].min<t[2].min))throw Error('阶梯门槛必须严格递增。');return t}
function requireFundingFinance(){if($('role').value!=='finance')throw Error('资金配置由财务角色保存生效，请切换为财务复核。')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;try{
 if(b.dataset.fundingTab){fundingTab=b.dataset.fundingTab;render()}if(b.hasAttribute('data-funding-pool-new'))openFundingPool();if(b.dataset.fundingPool)openFundingPool(b.dataset.fundingPool);
 if(b.dataset.fundingActivate){requireFundingFinance();const p=state.funding.pools.find(p=>p.id===b.dataset.fundingActivate);if(p.status!=='draft')throw Error('资金池已启用，不能重复注入初始来源。');p.status='active';save();render();toast('已启用，初始来源只计入一次。')}
 if(b.hasAttribute('data-funding-rule-new'))openFundingRule();if(b.dataset.fundingRule)openFundingRule(b.dataset.fundingRule);if(b.dataset.fundingBinding)openFundingBinding(b.dataset.fundingBinding);if(b.hasAttribute('data-funding-sale-new'))openFundingSale();
 if(b.dataset.fundingRetry){requireFundingFinance();retryFundingSale(b.dataset.fundingRetry);render();toast('已完成入池重试，没有重复信用流水。')}
 if(b.dataset.fundingPrepare){const batch=prepareFundingBatch(b.dataset.fundingPrepare);openFundingBatch(batch.id)}if(b.dataset.fundingBatch)openFundingBatch(b.dataset.fundingBatch);
 if(b.dataset.fundingApprove||b.dataset.fundingReject){approveFundingBatch(b.dataset.fundingApprove||b.dataset.fundingReject,!!b.dataset.fundingReject,$('fundingOpinion').value);finishDetail();toast('本节点已处理，资金池与期间记录已同步。')}
 if(b.dataset.fundingPayout)openFundingPayout(b.dataset.fundingPayout);
 }catch(error){fundingFail(error)}});
document.addEventListener('change',e=>{if(e.target.id==='fundingDate'){if(!/^\d{4}-\d{2}-\d{2}$/.test(e.target.value))return;state.funding.date=e.target.value;save();render();toast('仅切换本地模拟业务日，未自动提前入池。')}});
document.addEventListener('submit',e=>{const f=e.target;if(!['fundingPoolForm','fundingRuleForm','fundingBindingForm','fundingSaleForm','fundingPayoutForm'].includes(f.id))return;e.preventDefault();try{if(!f.reportValidity())return;const data=state.funding;
 if(f.id==='fundingPoolForm'){requireFundingFinance();const old=data.pools.find(p=>p.id===f.dataset.id);if(old?.kind==='rebate')throw Error('客户返利池由批准批次自动维护，不能手动注资或改用途。');const ratios=[0,1,2,3].map(i=>Number($('fpRatio'+i).value));if(old?.status==='active'&&ratios.some((v,i)=>v!==old.ratios[i]))throw Error('已启用池的组织比例固定，请新建资金池承接新的分配。');if(Math.abs(sum(ratios)-100)>.00001)throw Error('组织分配比例合计必须为100%。');if($('fpFrom').value>$('fpTo').value)throw Error('结束日期不能早于开始日期。');const initial=old?.status==='active'?old.initial:cents($('fpInitial').value),cap=cents($('fpCap').value);if(cap<initial)throw Error('预算上限不能低于初始来源。');if(old&&cap<fundingPoolTotals(old.id).source)throw Error('上限不能低于已形成的有效来源。');const p={...(old||{id:nextId('POOL-',data.pools),status:'draft',kind:'operating'}),name:$('fpName').value.trim(),initial,cap,ratios,from:$('fpFrom').value,to:$('fpTo').value};if(!p.name)throw Error('请填写名称。');if(old)data.pools[data.pools.indexOf(old)]=p;else data.pools.push(p);save();finishDetail();return toast('资金池配置已保存；新池需财务启用后才能获取资金。')}
 if(f.id==='fundingRuleForm'){requireFundingFinance();const old=data.rules.find(r=>r.id===f.dataset.id),pool=data.pools.find(p=>p.id===$('frPool').value),from=$('frFrom').value,to=$('frTo').value;if(from>to||from<pool.from||to>pool.to)throw Error('规则有效期应处于目标资金池期间内。');const r={id:old?.id||nextId('GET-',data.rules),version:(old?.version||0)+1,name:$('frName').value.trim(),pool:pool.id,customer:$('frCustomer').value,sku:$('frSku').value.trim(),method:$('frMethod').value,rate:Number($('frRate').value),unit:cents($('frUnit').value),timing:$('frTiming').value,tiers:readFundingTiers('fr'),from,to,status:'active'};if(!r.name||!r.sku)throw Error('规则名称及 SKU 不能为空。');if(old){data.ruleVersions=data.ruleVersions||[];data.ruleVersions.push(clone(old));data.rules[data.rules.indexOf(old)]=r}else data.rules.push(r);save();finishDetail();return toast('新版本规则已生效，原销售快照不变。')}
 if(f.id==='fundingBindingForm'){requireFundingFinance();const old=data.bindings.find(l=>l.id===f.dataset.id),policy=state.policySchemes.find(p=>p.id===$('fbPolicy').value),from=$('fbFrom').value,to=$('fbTo').value;if(!policy||policy.customer!==old.customer||from>to||from<policy.from||to>policy.to)throw Error('客户策略期间必须在所选商业政策期间内。');const l={...clone(old),version:old.version+1,policyId:policy.id,sourcePool:$('fbPool').value,rebateTiming:$('fbTiming').value,rebateMethod:$('fbMethod').value,rebateRate:Number($('fbRate').value),tierMode:$('fbTierMode').value,lockEarly:$('fbLock').value==='yes',serviceRate:Number($('fbService').value),tiers:readFundingTiers('fb'),from,to};data.bindingVersions=data.bindingVersions||[];data.bindingVersions.push(clone(old));data.bindings[data.bindings.indexOf(old)]=l;save();finishDetail();return toast('客户策略资金时点已保存，新销售使用新版本。')}
 if(f.id==='fundingSaleForm'){if($('role').value!=='sales')throw Error('请切换为销售角色提交销售完成事件。');const s=postFundingSale({kind:$('saleKind').value,customer:$('saleCustomer').value,doc:$('saleDoc').value,line:$('saleLine').value,sku:$('saleSku').value.trim(),base:cents($('saleAmount').value),qty:Number($('saleQty').value),date:$('saleDate').value,original:$('saleOriginal').value});log('销售与资金同步',s.id+' / '+s.status+'，获取规则 '+s.rule.id+' V'+s.rule.version);finishDetail();return toast(s.status==='posted'?'销售已入账，资金池及客户数据已更新。':s.status==='period'?'销售已累计，未到期间核验前不增加可用资金。':'销售已记录，超过上限的资金等待处理。')}
 if(f.id==='fundingPayoutForm'){requireFundingFinance();const b=data.batches.find(b=>b.id===f.dataset.id);if(b?.status!=='approved'||b.kind!=='rebate'||data.date<b.period.end)throw Error('该批次尚未满足返利清偿条件。');const group=fundingGroups().find(g=>g.key===b.key);if(group?.delta<0)throw Error('原销售调整后应享减少，先进入冲销或追偿核对，暂停继续发放。');const amount=cents($('rebatePayAmount').value),ref=$('rebatePayRef').value.trim(),paid=sum(data.payouts.filter(p=>p.batch===b.id).map(p=>p.amount));if(data.payouts.some(p=>p.ref===ref)||!ref)throw Error('财务流水号为空或已回写，不能重复发放。');if(amount<=0||amount>b.amount-paid||amount>fundingPoolTotals(b.targetPool).available)throw Error('超过批次应付或客户返利池可用余额。');data.payouts.push({id:nextId('REBATE-PAY-',data.payouts),batch:b.id,pool:b.targetPool,customer:b.customer,amount,ref,method:$('rebatePayMethod').value,date:data.date});log('客户返利清偿',b.id+' / '+money(amount)+'，不再次扣来源池。');closeModal();render();return toast('返利清偿已回写，客户返利池和客户台账已同步。')}
 }catch(error){fundingFail(error)}});

// 将新的销售获取流水接入原组织余额、客户台账、活动审批和清偿，保留旧期初。
let activityFundingContext=null;const beforeFundingBalances=balances,beforeFundingPools=poolsView,beforeFundingCustomerData=customerLedgerData,beforeFundingCustomerBody=customerLedgerBody,beforeFundingActivity=newActivity,beforeFundingSubmit=submitActivity,beforeFundingApprove=approve,beforeFundingApprovalView=approvalView,beforeFundingSettlement=settlementView,beforeFundingRender=render;
balances=function(){ensureFunding();return fundingOrgBalances(activityFundingContext||MAIN_POOL)};
poolTable=function(){const b=balances();return table(['承担组织','分配比例','可支配总额','已核销','未核销占用','可用 / 缺口'],poolNames.map((n,i)=>[n,state.funding.pools.find(p=>p.id===(activityFundingContext||MAIN_POOL)).ratios[i]+'%',money(b.gross[i]),money(b.used[i]),money(b.occupied[i]),money(b.available[i])+' / '+money(b.gap[i])]))};
poolsView=function(){return `<div class="actions" style="margin-bottom:16px"><button class="primary" data-funding-go="pools">配置总资金池与获取方式</button><button data-funding-go="sales">销售完成入池</button><button data-funding-go="period">期间入池与返利核验</button></div>`+beforeFundingPools()};
function customerFundingPanel(cid){const d=fundingCustomerData(cid);return`<section class="card" style="margin-top:24px"><h2>销售获取与客户策略资金同步</h2><div class="grid stats">${stat('切换后净销售',money(d.sales),'签收减关联退货')}${stat('已获取资金',money(d.earned),'只统计实际信用流水')}${stat('待期末核验返利',money(d.pending),'未增加客户返利池余额')}${stat('客户返利池可结算',money(d.rebateAvailable),'已划入减已发放',true)}</div><div class="actions"><button data-funding-client-config="${cid}">客户资金策略与时点</button><button data-funding-go="sales">销售入池流水</button><button data-funding-go="period">期间核验与返利释放</button><button data-funding-go="flows">资金及返利发放记录</button></div><p class="note">旧期初来源不重复入池；已知客户A年返权益按期初10万元及预留2000元承接，其他新增统计从 ${FUND_CUTOVER} 起算。返利入池、客户应付及付款分开记录。</p></section>`}
customerLedgerData=function(c){ensureFunding();const old=beforeFundingCustomerData(c),d=fundingCustomerData(c.id),has=state.funding.sales.some(s=>s.customer===c.id);return{...old,ready:old.ready||has,sales:(c.id==='A'?10000000:0)+d.sales,contribution:(c.id==='A'?1000000:0)+d.earned,reserve:(c.id==='A'?300000-sum(state.funding.transfers.map(t=>t.openingConsumed||0)):0)+d.service+d.instantR,confirmed:(old.confirmed||0)+d.paid,benefit:old.benefit+d.paid,available:has||c.id==='A'?fundingPoolTotals(state.funding.bindings.find(l=>l.customer===c.id).sourcePool).available:null}}
customerLedgerBody=function(id){ensureFunding();const has=state.funding.sales.some(s=>s.customer===id);if(!has&&!(id==='A'&&state.funding.sales.length))return beforeFundingCustomerBody(id)+customerFundingPanel(id);const c=customer(id),d=customerLedgerData(c);return heading('CUSTOMER LEDGER',c.name+' · 费用总台账','销售、资金获取、客户返利权益及实际清偿同步展示。')+`<section class="card"><h2>${c.name} ${tag('销售已接入','ok')}</h2><p>${c.center} / ${c.mode}，来源与客户返利专属池分别记账。</p></section><div class="grid stats">${stat('净销售含期初',money(d.sales),'期初不重复计提')}${stat('有效销售贡献',money(d.contribution),'总池信用流水，不含内部划拨')}${stat('来源池统筹可用',money(d.available),'共享余额，不可按客户重复相加')}${stat('确认受益投入',money(d.benefit),'含已发放客户返利')}</div>`+customerFundingPanel(id)+contextPanel(id)};
const originalFundingCustomerRows=ledgerCustomerRows;
ledgerCustomerRows=function(){return originalFundingCustomerRows().replace('活动可用','来源池可用（共享）')};
newActivity=function(existing){beforeFundingActivity(existing);if(!$('activityForm'))return;const selected=existing?.fundingPoolId||MAIN_POOL;const block=`<div class="field"><label for="activitySourcePool">承担来源资金池</label><select id="activitySourcePool">${state.funding.pools.filter(p=>p.kind==='operating'&&p.status==='active').map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${esc(p.name)} · 可用 ${money(fundingPoolTotals(p.id).available)}</option>`).join('')}</select><small>客户返利专属池不允许申请普通活动；待期末入池资金也不可使用。</small></div>`;$('activityForm').insertAdjacentHTML('afterbegin',block);detailPage.body=$('fullPageBody').innerHTML;detailPage.baseline=JSON.stringify(formSnapshot())};
submitActivity=function(form){const id=$('activitySourcePool')?.value||state.activities.find(a=>a.id===form.dataset.edit)?.fundingPoolId||MAIN_POOL,pool=fundingPoolTotals(id);if(!pool||pool.pool.kind!=='operating'||pool.pool.status!=='active')return $('activityError').textContent='该资金池不能用于活动。';if(pool.gap)return $('activityError').textContent='来源池已有缺口，请先补足。';const before=new Set(state.activities.map(a=>a.id));activityFundingContext=id;try{beforeFundingSubmit(form)}finally{activityFundingContext=null}const a=state.activities.find(a=>!before.has(a.id))||state.activities.find(a=>a.id===form.dataset.edit);if(a){a.fundingPoolId=id;save();if(!$('activityForm'))render()}};
approve=function(id,reject=false){const a=state.activities.find(a=>a.id===id);activityFundingContext=a.fundingPoolId||MAIN_POOL;try{return beforeFundingApprove(id,reject)}finally{activityFundingContext=null;if(!detailPage)render()}};
approvalView=function(){ensureFunding();return beforeFundingApprovalView()+`<section class="card" style="margin-top:24px"><h2>资金入池与客户返利期间核验</h2>${table(['批次 / 期间','客户','类型及金额','节点','操作'],state.funding.batches.filter(b=>b.status==='pending').map(b=>[b.id+' / '+b.period.key,customer(b.customer).name,(b.kind==='earn'?'销售获取':'客户返利')+' '+money(b.amount),roles[['business','finance'][b.step]],`<button data-funding-batch="${b.id}">进入核验</button>`]))}</section>`};

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.fundingGo){fundingTab=b.dataset.fundingGo;navigate('funding')}if(b.dataset.fundingClientConfig){const l=state.funding.bindings.find(l=>l.customer===b.dataset.fundingClientConfig);if(l)openFundingBinding(l.id)}});
