e;border-color:#ead9b4}.banner.error{background:#fff0ef;color:#9a2929;border-color:#e8b9b6}.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin:24px 0 20px;overflow:auto}.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;padding:12px 0;white-space:nowrap;background:transparent;font-weight:400}.tabs button[aria-selected=true]{color:var(--brand);border-color:var(--brand);font-weight:700}.toolbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:16px}input,select,textarea{border:1px solid #bccbd0;border-radius:7px;padding:10px 12px;min-height:42px;background:white;color:var(--ink);max-width:100%}input[type=number]{font-variant-numeric:tabular-nums}label{display:block;font-size:12px;font-weight:600;margin-bottom:6px}textarea{min-height:88px;resize:vertical;width:100%}.field{display:flex;flex-direction:column;gap:3px}.field small{font-size:11px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field input,.field select{width:100%}.wide{grid-column:1/-1}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left;white-space:nowrap;font-size:13px}th{font-size:11px;color:var(--muted);background:#f6f8fa;font-weight:600}th,td{padding:14px 12px;border-bottom:1px solid #e6ecee}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}td.wrap{white-space:normal;min-width:180px;max-width:340px}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#f9fbfb}.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin:20px 0;gap:8px}.step{padding:12px;background:#f4f7f8;border-radius:8px;font-size:12px}.step strong{display:block;color:var(--brand);margin-bottom:5px;font-size:11px}.stack{display:flex;height:32px;border-radius:7px;overflow:hidden;margin:20px 0 12px}.stack span{min-width:2px}.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px}.dot{display:inline-block;width:8px;height:8px;margin-right:6px;border-radius:2px}.keyval{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid #edf1f3}.keyval:last-child{border:0}.keyval span{color:var(--muted)}.keyval strong{text-align:right;font-weight:600}.note{font-size:12px;color:var(--muted);margin-top:12px}.empty{text-align:center;padding:40px;color:var(--muted)}.empty strong{display:block;color:var(--ink);margin-bottom:8px}.activity{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);gap:16px}.activity:last-child{border:0}.activity small{display:block}.rule-item{margin-bottom:16px}.rule-item summary{font-size:16px;font-weight:700;cursor:pointer;padding:4px 0}.rule-item li{margin:10px 0}.rule-item ul{padding-left:22px}.rule-item table{white-space:normal;margin-top:16px}.flowline{font-size:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.flowline b{background:#eff4f5;padding:5px 10px;border-radius:6px;font-weight:500}.flowline .done{background:#dff2e8;color:#126241}.flowline .current{outline:1px solid var(--brand);color:var(--brand)}.toast{position:fixed;bottom:24px;right:24px;max-width:480px;z-index:30;padding:16px 24px;background:#183b36;color:white;border-radius:10px;box-shadow:0 8px 32px #172d3530}.toast.error{background:#852e2e}.hidden{display:none!important}dialog{width:min(700px,calc(100% - 32px));border:0;border-radius:16px;padding:0;box-shadow:0 16px 80px #142d3555;max-height:90vh;color:var(--ink)}dialog::backdrop{background:#142d3570}.dialog-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:20px 24px}.dialog-head h2{margin:0}.dialog-body{padding:24px}.dialog-foot{display:flex;justify-content:flex-end;gap:8px;padding:16px 24px;border-top:1px solid var(--line)}.error-text{color:var(--red);font-size:12px;min-height:20px}.progress{height:7px;border-radius:5px;background:#e9eff1;overflow:hidden;margin:12px 0}.progress span{display:block;background:var(--brand);height:100%}a{color:var(- <script id="rulesData" type="application/json">[{"id": "R01", "title": "有效销售与计提节点", "lead": "下单测算，签收计提。", "items": ["订单确认后展示预计贡献、预计返利和预计服务费，不增加正式可用额度。以 OMS 有效签收事件作为费用管理计提节点，部分签收按已签收部分计算。", "取消订单不计提。退货和折让引用原销售记录及原规则，通过反向或调整记录处理。", "回款作为回款奖励、结算或特殊政策的条件，默认不作为所有销售贡献的计提前提。", "订单确认时锁定价格和适用政策版本，签收计算引用锁定版本。保留销售明细、事件版本和计算快照，支持复算。", "示例：订单金额 100,000 元，已签收 60,000 元，只对已签收部分正式计提，其余保持预计。这里的计提是管理台账动作，财务收入和凭证按财务口径执行。"]}, {"id": "R02", "title": "总费用包边界", "lead": "费用归属随政策版本固定，余额不足不得临时变更归属。", "table": [["项目", "默认归属", "处理方式"], ["合同价 折扣 临时特价", "成交价格", "在成交额体现，不重复扣包"], ["年返 季返 增量返 回款奖励", "包内", "按批准条件预留和确认"], ["托盘及客户专属日常服务", "包内", "按合同预留和确认"], ["陈列 试吃 地推 新品推广", "包内", "活动额度先占用后核销"], ["营销赠品 样品 物料", "包内", "按成本管理，关联促销或活动"], ["已含在产品或履约成本的支出", "原成本项目", "可展示分析，不重复扣包"], ["总部战略 公共品牌 跨中心专项", "独立专项", "单列预算来源和受益对象"]], "items": ["仓储配送按事项区分：属于正常履约成本的不再扣包，额外购买的客户专项服务可经批准纳入包内。已有合同约定优先。", "同一服务事项只确认一次。服务商执行试吃属于活动执行费，不因收款方是服务商再计托盘费。现金、抵扣及实物交付不是新增费用。", "没有订单的公共活动或固定服务费关联项目、期间、批准预算或分摊依据，不虚构订单。"]}, {"id": "R03", "title": "金额与税口径", "lead": "统一管理计费基数，支付与费用保留税额桥接。", "items": ["默认销售计费基数为实际成交的不含税销售金额，扣除有效退货和销售折让。合同约定其他基数时单独配置并保留差异。", "保存原始含税金额、不含税金额、税额、币种及计费基数。费用占用和确认使用同一管理成本口径，支付与费用之间保留税额及其他差异明细。", "后续返利单独计算，不自动反向扣减自身计费基数。经营分析若已引用扣除返利后的财务收入，不再重复扣返利。", "管理费用分类不直接决定会计分类，应付客户对价可能涉及冲减交易价格，系统应保留财务映射能力。", "最终入账金额保留两位小数，中间计算保留更高精度。分摊先按分计算，尾差补到金额最大明细；相同金额按稳定明细编号顺序处理。拆分合计必须等于原金额。"]}, {"id": "R04", "title": "阶梯价格", "lead": "首期优先支持单次订单，周期累计价格独立配置。", "items": ["普通价格优先支持客户、SKU、单次订单数量的阶梯。合同未约定组合计量时，不合并不同 SKU 数量。", "全量享价与超量部分享价必须明确二选一。周期累计价格单列累计周期、SKU 范围和补差方式。", "订单确认后锁定成交价和政策版本。后续改价走审批调整，不直接覆盖历史。", "单次阶梯退货后按有效数量重新判断，是否追补价差依合同；累计阶梯重新计算累计有效数量，历史价差通过调整单处理。", "合同未约定退货补差时，进入人工处理，不自动向客户追加应收。"]}, {"id": "R05", "title": "返利预留与动态复核", "lead": "年度预测与正式预留分开，已发生销售触发正式计算。", "items": ["预测返利根据年度预测销售测算，仅用于分析；正式预留根据实际有效销售和批准政策计算，影响费用额度。", "默认按实际累计销售已达到档位计算正式预留，全额达档与分段返利采用不同算法。", "有效销售、退货、折让或批准调整后，重算累计应预留。差额与未确认预留及累计已确认金额比较；已支付金额仍包含在累计已确认中。", "累计应预留增加则补提，减少则释放可释放预留；已确认不可退义务不能自动取消，差额进入例外处理。预留转确认不再扣额度。", "跨档补提不足时登记缺口，暂停相关新活动额度释放，不压低返利义务。未到起返门槛默认正式预留为零，并展示预测风险；批准预估政策要求提前预留时从其规定。", "返利确认和结算前校验达成条件、期间和审批材料。示例：100 万元按 1% 已预留 1 万元，累计 200 万元适用全额 2% 时，应预留 4 万元，补提 3 万元。"]}, {"id": "R06", "title": "额度释放与组织分配", "lead": "先预留，再解锁，再分池，不允许账户透支。", "items": ["有效签收形成贡献，扣除包内客户预留后，校验政策及缺口。默认剩余额度全部解锁，再按组织比例分配。", "年度目标默认用于经营评估，不自动作为解锁门槛。合同或政策明确要求目标门槛时，未达部分进入待解锁。", "政策缺失、冲突、计算异常或超包缺口，暂停相关新额度释放，不自动收回已批准占用，不取消已成立合同义务。", "试算比例建议总部 10%、中心 20%、大区 20%、省区 50%，按中心和有效期配置，合计必须为 100%。这不是已批准正式比例。", "默认进入组织统筹池并保留来源客户。合同专属额度单独限制用途。允许批准后支持其他客户，记录实际受益客户。", "跨中心、跨法人和跨专项来源不得自动调拨。缺口独立记录，补足后才能新增占用。多池承担分别授权，最终占用作为一个整体提交。"]}, {"id": "R07", "title": "政策匹配与叠加", "lead": "同类政策唯一匹配，不同类型显式配置叠加关系。", "items": ["先校验法人、业务模式、客户或集团，再校验合同项目、SKU、区域、有效期、适用及排除条件。", "同类优先级为已批准项目专项、客户专项、集团政策、中心通用政策。同优先级仍有多条匹配时报冲突，不按创建时间或金额自动选择。", "基础价和数量阶梯价形成一个最终成交价。特价与额外折扣默认不叠加，年返与增量或结构返利默认不叠加，经政策批准可开放。", "返利与真实独立服务可并存；同一服务与活动不得重复确认；同一活动可多池承担，分别授权且总额受控。", "明确批准不返利或无服务商的，可按零费用处理。政策未知或未维护不得擅自按零。新版本不覆盖历史，追溯变更需审批并生成调整记录。"]}, {"id": "R08", "title": "实物费用成本与调整", "lead": "预算使用批准成本，实际确认关联库存成本。", "items": ["申请阶段按批准的标准或预计成本占用预算，出库关联库存系统实际出库成本。接口未具备时受控导入并标记成本待核对。", "核销确认一次费用，出库和供应商付款不新增第二笔费用。预算与实际成本差额通过追加或释放处理。", "退库关联原出库，按原成本或库存系统确认的冲回成本调整。报损需审批，不作为正常使用核销。", "随单赠品与活动领用分开识别，均绑定促销或活动编号；退库、报损和取消领用保留原记录关联。"]}, {"id": "R09", "title": "审批与岗位授权", "lead": "常规事项按金额授权，特殊事项强制升级，禁止自批。", "table": [["单笔申请或项目累计金额", "试点建议审批路径"], ["不超过 10,000 元", "各承担池负责人"], ["超过 10,000 元且不超过 50,000 元", "各承担池负责人及中心负责人"], ["超过 50,000 元", "各承担池负责人 中心负责人 总部授权负责人"]], "items": ["以上金额为原型和试点建议，现行授权制度优先，所有档位必须可配置。政策发布、确认、核销、结算按事项加入业务审核和财务复核。", "多池由各池分别授权。超预算、跨中心、跨法人、追溯改政策和缺口补足，无论金额均升级。收款主体或账户变更独立财务审核。", "申请人不得审批本人申请，负责人发起时转上级。同项目追加按累计金额判断权限，防止拆单绕过审批。付款按财务支付授权执行。", "全部审批完成时正式占用额度，最终提交中校验并锁定余额。待审仅展示预计影响，不保证额度；不足时保留单据和已审记录，转待补足，不留部分占用。", "驳回保留意见和输入。核销经执行确认与财务复核后转使用，结项释放差额；付款不再次扣费用池。"]}, {"id": "R10", "title": "期初与历史迁移", "lead": "首期采用切换日期初加未结业务，不默认重算全部历史。", "items": ["分别导入活动可用、待解锁、活动占用、未确认预留、已确认待结算、已结算未清偿。未结业务保留合同、政策、单据和来源关联。", "历史明细以查询或归档保留，确需重算另行专项处理。期初由业务与财务签认，迁移批次及核对结果可追溯。", "切换前业务不得再次生成贡献。历史订单切换后退货，关联原订单及已迁移余额后调整；未完成映射先进入异常，不自动冲减新账户。", "已关账不覆盖，调整记当前开放期并保留原业务期间。上线后差错通过调整单修正，不直接改历史余额。"]}, {"id": "R11", "title": "接口对账与恢复", "lead": "核心计算事件优先自动化，外围接口允许受控导入。", "table": [["接口", "首期建议"], ["SKU 组织 客户关系 政策版本", "受控同步，保证编码和版本一致"], ["签收 退货 折让 取消", "优先自动对接，支持去重 补拉 重放"], ["库存出库和退库", "自动回写或受控导入"], ["结算 支付 抵扣 退款", "自动回写或财务复核导入"], ["回款状态", "启用回款奖励或解锁政策前具备"]], "items": ["按来源、单据行、事件类型和版本识别唯一事件，同一事件只入账一次。更正走新版本或调整事件。", "贡献、预留及分池同批整体成功或失败。导入与重试记录来源、操作人、批次和结果。未收到支付或交付结果不标记完成。", "每日核对销售完整性、计算拆分、分池、流水余额、返利跨档、核销、实物及清偿。差异生成工单，明确责任与处理期限，月结前未解释差异为零。", "严重错误暂停相关新额度释放和申请，保留业务事件，修复后幂等重放。已确认、核销、结算或支付业务通过调整单恢复。"]}]</script>
<script>
'use strict';
const rules=JSON.parse(document.getElementById('rulesData').textContent),key='tgx-expense-prototype-v1';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'¥'+(n/100).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const cents=v=>Math.round(Number(v)*100),poolNames=['总部池','休食中心池','华东大区池','浙江省区池'],roles={sales:'销售 · 周敏',pool0:'总部池负责人',pool1:'中心池负责人',pool2:'大区池负责人',pool3:'省区池负责人',center:'中心授权负责人',hq:'总部授权负责人',business:'业务核销复核',finance:'财务复核'};
const pages=[['ledger','01','客户费用总台账'],['policies','02','客户政策'],['calculator','03','销售费用试算'],['pools','04','组织费用池'],['activities','05','活动与核销'],['approval','06','审核工作台'],['settlement','07','结算与清偿'],['exceptions','08','异常与对账'],['rules','09','规则说明']];
const seed=()=>({schema:1,policy:{total:10,rebate:2,service:3,ratios:[10,20,20,50]},activities:[{id:'ACT-001',name:'秋季新品试吃',customer:'杭州示例商贸 A',recipient:'杭州示例商贸 A',amount:150000,shares:[15000,30000,30000,75000],status:'closed',actual:150000,applicant:'sales',route:['pool0','pool1','pool2','pool3'],approved:['pool0','pool1','pool2','pool3'],reviews:['business','finance'],evidence:'演示执行记录和验收材料',purpose:'新品推广',payee:'示例执行服务商 C'},{id:'ACT-002',name:'十一月门店陈列',customer:'杭州示例商贸 A',recipient:'杭州示例商贸 A',amount:50000,shares:[5000,10000,10000,25000],status:'approved',actual:0,applicant:'sales',route:['pool0','pool1','pool2','pool3'],approved:['pool0','pool1','pool2','pool3'],reviews:[],purpose:'陈列支持',payee:'示例执行服务商 C'}],servicePaid:0,payments:[],logs:[{event:'初始化',detail:'导入演示期初；总贡献 ¥10,000.00，台账已对平。',time:'演示期初'}],exceptions:[{id:'EX-001',title:'客户政策尚未维护',source:'OMS-DEMO-009 / 行 1',detail:'尚未指定有效政策，不能按零费用计提。请补齐批准政策后重放。',status:'open'},{id:'EX-002',title:'重复签收事件已拦截',source:'OMS-DEMO-001 / V1',detail:'相同来源、单据行、事件和版本已处理，本次未新增流水。',status:'blocked'}]});
let state;try{state=JSON.parse(localStorage.getItem(key));if(!state||state.schema!==1)state=seed()}catch{state=seed();$('storageWarning').textContent=' 当前浏览器不支持持久保存，关闭页面将丢失模拟操作。'}
let page='ledger',tab='overview',filter='',statusFilter='all',returnFocus=null;
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch{$('storageWarning').textContent=' 保存受限，当前操作仅在本次打开期间有效。'}}
function log(event,detail){state.logs.unshift({event,detail,time:new Date().toLocaleString('zh-CN')});save()}
let toastTimer;function toast(msg,error=false){$('toast').textContent=msg;$('toast').className='toast'+(error?' error':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),6500)}
const sum=a=>a.reduce((x,y)=>x+y,0);
function splitAmount(total,weights){const out=weights.map(w=>Math.floor(total*w/100));let rest=total-sum(out);let index=weights.indexOf(Math.max(...weights));out[index]+=rest;return out}
function balances(){const b={used:[0,0,0,0],occupied:[0,0,0,0]};for(const a of state.activities){if(a.status==='closed'){const u=splitAmount(a.actual,a.shares.map(n=>n/a.amount*100));u.forEach((x,i)=>b.used[i]+=x)}else if(['approved','review'].includes(a.status)){a.shares.forEach((x,i)=>b.occupied[i]+=x)}}b.available=poolNames.map((_,i)=>[50000,100000,100000,250000][i]-b.used[i]-b.occupied[i]);return b}
function heading(kicker,title,desc,action=''){return `<div class="heading"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${action}</div></div>`}
function stat(label,value,desc,accent=false){return `<div class="card stat ${accent?'accent':''}"><div class="label">${label}</div><div class="number">${value}</div><small>${desc}</small></div>`}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${headers.length}"><div class="empty"><strong>没有符合条件的记录</strong>可清除筛选，或发起一笔演示申请。</div></td></tr>`}</tbody></table></div>`}
const tag=(t,c='')=>`<span class="tag ${c}">${t}</span>`;
function status(a){return ({pending:tag('待审批','warn'),approved:tag('已占用','blue'),review:tag('核销待复核','warn'),closed:tag('已结项','ok'),rejected:tag('已驳回','bad'),funding:tag('待补足额度','bad')})[a.status]}
function route(a){return `<div class="flowline">${a.route.map((r,i)=>`<b class="${a.approved.includes(r)?'done':i===a.approved.length?'current':''}">${a.approved.includes(r)?'✓ ':''}${roles[r]}</b>`).join('<span>→</span>')}</div>`}
function navigate(next){page=next;filter='';statusFilter='all';render();$('workspace').focus({preventScroll:true})}
function render(){
 $('nav').innerHTML=pages.map(([id,num,label])=>`<button data-nav="${id}" ${page===id?'aria-current="page"':''}><span>${num}</span><span>${label}</span></button>`).join('');$('crumb').textContent=pages.find(x=>x[0]===page)[2];
 const views={ledger:ledgerView,policies:policyView,calculator:calcView,pools:poolsView,activities:activitiesView,approval:approvalView,settlement:settlementView,exceptions:exceptionsView,rules:rulesView};$('workspace').innerHTML=views[page]();if(page==='calculator')calculate();if(page==='activities')drawActivityRows();
}

function showModal(title,body){returnFocus=document.activeElement;$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modal').showModal();const f=$('modalBody').querySelector('input:not([readonly]),select,textarea,button');if(f)f.focus()}

function detail(id){const a=state.activities.find(a=>a.id===id);showModal('活动明细与审核',`<h2>${esc(a.name)} ${status(a)}</h2><p class="muted">${a.id} · 政策 POL-001 / V1 · 合同 HT-DEMO-2026</p>${[['来源客户',a.customer],['实际受益客户',a.recipient],['收款主体',a.payee],['申请预算',money(a.amount)],['待确认或实际核销',money(a.actual)],['用途与关系',a.purpose]].map(([x,y])=>`<div class="keyval"><span>${x}</span><strong>${esc(y)}</strong></div>`).join('')}<h3>承担明细与审核后变化</h3>${table(['费用池','申请承担','当前可用'],a.shares.map((n,i)=>n?[poolNames[i],money(n),money(balances().available[i])]:null).filter(Boolean))}<h3>预算审批路线</h3>${route(a)}${a.reason?`<div class="banner error">上次驳回：${esc(a.reason)}</div>`:''}${a.evidence?`<h3>执行与凭证说明</h3><p>${esc(a.evidence)}</p>`:''}${['pending','review','funding'].includes(a.status)?`<h3>审核意见</h3><textarea id="reviewNote" placeholder="驳回需填写原因和修改建议；通过可补充说明。"></textarea><p class="error-text" id="reviewError" role="alert"></p><div class="actions"><button class="danger" data-reject="${a.id}">驳回单据</button><button class="primary" data-approve="${a.id}">${a.status==='review'?'通过当前复核':a.status==='funding'?'重新校验额度':'通过当前审批'}</button></div><p class="note">预算审批不直接批准付款。实际清偿需关联结算记录。</p>`:'<p class="note">当前单据无待审节点。操作历史可在客户台账中查看。</p>'}`)}
function approve(id,reject=false){const a=state.activities.find(x=>x.id===id),role=$('role').value,note=$('reviewNote').value.trim(),err=$('reviewError');if(a.applicant===role)return err.textContent='不能审批本人申请。请切换为当前审批节点对应负责人。';let required=a.status==='review'?(a.reviews.includes('business')?'finance':'business'):a.route[a.approved.length];if(a.status==='funding')required=a.route.at(-1);if(role!==required)return err.textContent='当前节点需要“'+roles[required]+'”操作，请在右上角切换角色。';
 if(reject){if(!note)return err.textContent='请填写驳回原因和恢复建议。';if(a.status==='review'){a.status='approved';a.actual=0;a.reviews=[]}else a.status='rejected';a.reason=note;log('单据驳回',`${id}，${roles[role]}：${note}`);closeModal();render();return toast('已驳回并保留输入和审核意见。')}
 if(a.status==='review'){a.reviews.push(role);if(role==='finance'){a.status='closed';log('核销结项',`${id} 净核销 ${money(a.actual)}，释放 ${money(a.amount-a.actual)}。${note}`)}else log('业务复核通过',`${id} 执行证明已复核。${note}`)}else{
 if(a.status!=='funding')a.approved.push(role);if(a.approved.length===a.route.length){const b=balances();const bad=a.shares.some((n,i)=>n>b.available[i]);if(bad){a.status='funding';log('占用失败',`${id} 余额不足，待补足；未留下部分占用。`);closeModal();render();return toast('审批已完成，但余额不足，转待补足额度。',true)}a.status='approved';log('审批完成并占用',`${id} 占用 ${money(a.amount)}。${note}`)}else log('节点审批通过',`${id} ${roles[role]}。${note}`)}closeModal();render();toast(a.status==='closed'?'核销复核完成，已结项并释放余款。':a.status==='approved'?'全部审批完成，额度已占用。':'当前节点通过，请切换至下一节点角色。')}
function verify(id){const a=state.activities.find(x=>x.id===id);if($('role').value!==a.applicant)return toast('请切换为原申请人销售 · 周敏提交核销。',true);showModal('提交活动核销',`<h2>${esc(a.name)}</h2><p>已占用预算 <strong>${money(a.amount)}</strong></p><form id="verifyForm" data-id="${id}"><div class="field"><label for="vamount">实际核销金额（元）*</label><input type="number" id="vamount" value="${a.amount/100}" min="0" step="0.01" required></div><div class="field" style="margin-top:16px"><label for="vevidence">执行验收及凭证说明 *</label><textarea id="vevidence" required minlength="5" placeholder="演示：填写执行时间、门店、验收和费用凭证说明。">${esc(a.evidence||'')}</textarea><small>原型仅保存文字说明，不上传或验证真实附件。</small></div><p class="error-text" id="verifyError" role="alert"></p><button class="primary">提交业务与财务复核</button></form>`)}
function settlementView(){const rows=[{id:'SET-S01',name:'托盘服务履约结算',payee:'示例托盘服务商',amount:200000},...state.activities.filter(a=>a.status==='closed').map(a=>({id:'SET-'+a.id,name:a.name,payee:a.payee,amount:a.actual}))];const total=sum(rows.map(r=>r.amount)),paid=sum(state.payments.map(p=>p.cash+p.offset));return heading('SETTLEMENT & DISCHARGE','结算与清偿','关联有效应付，支持现金与货款抵扣组合；清偿不再扣费用池。')+`<div class="grid stats">${stat('演示有效结算',money(total),'包含服务与已结项活动')}${stat('已清偿',money(paid),'现金 + 有效货款抵扣')}${stat('尚未清偿',money(total-paid),'不重复计为新增费用',true)}${stat('清偿记录',state.payments.length,'仅为本地模拟回写')}</div><div class="banner warn">为便于走查，服务及已结项活动已预置为结算条件满足。生产系统仍须单独完成结算审批。本页登记不代表实际付款。</div><section class="card">${table(['结算单号 / 事项','收款主体','有效应付','已清偿','未清偿','操作'],rows.map(r=>{const paid=sum(state.payments.filter(p=>p.id===r.id).map(p=>p.cash+p.offset));return [`${r.id}<br><small>${esc(r.name)}</small>`,esc(r.payee),money(r.amount),money(paid),money(r.amount-paid),`<button class="small" data-pay="${r.id}" data-max="${r.amount-paid}" ${r.amount===paid?'disabled':''}>${r.amount===paid?'已清偿':'登记模拟清偿'}</button>`]}))}</section><section class="card" style="margin-top:16px"><h2>清偿回写记录</h2>${table(['关联结算','现金','货款抵扣','模拟流水号'],state.payments.map(p=>[p.id,money(p.cash),money(p.offset),esc(p.ref)]))}</section>`}
function pay(id,max){if($('role').value!=='finance')return toast('请切换为财务复核角色登记模拟清偿。',true);showModal('登记模拟清偿',`<p>关联结算 <strong>${id}</strong></p><p>本次最多清偿 <strong>${money(max)}</strong></p><form id="payForm" data-id="${id}" data-max="${max}"><div class="fields"><div class="field"><label for="cash">现金支付（元）</label><input id="cash" type="number" value="${max/100}" min="0" step="0.01" required></div><div class="field"><label for="offset">货款抵扣（元）</label><input id="offset" type="number" value="0" min="0" step="0.01" required></div><div class="field wide"><label for="payref">模拟财务流水号 *</label><input id="payref" required value="DEMO-${state.payments.length+1}" maxlength="60"></div></div><p class="error-text" id="payError" role="alert"></p><button class="primary">确认模拟回写</button></form>`)}
function exceptionsView(){return heading('RECONCILIATION & RECOVERY','异常与对账','保留业务事件和历史，通过修复重放或调整恢复。',`<button data-action="check">运行演示对账</button>`)+`<section class="card"><h2>异常事件</h2>${table(['工单','场景与来源','处理说明','状态','操作'],state.exceptions.map(e=>[e.id,`${esc(e.title)}<br><small>${esc(e.source)}</small>`,`<span class="wrap">${esc(e.detail)}</span>`,e.status==='open'?tag('待补齐','warn'):e.status==='resolved'?tag('已重放','ok'):tag('已去重拦截','ok'),e.status==='open'?`<button class="small" data-replay="${e.id}">模拟补齐并重放</button>`:'—']))}<p class="note">异常事件不写入本页演示期初余额；重放仅模拟恢复状态，实际新增计提需经过完整校验。</p></section><section class="card" style="margin-top:16px"><h2>对账检查</h2><div id="checkResult"><p class="muted">检查贡献分解、费用池非负和清偿上限。</p></div></section>`}
function rulesView(){return heading('BUSINESS RULES','规则说明','11 项规则建议与配套 Word 一致。合同及现行授权优先。',`<button data-action="reset" class="danger">重置演示数据</button>`)+`<div class="banner warn">组织比例 10 / 20 / 20 / 50 与审批档位 1 万 / 5 万为建议参数，须批准后启用。所有客户、金额、业务状态均为演示。</div>${rules.map(r=>`<details class="card rule-item"><summary>${r.id}　${esc(r.title)}</summary><p><strong>${esc(r.lead)}</strong></p>${r.table?table(r.table[0],r.table.slice(1).map(row=>row.map(esc))):''}<ul>${r.items.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></details>`).join('')}<section class="card"><h2>原型交互边界</h2><p>支持：台账页签、筛选、参数草稿、单 SKU 比例试算、单池或四级分摊申请、分节点审批、自批与越权拦截、核销复核、结项释放、模拟组合清偿、CSV 导出和本地重置。</p><p>未接入：真实客户与合同、政策发布、阶梯价格引擎、库存实物交付、预算追加与调拨、跨期迁移、真实支付和生产权限。角色切换仅用于演示。</p></section>`}
function exportCSV(){const b=balances(),rows=[['承担组织','累计入池','净核销','未核销占用','可用额度'],...poolNames.map((n,i)=>[n,[500,1000,1000,2500][i],b.used[i]/100,b.occupied[i]/100,b.available[i]/100])];const blob=new Blob(['\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='演示客户费用台账.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出演示组织费用台账。')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.nav)return navigate(b.dataset.nav);if(b.dataset.tab){tab=b.dataset.tab;render();return}if(b.hasAttribute('data-close'))return closeModal();if(b.dataset.detail)return detail(b.dataset.detail);if(b.dataset.verify)return verify(b.dataset.verify);if(b.dataset.edit)return newActivity(state.activities.find(a=>a.id===b.dataset.edit));if(b.dataset.approve)return approve(b.dataset.approve);if(b.dataset.reject)return approve(b.dataset.reject,true);if(b.dataset.pay)return pay(b.dataset.pay,Number(b.dataset.max));if(b.dataset.replay){const item=state.exceptions.find(x=>x.id===b.dataset.replay);item.status='resolved';log('模拟异常恢复',item.id+' 补齐批准政策后幂等重放；期初余额不变。');render();return toast('已模拟完成补齐和重放，未重复计提。')}
 switch(b.dataset.action){case'new':newActivity();break;case'export':exportCSV();break;case'clear':filter='';statusFilter='all';render();break;case'reset':showModal('重置演示数据','<p>将清除当前浏览器中的演示申请、审批、核销、清偿和参数草稿，并恢复演示期初。</p><button class="danger" data-action="resetConfirm">确认重置演示</button>');break;case'resetConfirm':state=seed();save();closeModal();render();toast('已恢复演示期初。');break;case'check':b.disabled=true;b.textContent='正在核对…';setTimeout(()=>{const bal=balances(),total=300000+200000+sum(bal.used)+sum(bal.occupied)+sum(bal.available),ok=total===1000000&&bal.available.every(n=>n>=0);$('checkResult').innerHTML=`<div class="banner ${ok?'':'error'}">${ok?'✓':'×'} ${ok?'贡献分解对平，费用池无负数。':'存在差异，请检查调整记录。'}</div><p>检查完成。演示清偿提交时均校验有效应付上限。</p>`;b.disabled=false;b.textContent='运行演示对账'},450);break;}
});
document.addEventListener('input',e=>{if(e.target.id==='activitySearch'){filter=e.target.value;drawActivityRows()}});
document.addEventListener('change',e=>{if(e.target.id==='activityStatus'){statusFilter=e.target.value;drawActivityRows()}if(e.target.id==='role'){render();toast('已切换为'+roles[e.target.value]+'，仅用于模拟操作。')}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(!f.reportValidity())return;if(f.id==='calcForm')return calculate();if(f.id==='activityForm')return submitActivity(f);
 if(f.id==='policyForm'){const ratios=[0,1,2,3].map(i=>Number($('ratio'+i).value));if(Math.abs(sum(ratios)-100)>0.00001)return $('policyError').textContent='四级分配比例合计必须为 100%，当前为 '+sum(ratios)+'%。';state.policy={total:Number($('pt').value),rebate:Number($('pr').value),service:Number($('ps').value),ratios};log('保存政策草稿','下一版本参数已保存，仅用于试算，不修改期初。');toast('草稿已保存，可前往销售费用试算验证。');return}
 if(f.id==='verifyForm'){const a=state.activities.find(x=>x.id===f.dataset.id);if($('role').value!==a.applicant)return $('verifyError').textContent='当前角色不是申请人，请切换角色后再提交。';const actual=cents($('vamount').value);if(actual>a.amount)return $('verifyError').textContent='实际核销超过预算，请先追加审批。当前金额和说明已保留。';a.actual=actual;a.evidence=$('vevidence').value.trim();a.reviews=[];a.status='review';log('提交核销',a.id+' 待业务和财务复核，当前占用保持不变。');closeModal();navigate('approval');return toast('已提交核销，请切换业务复核角色。')}
 if(f.id==='payForm'){if($('role').value!=='finance')return $('payError').textContent='请使用财务复核角色登记。';const cash=cents($('cash').value),offset=cents($('offset').value),ref=$('payref').value.trim();if(cash+offset<=0||cash+offset>Number(f.dataset.max))return $('payError').textContent='现金与抵扣合计须大于零，且不能超过未清偿金额。';if(state.payments.some(p=>p.ref===ref))return $('payError').textContent='该财务流水号已处理，已阻止重复回写。';if(!ref)return $('payError').textContent='请填写模拟财务流水号。';state.payments.push({id:f.dataset.id,cash,offset,ref});log('模拟清偿回写',`${f.dataset.id} 现金 ${money(cash)}，抵扣 ${money(offset)}，费用池不变。`);closeModal();render();return toast('模拟清偿已回写，未重复扣减费用池。')}
});
$('closeModal').onclick=closeModal;$('modal').addEventListener('cancel',()=>setTimeout(()=>{if(returnFocus?.isConnected)returnFocus.focus()},0));
render();save();
</script></body></html>
