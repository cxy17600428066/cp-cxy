const mergeDialog=openMerge;openMerge=function(index){state.entry='reject';if(Number.isInteger(index))state.activeRejectIndex=index;mergeDialog()}
const rejectArchive=rejectPage;rejectPage=function(){return rejectArchive().replace('批量标记已处理','导出驳回订单')}
const splitArchiveBase=splitArchiveContent;splitArchiveContent=function(){let html=splitArchiveBase(),d=state.lastShippingSplit;if(!d)return html;let sourceItems=d.products.map(p=>`${p.name} × ${p.qty}${p.unit} ${tag(p.temp,p.color)}`).join('<br>');let resultRows=d.parts.map((part,i)=>{let items=d.products.filter(p=>part.values[p.sku]>0).map(p=>`${p.name} × ${part.values[p.sku]}${p.unit}`).join('<br>');return `<tr>${i===0?`<th rowspan="${d.parts.length}">处理后订单<br>${tag('拆单结果','green')}</th>`:''}<td>子发货单 F2026082700110${21+i}</td><td>${d.mode==='temperature'?tag(part.label,d.products.find(p=>p.temp===part.label)?.color||'gray'):'自定义'}</td><td>${items}</td></tr>`}).join('');return `<article class="order-card"><div class="order-head"><span class="order-no">拆单编号：SP202608270028</span><span>入口：发货管理（未同步旺店通）</span><span>拆分方式：${tag(d.mode==='temperature'?'按温层快捷拆分':'自定义拆分',d.mode==='temperature'?'blue':'gray')}</span><span class="right-time">拆单时间：刚刚</span></div><div class="table-wrap" style="padding-top:12px"><table class="table"><tbody><tr><th style="width:130px">处理前订单<br>${tag('拆单来源','gray')}</th><td>原发货单：${d.sourceNo}<br>原订单：O202608270900112</td><td colspan="2">${sourceItems}</td></tr>${resultRows}</tbody></table></div></article>${html}`}
const traceDrawer=openTrace;openTrace=function(no,parent,wdt){traceDrawer(no,parent,wdt);if(parent.includes('拆单')&&wdt==='—'){document.getElementById('drawerBody').insertAdjacentHTML('afterbegin',`<div class="notice"><b>当前有效单据</b><span>${no} 是拆单生成的子发货单，尚未同步旺店通，可以继续拆单，也可以与收件信息一致的其他未同步发货单合单。</span></div>`)}}

// 退货与售后关联演示：售后归原订单，履约定位到实际发货单。
const afterSaleCases={
 split:{afterSaleNo:'SH202608300021',originalOrder:'O202608251429521',customer:'浙江驰骋物流有限公司',product:'无骨鸡爪-脱骨侠-250克-酸辣柠檬-45天-60%盒装（SC）',ordered:3,shipped:3,returned:1,available:2,rows:[['F202608270010886','拆单子单 1/2','1盒','1盒','0盒'],['F202608270010887','拆单子单 2/2','2盒','0盒','2盒']]},
 merge:{afterSaleNo:'SH202608300026',originalOrder:'O202608221505521',customer:'上海益祥贸易有限公司',product:'无骨鸡爪-脱骨侠-368克-酸辣柠檬-45天',ordered:3,shipped:3,returned:1,available:2,rows:[['HF2026082700021','合并发货单（来源 O202608221505521）','3罐','1罐','2罐'],['HF2026082700021','同单另一来源 O202608221504903','2罐','0罐','2罐']]},
 normal:{afterSaleNo:'SH202608300031',originalOrder:'O202608270900112',customer:'浙江驰骋物流有限公司',product:'无骨鸡爪-脱骨侠-220克-酸辣柠檬-9个月-60%',ordered:3,shipped:3,returned:0,available:3,rows:[['F202608270011020','普通发货单','3盒','0盒','3盒']]}
};
function returnCaseKey(type,parent){return (type&&type.includes('合并'))||(parent&&parent.includes('合单'))?'merge':(type&&type.includes('拆单'))||(parent&&parent.includes('拆单'))?'split':'normal'}
function openReturnImpact(no,order,type,status,mode){let key=returnCaseKey(type,type),c=afterSaleCases[key],before=(mode||((status==='未同步'||status==='已驳回')?'before':'after'))==='before';let switcher=`<div class="return-switch"><button class="btn ${before?'on':''}" onclick="openReturnImpact('${no}','${order}','${type}','${status}','before')">发货前退款 / 取消</button><button class="btn ${before?'':'on'}" onclick="openReturnImpact('${no}','${order}','${type}','${status}','after')">发货后退货</button></div>`;let body=before?`${switcher}<div class="info-bar"><b>拆合对象只取剩余履约数量。</b>退款或取消仍归原订单商品行，成功后先扣减发货单可履约数量，再允许拆单、合单或同步旺店通。</div><div class="return-summary"><div class="return-metric">原订单数量<b>6件</b></div><div class="return-metric">退款/取消占用<b style="color:#e6a23c">1件</b></div><div class="return-metric">剩余可履约<b style="color:#67c23a">5件</b></div><div class="return-metric">当前发货单<b style="font-size:14px">${no}</b></div></div><table class="table"><thead><tr><th>原订单商品行</th><th>原数量</th><th>售后占用</th><th>可参与拆合数量</th></tr></thead><tbody><tr><td>${order}<br><span class="muted">${c.product}</span></td><td>6件</td><td>${tag('退款审核中 1件','orange')}</td><td><b style="color:#67c23a">5件</b></td></tr></tbody></table><div class="notice"><b>全量取消</b><span>若所有商品剩余履约数量均为0，当前发货单直接失效，不再允许拆合或同步；历史拆合关系仍保留。</span></div>`:`${switcher}<div class="info-bar"><b>退货从原订单商品行发起。</b>系统同时记录“原订单商品行”和“实际发货单商品行”，财务及售后归原订单，退货履约沿拆/合单链定位实际发货数量。</div><div class="return-summary"><div class="return-metric">售后单号<b style="font-size:14px">${c.afterSaleNo}</b></div><div class="return-metric">累计已发<b>${c.shipped}件</b></div><div class="return-metric">累计有效退货<b style="color:#e6a23c">${c.returned}件</b></div><div class="return-metric">当前可退<b style="color:#67c23a">${c.available}件</b></div></div><div class="return-flow"><div class="flow" style="padding:4px"><div class="node">原订单商品行<br>${c.originalOrder}</div><span class="arrow">→</span><div class="node">拆/合关系<br>${key==='split'?'SP202608270021':key==='merge'?'MG202608270006':'无重组'}</div><span class="arrow">→</span><div class="node">实际发货单明细</div><span class="arrow">→</span><div class="node">退货明细<br>${c.afterSaleNo}</div></div></div><table class="table"><thead><tr><th>实际发货单</th><th>来源说明</th><th>已发数量</th><th>已退数量</th><th>可退数量</th></tr></thead><tbody>${c.rows.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td><b style="color:#67c23a">${r[4]}</b></td></tr>`).join('')}</tbody></table>${key==='merge'?`<div class="notice"><b>合单特别规则</b><span>同一合并发货单中的相同SKU也必须按原订单商品行分别计算可退数量，不能用另一原订单的数量补足。</span></div>`:''}`;showModal('退货关联与售后影响',body,`<button class="btn" onclick="closeModal()">关闭</button><button class="btn" onclick="toast('已定位原订单 ${c.originalOrder}')">查看原订单</button><button class="btn primary" onclick="closeModal();toast('已进入售后退款模块（演示）')">进入售后退款</button>`)}
function openReturnFromRejected(i){let r=rejected[i],type=i===1?'合并发货单':(i===0||r.origin?'拆单子单':'普通发货单');openReturnImpact(r.id,r.order,type,'已驳回')}

const orderCardWithAfterSaleBase=orderCard;orderCard=function(no,order,type,color,wdt,product,qty,status,parent,unused,deadline){let html=orderCardWithAfterSaleBase(no,order,type,color,wdt,product,qty,status,parent,unused,deadline),label=status==='未同步'?'售后影响':'退货关联',button=`<button class="btn link" onclick="openReturnImpact('${no}','${order}','${type}','${status}')">↩ ${label}</button>`;return html.replace('</div></div><div class="relation-strip">',`${button}</div></div><div class="relation-strip">`)}
const rejectPageWithAfterSaleBase=rejectPage;rejectPage=function(){return rejectPageWithAfterSaleBase().replace(/(<button class="btn link" onclick="openRejectDetail\((\d+)\)">查看订单<\/button>)/g,(m,button,index)=>`${button}<br><button class="btn link" onclick="openReturnFromRejected(${index})">售后影响</button>`)}

const rejectDetailWithAfterSaleBase=openRejectDetail;openRejectDetail=function(i){rejectDetailWithAfterSaleBase(i);let r=rejected[i],notice=document.querySelector('#modalBody .notice');if(notice)notice.insertAdjacentHTML('beforebegin',`<div class="return-link"><span>${tag('售后联动','orange')} 拆合前按原订单商品行复核退款/取消占用和剩余履约数量。</span><button class="btn link" onclick="openReturnFromRejected(${i})">查看售后影响 →</button></div>`)}

function decorateTransformForAfterSale(kind){let body=document.getElementById('modalBody');if(!body||body.querySelector('.after-sale-recheck'))return;let target=body.querySelector('.stepbar + .info-bar')||body.querySelector('.info-bar');if(target)target.insertAdjacentHTML('afterend',`<label class="check-row after-sale-recheck"><input type="checkbox" id="simulateAfterSaleChange"><span><b>提交时重新校验售后数量</b><br>可${kind==='split'?'拆':'合'}数量以扣除退款、取消占用后的剩余履约数量为准。勾选此项可模拟编辑期间售后数量发生变化。</span></label>`)}
const splitWithAfterSaleBase=openSplit;openSplit=function(index){splitWithAfterSaleBase(index);if(document.getElementById('suborders'))decorateTransformForAfterSale('split')}
const shippingSplitWithAfterSaleBase=openShippingSplit;openShippingSplit=function(no,type){shippingSplitWithAfterSaleBase(no,type);if(document.getElementById('suborders'))decorateTransformForAfterSale('split')}
const mergeWithAfterSaleBase=openMerge;openMerge=function(index){mergeWithAfterSaleBase(index);if(document.querySelector('#modalBody .merge-layout'))decorateTransformForAfterSale('merge')}
const shippingMergeWithAfterSaleBase=openShippingMerge;openShippingMerge=function(no,type){shippingMergeWithAfterSaleBase(no,type);if(document.querySelector('#modalBody .merge-layout'))decorateTransformForAfterSale('merge')}
const validateSplitWithAfterSaleBase=validateSplit;validateSplit=function(){if(document.getElementById('simulateAfterSaleChange')?.checked){let err=document.getElementById('splitError');err.style.display='block';err.textContent='原订单售后数量已变化：退款/取消占用由0件变为1件，请刷新后按剩余履约数量重新拆分';return}validateSplitWithAfterSaleBase()}
const validateMergeWithAfterSaleBase=validateMerge;validateMerge=function(){if(document.getElementById('simulateAfterSaleChange')?.checked){let err=document.getElementById('mergeError');err.style.display='block';err.textContent='其中一张来源单的售后占用数量已变化，本次合单已终止，请刷新候选订单';return}validateMergeWithAfterSaleBase()}

const transformRulesWithAfterSaleBase=openTransformRules;openTransformRules=function(){transformRulesWithAfterSaleBase();let tbody=document.querySelector('#modalBody .table tbody');if(tbody)tbody.insertAdjacentHTML('beforeend','<tr><td>退款、取消或退货占用变化</td><td>重新计算剩余履约数量</td><td>拆合提交时二次校验</td><td>数量变化则终止并刷新方案</td></tr>')}
const splitArchiveWithAfterSaleBase=splitArchiveContent;splitArchiveContent=function(){let html=splitArchiveWithAfterSaleBase();return html.replace('</div></article>',`</div><div class="return-link"><span>${tag('退货可追溯','green')} 退货仍归原订单商品行，可定位到全部拆单子发货单。</span><button class="btn link" onclick="openReturnImpact('F202608270010886','O202608251429521','拆单子单','已接收','after')">查看退货关联 →</button></div></article>`)}
const mergeArchiveWithAfterSaleBase=mergeArchiveContent;mergeArchiveContent=function(){let html=mergeArchiveWithAfterSaleBase();return html.replace('</div></article>',`</div><div class="return-link"><span>${tag('退货按来源','green')} 合并后相同SKU仍按各原订单商品行分别计算可退数量。</span><button class="btn link" onclick="openReturnImpact('HF2026082700021','O202608221505521','合并发货单','已接收','after')">查看退货关联 →</button></div></article>`)}
const traceWithAfterSaleBase=openTrace;openTrace=function(no,parent,wdt){traceWithAfterSaleBase(no,parent,wdt);let key=returnCaseKey('',parent),c=afterSaleCases[key];document.getElementById('drawerBody').insertAdjacentHTML('beforeend',`<h3 style="font-size:15px">售后与退货归属</h3><div class="return-link"><span>原订单商品行 ${c.originalOrder} → 实际发货单 ${no} → 退货明细 ${c.afterSaleNo}</span><button class="btn link" onclick="closeDrawer();openReturnImpact('${no}','${c.originalOrder}','${key==='merge'?'合并发货单':key==='split'?'拆单子单':'普通发货单'}','${wdt==='—'?'未同步':'已接收'}','after')">查看详情 →</button></div>`)}
const guideWithAfterSaleBase=showGuide;showGuide=function(){guideWithAfterSaleBase();let list=document.querySelector('#modalBody ol');if(list)list.insertAdjacentHTML('beforeend','<li>点击发货单或驳回订单的“售后影响 / 退货关联”，切换查看发货前退款取消与发货后退货；拆合弹窗可勾选模拟售后数量变化，验证提交拦截。</li>')}
render();
</script>
</body>
</html>
