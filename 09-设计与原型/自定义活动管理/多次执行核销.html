<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>活动执行与核销记录</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#263445;font:14px/1.7 'Microsoft YaHei',sans-serif}main{padding:24px;max-width:1600px;margin:auto}h1{font-size:22px}h2{font-size:16px;margin:0}section{background:white;border:1px solid #dce3ec;border-radius:6px;padding:24px;margin:16px 0}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:16px}.stats div{background:#edf5ff;padding:16px;border-radius:4px}.stats b{display:block;font-size:22px;font-weight:500}small,.muted{color:#586779}button,input,select,textarea{font:inherit;border:1px solid #cbd5e1;border-radius:4px;padding:8px 12px;background:white;color:inherit}button{cursor:pointer}button.primary{background:#176bc5;color:white;border-color:#176bc5}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #176bc5;outline-offset:2px}input,textarea,select{max-width:100%;width:100%}textarea{min-height:88px}label{display:block;margin:12px 0}table{width:100%;border-collapse:collapse;min-width:680px}th,td{text-align:left;padding:12px;border-bottom:1px solid #dce3ec}th{background:#f4f6f9;font-weight:500;color:#586779}td input{min-width:100px}.scroll{overflow:auto}#editor[hidden]{display:none}.error{color:#b42318}#feedback{padding:12px 0}details{margin-top:16px}summary{cursor:pointer;color:#176bc5}#snapshot section{padding:16px}#snapshot input:disabled,#snapshot textarea:disabled,#snapshot select:disabled{opacity:1;color:#586779}#actions{display:flex;gap:8px;flex-wrap:wrap}#editor .stats{grid-template-columns:repeat(3,1fr)}@media(max-width:800px){main{padding:12px}section{padding:16px}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:440px){.stats,#editor .stats{grid-template-columns:1fr}}
body.execution-with-sidebar{display:grid;grid-template-columns:248px minmax(0,1fr);align-items:start;gap:20px;padding:16px}body.execution-with-sidebar>main{padding:0;width:100%;min-width:0;max-width:none}#execution-application-sidebar{background:#fff;border:1px solid #dce3ec;box-shadow:0 2px 8px #0000000a;padding:20px;min-height:calc(100vh - 32px);font-size:13px;overflow-wrap:anywhere}#execution-application-sidebar h2{font-size:15px;margin-bottom:20px}#execution-application-sidebar dl{margin:0}#execution-application-sidebar dt{color:#263445;margin-top:20px}#execution-application-sidebar dd{margin:4px 0 0;color:#586779}#execution-application-sidebar .money{color:#176bc5;font-weight:600}@media(max-width:800px){body.execution-with-sidebar{grid-template-columns:1fr;padding:12px}#execution-application-sidebar{min-height:0}#execution-application-sidebar dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}#execution-application-sidebar dl div{min-width:0}#execution-application-sidebar dt{margin:0}}body.execution-with-sidebar #execution-application-sidebar dl{display:block}body.execution-with-sidebar #execution-application-sidebar dl>div{display:block;margin:0 0 22px}body.execution-with-sidebar #execution-application-sidebar dt,body.execution-with-sidebar #execution-application-sidebar dd{display:inline;margin:0;line-height:1.9}body.execution-with-sidebar #execution-application-sidebar dt{margin-right:12px}body.execution-with-sidebar #execution-application-sidebar dd{overflow-wrap:anywhere}body.execution-with-sidebar #execution-application-sidebar{position:sticky;top:16px}#activity-info-panel{padding:0}#activity-info-panel details{margin:0}#activity-info-panel summary{display:list-item;padding:20px;border-bottom:1px solid #dce3ec;font-weight:600;color:#263445}#activity-info-panel #snapshot{padding:16px}#activity-info-panel #snapshot>div{border:0!important}body.execution-with-sidebar main>.row h1{font-size:18px}#activity-info-panel input:disabled,#activity-info-panel select:disabled,#activity-info-panel textarea:disabled{background:#f4f6f9;opacity:1;color:#586779}@media(max-width:800px){body.execution-with-sidebar #execution-application-sidebar{position:static}body.execution-with-sidebar #execution-application-sidebar dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}body.execution-with-sidebar #execution-application-sidebar dl>div{margin:0}}
#execution-choice[hidden]{display:none!important}#execution-modal{width:min(1120px,calc(100vw - 48px));max-height:calc(100vh - 48px);padding:0;border:1px solid #dce3ec;border-radius:8px;color:#263445;box-shadow:0 16px 64px #0003}#execution-modal::backdrop{background:#14253d66}#execution-modal #editor{border:0;margin:0;padding:24px}#execution-modal #editor>.row{position:sticky;top:-1px;background:white;z-index:2;padding:8px 0 16px;border-bottom:1px solid #dce3ec}#execution-modal #actions{position:sticky;bottom:-1px;background:white;padding:16px 0 8px;border-top:1px solid #dce3ec}#execution-modal #feedback{padding:0 24px 20px}@media(max-width:600px){#execution-modal{width:calc(100vw - 16px);max-height:calc(100dvh - 16px)}#execution-modal #editor{padding:16px}}
</style><body><main><div class="row"><h1 id="title">活动执行记录</h1><button id="freeze" class="primary">确认申请快照（演示已审批）</button></div><small>一张申请可新增多张执行单；每张执行单仅核销一次，多张执行单可合并核销。执行提交后需人工审核，通过后方可核销；待审核占用预算，退回释放额度。</small><section><div class="row"><h2 id="application-label">尚未关联申请</h2><span id="application-status">请先确认申请快照</span></div><div class="stats" id="stats"></div><details><summary>查看已审批申请表单（只读）</summary><div id="snapshot"></div></details></section><section><div class="row"><h2 id="list-title">执行记录</h2><button id="new" class="primary">＋ 新增执行</button></div><div class="scroll"><table><thead id="head"></thead><tbody id="records"></tbody></table></div></section><section id="editor" hidden><div class="row"><h2 id="editor-title"></h2><button id="close" type="button">关闭</button></div><form id="form"><div id="execution-period" class="row" style="justify-content:flex-start"><label>执行数据所属期间 · 开始日期 *<input id="period-start" type="date" required></label><label>结束日期 *<input id="period-end" type="date" required></label><small>填写本次实际费用对应的执行期间。</small></div><label id="execution-choice">关联执行单<select id="execution-select"></select></label><div class="scroll"><table><thead id="detail-head"></thead><tbody id="details"></tbody></table></div><div class="stats" id="detail-stats"></div><label>补充附件（选填）<input id="files" type="file" multiple></label><ul id="file-list"></ul><small>本地演示保存文件名；刷新后文件内容需重新选择。</small><label id="note-label">备注（选填）<textarea id="note"></textarea></label><div id="actions"><button type="button" id="draft">保存草稿</button><button type="submit" id="submit" class="primary">提交</button></div></form></section><div id="feedback" role="status" aria-live="polite"></div></main><script>
(()=>{const q=s=>document.querySelector(s),key='activity-multi-records-v1',mode=document.body.dataset.mode||'execution',isWriteoff=mode==='writeoff',money=n=>Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}),round=n=>Math.round((n+Number.EPSILON)*100)/100;let db,editing=null,lines=[],readonly=false;function load(){try{db=JSON.parse(localStorage.getItem(key))}catch{}if(!db)db={application:null,executions:[],writeoffs:[]};}function save(){localStorage.setItem(key,JSON.stringify(db))}function say(text,error=false){q('#feedback').textContent=text;q('#feedback').className=error?'error':''}function cell(row,text){const td=document.createElement('td');td.textContent=text;row.append(td);return td}function button(text,fn){const b=document.createElement('button');b.type='button';b.textContent=text;b.onclick=fn;return b}const sum=arr=>round(arr.reduce((a,b)=>a+Number(b||0),0));function execUsed(index){return sum(db.executions.filter(r=>['待审核','审核通过','已提交'].includes(r.status)).map(r=>r.lines[index]))}function written(execId,index){return sum(db.writeoffs.filter(r=>r.status==='已提交'&&(r.execution===execId||r.executionIds?.includes(execId))).map(r=>r.executionIds?db.executions.find(e=>e.id===execId)?.lines[index]||0:r.lines[index].base))}function finalSum(r){return sum(r.lines.map(l=>round(l.base+l.adjust)))}function actualTotal(r){return sum(r.lines)}function shareTotal(values){return sum(values.map(v=>round(v*db.application.share/100)))}
function renderSidebar(){if(isWriteoff)return;document.body.classList.add('execution-with-sidebar');let panel=document.getElementById('execution-application-sidebar');if(!panel){panel=document.createElement('aside');panel.id='execution-application-sidebar';panel.setAttribute('aria-label','关联活动申请摘要');document.body.prepend(panel)}panel.replaceChildren();const heading=document.createElement('h2');heading.textContent='关联申请信息';panel.append(heading);const app=db.application;if(!app){const p=document.createElement('p');p.textContent='确认申请快照后，展示对应申请信息。';panel.append(p);return}const temp=document.createElement('div');temp.innerHTML=app.html;const entries=[['单据编号',app.id]];temp.querySelectorAll('.basic-field').forEach(field=>{const label=field.querySelector('span')?.textContent.replaceAll('*','').replace(/[：:]$/,'').trim();const controls=Array.from(field.querySelectorAll('input,select,textarea'));const value=controls.length?controls.filter(el=>!['radio','checkbox'].includes(el.type)||el.checked).map(el=>el.value).join(' 至 '):(field.querySelector('b')?.textContent||field.lastElementChild?.textContent||'').trim();if(label&&!label.includes('预算费用')&&!label.includes('预计我司承担'))entries.push([label,value])});const budget=sum(app.items.map(i=>i.budget));entries.push(['预算费用合计（元）',money(budget)],['我司承担费用（元）',money(round(budget*app.share/100))],['支付方式',app.pay]);const dl=document.createElement('dl');entries.forEach(([label,value])=>{const wrap=document.createElement('div'),dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label+'：';dd.textContent=value||'—';if(label.includes('费用'))dd.className='money';wrap.append(dt,dd);dl.append(wrap)});panel.append(dl)}
function render(){const app=db.application;renderSidebar();q('#freeze').hidden=!!app;q('#new').disabled=!app;q('#application-label').textContent=app?app.id+' · '+app.dealer:'尚未关联申请';q('#application-status').textContent=app?'申请快照已锁定 · 多次执行 / 多次核销':'请在活动申请填写后确认快照';q('#snapshot').innerHTML=app?.html||'';const budget=sum(app?.items.map(i=>i.budget)||[]),used=sum(db.executions.filter(r=>['待审核','审核通过','已提交'].includes(r.status)).map(actualTotal)),final=sum(db.writeoffs.filter(r=>r.status==='已提交').map(finalSum));q('#stats').replaceChildren();[['申请总预算',budget],['累计已提交执行',used],['累计最终核销',final],['剩余可执行预算',round(budget-used)]].forEach(([label,value])=>{const div=document.createElement('div');div.textContent=label+'（元）';const b=document.createElement('b');b.textContent=money(value);div.append(b);q('#stats').append(div)});q('#head').innerHTML=isWriteoff?'<tr><th>核销单号</th><th>关联执行单</th><th>本次处理金额</th><th>调整金额</th><th>最终核销金额</th><th>状态</th><th>操作</th></tr>':'<tr><th>执行单号</th><th>实际费用</th><th>已处理核销原额</th><th>剩余可核销原额</th><th>状态</th><th>操作</th></tr>';const records=isWriteoff?db.writeoffs:db.executions;q('#records').replaceChildren();records.forEach(r=>{const tr=document.createElement('tr');cell(tr,r.id);if(isWriteoff){cell(tr,(r.executionIds||[r.execution]).join('、'));cell(tr,money(sum(r.lines.map(l=>l.base))));cell(tr,money(sum(r.lines.map(l=>l.adjust))));cell(tr,money(finalSum(r)))}else{const processed=sum(r.lines.map((v,i)=>written(r.id,i)));cell(tr,money(actualTotal(r)));cell(tr,money(processed));cell(tr,money(actualTotal(r)-processed))}cell(tr,r.status);cell(tr,'').append(button(r.status==='草稿'?'编辑草稿':'查看',()=>open(r)));q('#records').append(tr)});if(!isWriteoff){q('#head').innerHTML='<tr><th>执行单号</th><th>执行数据所属期间</th><th>执行数据 / 实际费用（元）</th><th>合计（元）</th><th>提交时间</th><th>核销状态</th><th>审核状态</th><th>操作</th></tr>';q('#records').replaceChildren();db.executions.forEach(r=>{const tr=document.createElement('tr');cell(tr,r.id);cell(tr,r.periodStart&&r.periodEnd?r.periodStart+' 至 '+r.periodEnd:'未记录（历史数据）');const detail=cell(tr,'');db.application.items.forEach((item,i)=>{const div=document.createElement('div');div.textContent=item.name+'：'+(r.lines[i]===''?'未填':money(r.lines[i]));detail.append(div)});cell(tr,money(actualTotal(r)));cell(tr,r.submittedAt||'—');const related=db.writeoffs.filter(w=>(w.executionIds||[w.execution]).includes(r.id));cell(tr,related.some(w=>w.status==='已提交')?'已核销':related.length?'核销草稿占用':'未核销');const status=r.status==='已提交'?'审核通过':r.status;const statusCell=cell(tr,status);if(r.reviewNote){const note=document.createElement('div');note.textContent=r.reviewNote;statusCell.append(note)}const ops=cell(tr,'');ops.append(button(['草稿','已退回'].includes(status)?'编辑':'查看',()=>open(r)));if(status==='待审核'){ops.append(button('审核',()=>reviewExecution(r.id)))}q('#records').append(tr)})}if(!records.length){const tr=document.createElement('tr');const td=cell(tr,'暂无记录，点击“新增”开始填报。');td.colSpan=7;q('#records').append(tr)}}
q('#freeze').onclick=()=>{try{const root=parent.document.getElementById('application').contentDocument.getElementById('custom-activity'),items=Array.from(root.querySelectorAll('#cost-rows tr')).map((row,i)=>({id:'item'+i,name:row.querySelector('input').value,budget:Number(row.querySelector('[data-amount]').textContent.replaceAll(',',''))}));if(!items.length||items.some(i=>!i.name||!Number.isFinite(i.budget)||i.budget<0))throw Error('请先补全申请费用明细');const share=Number(root.querySelector('#company-percent').value);if(share<0||share>100)throw Error('承担比例需在0—100%之间');const wrapper=document.createElement('div');wrapper.id='custom-activity';wrapper.append(root.querySelector('style').cloneNode(true));root.querySelectorAll('form>section').forEach(section=>{const clone=section.cloneNode(true);const originals=section.querySelectorAll('input,select,textarea');clone.querySelectorAll('input,select,textarea').forEach((el,i)=>{if(el.type!=='file')el.value=originals[i].value;el.checked=originals[i].checked;if(el.tagName==='INPUT'){el.setAttribute('value',el.value);if(el.checked)el.setAttribute('checked','');else el.removeAttribute('checked')}if(el.tagName==='TEXTAREA')el.textContent=el.value;if(el.tagName==='SELECT')Array.from(el.options).forEach(o=>o.toggleAttribute('selected',o.value===el.value));el.disabled=true});clone.querySelectorAll('button,input[type=file]').forEach(el=>el.remove());wrapper.append(clone)});db.application={id:'HD-DEMO-001',dealer:root.querySelector('.basic-grid input').value,items,share,pay:root.querySelector('#payment').value,html:wrapper.outerHTML};save();render();say('已锁定申请快照。后续执行和核销沿用本快照，修改申请页不会覆盖历史数据。')}catch(e){say(e.message,true)}};
function reviewExecution(id){const dialog=document.createElement('dialog');dialog.style.cssText='width:min(520px,90vw);padding:24px;border:1px solid #dce3ec;border-radius:8px';const title=document.createElement('h2');title.textContent='审核执行 '+id;const tip=document.createElement('p');tip.textContent='原型审核演示；正式系统应按审核人权限控制。';const note=document.createElement('textarea');note.setAttribute('aria-label','审核意见');note.placeholder='审核意见（退回时必填）';const feedback=document.createElement('p');feedback.setAttribute('role','alert');function decide(pass){if(!pass&&!note.value.trim()){feedback.textContent='请填写退回原因。';return}load();const record=db.executions.find(r=>r.id===id);if(record?.status!=='待审核'){feedback.textContent='单据状态已变化，请关闭并刷新。';return}record.status=pass?'审核通过':'已退回';record.reviewNote=note.value.trim();save();dialog.close();dialog.remove();render();say(pass?'审核通过，该执行单可核销。':'已退回，申请人可编辑后重新提交。')}dialog.append(title,tip,note,feedback,button('审核通过',()=>decide(true)),button('退回',()=>decide(false)),button('取消',()=>{dialog.close();dialog.remove()}));document.body.append(dialog);dialog.showModal()}
function selectedExec(){return db.executions.find(r=>r.id===q('#execution-select').value)}function drawLines(){q('#details').replaceChildren();q('#detail-head').innerHTML=isWriteoff?'<tr><th>费用项</th><th>执行原额</th><th>已处理原额</th><th>本次核销原额</th><th>调整费用</th><th>最终核销费用</th></tr>':'<tr><th>费用项</th><th>申请预算</th><th>剩余可执行</th><th>本次实际费用</th></tr>';db.application.items.forEach((item,i)=>{const tr=document.createElement('tr');cell(tr,item.name);const exec=selectedExec();cell(tr,money(isWriteoff?exec?.lines[i]||0:item.budget));cell(tr,money(isWriteoff?written(exec?.id,i):item.budget-execUsed(i)));const fields=isWriteoff?['base','adjust']:['amount'];fields.forEach(field=>{const input=document.createElement('input');input.type='number';input.step='0.01';if(field!=='adjust')input.min='0';input.required=true;input.disabled=readonly;input.setAttribute('aria-label',item.name+' '+({base:'本次核销原额',adjust:'调整费用',amount:'本次实际费用'}[field]));input.value=isWriteoff?lines[i][field]:lines[i];input.oninput=()=>{if(isWriteoff)lines[i][field]=input.value;else lines[i]=input.value;update()};cell(tr,'').append(input)});if(isWriteoff)cell(tr,'').dataset.final=i;q('#details').append(tr)});update()}
function update(){if(isWriteoff)q('#details').querySelectorAll('[data-final]').forEach(el=>{const l=lines[Number(el.dataset.final)];el.textContent=money(Number(l.base)+Number(l.adjust))});const total=isWriteoff?sum(lines.map(l=>Number(l.base)+Number(l.adjust))):sum(lines);q('#detail-stats').textContent='本次'+(isWriteoff?'最终核销':'实际费用')+'合计：'+money(total)+' 元　我司承担：'+money(shareTotal(isWriteoff?lines.map(l=>round(Number(l.base)+Number(l.adjust))):lines.map(Number)))+' 元'}
function open(record=null){editing=record?.id||null;readonly=['待审核','审核通过','已提交'].includes(record?.status);q('#execution-period').hidden=isWriteoff;q('#period-start').required=!isWriteoff;q('#period-end').required=!isWriteoff;q('#period-start').value=record?.periodStart||'';q('#period-end').value=record?.periodEnd||'';q('#period-start').disabled=readonly;q('#period-end').disabled=readonly;q('#editor').hidden=false;q('#editor-title').textContent=record?record.id:(isWriteoff?'新增核销':'新增执行');q('#execution-choice').hidden=!isWriteoff;const select=q('#execution-select');select.replaceChildren();db.executions.filter(e=>['审核通过','已提交'].includes(e.status)).forEach(e=>{const o=document.createElement('option');o.value=e.id;o.textContent=e.id;select.append(o)});if(isWriteoff&&record)select.value=record.execution;select.disabled=readonly||!!record;lines=record?JSON.parse(JSON.stringify(record.lines)):db.application.items.map(()=>isWriteoff?{base:'',adjust:'0'}:'');q('#note').value=record?.note||'';q('#note').disabled=readonly;q('#files').value='';q('#files').disabled=readonly;q('#file-list').replaceChildren();(record?.files||[]).forEach(f=>{const li=document.createElement('li');li.textContent=f;q('#file-list').append(li)});q('#actions').hidden=readonly;drawLines();q('#editor').scrollIntoView({behavior:'instant'})}q('#execution-select').onchange=()=>{lines=db.application.items.map(()=>({base:'',adjust:'0'}));drawLines()};q('#new').onclick=()=>{load();if(!db.application)return;if(isWriteoff&&!db.executions.some(e=>['审核通过','已提交'].includes(e.status)))return say('请先提交一张执行单。',true);open()};q('#close').onclick=()=>q('#editor').hidden=true;

function openBatch(record=null){load();active=record?.id||null;view=record?.status==='已提交';selectedIds=record?(record.executionIds||[record.execution]):[];adjust=db.application.items.map((_,i)=>record?String(record.lines[i].adjust):'0');q('#editor').hidden=false;q('#editor-title').textContent=record?record.id:'新增核销（合并执行）';choice.hidden=false;options.replaceChildren();db.executions.filter(e=>['审核通过','已提交'].includes(e.status)).forEach(e=>{const label=document.createElement('label'),checkbox=document.createElement('input');label.style.display='flex';label.style.gap='8px';label.style.alignItems='center';checkbox.type='checkbox';checkbox.style.width='auto';checkbox.value=e.id;checkbox.checked=selectedIds.includes(e.id);checkbox.disabled=view||occupied(e.id);checkbox.onchange=()=>{selectedIds=Array.from(options.querySelectorAll('input:checked')).map(el=>el.value);batchDraw()};label.append(checkbox,document.createTextNode(e.id+' · '+money(actualTotal(e))+' 元'+(occupied(e.id)?'（已核销或草稿占用）':'')));options.append(label)});q('#note').value=record?.note||'';q('#note').disabled=view;q('#files').value='';q('#files').disabled=view;q('#file-list').replaceChildren();(record?.files||[]).forEach(f=>{const li=document.createElement('li');li.textContent=f;q('#file-list').append(li)});q('#actions').hidden=view;batchDraw();}
