<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>活动执行与核销记录</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#263445;font:14px/1.7 'Microsoft YaHei',sans-serif}main{padding:24px;max-width:1600px;margin:auto}h1{font-size:22px}h2{font-size:16px;margin:0}section{background:white;border:1px solid #dce3ec;border-radius:6px;padding:24px;margin:16px 0}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:16px}.stats div{background:#edf5ff;padding:16px;border-radius:4px}.stats b{display:block;font-size:22px;font-weight:500}small,.muted{color:#586779}button,input,select,textarea{font:inherit;border:1px solid #cbd5e1;border-radius:4px;padding:8px 12px;background:white;color:inherit}button{cursor:pointer}button.primary{background:#176bc5;color:white;border-color:#176bc5}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #176bc5;outline-offset:2px}input,textarea,select{max-width:100%;width:100%}textarea{min-height:88px}label{display:block;margin:12px 0}table{width:100%;border-collapse:collapse;min-width:680px}th,td{text-align:left;padding:12px;border-bottom:1px solid #dce3ec}th{background:#f4f6f9;font-weight:500;color:#586779}td input{min-width:100px}.scroll{overflow:auto}#editor[hidden]{display:none}.error{color:#b42318}#feedback{padding:12px 0}details{margin-top:16px}summary{cursor:pointer;color:#176bc5}#snapshot section{padding:16px}#snapshot input:disabled,#snapshot textarea:disabled,#snapshot select:disabled{opacity:1;color:#586779}#actions{display:flex;gap:8px;flex-wrap:wrap}#editor .stats{grid-template-columns:repeat(3,1fr)}@media(max-width:800px){main{padding:12px}section{padding:16px}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:440px){.stats,#editor .stats{grid-template-columns:1fr}}
</style><body><main><div class="row"><h1 id="title">活动执行记录</h1><button id="freeze" class="primary">确认申请快照（演示已审批）</button></div><small>一张申请可新增多张执行单；每张执行单可分次核销。提交模拟审核通过，草稿不占额度，已提交记录不可修改。</small><section><div class="row"><h2 id="application-label">尚未关联申请</h2><span id="application-status">请先确认申请快照</span></div><div class="stats" id="stats"></div><details><summary>查看已审批申请表单（只读）</summary><div id="snapshot"></div></details></section><section><div class="row"><h2 id="list-title">执行记录</h2><button id="new" class="primary">＋ 新增执行</button></div><div class="scroll"><table><thead id="head"></thead><tbody id="records"></tbody></table></div></section><section id="editor" hidden><div class="row"><h2 id="editor-title"></h2><button id="close" type="button">关闭</button></div><form id="form"><label id="execution-choice">关联执行单<select id="execution-select"></select></label><div class="scroll"><table><thead id="detail-head"></thead><tbody id="details"></tbody></table></div><div class="stats" id="detail-stats"></div><label>补充附件（选填）<input id="files" type="file" multiple></label><ul id="file-list"></ul><small>本地演示保存文件名；刷新后文件内容需重新选择。</small><label id="note-label">备注（选填）<textarea id="note"></textarea></label><div id="actions"><button type="button" id="draft">保存草稿</button><button type="submit" id="submit" class="primary">提交</button></div></form></section><div id="feedback" role="status" aria-live="polite"></div></main><script>
(()=>{const q=s=>document.querySelector(s),key='activity-multi-records-v1',mode=document.body.dataset.mode||'execution',isWriteoff=mode==='writeoff',money=n=>Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}),round=n=>Math.round((n+Number.EPSILON)*100)/100;let db,editing=null,lines=[],readonly=false;function load(){try{db=JSON.parse(localStorage.getItem(key))}catch{}if(!db)db={application:null,executions:[],writeoffs:[]};}function save(){localStorage.setItem(key,JSON.stringify(db))}function say(text,error=false){q('#feedback').textContent=text;q('#feedback').className=error?'error':''}function cell(row,text){const td=document.createElement('td');td.textContent=text;row.append(td);return td}function button(text,fn){const b=document.createElement('button');b.type='button';b.textContent=text;b.onclick=fn;return b}const sum=arr=>round(arr.reduce((a,b)=>a+Number(b||0),0));function execUsed(index){return sum(db.executions.filter(r=>r.status==='已提交').map(r=>r.lines[index]))}function written(execId,index){return sum(db.writeoffs.filter(r=>r.status==='已提交'&&r.execution===execId).map(r=>r.lines[index].base))}function finalSum(r){return sum(r.lines.map(l=>round(l.base+l.adjust)))}function actualTotal(r){return sum(r.lines)}function shareTotal(values){return sum(values.map(v=>round(v*db.application.share/100)))}
function render(){const app=db.application;q('#freeze').hidden=!!app;q('#new').disabled=!app;q('#application-label').textContent=app?app.id+' · '+app.dealer:'尚未关联申请';q('#application-status').textContent=app?'申请快照已锁定 · 多次执行 / 多次核销':'请在活动申请填写后确认快照';q('#snapshot').innerHTML=app?.html||'';const budget=sum(app?.items.map(i=>i.budget)||[]),used=sum(db.executions.filter(r=>r.status==='已提交').map(actualTotal)),final=sum(db.writeoffs.filter(r=>r.status==='已提交').map(finalSum));q('#stats').replaceChildren();[['申请总预算',budget],['累计已提交执行',used],['累计最终核销',final],['剩余可执行预算',round(budget-used)]].forEach(([label,value])=>{const div=document.createElement('div');div.textContent=label+'（元）';const b=document.createElement('b');b.textContent=money(value);div.append(b);q('#stats').append(div)});q('#head').innerHTML=isWriteoff?'<tr><th>核销单号</th><th>关联执行单</th><th>本次处理金额</th><th>调整金额</th><th>最终核销金额</th><th>状态</th><th>操作</th></tr>':'<tr><th>执行单号</th><th>实际费用</th><th>已处理核销原额</th><th>剩余可核销原额</th><th>状态</th><th>操作</th></tr>';const records=isWriteoff?db.writeoffs:db.executions;q('#records').replaceChildren();records.forEach(r=>{const tr=document.createElement('tr');cell(tr,r.id);if(isWriteoff){cell(tr,r.execution);cell(tr,money(sum(r.lines.map(l=>l.base))));cell(tr,money(sum(r.lines.map(l=>l.adjust))));cell(tr,money(finalSum(r)))}else{const processed=sum(r.lines.map((v,i)=>written(r.id,i)));cell(tr,money(actualTotal(r)));cell(tr,money(processed));cell(tr,money(actualTotal(r)-processed))}cell(tr,r.status);cell(tr,'').append(button(r.status==='草稿'?'编辑草稿':'查看',()=>open(r)));q('#records').append(tr)});if(!records.length){const tr=document.createElement('tr');const td=cell(tr,'暂无记录，点击“新增”开始填报。');td.colSpan=7;q('#records').append(tr)}}
q('#freeze').onclick=()=>{try{const root=parent.document.getElementById('application').contentDocument.getElementById('custom-activity'),items=Array.from(root.querySelectorAll('#cost-rows tr')).map((row,i)=>({id:'item'+i,name:row.querySelector('input').value,budget:Number(row.querySelector('[data-amount]').textContent.replaceAll(',',''))}));if(!items.length||items.some(i=>!i.name||!Number.isFinite(i.budget)||i.budget<0))throw Error('请先补全申请费用明细');const share=Number(root.querySelector('#company-percent').value);if(share<0||share>100)throw Error('承担比例需在0—100%之间');const wrapper=document.createElement('div');wrapper.id='custom-activity';wrapper.append(root.querySelector('style').cloneNode(true));root.querySelectorAll('form>section').forEach(section=>{const clone=section.cloneNode(true);const originals=section.querySelectorAll('input,select,textarea');clone.querySelectorAll('input,select,textarea').forEach((el,i)=>{if(el.type!=='file')el.value=originals[i].value;el.checked=originals[i].checked;if(el.tagName==='INPUT'){el.setAttribute('value',el.value);if(el.checked)el.setAttribute('checked','');else el.removeAttribute('checked')}if(el.tagName==='TEXTAREA')el.textContent=el.value;if(el.tagName==='SELECT')Array.from(el.options).forEach(o=>o.toggleAttribute('selected',o.value===el.value));el.disabled=true});clone.querySelectorAll('button,input[type=file]').forEach(el=>el.remove());wrapper.append(clone)});db.application={id:'HD-DEMO-001',dealer:root.querySelector('.basic-grid input').value,items,share,pay:root.querySelector('#payment').value,html:wrapper.outerHTML};save();render();say('已锁定申请快照。后续执行和核销沿用本快照，修改申请页不会覆盖历史数据。')}catch(e){say(e.message,true)}};
function selectedExec(){return db.executions.find(r=>r.id===q('#execution-select').value)}function drawLines(){q('#details').replaceChildren();q('#detail-head').innerHTML=isWriteoff?'<tr><th>费用项</th><th>执行原额</th><th>已处理原额</th><th>本次核销原额</th><th>调整费用</th><th>最终核销费用</th></tr>':'<tr><th>费用项</th><th>申请预算</th><th>剩余可执行</th><th>本次实际费用</th></tr>';db.application.items.forEach((item,i)=>{const tr=document.createElement('tr');cell(tr,item.name);const exec=selectedExec();cell(tr,money(isWriteoff?exec?.lines[i]||0:item.budget));cell(tr,money(isWriteoff?written(exec?.id,i):item.budget-execUsed(i)));const fields=isWriteoff?['base','adjust']:['amount'];fields.forEach(field=>{const input=document.createElement('input');input.type='number';input.step='0.01';if(field!=='adjust')input.min='0';input.required=true;input.disabled=readonly;input.setAttribute('aria-label',item.name+' '+({base:'本次核销原额',adjust:'调整费用',amount:'本次实际费用'}[field]));input.value=isWriteoff?lines[i][field]:lines[i];input.oninput=()=>{if(isWriteoff)lines[i][field]=input.value;else lines[i]=input.value;update()};cell(tr,'').append(input)});if(isWriteoff)cell(tr,'').dataset.final=i;q('#details').append(tr)});update()}
function update(){if(isWriteoff)q('#details').querySelectorAll('[data-final]').forEach(el=>{const l=lines[Number(el.dataset.final)];el.textContent=money(Number(l.base)+Number(l.adjust))});const total=isWriteoff?sum(lines.map(l=>Number(l.base)+Number(l.adjust))):sum(lines);q('#detail-stats').textContent='本次'+(isWriteoff?'最终核销':'实际费用')+'合计：'+money(total)+' 元　我司承担：'+money(shareTotal(isWriteoff?lines.map(l=>round(Number(l.base)+Number(l.adjust))):lines.map(Number)))+' 元'}
function open(record=null){editing=record?.id||null;readonly=record?.status==='已提交';q('#editor').hidden=false;q('#editor-title').textContent=record?record.id:(isWriteoff?'新增核销':'新增执行');q('#execution-choice').hidden=!isWriteoff;const select=q('#execution-select');select.replaceChildren();db.executions.filter(e=>e.status==='已提交').forEach(e=>{const o=document.createElement('option');o.value=e.id;o.textContent=e.id;select.append(o)});if(isWriteoff&&record)select.value=record.execution;select.disabled=readonly||!!record;lines=record?JSON.parse(JSON.stringify(record.lines)):db.application.items.map(()=>isWriteoff?{base:'',adjust:'0'}:'');q('#note').value=record?.note||'';q('#note').disabled=readonly;q('#files').value='';q('#files').disabled=readonly;q('#file-list').replaceChildren();(record?.files||[]).forEach(f=>{const li=document.createElement('li');li.textContent=f;q('#file-list').append(li)});q('#actions').hidden=readonly;drawLines();q('#editor').scrollIntoView({behavior:'instant'})}q('#execution-select').onchange=()=>{lines=db.application.items.map(()=>({base:'',adjust:'0'}));drawLines()};q('#new').onclick=()=>{load();if(!db.application)return;if(isWriteoff&&!db.executions.some(e=>e.status==='已提交'))return say('请先提交一张执行单。',true);open()};q('#close').onclick=()=>q('#editor').hidden=true;
function persist(submit){try{load();const app=db.application;if(!app)throw Error('申请尚未确认');if(editing&&(isWriteoff?db.writeoffs:db.executions).find(r=>r.id===editing)?.status==='已提交')throw Error('该单已提交，不可覆盖');const normalized=isWriteoff?lines.map(l=>({base:Number(l.base),adjust:Number(l.adjust)})):lines.map(Number);if(submit){if(lines.some(l=>isWriteoff?l.base===''||l.adjust==='':l===''))throw Error('请填写每项金额，未发生请填0');normalized.forEach((l,i)=>{if(isWriteoff){const exec=selectedExec();if(!exec)throw Error('请选择执行单');if(!Number.isFinite(l.base)||!Number.isFinite(l.adjust)||l.base<0||l.base+l.adjust<0)throw Error('核销原额及最终金额不能为负');if(l.base===0&&l.adjust!==0)throw Error('没有核销原额时不能单独调整');if(l.base>writtenRemaining(exec,i)+.001)throw Error(app.items[i].name+'超出该执行单剩余可核销原额');const previous=sum(db.writeoffs.filter(r=>r.status==='已提交').map(r=>r.lines[i].base+r.lines[i].adjust));if(previous+l.base+l.adjust>app.items[i].budget+.001)throw Error('调整后超过申请费用项预算，请补充审批')}else{if(!Number.isFinite(l)||l<0)throw Error('实际费用须为非负金额');if(l+execUsed(i)>app.items[i].budget+.001)throw Error(app.items[i].name+'超出剩余可执行预算')}})}const collection=isWriteoff?db.writeoffs:db.executions;const id=editing||((isWriteoff?'HX':'ZX')+'-'+String(collection.length+1).padStart(4,'0'));const existing=collection.find(r=>r.id===id);const record={id,status:submit?'已提交':'草稿',lines:submit?normalized:JSON.parse(JSON.stringify(lines)),execution:isWriteoff?q('#execution-select').value:null,note:q('#note').value,files:q('#files').files.length?Array.from(q('#files').files).map(f=>f.name):existing?.files||[]};const index=collection.findIndex(r=>r.id===id);if(index<0)collection.push(record);else collection[index]=record;save();q('#editor').hidden=true;render();say(submit?'已提交，演示为审核通过并占用额度。':'草稿已保存，暂不占用额度。')}catch(e){say(e.message,true)}}function writtenRemaining(exec,i){return exec.lines[i]-written(exec.id,i)}q('#draft').onclick=()=>persist(false);q('#form').onsubmit=e=>{e.preventDefault();persist(true)};q('#files').onchange=()=>{q('#file-list').replaceChildren();Array.from(q('#files').files).forEach(f=>{const li=document.createElement('li');li.textContent=f.name;q('#file-list').append(li)})};q('#title').textContent=isWriteoff?'活动核销记录':'活动执行记录';q('#list-title').textContent=isWriteoff?'核销记录':'执行记录';q('#new').textContent=isWriteoff?'＋ 新增核销':'＋ 新增执行';q('#submit').textContent=isWriteoff?'提交核销':'提交执行';load();render();window.refreshRecords=()=>{if(q('#editor').hidden){load();render()}};window.addEventListener('storage',()=>window.refreshRecords());})();
</script></body></html>
