<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>计划发货管理 · 交互原型</title><style>
:root{--blue:#245ae8;--ink:#18243b;--muted:#647086;--line:#e1e7f0;--bg:#f4f6fa;--red:#b42318;--amber:#985b08;--green:#14754e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 "Microsoft YaHei",Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;min-height:36px;border:1px solid var(--line);border-radius:6px;background:white;color:var(--ink);padding:6px 14px}button:hover{background:#edf2ff;border-color:#bac9ef}button:disabled{cursor:not-allowed;background:#edf0f5;color:#6c7585}button.primary{background:var(--blue);border-color:var(--blue);color:white}button.link{border:0;color:var(--blue);padding:4px 8px;background:transparent}button.danger{color:var(--red)}:focus-visible{outline:3px solid #759cff;outline-offset:2px}input,select,textarea{border:1px solid #cbd3df;border-radius:6px;padding:8px 10px;background:white;color:var(--ink);width:100%;min-height:40px}input[type=checkbox],input[type=radio]{width:17px;min-height:17px;height:17px;accent-color:var(--blue)}aside{position:fixed;inset:0 auto 0 0;width:208px;background:#14233d;color:#b9c7df;padding:24px 16px;display:flex;flex-direction:column}.brand{font-size:20px;font-weight:700;color:white;padding:0 12px 28px}.brand small{display:block;font-size:11px;letter-spacing:2px;color:#99abd0}.nav{width:100%;text-align:left;background:transparent;color:#b9c7df;border:0;padding:12px 16px;margin-bottom:8px}.nav.active{background:#294368;color:white}.sidefoot{margin-top:auto;border-top:1px solid #344563;padding-top:16px;font-size:12px}.main{margin-left:208px}header{height:64px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px}.chip{background:#edf2ff;color:#254dac;padding:3px 10px;border-radius:20px;font-size:12px}.content{padding:24px 32px;max-width:1680px;margin:auto}.titlebar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}h1{font-size:25px;margin:0 0 4px}h2{font-size:17px;margin:0 0 12px}h3{font-size:15px;margin:0 0 8px}p{margin:4px 0 12px}.muted,small{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}.card{background:white;border:1px solid var(--line);border-radius:10px;padding:20px}.stat{font-size:30px;font-weight:700;line-height:1.5}.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.bar input{width:260px}.bar select{width:160px}.panel{background:white;border:1px solid var(--line);border-radius:10px;overflow:hidden}.panelhead{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;text-align:left}th{background:#f8fafc;color:#566379;font-weight:500;font-size:12px;padding:12px 16px}td{padding:16px;border-bottom:1px solid var(--line);vertical-align:top}td small{display:block;font-size:12px}tr:last-child td{border-bottom:0}.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;background:#edf2ff;color:#2552b9}.badge.good{background:#e7f5ed;color:var(--green)}.badge.warn{background:#fff3d9;color:var(--amber)}.badge.bad{background:#feeeec;color:var(--red)}.notice{padding:12px 16px;border-radius:6px;background:#edf3ff;border:1px solid #d4e1ff;color:#2c4f85;margin:0 0 16px}.notice.warn{background:#fff8e9;border-color:#f1d799;color:var(--amber)}.notice.bad{background:#fff1ef;border-color:#f3beb6;color:var(--red)}.empty{text-align:center;padding:48px 24px;color:var(--muted)}.footerline{padding:12px 20px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}dialog{border:0;padding:0;border-radius:12px;width:min(960px,94vw);max-height:90vh;box-shadow:0 24px 90px #14233d44;color:var(--ink)}dialog::backdrop{background:#15243a88}.dialoghead{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.dialogbody{padding:24px;max-height:65vh;overflow:auto}.dialogfoot{padding:16px 24px;background:#fafbfd;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}.steps{display:flex;gap:12px;background:#f6f8fc;padding:12px 16px;border-radius:6px;margin-bottom:24px}.step{flex:1;color:var(--muted)}.step.active{font-weight:700;color:var(--blue)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid.three{grid-template-columns:repeat(3,1fr)}label{display:block;font-size:13px;margin-bottom:4px}.field small{display:block;margin-top:4px}.full{grid-column:1/-1}.section{margin-bottom:24px}.quote{display:flex;gap:12px;border:1px solid var(--line);padding:16px;border-radius:8px;align-items:center;margin-bottom:12px}.quote.selected{border:2px solid var(--blue);background:#f6f9ff;padding:15px}.quote.disabled{background:#fafafa}.quote .info{flex:1}.price{font-size:23px;font-weight:700}.timeline{border-left:2px solid #d9e3f6;margin-left:8px;padding-left:20px}.timeline p{padding-bottom:12px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 24px;background:#172840;color:white;border-radius:8px;z-index:20;box-shadow:0 4px 20px #0002}.count{font-variant-numeric:tabular-nums;font-weight:600}.right{text-align:right}.hidden{display:none!important}.help{font-size:12px;color:var(--muted)}.checkline{display:flex;gap:8px;align-items:center}.splitrow{display:grid;grid-template-columns:1fr 130px 130px;gap:16px;padding:12px;border-bottom:1px solid var(--line)}@media(max-width:1000px){aside{width:176px}.main{margin-left:176px}.content{padding:20px}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){aside{position:static;width:100%;padding:12px;display:block}.brand{padding:0 8px 8px}.brand small,.sidefoot{display:none}.nav{width:auto;margin:0;padding:8px}.main{margin:0}header{height:auto;min-height:52px;padding:12px}.content{padding:16px}.titlebar{align-items:flex-start}.cards{gap:8px}.card{padding:12px}.grid,.grid.three{grid-template-columns:1fr}.bar input,.bar select{width:100%}.dialogbody{padding:16px}.steps{font-size:12px;gap:8px}.quote{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<aside><div class="brand">履约工作台<small>FULFILLMENT WORKSPACE</small></div><button class="nav" id="nav-orders" onclick="go('orders')">▤　订单拆合单</button><button class="nav active" id="nav-plans" onclick="go('plans')">▣　计划发货管理</button><button class="nav" id="nav-settings" onclick="go('settings')">⚙　物流与预警配置</button><div class="sidefoot">业务流转<br>订单 → 拆合单 → 计划<br>→ 旺店通出库发货</div></aside><div class="main"><header><span>销售履约 / <b id="crumb">计划发货管理</b></span><span class="chip">可交互原型 · 演示数据</span></header><main class="content" id="app"></main></div>
<dialog id="modal" aria-labelledby="modalTitle"><div class="dialoghead"><div><h2 id="modalTitle" style="margin:0"></h2><small id="modalSub"></small></div><button aria-label="关闭弹窗" onclick="closeModal()">✕</button></div><div class="dialogbody" id="modalBody"></div><div class="dialogfoot" id="modalFoot"></div></dialog><div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
'use strict';
const STORE='shipment-prototype-v1',$=id=>document.getElementById(id),hour=3600000,now=()=>Date.now();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'¥'+Number(n).toFixed(2),stamp=t=>new Date(t).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
function seed(){let t=now(),make=(id,name,h,address='上海市闵行区申长路 1688 号',warehouse=false)=>({id,source:id,customer:name,phone:'138****2688',address,warehouse,created:t-36*hour,due:t+h*hour,status:'ready',items:[{sku:'SKU-001',name:'经典款礼盒',qty:20},{sku:'SKU-002',name:'配套包装袋',qty:20}]});let orders=[make('SO-001','上海悦集商贸',96),make('SO-002','上海悦集商贸',100),make('SO-003','杭州优选供应链',60,'浙江省杭州市余杭区仓前街道 128 号',true),make('SO-004','南京星禾零售',30,'江苏省南京市江宁区天元东路 88 号'),make('SO-005','苏州汇选商贸',18,'江苏省苏州市工业园区星湖街 88 号')];let plans=[{id:'PL-DEMO-001',orderIds:['SO-003'],customer:orders[2].customer,address:orders[2].address,due:orders[2].due,created:t-12*hour,warehouse:true,warehouseName:'杭州优选收货仓',fee:30,weight:12,length:40,width:30,height:30,boxes:2,courier:'申通快递',transit:48,cost:82.8,transport:52.8,status:'confirmed',sync:'success',shipped:false,wdt:'WDT-DEMO-001',logs:['确认计划，示例报价 ¥82.80','演示同步成功，等待旺店通出库'],configSnapshot:{process:8,buffer:4,warn:12,divisor:6000}}];orders[2].status='occupied';return{orders,plans,config:{process:8,buffer:4,warn:12,divisor:6000},seq:6}}
let state;try{state=JSON.parse(localStorage.getItem(STORE))||seed()}catch(e){state=seed()}const defaultCouriers=()=>[{name:'中通快递',first:9,next:1.1,transit:60,warehouse:false,enabled:true},{name:'申通快递',first:11,next:1.4,transit:48,warehouse:true,enabled:true},{name:'顺丰速运',first:22,next:2.4,transit:24,warehouse:true,enabled:true}];state.couriers||=defaultCouriers();let page='plans',selected=new Set(),query='',filter='all',wizard=null,busy=false;
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){toast('浏览器未允许本地保存，本次操作仍可继续演示')}}function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),4000)}
function go(p){page=p;query='';filter='all';selected.clear();render()}function duration(ms){let a=Math.abs(ms);return(Math.floor(a/(24*hour))?Math.floor(a/(24*hour))+'天 ':'')+Math.floor(a/hour)%24+'小时 '+Math.floor(a/60000)%60+'分'}
function deadlines(p){let c=p.configSnapshot||state.config;return{ship:p.due-(p.transit+c.buffer)*hour,sync:p.due-(p.transit+c.buffer+c.process)*hour}}
function risk(p){if(p.status==='cancelled')return{label:'已取消',cls:''};if(p.shipped)return p.actualShip+(p.transit+(p.configSnapshot||state.config).buffer)*hour>p.due?{label:'预计晚到',cls:'bad'}:{label:'已发货 · 待签收',cls:'good'};if(p.due<now())return{label:'到货要求已超时',cls:'bad'};let t=p.sync==='success'?deadlines(p).ship:deadlines(p).sync;return t<now()?{label:p.sync==='success'?'发货已超时':'同步已超时',cls:'bad'}:t-now()<state.config.warn*hour?{label:'临近截止',cls:'warn'}:{label:'时效正常',cls:'good'}}
function badge(s,c=''){return'<span class="badge '+c+'">'+esc(s)+'</span>'}function countdown(t){return'<span class="count">'+(t<now()?'已超时 ':'还剩 ')+duration(t-now())+'</span>'}
function render(){state.couriers||=defaultCouriers();document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.id==='nav-'+page));$('crumb').textContent={plans:'计划发货管理',orders:'订单拆合单',settings:'物流与预警配置'}[page];$('app').innerHTML=page==='plans'?plansView():page==='orders'?ordersView():settingsView()+courierSettings()}
function plansView(){let active=state.plans.filter(p=>p.status!=='cancelled'),urgent=active.filter(p=>['bad','warn'].includes(risk(p).cls)),rows=state.plans.filter(p=>(p.id+p.customer+p.orderIds.join('')).toLowerCase().includes(query.toLowerCase())&&(filter==='all'||filter==='urgent'&&['bad','warn'].includes(risk(p).cls)||filter==='failed'&&p.sync==='failed'||filter==='waiting'&&!p.shipped&&p.status!=='cancelled'||filter==='shipped'&&p.shipped));return `<div class="titlebar"><div><h1>计划发货管理</h1><div class="muted">先确定发货方案，再同步旺店通执行出库与发货。</div></div><button class="primary" onclick="startWizard()">＋ 新建发货计划</button></div><div class="cards"><div class="card"><small>有效发货计划</small><div class="stat">${active.length}</div><small>取消计划不计入</small></div><div class="card"><small>待出库发货</small><div class="stat">${active.filter(p=>!p.shipped).length}</div><small>等待旺店通执行</small></div><div class="card"><small>需要时效跟进</small><div class="stat" style="color:var(--amber)">${urgent.length}</div><button class="link" onclick="setFilter('urgent')">查看预警 →</button></div><div class="card"><small>同步失败</small><div class="stat" style="color:var(--red)">${active.filter(p=>p.sync==='failed').length}</div><small>保留订单，可重试</small></div></div><div class="notice">演示环境：同步、撤销及发货回传均为本地模拟，不连接旺店通。费用及运输时效均为示例配置。</div><div class="panel"><div class="panelhead"><div class="bar"><input aria-label="搜索计划" placeholder="搜索计划编号 / 客户 / 订单" value="${esc(query)}" oninput="search(this.value)"><select aria-label="筛选计划状态" onchange="setFilter(this.value)">${[['all','全部计划'],['waiting','待发货'],['urgent','时效预警'],['failed','同步失败'],['shipped','已发货']].map(([v,t])=>`<option value="${v}" ${filter===v?'selected':''}>${t}</option>`).join('')}</select></div><span class="muted">共 ${rows.length} 个计划</span></div><div class="tablewrap"><table><thead><tr><th>计划 / 客户</th><th>到货要求 / 剩余时间</th><th>执行截止 / 预警</th><th>发货方案</th><th>计划 / 同步 / 发货</th><th>操作</th></tr></thead><tbody>${rows.map(p=>{let r=risk(p),d=deadlines(p);return `<tr><td><button class="link" onclick="detail('${p.id}')">${p.id}</button><small>${esc(p.customer)} · ${p.orderIds.length} 个订单</small><small>创建 ${stamp(p.created)}</small></td><td>${stamp(p.due)}<small>${countdown(p.due)}</small></td><td>${badge(r.label,r.cls)}<small>${p.sync==='success'?'最晚发货':'最晚同步'} ${stamp(p.sync==='success'?d.ship:d.sync)}</small></td><td>${esc(p.courier||'待选择')} · <b>${money(p.cost||0)}</b><small>${p.warehouse?'入仓 · '+esc(p.warehouseName):'普通配送'} / ${p.boxes} 箱</small></td><td>${badge(p.status==='draft'?'草稿':p.status==='cancelled'?'已取消':p.shipped?'已发货':'执行中')}<small>${badge({none:'未同步',loading:'同步中',failed:'同步失败',success:'同步成功'}[p.sync],p.sync==='failed'?'bad':p.sync==='success'?'good':'')}</small><small>${p.shipped?'全部发货':'未发货'}</small></td><td><button class="link" onclick="detail('${p.id}')">查看详情</button>${p.status==='draft'?`<button class="link" onclick="editDraft('${p.id}')">继续编辑</button>`:''}${p.sync==='failed'?`<button class="link" onclick="syncPlan('${p.id}',false)">重试同步</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="6"><div class="empty">没有符合条件的计划<br><button onclick="clearFilters()">清除筛选</button></div></td></tr>'}</tbody></table></div><div class="footerline">倒计时每分钟更新 · 确认后占用订单 · 同步成功不代表已发货 · 数据保存在当前浏览器</div></div>`}
function ordersView(){let rows=state.orders.filter(o=>(o.id+o.customer+o.source).includes(query));return `<div class="titlebar"><div><h1>订单拆合单</h1><div class="muted">完成拆单或合单，再将可发货订单加入计划。</div></div><button class="primary" onclick="startWizard()">创建发货计划</button></div><div class="notice">合单要求：同客户、收货地址、发货仓与入仓要求；到货时间取最早值。已占用订单不可再次拆合单。</div><div class="panel"><div class="panelhead"><div class="bar"><input aria-label="搜索订单" placeholder="搜索订单 / 客户 / 原订单" value="${esc(query)}" oninput="search(this.value)"><button onclick="mergeOrders()" ${selected.size<2?'disabled':''}>合并订单</button><button onclick="splitOrder()" ${selected.size!==1?'disabled':''}>拆分订单</button></div><span class="muted">已选 ${selected.size} 个订单</span></div><div class="tablewrap"><table><thead><tr><th><input type="checkbox" aria-label="全选可用订单" onchange="selectAll(this.checked)"></th><th>订单 / 原订单</th><th>客户 / 收货地址</th><th>商品</th><th>下单时间 / 要求到货</th><th>状态</th><th>操作</th></tr></thead><tbody>${rows.map(o=>`<tr><td><input type="checkbox" aria-label="选择 ${o.id}" ${o.status!=='ready'?'disabled':''} ${selected.has(o.id)?'checked':''} onchange="pick('${o.id}',this.checked)"></td><td><b>${esc(o.id)}</b><small>来源 ${esc(o.source)}</small></td><td>${esc(o.customer)}<small>${esc(o.address)}</small><small>${o.warehouse?'入仓配送':'普通配送'} · 华东发货仓</small></td><td>${o.items.map(i=>esc(i.name)+' × '+i.qty).join('<br>')}</td><td>${stamp(o.created)}<small>要求到货 ${stamp(o.due)}</small><small>${countdown(o.due)}</small></td><td>${badge(o.status==='ready'?'待计划':o.status==='occupied'?'已占用':o.status==='shipped'?'已发货':'已拆合',o.status==='ready'?'good':'')}</td><td><button class="link" ${o.status!=='ready'?'disabled':''} onclick="editOrder('${o.id}')">调整到货要求</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">没有匹配订单，请修改搜索条件。</td></tr>'}</tbody></table></div></div>`}
function clearFilters(){query='';filter='all';render()}function search(v){query=v;let pos=document.activeElement.selectionStart;render();let el=document.querySelector('.bar input');el?.focus();if(el&&pos!=null)el.setSelectionRange(pos,pos)}function setFilter(v){filter=v;render()}function pick(id,v){v?selected.add(id):selected.delete(id);render()}function selectAll(v){selected.clear();if(v)state.orders.filter(o=>o.status==='ready'&&(o.id+o.customer+o.source).includes(query)).forEach(o=>selected.add(o.id));render()}
function openModal(title,sub,body,foot){$('modalTitle').textContent=title;$('modalSub').textContent=sub||'';$('modalBody').innerHTML=body;$('modalFoot').innerHTML=foot||'<span></span><button onclick="closeModal()">关闭</button>';$('modal').querySelector('.dialoghead button').disabled=busy;if(!$('modal').open)$('modal').showModal()}function closeModal(){if(busy){toast('正在模拟同步，请等待结果');return}$('modal').close()}
function editOrder(id){let o=state.orders.find(o=>o.id===id),v=new Date(o.due-new Date(o.due).getTimezoneOffset()*60000).toISOString().slice(0,16);openModal('调整客户到货要求',id,`<p>原始下单：${stamp(o.created)}，拆合单不重置下单时间。</p><label for="dueInput">客户要求到货时间 *</label><input id="dueInput" type="datetime-local" value="${v}"><p id="dueError" role="alert" style="color:var(--red)"></p>`,`<button onclick="closeModal()">取消</button><button class="primary" onclick="saveDue('${id}')">保存</button>`)}
function saveDue(id){let t=new Date($('dueInput').value).getTime();if(!Number.isFinite(t)){$('dueError').textContent='请填写完整的日期和时间。';return}state.orders.find(o=>o.id===id).due=t;save();closeModal();render();toast('到货要求已更新，新计划将按此时间匹配快递')}
function mergeOrders(){let list=state.orders.filter(o=>selected.has(o.id)),first=list[0];if(list.length<2)return;if(list.some(o=>o.status!=='ready'||o.customer!==first.customer||o.address!==first.address||o.warehouse!==first.warehouse)){toast('无法合单：请选择同客户、同地址、同入仓要求的待计划订单');return}openModal('确认合并订单','保留原订单关联，商品数量守恒',`<div class="notice">${list.map(o=>esc(o.id)).join(' + ')} → 1 个新订单</div><p>客户：${esc(first.customer)}</p><p>最早下单：${stamp(Math.min(...list.map(o=>o.created)))}</p><p>要求到货：${stamp(Math.min(...list.map(o=>o.due)))}（取最早时间）</p>`,`<button onclick="closeModal()">返回</button><button class="primary" onclick="confirmMerge()">确认合并</button>`)}
function confirmMerge(){let list=state.orders.filter(o=>selected.has(o.id)),first=list[0],items=[];list.forEach(o=>o.items.forEach(i=>{let f=items.find(x=>x.sku===i.sku);f?f.qty+=i.qty:items.push({...i})}));state.orders.push({...first,id:'MG-'+String(state.seq++).padStart(4,'0'),source:list.map(o=>o.source).join(' / '),created:Math.min(...list.map(o=>o.created)),due:Math.min(...list.map(o=>o.due)),items,status:'ready'});list.forEach(o=>o.status='processed');save();selected.clear();closeModal();render();toast('合单完成，新订单可创建发货计划')}
function splitOrder(){let o=state.orders.find(o=>selected.has(o.id));if(!o||o.status!=='ready')return;openModal('拆分订单',o.id+' · 每个商品的数量必须守恒',`<div class="notice">分为两个订单，继承下单时间、收货信息和要求到货时间。</div><div class="splitrow"><b>商品</b><b>订单 A 数量</b><b>订单 B 数量</b></div>${o.items.map((i,n)=>`<div class="splitrow"><span>${esc(i.name)}<small>原数量 ${i.qty}</small></span><input id="split-${n}" type="number" min="0" max="${i.qty}" value="${Math.ceil(i.qty/2)}" aria-label="${esc(i.name)}订单A数量" oninput="$('remain-${n}').textContent=${i.qty}-Number(this.value)"><span id="remain-${n}">${Math.floor(i.qty/2)}</span></div>`).join('')}<p id="splitError" role="alert" style="color:var(--red)"></p>`,`<button onclick="closeModal()">返回</button><button class="primary" onclick="confirmSplit('${o.id}')">确认拆分</button>`)}
function confirmSplit(id){let o=state.orders.find(o=>o.id===id),a=[],b=[];for(let n=0;n<o.items.length;n++){let i=o.items[n],v=Number($('split-'+n).value);if(!Number.isInteger(v)||v<0||v>i.qty){$('splitError').textContent='数量须为 0 至原数量之间的整数。';return}if(v)a.push({...i,qty:v});if(i.qty-v)b.push({...i,qty:i.qty-v})}if(!a.length||!b.length){$('splitError').textContent='两个新订单都需要至少一个商品，请调整数量。';return}state.orders.push({...o,id:'SP-'+String(state.seq++).padStart(4,'0')+'-A',items:a},{...o,id:'SP-'+String(state.seq++).padStart(4,'0')+'-B',items:b});o.status='processed';selected.clear();save();closeModal();render();toast('拆单完成，两个新订单可分别安排计划')}
function startWizard(){wizard={step:1,orderIds:[...selected].filter(id=>state.orders.find(o=>o.id===id)?.status==='ready'),weight:12,length:40,width:30,height:30,boxes:2,warehouse:false,warehouseName:'',fee:30,payer:'公司承担',note:'',courier:'',reason:'',riskAck:false};showWizard()}
function eligible(){return state.orders.filter(o=>o.status==='ready'||wizard.orderIds.includes(o.id))}function chosen(){return state.orders.filter(o=>wizard.orderIds.includes(o.id))}function dueOf(){return Math.min(...chosen().map(o=>o.due))}
function showWizard(){let body='<div class="steps">'+['选择订单','配送与包裹','快递与费用','确认计划'].map((s,i)=>`<span class="step ${wizard.step===i+1?'active':''}">${i+1}. ${s}</span>`).join('')+'</div>';

if(wizard.step===3){let qs=quotes(),rec=qs.find(q=>q.ok);if(!wizard.courier)wizard.courier=(rec||qs.find(q=>q.support)).name;body+=`<div class="notice ${rec?'':'warn'}">${rec?'推荐：满足配送、入仓和到货要求后，优先总费用最低。':'当前方案均存在时效风险，请检查到货要求并确认风险。'}<br>要求到货 ${stamp(dueOf())} · 仓库处理 ${state.config.process}h · 安全缓冲 ${state.config.buffer}h</div>${qs.map(q=>`<div class="quote ${wizard.courier===q.name?'selected':''} ${!q.support?'disabled':''}"><input type="radio" name="courier" aria-label="选择${q.name}" ${wizard.courier===q.name?'checked':''} ${!q.support?'disabled':''} onchange="wizard.courier='${q.name}';wizard.riskAck=false;showWizard()"><div class="info"><b>${q.name}</b> ${rec?.name===q.name?badge('推荐 · 最低价','good'):''}<small style="display:block">运输 ${money(q.transport)} + 入仓 ${money(q.fee)} · 计费 ${q.bill.toFixed(1)} kg / 箱</small><small>预计到货 ${stamp(q.arrive)} · ${q.support?q.ok?'满足要求，余量 '+duration(dueOf()-q.arrive):'预计晚到 '+duration(q.arrive-dueOf()):'不支持入仓，不可选择'}</small></div><div class="right"><div class="price">${money(q.total)}</div>${badge(q.ok?'时效符合':!q.support?'服务不支持':'时效风险',q.ok?'good':'warn')}</div></div>`).join('')}<label for="reason">人工选择原因 ${wizard.courier!==rec?.name?'*':''}</label><input id="reason" value="${esc(wizard.reason)}" placeholder="选择非推荐快递时必填，如客户指定承运商" oninput="wizard.reason=this.value">${!qs.find(q=>q.name===wizard.courier)?.ok?`<label class="checkline" style="margin-top:16px"><input type="checkbox" ${wizard.riskAck?'checked':''} onchange="wizard.riskAck=this.checked">已知可能晚到，将人工跟进客户到货要求</label>`:''}`}
if(wizard.step===4){let q=quotes().find(q=>q.name===wizard.courier),o=chosen()[0],d=deadlines({due:dueOf(),transit:q.transit});body+=`<div class="notice ${q.ok?'':'warn'}">${q.ok?'方案满足当前配置时效，确认后可同步旺店通。':'当前方案存在晚到风险，已记录人工确认，请持续跟进。'}</div><div class="grid"><div class="card"><h3>订单与收货</h3><p>${esc(o.customer)}<br>${esc(o.address)}</p><p>${wizard.orderIds.map(esc).join('<br>')}</p><small>原始下单 ${stamp(Math.min(...chosen().map(o=>o.created)))}</small></div><div class="card"><h3>发货方案</h3><p>${q.name} · ${wizard.boxes} 箱 · 毛重 ${(wizard.weight*wizard.boxes).toFixed(1)} kg<br>体积 ${(wizard.length*wizard.width*wizard.height*wizard.boxes/1000000).toFixed(3)} m³</p><p>${wizard.warehouse?'入仓：'+esc(wizard.warehouseName):'普通配送'} · ${esc(wizard.payer)}</p><b>预计总费用 ${money(q.total)}</b><small style="display:block">运输 ${money(q.transport)} + 入仓 ${money(q.fee)}</small></div><div class="card full"><h3>关键时间</h3><div class="grid three"><div><small>最晚同步</small><br><b>${stamp(d.sync)}</b></div><div><small>最晚发货</small><br><b>${stamp(d.ship)}</b></div><div><small>客户要求到货</small><br><b>${stamp(dueOf())}</b></div></div></div></div><p class="help" style="margin-top:16px">确认后锁定示例报价快照并占用订单。同步成功后在旺店通出库发货。当前原型不实际提交订单。</p>`}
body+='<div id="wizardError" role="alert" style="color:var(--red);margin-top:12px"></div>';openModal(wizard.editId?'继续编辑发货计划':'新建发货计划','先拆合单 → 确认方案 → 同步旺店通',body,`<button onclick="${wizard.step===1?'closeModal()':'prevStep()'}">${wizard.step===1?'取消':'上一步'}</button><div class="bar">${wizard.step>=2?'<button onclick="saveDraft()">保存草稿</button>':''}<button class="primary" onclick="${wizard.step===4?'submitPlan()':'nextStep()'}">${wizard.step===4?'确认计划':'下一步'}</button></div>`)}
function invalidateQuote(){wizard.courier='';wizard.reason='';wizard.riskAck=false}function chooseOrder(id,v){if(v)wizard.orderIds.push(id);else wizard.orderIds=wizard.orderIds.filter(x=>x!==id);invalidateQuote();showWizard()}
function validateStep(){let error='';if(wizard.step===1){let list=chosen(),o=list[0];if(!list.length)error='请选择至少一个待计划订单。';else if(list.some(x=>x.customer!==o.customer||x.address!==o.address||x.warehouse!==o.warehouse))error='所选订单客户、地址或入仓要求不一致，请分开安排。'}if(wizard.step===2){if(['weight','length','width','height','boxes'].some(k=>!Number.isFinite(wizard[k])||wizard[k]<=0)||!Number.isInteger(wizard.boxes))error='请填写大于 0 的重量和尺寸，箱数必须为正整数。';else if(wizard.warehouse&&(!wizard.warehouseName.trim()||!Number.isFinite(wizard.fee)||wizard.fee<0))error='请填写入仓仓库名称及不小于 0 的入仓费用。';else if(chosen()[0].warehouse&&!wizard.warehouse)error='所选订单要求入仓，请选择入仓配送。'}if(wizard.step===3){let qs=quotes(),q=qs.find(q=>q.name===wizard.courier),rec=qs.find(q=>q.ok);if(!q?.support)error='请选择支持配送要求的快递。';else if(q.name!==rec?.name&&!wizard.reason.trim())error='选择非推荐快递时，请填写人工选择原因。';else if(!q.ok&&!wizard.riskAck)error='当前方案可能晚到，请确认风险后继续。'}if(error){$('wizardError').textContent=error;return false}return true}
function nextStep(){if(!validateStep())return;if(wizard.step===2&&!quotes().some(q=>q.support)){$('wizardError').textContent='没有启用且支持本次配送的承运商。请保存草稿，再到物流配置启用支持入仓的承运商。';return}if(wizard.step===1){wizard.warehouse=chosen()[0].warehouse;wizard.warehouseName=wizard.warehouse?'客户指定收货仓':''}wizard.step++;showWizard()}function prevStep(){wizard.step--;showWizard()}
function quotes(){let c=state.config;return state.couriers.map(q=>{let support=q.enabled&&(!wizard.warehouse||q.warehouse),bill=Math.ceil(Math.max(wizard.weight,wizard.length*wizard.width*wizard.height/c.divisor)),transport=(q.first+Math.max(0,bill-1)*q.next)*wizard.boxes,fee=wizard.warehouse?wizard.fee:0,arrive=now()+(c.process+q.transit+c.buffer)*hour;return{...q,support,bill,transport,fee,total:transport+fee,arrive,ok:support&&arrive<=dueOf()}}).sort((a,b)=>a.total-b.total||a.transit-b.transit)}
function buildPlan(status){let q=quotes().find(q=>q.name===wizard.courier),o=chosen()[0];return{...wizard,id:wizard.editId||'PL-'+new Date().toLocaleDateString('sv-SE').replaceAll('-','')+'-'+String(state.seq++).padStart(3,'0'),customer:o.customer,address:o.address,due:dueOf(),created:wizard.created||now(),cost:q?.total||0,transport:q?.transport||0,transit:q?.transit||48,status,sync:'none',shipped:false,logs:[status==='draft'?'保存草稿，订单已占用':'确认计划，锁定示例报价'],configSnapshot:{...state.config}}}
function persistPlan(p){let idx=state.plans.findIndex(x=>x.id===p.id);if(idx>=0){state.plans[idx].orderIds.filter(id=>!p.orderIds.includes(id)).forEach(id=>state.orders.find(o=>o.id===id).status='ready');state.plans[idx]=p}else state.plans.unshift(p);p.orderIds.forEach(id=>state.orders.find(o=>o.id===id).status='occupied');save();selected.clear();page='plans';closeModal();render()}
function saveDraft(){if(wizard.step===2&&!validateStep())return;let p=buildPlan('draft');persistPlan(p);toast('草稿已保存，订单已占用，可继续编辑')}function submitPlan(){let q=quotes().find(q=>q.name===wizard.courier);if(!q.ok&&!wizard.riskAck){wizard.step=3;showWizard();$('wizardError').textContent='时效已变化，请重新确认风险。';return}let p=buildPlan('confirmed');persistPlan(p);detail(p.id);toast('计划已确认，可选择演示同步结果')}function editDraft(id){let p=state.plans.find(p=>p.id===id);wizard={...p,orderIds:[...p.orderIds],editId:id,step:2};showWizard()}
function detail(id){let p=state.plans.find(p=>p.id===id),r=risk(p),d=deadlines(p);let body=`<div class="notice ${r.cls==='bad'?'bad':r.cls==='warn'?'warn':''}">${r.label} · 距要求到货 ${p.due<now()?'已超时':'还剩'} ${duration(p.due-now())}<br>最晚同步 ${stamp(d.sync)} · 最晚发货 ${stamp(d.ship)}</div><div class="grid"><div class="card"><h3>订单与收货</h3><p>${esc(p.customer)}<br>${esc(p.address)}</p>${p.orderIds.map(id=>{let o=state.orders.find(o=>o.id===id);return `<p><b>${esc(id)}</b><small style="display:block">原订单 ${esc(o.source)} · 下单 ${stamp(o.created)}</small>${o.items.map(i=>esc(i.name)+' × '+i.qty).join('；')}</p>`}).join('')}</div><div class="card"><h3>配送与费用</h3><p>${esc(p.courier||'草稿未选择快递')} · ${p.boxes} 箱<br>${p.warehouse?'入仓：'+esc(p.warehouseName):'普通配送'}<br>毛重 ${(p.weight*p.boxes).toFixed(1)} kg · 体积 ${(p.length*p.width*p.height*p.boxes/1000000).toFixed(3)} m³</p><p>${p.status==='draft'?'草稿预估':'确认'}费用 <b>${money(p.cost)}</b><small style="display:block">运输 ${money(p.transport||0)} + 入仓 ${money(p.warehouse?p.fee:0)}<br>实际费用待结算</small></p><p>旺店通单据：${esc(p.wdt||'尚未同步')}</p><small>${esc(p.note||'无配送备注')}</small>${p.reason?'<p>人工选择原因：'+esc(p.reason)+'</p>':''}</div><div class="card full"><h3>同步与发货记录</h3><div class="timeline">${p.logs.map(s=>'<p>'+esc(s)+'</p>').join('')}</div>${p.sync==='failed'?'<div class="notice bad">演示失败：物流编码映射缺失。修复映射后重试，复用相同计划编号，避免重复创建。</div>':''}${p.shipped?'<div class="notice">演示物流单号：DEMO-'+p.id.slice(-3)+'；实际发货 '+stamp(p.actualShip)+'；尚未确认签收。</div>':''}</div></div>`;let buttons='';if(p.status==='draft')buttons=`<button class="primary" onclick="editDraft('${id}')">继续编辑</button>`;else if(p.status!=='cancelled'&&!p.shipped){if(['none','failed'].includes(p.sync))buttons=`<button onclick="syncPlan('${id}',true)">模拟同步失败</button><button class="primary" onclick="syncPlan('${id}',false)">${p.sync==='failed'?'修复映射并重试':'模拟同步成功'}</button>`;else if(p.sync==='success')buttons=`<button class="primary" onclick="shipPlan('${id}')">模拟旺店通发货回传</button>`}openModal('计划详情 · '+id,'同步状态与出库发货状态分别管理',body,`<div>${p.status!=='cancelled'&&!p.shipped?`<button class="danger" onclick="cancelAsk('${id}')">取消计划</button>`:''}</div><div class="bar">${buttons}<button onclick="closeModal()">关闭</button></div>`)}
function syncPlan(id,fail){let p=state.plans.find(p=>p.id===id);if(!p||!['none','failed'].includes(p.sync)||p.status!=='confirmed'||busy)return;busy=true;p.sync='loading';p.logs.push('开始演示同步，业务标识 '+p.id);detail(id);document.querySelectorAll('#modal button').forEach(b=>b.disabled=true);render();setTimeout(()=>{p.sync=fail?'failed':'success';if(!fail)p.wdt='WDT-DEMO-'+p.id;p.logs.push(stamp(now())+' · '+(fail?'模拟同步失败：物流编码映射缺失':'模拟同步成功，等待旺店通出库发货'));busy=false;save();render();detail(id);toast(fail?'同步失败，输入已保留，可修复后重试':'同步成功，等待旺店通发货回传')},900)}
function shipPlan(id){let p=state.plans.find(p=>p.id===id);if(p.sync!=='success'||p.shipped||p.status==='cancelled')return;p.shipped=true;p.actualShip=now();p.logs.push(stamp(now())+' · 模拟旺店通全部发货回传，数量与计划一致');p.orderIds.forEach(id=>state.orders.find(o=>o.id===id).status='shipped');save();render();detail(id);toast('已回传实际发货时间及演示物流单号')}
function cancelAsk(id){let p=state.plans.find(p=>p.id===id);openModal('取消计划',id,`<div class="notice warn">${p.sync==='success'?'已同步旺店通，演示先模拟撤销外部单据成功，再取消本地计划。正式系统需检查仓库作业状态。':'取消后释放订单占用，可重新安排计划。'}</div><label for="cancelReason">取消原因 *</label><textarea id="cancelReason" placeholder="填写取消原因"></textarea><p id="cancelError" role="alert" style="color:var(--red)"></p>`,`<button onclick="detail('${id}')">返回详情</button><button class="danger" onclick="cancelPlan('${id}')">${p.sync==='success'?'模拟撤销成功并取消':'确认取消'}</button>`)}
function cancelPlan(id){let reason=$('cancelReason').value.trim();if(!reason){$('cancelError').textContent='请填写取消原因。';return}let p=state.plans.find(p=>p.id===id);if(p.shipped)return;p.status='cancelled';p.logs.push((p.sync==='success'?'模拟旺店通撤销成功；':'')+'取消计划：'+reason);p.orderIds.forEach(id=>state.orders.find(o=>o.id===id).status='ready');save();closeModal();render();toast('计划已取消，订单占用已释放')}
function settingsView(){let c=state.config;return `<div class="titlebar"><div><h1>物流与预警配置</h1><div class="muted">使用示例价格和时效，验证低价优先与倒计时逻辑。</div></div><button onclick="resetAsk()">重置演示数据</button></div><div class="notice">时效单位为连续小时，示例未覆盖节假日、截单时间和偏远地区。配置修改仅影响新报价；历史计划保留参数与费用快照。</div><div class="grid"><div class="card"><h2>时效与计费参数</h2><form onsubmit="saveSettings(event)"><div class="grid">${[['process','仓库处理时长（小时）'],['buffer','安全缓冲（小时）'],['warn','截止前预警（小时）'],['divisor','体积重量系数（cm³/kg）']].map(([k,t])=>`<div class="field"><label for="cfg-${k}">${t}</label><input id="cfg-${k}" required type="number" min="${k==='divisor'?1:0}" max="${k==='divisor'?100000:720}" step="1" value="${c[k]}"></div>`).join('')}</div><p class="help" style="margin-top:16px">最晚同步 = 到货要求 − 运输时长 − 安全缓冲 − 仓库处理时长。</p><button class="primary" type="submit">保存配置</button><p id="configResult" role="status"></p></form></div><div class="card"><h2>业务规则</h2><p>① 先拆合单再建计划，商品数量守恒。</p><p>② 合单保留最早下单及最早到货要求。</p><p>③ 满足服务和时效的快递中，优先总费用最低。</p><p>④ 非推荐方案需填写原因，晚到方案需确认风险。</p><p>⑤ 草稿和确认计划占用订单，取消后释放。</p><p>⑥ 旺店通执行出库发货，已发货禁止取消。</p></div><div class="panel full"><div class="panelhead"><h2 style="margin:0">快递收费与时效 · 示例配置</h2></div><div class="tablewrap"><table><thead><tr><th>快递公司</th><th>首重 1kg</th><th>续重 / kg</th><th>运输时长</th><th>入仓能力</th><th>计费方式</th></tr></thead><tbody><tr><td>中通快递</td><td>¥9.00</td><td>¥1.10</td><td>60 小时</td><td>不支持（示例）</td><td rowspan="3">每箱取毛重与体积重较大值，向上取整到 kg</td></tr><tr><td>申通快递</td><td>¥11.00</td><td>¥1.40</td><td>48 小时</td><td>支持（示例）</td></tr><tr><td>顺丰速运</td><td>¥22.00</td><td>¥2.40</td><td>24 小时</td><td>支持（示例）</td></tr></tbody></table></div></div></div>`}
function saveSettings(e){e.preventDefault();let c={};for(let k of ['process','buffer','warn','divisor'])c[k]=Number($('cfg-'+k).value);state.config=c;save();$('configResult').textContent='配置已保存，下次报价使用新参数。';toast('物流与预警配置已保存')}
function courierSettings(){return `<div class="panel" style="margin-top:16px"><div class="panelhead"><h2 style="margin:0">调整承运商配置</h2><small>上方为默认示例，下方为当前生效配置</small></div><div class="tablewrap"><table><thead><tr><th>承运商</th><th>首重 / 续重</th><th>运输时长</th><th>入仓服务</th><th>状态</th><th>操作</th></tr></thead><tbody>${state.couriers.map((q,i)=>`<tr><td>${q.name}</td><td>${money(q.first)} / ${money(q.next)}</td><td>${q.transit} 小时</td><td>${q.warehouse?'支持':'不支持'}</td><td>${badge(q.enabled?'启用':'停用',q.enabled?'good':'warn')}</td><td><button class="link" onclick="editCourier(${i})">编辑收费与时效</button></td></tr>`).join('')}</tbody></table></div></div>`}
function editCourier(i){let q=state.couriers[i];openModal('编辑承运商配置',q.name+' · 仅影响新的报价',`<form id="rateForm" onsubmit="saveCourier(event,${i})"><div class="grid">${[['first','首重 1kg（元）'],['next','续重每 kg（元）'],['transit','预计运输时长（小时）']].map(([k,t])=>`<div class="field"><label for="rate-${k}">${t}</label><input id="rate-${k}" type="number" min="${k==='transit'?1:0}" step="${k==='transit'?1:0.01}" required value="${q[k]}"></div>`).join('')}<div class="field"><label for="rate-warehouse">入仓能力</label><select id="rate-warehouse"><option value="yes" ${q.warehouse?'selected':''}>支持送仓</option><option value="no" ${!q.warehouse?'selected':''}>不支持送仓</option></select></div><label class="checkline"><input id="rate-enabled" type="checkbox" ${q.enabled?'checked':''}>启用该承运商</label></div><p id="rateError" style="color:var(--red)" role="alert"></p></form>`,`<button onclick="closeModal()">取消</button><button class="primary" type="submit" form="rateForm">保存承运商配置</button>`)}
function saveCourier(e,i){e.preventDefault();let q={...state.couriers[i]};for(let k of ['first','next','transit'])q[k]=Number($('rate-'+k).value);q.warehouse=$('rate-warehouse').value==='yes';q.enabled=$('rate-enabled').checked;if(!q.enabled&&!state.couriers.some((r,n)=>n!==i&&r.enabled)){$('rateError').textContent='至少保留一家启用的承运商。';return}state.couriers[i]=q;save();closeModal();render();toast('承运商配置已保存，新计划将重新比价')}
function resetAsk(){openModal('重置演示数据','仅影响当前浏览器',`<p>删除本原型保存的拆合单结果、计划和配置，恢复初始示例。与真实业务系统无关。</p>`,`<button onclick="closeModal()">保留当前数据</button><button class="danger" onclick="state=seed();save();selected.clear();closeModal();render();toast('已恢复初始演示数据')">确认重置</button>`)}
$('modal').addEventListener('cancel',e=>{if(busy)e.preventDefault()});render();setInterval(()=>{if(!$('modal').open&&!['INPUT','SELECT'].includes(document.activeElement.tagName))render()},60000);
</script></body></html>
