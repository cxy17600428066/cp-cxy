function mergeOrders(){if(!planner())return;let list=state.orders.filter(o=>selected.has(o.id)&&o.status==='ready');if(list.length<2||!compatible(list)){toast('请选择同客户、同地址、同温层的待计划订单');return}showModal('确认合并订单','合并后商品数量守恒，保留来源订单',`<p>${list.map(o=>esc(o.id)).join(' ＋ ')}</p><p>要求到货取最早值：${fmt(Math.min(...list.map(o=>o.due)))}</p>`,`<button onclick="closeModal()">返回</button><button class="primary" onclick="confirmMerge()">确认合并</button>`)}
function confirmMerge(){if(!planner())return;let list=state.orders.filter(o=>selected.has(o.id)&&o.status==='ready');if(list.length<2||!compatible(list))return;let items=[];list.forEach(o=>o.items.forEach(i=>{let x=items.find(x=>x.sku===i.sku);x?x.qty+=i.qty:items.push({...i})}));state.orders.push({...list[0],id:'MG-'+state.seq++,source:list.map(o=>o.source).join(' / '),items,created:Math.min(...list.map(o=>o.created)),due:Math.min(...list.map(o=>o.due))});list.forEach(o=>o.status='processed');selected.clear();save();closeModal();render();toast('合单完成，可创建计划')}
function splitOrder(){if(!planner())return;let o=state.orders.find(o=>selected.has(o.id)&&o.status==='ready');if(!o)return;showModal('拆分订单',o.id+' · 分为A、B两个订单',`<div class="grid">${o.items.map((i,n)=>`<div class="field"><label for="split-${n}">${esc(i.name)}，总量 ${i.qty}，A订单数量</label><input id="split-${n}" type="number" min="0" max="${i.qty}" value="${Math.ceil(i.qty/2)}"><small>B订单为剩余数量</small></div>`).join('')}</div><p id="error" class="err" role="alert"></p>`,`<button onclick="closeModal()">返回</button><button class="primary" onclick="confirmSplit('${o.id}')">确认拆分</button>`)}
function confirmSplit(id){if(!planner())return;let o=state.orders.find(o=>o.id===id),a=[],b=[];for(let n=0;n<o.items.length;n++){let i=o.items[n],v=Number($('split-'+n).value);if(!Number.isInteger(v)||v<0||v>i.qty){$('error').textContent='数量需为不超过原数量的非负整数。';return}if(v)a.push({...i,qty:v});if(i.qty-v)b.push({...i,qty:i.qty-v})}if(!a.length||!b.length){$('error').textContent='两个订单均需至少一件商品。';return}for(let items of[a,b])state.orders.push({...o,id:'SP-'+state.seq++,items});o.status='processed';selected.clear();save();closeModal();render();toast('拆单完成')}
const same=(a,b)=>String(a).replace(/市$/,'')===String(b).replace(/市$/,'');
function cities(){return [...new Set([...RATE_DB.sfCold,...RATE_DB.kyLand].map(r=>r[1]))].sort((a,b)=>a.localeCompare(b,'zh'))}function districts(city){return [...new Set([...RATE_DB.sfDelivery,...RATE_DB.ztoDelivery].filter(r=>same(r[1],city)).map(r=>r[2]))].sort((a,b)=>a.localeCompare(b,'zh'))}
function roundWeight(w){return state.config.rounding==='ceil'?Math.ceil(w):w}function clamp(v,min,max){return Math.min(Math.max(v,min),max)}
function quoteProducts(w){let gross=w.weight*w.boxes,volume=w.length*w.width*w.height*w.boxes,config=state.config;return PRODUCTS.filter(p=>p.temp===w.temp).map(p=>{let vol=volume/p.divisor,bill=p.id==='zto'?Math.ceil(Math.max(gross,vol)):roundWeight(Math.max(gross,vol)),pending=[],rows=[],transport=null,delivery=0,entry=w.warehouse&&p.temp==='normal'?60:0,rate=null,transit=Number(config.transit[p.id])||null,support=true;let route=(RATE_DB[p.id==='zto'?'ztoPort':p.id]||[]).find(r=>same(r[1],w.city));
if(!route){pending.push('未找到该目的城市的合作报价，请人工询价')}else if(p.temp==='normal'){let mode=p.company==='ky'?config.kyMode:config.sfMode;if(mode==='pending')pending.push('起重与首重适用方式待确认');if(config.rounding==='pending')pending.push('重量进位方式待确认');let charge=mode==='first50'?Math.max(bill,50):Math.max(bill,route[3]||50),first=mode==='first50'?50:1;rate=route[5+(charge<=100?0:charge<=300?1:charge<=500?2:charge<=1000?3:4)];let ref=route[2]+Math.max(0,charge-first)*rate;if(route[4]!=null)ref=Math.max(ref,route[4]);if(mode!=='pending'&&config.rounding!=='pending'){bill=charge;transport=ref}rows.push(['运输算法',`首重${route[2]}元 ＋（计费重－首重重量）×${rate}元/kg`],['报价表起重',route[3]+'kg'+(route[4]!=null?'；最低运费'+route[4]+'元':'')]);if(w.warehouse)entry=60;
}else if(p.company==='sf'){let cuts=p.id==='sfCold'?[200,500]:[1000,3000],i=bill<=cuts[0]?0:bill<=cuts[1]?1:2;rate=route[3+i];let coeff=i===0?0:route[i===1?6:7],raw=bill*rate+coeff;rows.push(['阶梯运输参考',`${bill.toFixed(2)}×${rate}＋${Number(coeff.toFixed(6))}；最低收费${route[2]}元`],['协议折扣','仅运输费×0.62，配送费不打折；不计提货费']);if(config.coldFormula==='pending')pending.push('Word首重通式与Excel阶梯累计的适用口径待确认');if(config.discountFloor==='pending')pending.push('0.62折扣与最低收费先后顺序待确认');if(config.rounding==='pending')pending.push('重量进位方式待确认');if(config.coldFormula==='progressive'&&config.discountFloor!=='pending'&&config.rounding!=='pending')transport=config.discountFloor==='before'?Math.max(route[2],raw)*.62:Math.max(route[2],raw*.62);
if(p.id==='sfPort'){let r=RATE_DB.sfDelivery.find(r=>same(r[1],w.city)&&r[2]===w.district);if(!r){delivery=null;pending.push('未匹配到收货区县配送费')}else if(r[7]!=='Y'){support=false;delivery=null;pending.push('该区县配送标记为不支持，需人工确认承运')}else if(bill>6000){delivery=null;pending.push('6吨以上配送封顶规则待确认')}else if(config.sfCap==='pending'){delivery=null;pending.push('配送封顶重量区间待确认')}else delivery=clamp(bill*r[3],r[4],bill<=2000?r[5]:r[6]);rows.push(['到港配送规则',r?`${r[3]}元/kg；最低${r[4]}元；2T封顶${r[5]}元，6T封顶${r[6]}元`:'区县未匹配'])}
if(w.warehouse){if(config.entryBasis==='pending'){entry=null;pending.push('入仓费采用实际重或计费重待确认')}else entry=clamp(.2*(config.entryBasis==='actual'?gross:bill),100,800)}
}else{let i=bill<=1000?0:bill<=3000?1:2;rate=route[3+i];transport=Math.round(Math.max(route[2],bill*rate));rows.push(['港到港',`${bill}kg×${rate}元/kg，最低${route[2]}元；金额四舍五入`]);let r=RATE_DB.ztoDelivery.find(r=>same(r[1],w.city)&&r[2]===w.district);if(!r){delivery=null;pending.push('未匹配到收货区县配送费')}else if(r[3]===0||r[4]>r[5]){delivery=null;pending.push('区县配送报价异常，需人工核价')}else if(bill>2000&&config.ztoCap==='pending'){delivery=null;pending.push('超过2吨的配送封顶规则待确认')}else delivery=bill<=2000?clamp(bill*r[3],r[4],r[5]):Math.max(bill*r[3],r[4]);rows.push(['港到门',r?`${r[3]}元/kg；最低${r[4]}元；2T封顶${r[5]}元`:'区县未匹配']);if(w.warehouse){if(config.entryBasis==='pending'||config.ztoEntry==='pending'){entry=null;pending.push('中通入仓重量口径及不足一吨计费待确认')}else{let wt=config.entryBasis==='actual'?gross:bill;entry=(config.ztoEntry==='proportional'?wt/1000:Math.ceil(wt/1000))*100}}}
if(!transit)pending.push('合作资料未给出线路时效，需人工确认');let total=[transport,delivery,entry].every(Number.isFinite)&&!pending.some(s=>!s.includes('时效'))?transport+delivery+entry:null;let manual=w.product===p.id&&Number(w.manualTotal)>0&&w.manualSource?.trim();if(manual){total=Number(w.manualTotal);if(Number(w.manualHours)>0)transit=Number(w.manualHours);pending=pending.filter(s=>s.includes('时效'));if(transit)pending=[];rows.push(['人工确认',w.manualSource]);}let arrive=transit?Math.max(now()+config.process*H,w.plannedShip?new Date(w.plannedShip).getTime():0)+(transit+config.buffer)*H:null,onTime=arrive!=null&&arrive<=w.due;rows.push(['运输费',money(transport)],['配送费',delivery===0?'不另计':money(delivery)],['入仓费',!w.warehouse?'不入仓':money(entry)]);return {...p,product:p.id,vol,gross,bill,transport,delivery,entry,rate,rows,pending,total,transit,arrive,onTime,support,manual:!!manual,source:p.source,ready:support&&Number.isFinite(total)&&!!transit,onTimeText:arrive?(onTime?'预计满足到货要求':'预计晚到 '+duration(arrive-w.due)):'预计到货待确认'}}).sort((a,b)=>(a.total??Infinity)-(b.total??Infinity))}
function optionField(key,label,choices){return `<div class="field"><label for="cfg-${key}">${label}</label><select id="cfg-${key}">${choices.map(([v,t])=>`<option value="${v}" ${state.config[key]===v?'selected':''}>${t}</option>`).join('')}</select></div>`}
function rulesView(){return `<div class="between title"><div><h1>物流计费规则</h1><div class="muted">业务规则以 Word 为准，线路与区县单价取 Excel；保留待确认条件。</div></div><button onclick="resetAsk()">重置演示数据</button></div><div class="notice"><b>规则优先级已锁定：Word ＞ Excel冲突条款。</b><br>跨越入仓统一60元/票/地址，不使用Excel的100元；中通入仓不套用Excel中与Word未统一的500元封顶。未选择的待确认口径不会自动生效。</div><div class="panel section"><div class="panelhead"><h2>合作物流与业务规则</h2><small>来源：《物流计费明细.docx》；当前线路均按所提供的马鞍山始发报价使用</small></div><div class="tablewrap"><table class="rules"><thead><tr><th>温层 / 合作物流</th><th>物流产品</th><th>体积重系数</th><th>运输与配送</th><th>入仓费</th></tr></thead><tbody><tr><td>常温 · 跨越</td><td>陆运件 / 省内次日</td><td>8000</td><td>按线路及重量段匹配</td><td>60元/票/地址</td></tr><tr><td>常温 · 顺丰</td><td>重货</td><td>8000</td><td>按线路及重量段匹配</td><td>60元/票/地址</td></tr><tr><td>冷运 · 顺丰</td><td>大件标快</td><td>3000</td><td>运输费×0.62<br>不计配送费、提货费</td><td rowspan="2">0.2元/kg<br>最低100元、最高800元</td></tr><tr><td>冷运 · 顺丰</td><td>大件到港</td><td>3000</td><td>运输费×0.62＋配送费<br>不计提货费</td></tr><tr><td>冷运 · 中通</td><td>冷链</td><td>3300</td><td>港到港＋港到门</td><td>100元/吨<br>不足一吨及重量口径待确认</td></tr></tbody></table></div><div class="footer">体积重 = 长×宽×高（cm）÷系数；实际重和体积重取大计费。一个计划对应一个收货地址、一票。</div></div><form onsubmit="saveConfig(event)"><div class="grid section"><div class="card full"><h2>待确认计费口径</h2><p class="muted">以下项目Word没有明确完整参数。由计划部确认后再选择；更改仅用于新的报价，历史计划保留快照。</p><div class="grid">${optionField('kyMode','跨越起重 / 首重适用方式',[['pending','待确认，不自动计算总价'],['first1','已确认：首重1kg，起重作为最低计费重量'],['first50','已确认：起重50kg作为首重重量']])}${optionField('sfMode','顺丰常温起重 / 首重适用方式',[['pending','待确认，不自动计算总价'],['first50','已确认：50kg首重，超出后按区间单价'],['first1','已确认：首重1kg，起重作为最低计费重量']])}${optionField('rounding','顺丰 / 跨越重量进位',[['pending','待确认'],['ceil','已确认：向上进位至1kg'],['exact','已确认：按原始重量计算']])}${optionField('coldFormula','顺丰冷运运输算法',[['pending','待确认：Word首重通式与Excel阶梯参数'],['progressive','已确认：使用Excel阶梯累计及速算系数，不另加首重']])}${optionField('discountFloor','顺丰冷运最低收费与0.62折扣',[['pending','待确认'],['before','已确认：先执行最低收费，再乘0.62'],['after','已确认：折后仍执行原最低收费']])}${optionField('entryBasis','顺丰冷运 / 中通入仓费用重量',[['pending','待确认'],['actual','已确认：实际重量'],['bill','已确认：该物流计费重量']])}${optionField('ztoEntry','中通不足一吨的入仓费',[['pending','待确认'],['proportional','已确认：按实际吨数比例收费'],['ceil','已确认：不足一吨按一吨收费']])}${optionField('sfCap','顺丰到港区县配送封顶',[['pending','待确认'],['ranges','已确认：≤2T用2T封顶，2–6T用6T封顶；>6T待确认']])}${optionField('ztoCap','中通超过2吨的配送封顶',[['pending','待确认'],['uncapped','已确认：2吨以上按单价及最低收费，不应用2T封顶']])}</div></div><div class="card"><h2>时效与预警</h2><div class="grid">${[['process','仓库处理（小时）'],['buffer','安全缓冲（小时）'],['warn','截止前预警（小时）']].map(([k,t])=>`<div class="field"><label for="cfg-${k}">${t}</label><input id="cfg-${k}" type="number" min="0" max="720" required value="${state.config[k]}"></div>`).join('')}</div><p class="source">最晚发货＝客户到货要求－运输时长－安全缓冲。最晚备货再减仓库处理时长。</p></div><div class="card"><h2>合作线路时效补充</h2><p class="muted">资料未提供完整时效。以下为人工确认参数，仅用于本原型；正式应用应按线路配置。</p><div class="grid">${PRODUCTS.map(p=>`<div class="field"><label for="hours-${p.id}">${p.name}（小时）</label><input id="hours-${p.id}" type="number" min="1" max="720" value="${state.config.transit[p.id]||''}" placeholder="待确认"></div>`).join('')}</div></div></div><div class="row section"><button class="primary" type="submit">保存已确认口径</button><span id="configResult" role="status" class="muted">保留“待确认”即可暂不启用对应计算。</span></div></form><div class="panel"><div class="between panelhead"><h2 style="margin:0">合作线路价格查询</h2><button onclick="routePreview()">选择城市与产品查询</button></div><div class="footer">已内置提供的城市干线与区县配送数据，不引用外部价格。跨越报价表执行日期为2025-05-24，继续使用前请核实有效性。</div></div>`}
function saveConfig(e){e.preventDefault();if(!planner())return;let keys=['kyMode','sfMode','rounding','coldFormula','discountFloor','entryBasis','ztoEntry','sfCap','ztoCap'];keys.forEach(k=>state.config[k]=$('cfg-'+k).value);for(let k of ['process','buffer','warn'])state.config[k]=Number($('cfg-'+k).value);for(let p of PRODUCTS)state.config.transit[p.id]=Number($('hours-'+p.id).value)||null;save();$('configResult').textContent='已保存。新的物流比价将使用这些口径；历史费用不变。';toast('计费口径与时效配置已保存')}
function routePreview(){if(!planner())return;showModal('查询合作线路报价','原始Excel数据查询，不代表已确认完整费用',`<div class="grid section"><div><label for="routeProduct">物流产品</label><select id="routeProduct" onchange="updateRoute()">${PRODUCTS.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></div><div><label for="routeCity">收货城市</label><select id="routeCity" onchange="updateRoute()">${cities().map(c=>`<option ${c==='上海市'?'selected':''}>${esc(c)}</option>`).join('')}</select></div></div><div id="routeInfo"></div>`);updateRoute()}
function updateRoute(){let id=$('routeProduct').value,city=$('routeCity').value,p=PRODUCTS.find(p=>p.id===id),r=RATE_DB[id==='zto'?'ztoPort':id].find(r=>same(r[1],city));if(!r){$('routeInfo').innerHTML='<div class="notice warn">未匹配到城市报价。请人工询价，不能按0元处理。</div>';return}let info=id==='zto'?[['最低运输费',r[2]+'元'],['0–1T / 1–3T / 3T以上（元/kg）',r.slice(3).join(' / ')]]:p.temp==='normal'?[['首重价格',r[2]+'元'],['起重',r[3]+'kg'],['最低运输费',r[4]==null?'表中未单列':r[4]+'元'],['(1,100] / (100,300] / (300,500] / (500,1000] / (1000,+∞)（元/kg）',r.slice(5).join(' / ')]]:[['最低运输费',r[2]+'元'],[id==='sfCold'?'0–200 / 200–500 / 500以上kg（元/kg）':'0–1 / 1–3 / 3以上吨（元/kg）',r.slice(3,6).join(' / ')],['速算系数',r.slice(6).map(v=>+v.toFixed(6)).join(' / ')]];let districtRows=id==='sfPort'?RATE_DB.sfDelivery.filter(r=>same(r[1],city)):id==='zto'?RATE_DB.ztoDelivery.filter(r=>same(r[1],city)):[];$('routeInfo').innerHTML=`<div class="card section"><h3>马鞍山市 → ${esc(city)} · ${p.name}</h3>${info.map(([k,v])=>`<p>${esc(k)}：<b>${esc(v)}</b></p>`).join('')}<small>来源：${esc(p.source)}</small></div>${districtRows.length?`<h3>区县配送费用</h3><div class="tablewrap"><table><thead><tr><th>区县</th><th>元/kg</th><th>最低收费</th><th>2T封顶</th>${id==='sfPort'?'<th>6T封顶</th><th>配送</th>':''}</tr></thead><tbody>${districtRows.map(r=>`<tr><td>${esc(r[2])}</td><td>${r[3]}</td><td>${r[4]}</td><td>${r[5]}</td>${id==='sfPort'?`<td>${r[6]}</td><td>${r[7]==='Y'?'支持':'不支持 / 待确认'}</td>`:''}</tr>`).join('')}</tbody></table></div>`:''}`}
function resetAsk(){if(!planner())return;showModal('重置演示数据','仅影响当前浏览器','<p>清除本原型的计划、拆合单结果及已确认口径，恢复初始演示数据。</p>','<button onclick="closeModal()">保留数据</button><button class="danger" onclick="resetData()">确认重置</button>')}

saveActiveFreight=function(){if(wizard?.comboRepairKey)combinationPreviousSaveActive()};
function openCombinationQuote(key){wizard.comboRepairKey=key;loadFreightGroup(key);showWizard()}
function closeCombinationQuote(){combinationPreviousSaveActive();let g=wizard.freightGroups.find(g=>g.key===wizard.comboRepairKey);let q=g&&orderBaseQuoteProducts({...wizard,...g,temp:g.temp==='normal'?'normal':'cold'}).find(q=>q.id===g.product);if(g)g.quoteOverrides=(g.quoteOverrides||[]).filter(v=>v.fields.product!==g.product);if(q?.ready){let fields=Object.fromEntries(freightFields.map(k=>[k,g[k]]));g.quoteOverrides.push({packageKey:comboPackageKey(wizard,g),fields});if(g.temperatureConfirmed){g.temperatureSupport||={};g.temperatureSupport[q.id]=true}}wizard.comboRepairKey=null;wizard.activeFreightKey=null;wizard.selectedCombinations={};showWizard()}
showWizard=function(){
 if(!planner()||wizard?.mode!=='plan')return;
 if(wizard.step!==3&&wizard.step!==4){combinationPreviousWizard();if(wizard.step===2){let hint=$('modalBody').querySelector('.section>p.muted');if(hint)hint.textContent='填写商品温层及各温层实际包裹，系统自动计算常温物流＋冷运物流的整单组合总价，并按总价优先低价推荐。'}return}
 if(wizard.step===3&&wizard.comboRepairKey){combinationPreviousWizard();$('modalTitle').textContent='补充报价 · '+wizard.comboRepairKey.replace('|',' · ');$('modalFoot').innerHTML='<button class="primary" onclick="closeCombinationQuote()">应用报价并返回整单比价</button>';return}
 syncCombinationSelection();let steps='<div class="steps">'+['选择订单','商品与包裹','整单组合比价','确认下达'].map((t,i)=>`<span class="${wizard.step===i+1?'active':''}">${i+1}. ${t}</span>`).join('')+'</div>';
 let body=steps+(wizard.step===3?'<div class="notice"><b>直接比较整单运费，推荐总价最低的物流组合</b><br>常温报价＋冷运报价＝订单总运费；先满足温层、承运范围及到货要求，再按完整组合总价排序。冷藏与冷冻保留各自包装，按各自费用汇总至冷运部分。</div>'+wizard.orderIds.map(orderCombinationPanel).join(''):'<div class="notice">确认整单组合、总价及费用构成，下达后仓库只读查看结果。</div>'+orderFreightHtml(wizard)+requestSummary(wizard));
 body+='<p id="error" class="err" role="alert"></p>';showModal(wizard.step===3?'整单物流组合与最低总价':'确认订单物流组合','计划部制定完整方案 · 仓库查看结果',body,`<button onclick="previousStep()">上一步</button><div class="row">${!wizard.editingPublished?'<button onclick="saveDraft()">保存草稿</button>':''}<button class="primary" onclick="${wizard.step===4?'publishPlan()':'nextStep()'}">${wizard.step===4?'下达结果给仓库':'确认组合，下一步'}</button></div>`)
};
const combinationPreviousFreightQuote=freightQuote;
freightQuote=function(p,g){return g.comboQuote||combinationPreviousFreightQuote(p,g)};
const combinationPreviousAggregate=freightAggregate;
freightAggregate=function(p){let q=combinationPreviousAggregate(p);if(Number.isFinite(q.total))q.total=Math.round(q.total*100)/100;return q};
const combinationPreviousValidStep=validStep;
validStep=function(){if(wizard?.mode!=='plan'||wizard.step<3)return combinationPreviousValidStep();if(wizard.comboRepairKey){$('error').textContent='请先应用报价，返回整单组合比价。';return false}for(let id of wizard.orderIds){let combos=buildOrderCombinations(wizard,id),selected=combos.find(c=>c.key===wizard.selectedCombinations?.[id]);let err='';if(!selected?.priced)err='报价或时效不完整，请补充后重新比价。';else if(selected.parts.some(x=>x.group.temp!=='normal'&&!x.group.temperatureSupport?.[x.quote.id]))err='请确认所选组合的冷运产品支持对应温层。';else if(!selected.onTime&&!wizard.combinationRisk?.[id])err='请先确认晚到风险或选择符合时效的组合。';else if(selected.key!==combos[0]?.key&&!wizard.combinationReasons?.[id]?.trim())err='请填写选择较高价组合的原因。';if(err){$('error').textContent=id+'：'+err;return false}chooseCombination(id,selected.key)}return true};
const combinationPreviousPackage=freightPackage;
freightPackage=function(key,field,value){combinationPreviousPackage(key,field,value);const g=wizard.freightGroups.find(g=>g.key===key);delete g.comboQuote;g.quoteOverrides=[];g.temperatureSupport={};wizard.selectedCombinations={}};
const combinationPreviousItemTemperature=changeItemTemperature;
changeItemTemperature=function(id,index,temp){wizard.selectedCombinations={};combinationPreviousItemTemperature(id,index,temp)};
// 展示以整单总价和承运组合为主，温层费用为辅助说明。
orderFreightHtml=function(p){let groups=p.freightGroups||p.estimate?.orderTemperatureQuotes||[],allComplete=true,grand=0;let content=(p.orderIds||[]).map(id=>{let gs=groups.filter(g=>g.orderId===id),parts=gs.map(g=>({group:g,quote:g.quote||freightQuote(p,g)||{name:'待匹配物流',total:null}})),complete=parts.length>0&&parts.every(x=>Number.isFinite(x.quote.total)&&x.quote.ready!==false),total=complete?Math.round(parts.reduce((s,x)=>s+x.quote.total,0)*100)/100:null;if(!complete)allComplete=false;else grand+=total;let names=[...new Set(parts.map(x=>x.quote.name))].join(' ＋ ');return `<div class="order-combination-result"><div class="between"><b>订单 ${esc(id)}</b><strong class="combo-total">${complete?money(total):'总价待确认'}</strong></div><p class="combo-names">${esc(names||'待匹配物流组合')}</p><small>${esc(comboCostLines(parts))}</small></div>`}).join('');return `<div class="temperature-freight">${content}${p.orderIds.length>1?'<div class="temperature-freight-total"><span>计划预估运费合计</span><strong>'+ (allComplete?money(grand):'待确认')+'</strong></div>':''}</div>`};
const combinationPreviousPlansView=plansView;
plansView=function(){let host=document.createElement('div');host.innerHTML=combinationPreviousPlansView();host.querySelectorAll('thead th').forEach(th=>{if(th.textContent==='温层 / 物流 / 分项运费')th.textContent='整单预估运费 / 物流组合'});return host.innerHTML};

// 两种展示使用同一份组合报价，不改变推荐、选择或费用。
let freightDisplay='both';
function freightViewControls(context='list',id=''){return `<div class="freight-view-control"><span>运费展示</span><div class="freight-view-buttons" role="group" aria-label="运费展示方式">${[['total','整单组合'],['items','温层明细'],['both','同时展示']].map(([v,t])=>`<button type="button" aria-pressed="${freightDisplay===v}" class="${freightDisplay===v?'primary':''}" onclick="setFreightDisplay('${v}','${context}','${id}')">${t}</button>`).join('')}</div></div>`}
function setFreightDisplay(mode,context,id){if(!['total','items','both'].includes(mode))return;freightDisplay=mode;if(context==='detail')detail(id);else if(context==='wizard')showWizard();else render()}
const freightSummaryView=orderFreightHtml;
function freightItemView(p){let groups=p.freightGroups||p.estimate?.orderTemperatureQuotes||[],grand=0,all=true;return `<div class="temperature-freight freight-item-view">${(p.orderIds||[]).map(id=>{let gs=groups.filter(g=>g.orderId===id),subtotal=0,complete=gs.length>0;let body=gs.map(g=>{let q=g.quote||freightQuote(p,g),known=q?.ready!==false&&Number.isFinite(q?.total);if(known){subtotal+=q.total;grand+=q.total}else{complete=false;all=false}return `<div class="temperature-freight-row"><span>${badge(TEMP_NAMES[g.temp]||'温层待确认')}<span>${esc(q?.name||'待匹配物流')}<small>${(g.items||[]).map(i=>esc(i.name)+' × '+i.qty).join('；')}</small></span></span><strong>${known?money(q.total):'待核价'}</strong></div>`}).join('');if(!complete)all=false;return `<div class="order-combination-result"><b>订单 ${esc(id)}</b>${body}<div class="temperature-freight-total"><span>订单运费合计</span><strong>${complete?money(Math.round(subtotal*100)/100):'待确认'}</strong></div></div>`}).join('')}${p.orderIds?.length>1?`<div class="temperature-freight-total"><span>计划预估运费合计</span><strong>${all?money(Math.round(grand*100)/100):'待确认'}</strong></div>`:''}</div>`}
orderFreightHtml=function(p){if(freightDisplay==='total')return freightSummaryView(p);if(freightDisplay==='items')return freightItemView(p);return `<div class="freight-both-view"><div><small class="freight-view-label">整单组合</small>${freightSummaryView(p)}</div><div class="freight-detail-section"><small class="freight-view-label">温层明细</small>${freightItemView(p)}</div></div>`};
const freightViewsPlansView=plansView;
plansView=function(){let host=document.createElement('div');host.innerHTML=freightViewsPlansView();let bar=document.createElement('div');bar.className='freight-view-toolbar';bar.innerHTML=freightViewControls();host.querySelector('.panelhead')?.after(bar);host.querySelectorAll('thead th').forEach(th=>{if(th.textContent==='整单预估运费 / 物流组合')th.textContent=freightDisplay==='items'?'温层明细 / 运费合计':freightDisplay==='both'?'整单组合 / 温层费用':'整单预估运费 / 物流组合'});return host.innerHTML};
const freightViewsDetail=detail;
detail=function(id){freightViewsDetail(id);if(!$('modal').open)return;let block=$('modalBody').querySelector('.freight-both-view,.temperature-freight');if(!block)return;let controls=document.createElement('div');controls.className='section';controls.innerHTML=freightViewControls('detail',id);block.before(controls)};
const freightViewsWizard=showWizard;
showWizard=function(){freightViewsWizard();if(!planner()||wizard?.mode!=='plan'||wizard.comboRepairKey||![3,4].includes(wizard.step)||!$('modal').open)return;let controls=document.createElement('div');controls.className='section';controls.innerHTML=freightViewControls('wizard');let notice=$('modalBody').querySelector('.notice');if(notice)notice.after(controls);if(wizard.step===3){$('modalBody').querySelectorAll('details.breakdown').forEach(el=>el.open=freightDisplay!=='total');if(freightDisplay==='items')$('modalBody').querySelectorAll('.quotehead .info p').forEach(el=>el.hidden=true)}};

render();setInterval(()=>{if(!$('modal').open&&!['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))render()},60000);
</script></body></html>
