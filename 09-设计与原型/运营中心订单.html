</style><header><strong>卓希综合管理系统</strong><span>⌂ 首页</span><span class="on">OMS订单系统</span><span>标准库系统</span><span>CRM系统</span><span>绩效系统</span><span>BI报表系统</span><span class="user">陈薪宇</span></header><aside><div>⌂　首页</div><div>▣　订单中心　⌃</div><div class="sub">订单列表</div><div class="sub active">运营中心订单</div><div class="sub">一件代发订单</div><div class="sub">订单接单列表</div><div class="sub">预订单管理</div><div class="sub">样品订单</div><div>异常订单　⌄</div><div>售后退款　⌄</div><div>发货管理　⌄</div><div>钱包管理　⌄</div><div>客户管理　⌄</div><div>商品管理　⌄</div></aside><main><div class="crumb">首页 / 订单中心 <span>运营中心订单</span></div><div class="body"><section class="panel"><div class="title"><div><h1>运营中心订单</h1><p>集中查看运营中心代发与补货订单，追溯发货单及关联订单。</p></div><span class="demo">交互原型 · 示例数据</span></div><form id="search"><div class="filters"><label><span>订单编号</span><input id="number" placeholder="请输入订单编号"></label><label><span>业务类型</span><select id="type"><option value="">全部</option><option>运营中心代发</option><option>运营中心补货</option></select></label><label><span>运营中心</span><select id="center"><option value="">全部</option><option>新疆乌鲁木齐运营中心</option><option>武汉运营中心</option></select></label><label><span>客户名称</span><input id="customer" placeholder="请输入客户名称"></label><label><span>订单状态</span><select id="status"><option value="">全部</option><option>待发货</option><option>部分发货</option><option>已发货</option></select></label><label><span>创建开始</span><input id="start" type="date" aria-label="创建开始日期"></label><label><span>创建结束</span><input id="end" type="date" aria-label="创建结束日期"></label><label><span>关联单号</span><input id="related" placeholder="发货单 / 补货单编号"></label></div><div class="actions"><button class="primary" type="submit">⌕ 搜索</button><button type="button" id="reset">重置</button></div><p id="error" role="alert" style="color:#b42318"></p></form></section><section class="panel"><div class="tabs" role="tablist"><button role="tab" data-tab="" class="selected">全部</button><button role="tab" data-tab="运营中心代发">运营中心代发</button><button role="tab" data-tab="运营中心补货"> const $=id=>document.getElementById(id);let tab='',lastFocus;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function link(text,id,kind){return `<button class="link" data-id="${id}" data-kind="${kind}">${text}</button>`}function render(){let rows=data.filter(d=>(!tab||d.type===tab)&&(!$('type').value||d.type===$('type').value)&&d.id.includes($('number').value.trim())&&(!$('center').value||d.center===$('center').value)&&d.customer.includes($('customer').value.trim())&&(!$('status').value||d.status===$('status').value)&&(! $('start').value||d.date>=$('start').value)&&(!$('end').value||d.date<=$('end').value)&&[d.shipment,d.supply].join(' ').includes($('related').value.trim()));$('count').textContent=`当前 ${rows.length} 笔订单`;$('total').textContent=`共 ${rows.length} 条`;$('orders').innerHTML=rows.length?rows.map(d=>`<article class="order"><div class="orderhead"><span class="tag ${d.type.includes('补货')?'purple':''}">${d.type}</span><strong>订单编号：${d.id}</strong><span>运营中心：${d.center}</span><span>创建时间：${d.date} 13:10:03</span></div><div class="content"><div><div class="product"><div class="pack">脱骨侠<br>无骨鸡爪</div><div>【箱规】无骨鸡爪－脱骨侠－1000克－酸辣柠檬<br><span class="muted">12个月 · 冷冻 · 10袋×1箱</span><br><span class="tag">口味：酸辣柠檬</span></div></div></div><div>¥ ${d.price.toFixed(2)}<br>× ${d.qty} 箱</div><div class="money">¥ ${(d.qty*d.price).toFixed(2)}</div><div>客户：${d.customer}<br>收货人：${d.person}<br><span class="muted">${d.address}</span></div><div><span class="tag ${d.status==='已发货'?'green':'orange'}">${d.status}</span><br><span class="muted">${d.log||'物流信息：暂无'}</span>${d.replenish?`<br><span class="muted">${d.replenish}</span>`:''}</div><div>${link('订单详情',d.id,'订单详情')}${d.shipment?link('查看运营发货单',d.id,'运营发货单'):''}${d.supply?link('查看补货单',d.id,'补货单'):''}${d.other?link('查看关联订单',d.id,'关联订单'):''}</div></div><div class="links"><span>${d.type.includes('补货')?'来源':'关联'}补货单：${d.supply||'未生成'}</span><span>运营发货单：${d.shipment||'暂无'}</span><span>关联${d.type.includes('补货')?'代发':'补货'}订单：${d.other||'未生成'}</span></div></article>`).join(''):'<div class="empty">没有符合条件的运营中心订单<br><button onclick="reset()" style="margin-top:16px">清除筛选</button></div>';document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('selected',b.dataset.tab===tab);b.setAttribute('aria-selected',b.dataset.tab===tab)})}function reset(){$('search').reset();tab='';$('error').textContent='';render()}$('reset').onclick=reset;$('search').onsubmit=e=>{e.preventDefault();if($('start').value&&$('end').value&&$('start').value>$('end').value){$('error').textContent='结束日期不能早于开始日期，请调整后重新搜索。';return}$('error').textContent='';render()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;$('type').value='';render()});document.addEventListener('click',e=>{let b=e.target.closest('[data-id]');if(!b)return;lastFocus=b;let d=data.find(x=>x.id===b.dataset.id),kind=b.dataset.kind;if(kind==='关联订单'){d=data.find(x=>x.id===d.other)||{...d,id:d.other}}$('dt').textContent=kind;let fields=kind==='运营发货单'?[['发货单编号',d.shipment],['关联订单',d.id],['发货方',d.center],['发货状态',d.status],['物流信息',d.log||'待回传']]:kind==='补货单'?[['补货单编号',d.supply],['运营中心',d.center],['关联订单',d.id],['关联另一订单',d.other],['商品','无骨鸡爪 · 酸辣柠檬'],['数量',d.qty+' 箱']]:[['订单编号',d.id],['业务类型',d.type],['运营中心',d.center],['客户名称',d.customer],['收货人',d.person],['收货地址',d.address],['订单状态',d.status],['商品','无骨鸡爪 · 酸辣柠檬'],['数量',d.qty+' 箱'],['订单金额','¥ '+(d.qty*d.price).toFixed(2)],['物流信息',d.log||'暂无']];$('detail').innerHTML='<div class="notice">示例单据预览，正式接入后打开系统对应单据。</div><div class="detail">'+fields.map(([k,v])=>`<div><b>${esc(k)}</b>${esc(v)}</div>`).join('')+'</div>';$('overlay').classList.remove('hidden');$('close').focus()});function close(){$('overlay').classList.add('hidden');lastFocus?.focus()}$('close').onclick=close;$('overlay').onclick=e=>{if(e.target===$('overlay'))close()};document.addEventListener('keydown',e=>{if($('overlay').classList.contains('hidden'))return;if(e.key
