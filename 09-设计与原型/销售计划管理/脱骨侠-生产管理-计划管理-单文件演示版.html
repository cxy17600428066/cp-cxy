<body data-page="manage" class=""><div id="root"></div><script type="application/json" id="standaloneFlowSource">"<!doctype html>\n<html lang=\"zh-CN\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>脱骨侠 · 计划管理详细流程图</title>\n<style>\n:root{color-scheme:light;--ink:#1b2d4b;--line:#dbe4f2;--blue:#2962dc;--muted:#526582}*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:var(--ink);font:15px/1.7 \"Microsoft YaHei\",sans-serif}header,main{max-width:1280px;margin:auto;padding:24px}h1{margin:0;font-size:26px}header p{margin:8px 0;color:var(--muted)}nav{display:flex;flex-wrap:wrap;gap:8px}button{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:white;color:var(--ink);cursor:pointer}button[aria-selected=true]{background:var(--blue);color:white;border-color:var(--blue)}button:focus-visible,a:focus-visible{outline:3px solid #83abff;outline-offset:3px}.sheet{background:white;border:1px solid var(--line);border-radius:8px;padding:24px;margin:16px 0}.sheet h2{font-size:20px;margin:0 0 16px}.drawing{overflow:auto;min-height:120px}.drawing svg{display:block;margin:auto;max-width:none!important}.error{color:#a32c28}li{margin:8px 0}.rules{border-top:1px solid var(--line);margin-top:24px;padding-top:16px}.rules h3{margin:0;font-size:16px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.muted{color:var(--muted)}[hidden]{display:none!important}@media(max-width:600px){header,main{padding:16px}.sheet{padding:16px}h1{font-size:22px}}@media print{nav,.toolbar{display:none!important}header,main{max-width:none;padding:8px}body{background:white}.sheet{display:block!important;page-break-before:always;border:0}.drawing{overflow:visible}.drawing svg{max-width:100%!important;max-height:800px;width:auto!important;height:auto!important}.sheet:first-of-type{page-break-before:auto}}\n.swimlane-drawing{overflow:auto;width:100%;margin:16px 0}.swimlane-drawing svg{display:block;font-family:\"Microsoft YaHei\",sans-serif}@media print{@page{size:A3 landscape;margin:10mm}.swimlane-drawing{overflow:visible}.swimlane-drawing svg{width:100%;height:auto;max-height:820px}}\n</style></head><body><header><h1>生产管理 · 计划管理详细流程图</h1><p>按现有 V5 业务与原型代码整理 · 2026-10-14 · 线上领导已纳入审批链</p><nav role=\"tablist\" aria-label=\"流程章节\"><button id=\"flowTab0\" role=\"tab\" aria-controls=\"flowPanel0\" aria-selected=\"true\" data-chapter=\"0\">01 总览：独立月周、线上线下与确认生效</button><button id=\"flowTab1\" role=\"tab\" aria-controls=\"flowPanel1\" aria-selected=\"false\" data-chapter=\"1\">02 填报、提交校验与无需求申报</button><button id=\"flowTab2\" role=\"tab\" aria-controls=\"flowPanel2\" aria-selected=\"false\" data-chapter=\"2\">03 线下完整汇总审核</button><button id=\"flowTab3\" role=\"tab\" aria-controls=\"flowPanel3\" aria-selected=\"false\" data-chapter=\"3\">04 线上领导初审、丹总终审与任务确认</button><button id=\"flowTab4\" role=\"tab\" aria-controls=\"flowPanel4\" aria-selected=\"false\" data-chapter=\"4\">05 驳回重提、撤回与批量操作</button><button id=\"flowTab5\" role=\"tab\" aria-controls=\"flowPanel5\" aria-selected=\"false\" data-chapter=\"5\">06 数量与内容调整、撤销及版本生效</button><button id=\"flowTab6\" role=\"tab\" aria-controls=\"flowPanel6\" aria-selected=\"false\" data-chapter=\"6\">07 订单、售后、实际达成与月末复盘</button></nav><div class=\"toolbar\"><button id=\"printFlows\">打印全部流程 / 保存 PDF</button><span class=\"muted\">矩形为操作，菱形为判断；查看图下规则可核对范围与例外。</span></div></header><main><section class=\"sheet\" role=\"tabpanel\" id=\"flowPanel0\" aria-labelledby=\"flowTab0\" ><h2>01 总览：独立月周、线上线下与确认生效</h2><div class=\"drawing\" id=\"flowDrawing0\" aria-label=\"01 总览：独立月周、线上线下与确认生效\">正在生成流程图…</div><div class=\"rules\"><h3>节点规则与边界</h3><ul><li>月计划与周计划独立填报、审核、确认，不分解、不相加。</li><li>计划数量包含已有订单，是周期预计销售总量。</li><li>生产管理当前为第一阶段：需求计划，不直接生成生产工单。</li></ul></div><details><summary>查看可编辑流程源代码</summary><pre></pre></details></section><section class=\"sheet\" role=\"tabpanel\" id=\"flowPanel1\" aria-labelledby=\"flowTab1\" hidden><h2>02 填报、提交校验与无需求申报</h2><div class=\"drawing\" id=\"flowDrawing1\" aria-label=\"02 填报、提交校验与无需求申报\">正在生成流程图…</div><div class=\"rules\"><h3>节点规则与边界</h3><ul><li>月度完整自然月；周度周一至周日。</li><li>一个销售固定属于一个中心和大区，可负责多个省区；客户只有一位负责人。</li><li>客户明细层不能单独提交，必须提交本人整份省区计划；线上按整份渠道提交。</li><li>整份无需求必须没有商品明细；无需求原因与提交批次留痕，不造零数量商品。</li><li>清单未发布、窗口未开放、归属错误、商品停用、重复或范围不完整时保留输入并阻断提交。</li></ul></div><details><summary>查看可编辑流程源代码</summary><pre></pre></details></section><section class=\"sheet\" role=\"tabpanel\" id=\"flowPanel2\" aria-labelledby=\"flowTab2\" hidden><h2>03 线下完整汇总审核</h2><div class=\"drawing\" id=\"flowDrawing2\" aria-label=\"03 线下完整汇总审核\">正在生成流程图…</div><div class=\"rules\"><h3>节点规则与边界</h3><ul><li>三个中心：休食中心、餐饮中心、大客中心。</li><li>大区列表按省区；中心列表按大区；严总列表按中心。详情可逐级下钻客户，也可独立查看商品汇总及数量来源。</li><li>完整性按应填清单、负责人固定批次、内容/数量/版本、下级审核节点验证，不按当前搜索结果拼接审批对象。</li><li>本级已通过不表示已生效，上级完成后仍待计划部门确认。</li></ul></div><details><summary>查看可编辑流程源代码</summary><pre></pre></details></section><section class=\"sheet\" role=\"tabpanel\" id=\"flowPanel3\" aria-labelledby=\"flowTab3\" hidden><h2>04 线上领导初审、丹总终审与任务确认</h2><div class=\"drawing\" id=\"flowDrawing3\" aria-label=\"04 线上领导初审、丹总终审与任务确认\">正在生成流程图…</div><div class=\"rules\"><h3>节点规则与边界</h3><ul><li>线上没有中心、大区、省区、客户维度，只有渠道、商品、单位。</li><li>线上领导只初审线上，丹总只终审线上；未完成初审不能跳到丹总。</li><li>计划部门查看前置审批后确认接收，无销售需求通过/驳回操作。</li><li>单条或批量确认都会校验权限、状态、版本和批次；冲突不覆盖原数据。</li><li>整份无需求也走线上领导、丹总、计划部门；只保留无需求批次，不计算虚假商品数量。</li></ul></div><details><summary>查看可编辑流程源代码</summary><pre></pre></details></section><section class=\"sheet\" role=\"tabpanel\" id=\"flowPanel4\" aria-labelledby=\"flowTab4\" hidden><h2>05 驳回重提、撤回与批量操作</h2><div class=\"drawing\" id=\"flowDrawing4\" aria-label=\"05 驳回重提、撤回与批量操作\">正在生成流程图…</div><div class=\"rules\"><h3>节点规则与边界</h3><ul><li>审核页明确分为待审核、本级已通过、驳回待修改。</li><li>只要完整下级范围仍有退回明细，整份范围都在退回页，不能部分审核。</li><li>重提产生新提交批次修订号；不是沿用之前通过结果。商品明细修改快照和原审批历史保留。</li><li>撤回仅允许整份未开始审核的本人批次；草稿作废另行留档，不物理删除。</li></ul></div><details><summary>查看可编辑流程源代码</summary><pre></pre></details></section><section class=\"sheet\" role=\"tabpanel\" id=\"flowPanel5\" aria-labelledby=\"flowTab5\" hidden><h2>06 数量与内容调整、撤销及版本生效</h2><div class=\"drawing\" id=\"flowDrawing5\" aria-label=\"06 数量与内容调整、撤销及版本生效\">正在生成流程图…</div><div class=\"rules\"><h3>节点规则与边界</h3><ul><li>仅数量调整即使加急，也不新增 OA 或领导审批。加急只是优先标识，不改变路径。</li><li>减少数量必须有完整同步和有效销量口径，不能将缺同步当作执行量为零。</li><li>非数量内容变更只允许执行开始前；只能在原业务、组织和授权范围内调整。</li><li>每个计划最多一个未完结调整。处理中或驳回时原执行量和版本不变。</li><li>确认任务后才产生新生效版本；未处理调整可由原申请人说明原因撤销，已处理不可撤销。</li></ul></div><details><summary>查看可编辑流程源代码</summary><pre></pre></details></section><section class=\"sheet\" role=\"tabpanel\" id=\"flowPanel6\" aria-labelledby=\"flowTab6\" hidden><h2>07 订单、售后、实际达成与月末复盘</h2><div class=\"drawing\" id=\"flowDrawing6\" aria-label=\"07 订单、售后、实际达成与月末复盘\">正在生成流程图…</div><div class=\"rules\"><h3>节点规则与边界</h3><ul><li>实际达成为下单销量，不是发货、交货或生产完成。</li><li>取消状态不计入；跨月售后归属及退款不退货等真实规则仍需业务确认，图中沿用原型配置。</li><li>不同单位不直接相加，只有已维护商品换算系数才能转换标准量。</li><li>同一订单分别参与月、周归因，月周不能再次合并累加。</li><li>统计条件不足时不输出正式整体达成率；可标注具备条件部分的销量。</li><li>跨月周分摊为估算，只用于复盘，不修改周计划；缺实际数据不能断言预测正确。</li></ul></div><details><summary>查看可编辑流程源代码</summary><pre></pre></details></section></main><script>document.querySelectorAll('[data-chapter]').forEach((b,index)=>{b.onclick=()=>document.querySelectorAll('[data-chapter]').forEach((x,i)=>{x.setAttribute('aria-selected',String(i===index));document.getElementById('flowPanel'+i).hidden=i!==index;});b.onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const n=e.key==='Home'?0:e.key==='End'?6:(index+(e.key==='ArrowRight'?1:-1)+7)%7;const x=document.getElementById('flowTab'+n);x.click();x.focus();}};});document.getElementById('printFlows').onclick=()=>window.print();<\/script><script>(function(){\nconst diagrams=[{\"roles\":[\"销售 / 线上运营\",\"线下审核领导\",\"线上审核领导\",\"计划部门\",\"系统\"],\"nodes\":[[\"select\",0,0,\"独立选择月度或周计划\",\"周期内预计销售总量，含已有订单\"],[\"fill\",0,1,\"按业务填报完整范围\",\"线下客户商品；线上渠道商品\"],[\"gate\",4,2,\"提交校验通过？\",\"窗口、清单、归属、商品、完整性\",\"decision\"],[\"off\",1,3,\"线下三级审核\",\"大区 → 中心 → 严总\"],[\"on\",2,3,\"线上两级审核\",\"线   const M=SalesPlan, screen=document.body.dataset.page==='screen', esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let d;try{d=M.load();}catch(e){document.getElementById('root').textContent=e.message;return;}
  let view=screen?'analysis':document.body.dataset.initialView==='salesHistory'?'salesHistory':document.body.dataset.initialView==='urgentDemo'?'urgentDemo':'plans', role=standaloneMode==='salesHistory'&&new URLSearchParams(location.search).get('business')==='online'?'线上运营':'省区填报', filters={business:'all',kind:'month',center:'all',area:'all',province:'all',channel:'all',unit:'袋',cycle:'2026-10'}, focused=null;
  const fmt=n=>n===null?'待确认口径':Number(n).toLocaleString('zh-CN'), product=id=>M.productName(d,id);
  const tag=s=>`<span class="tag ${s==='已确认'?'good':'warn'}">${esc(s)}</span>`;
  const options=(list,val,all='')=>(all?`<option value="all">${all}</option>`:'')+list.map(v=>`<option ${v===val?'selected':''} value="${esc(v)}">${esc(v)}</option>`).join('');
  const rows=()=>d.plans.filter(p=>(filters.achievementDemo?!!p.achievementDemo:!p.achievementDemo)&&(!filters.demoCase||p.id===filters.demoCase)&&PlanBusiness.canView(d,role,p)&&(filters.business==='all'||p.business===filters.business)&&p.kind===filters.kind&&(!filters.cycle||(filters.kind==='month'?p.start.slice(0,7)===filters.cycle:p.start===filters.cycle))&&(filters.center==='all'||p.center===filters.center)&&(filters.area==='all'||p.area===filters.area)&&(filters.province==='all'||p.province===filters.province)&&(filters.channel==='all'||p.channel===filters.channel)&&(view==='review'&&filters.business==='offline'||p.unit===filters.unit));
  const subject=p=>p.business==='online'?p.channel:(p.province+' · '+(p.customer||'客户待维护'));
  let storageBaseline=localStorage.getItem(M.KEY);
  function persist(){try{if(localStorage.getItem(M.KEY)!==storageBaseline){message('数据已在其他窗口更新，当前输入仍保留。请关闭表单、刷新数据后核对并重新提交。');return false;}M.save(d);storageBaseline=localStorage.getItem(M.KEY);return true;}catch(e){message('保存失败：浏览器存储不可用，请检查权限；请保留当前页面。');return false;}}
  function message(s){const el=document.getElementById('message');el.textContent=s;el.style.display='block';setTimeout(()=>el.style.display='none',7000);}

  PlanBusiness.initialize(d);BusinessRelease.initialize(d);PlanWorkflow.initialize(d);TaskConfirmation.initialize(d);OrderPolicy.initialize(d);
  {const backup=structuredClone(d);try{PlanOperations.seedDemo(d);if(!persist())Object.assign(d,backup);}catch(e){Object.assign(d,backup);console.error("演示数据准备失败",e);}}

  let taskStatus='all';
  const uxApi={data:()=>d,role:()=>role,view:()=>view,kind:()=>filters.kind,filters:()=>filters,status:()=>taskStatus,setStatus:s=>{taskStatus=s;render();},rows,render,persist,message,modal,log,planTable,action,openQuantity:(p,options)=>{const guard=PlanBusiness.adjustGuard(d,p,p.qty);if(guard)return message(guard);adjustment(p,options);SalesUX.adjustPreview(uxApi,p);},setView:v=>{view=v;render();},drill:(list)=>{modal('计划与订单明细',planTable(list));}};
  try{const saved=JSON.parse(localStorage.getItem('tgx_standalone_plan_filters'));if(saved)filters={...filters,...saved};}catch{}
  if(view==='salesHistory'){const b=new URLSearchParams(location.search).get('business');if(['online','offline'].includes(b))filters.business=b;}
  function render(){OrderPolicy.begin(d);
    BusinessRelease.syncChanges(d);document.querySelector('nav')?._headerObserver?.disconnect();StableSidebar.capture();
    if(!['offline','online'].includes(filters.business))filters.business='offline';
    if(!screen&&['大区审核','中心审核','严总'].includes(role)&&['review','adjustments'].includes(view))filters.business='offline';
    if(!screen&&SalesPlan.onlineReviewer(role)&&['review','adjustments'].includes(view))filters.business='online';
    if(!screen&&role==='省区填报'&&!['salesHistory','monthRecap'].includes(view)){filters.business='offline';const fixed=PlanBusiness.affiliation(role);filters.center=fixed.center;filters.area=fixed.area;if(filters.province!=='all'&&!M.areas[fixed.area].includes(filters.province))filters.province='上海';if(filters.province==='all')filters.province='上海';}
    if(!screen&&role==='线上运营'&&!['salesHistory','monthRecap'].includes(view)){filters.business='online';filters.center='all';filters.area='all';filters.province='all';}

    document.getElementById('root').innerHTML=`<header><div><strong>脱骨侠 · ${screen?'生产管理 · 计划达成分析':'生产管理'}</strong><div class="muted">第一阶段 · 计划管理 · 需求计划填报</div></div><div class="row">${!screen?`<label>当前角色 <select id="role">${options(['省区填报','线上运营','大区审核','中心审核','严总','线上领导','丹总','计划部门','商品管理员','规则管理员'],role)}</select></label>`:''}<a href="?page=flow">流程图</a><a href="${screen?'?page=manage':'?page=screen'}">${screen?'返回计划管理':'打开达成大屏'}</a></div></header><main><div class="notice">交互演示数据 · OMS、旺店通及 OA 未接入真实系统。${!d.orderPolicies.offline.version||!d.orderPolicies.online.version?'销量统计口径待确认，正式达成率暂不计算。':''}</div>${!screen?`<nav aria-label="生产管理导航"><div class="module-parent">生产管理</div><div class="module-current">计划管理 <span class="tag">第一阶段</span></div><div class="module-group">计划业务</div><button data-plan-kind="month" aria-current="${view==='plans'&&filters.kind==='month'}">月度计划</button><button data-plan-kind="week" aria-current="${view==='plans'&&filters.kind==='week'}">周计划</button>${[['review','分级审核'],['adjustments','计划调整'],['products','可填报商品'],['orders','订单关联'],['analysis','达成分析'],['rules','填报规则']].map(([k,t])=>`${k==='products'?'<div class="module-group">计划支撑</div>':''}<button data-view="${k}" aria-current="${view===k}">${t}</button>`).join('')}</nav>`:''}<div class="breadcrumb" aria-label="当前位置">生产管理 / 计划管理 / ${({plans:filters.kind==='month'?'月度计划':'周计划',review:'分级审核',adjustments:'计划调整',products:'可填报商品',orders:'订单关联',analysis:'达成分析',rules:'填报规则',demand:'已确认需求总表',progress:'填报进度',notifications:'通知与待办',businessRules:'业务规则与权限',salesHistory:'历史销售查询',monthRecap:'月周预测复盘',acceptance:'需求承接',urgentDemo:'加急申请与处理',demoStates:'全流程演示案例'})[view]}</div><div class="phase-banner"><strong>第一阶段 · 计划管理</strong><span>填报需求计划 → 审核确认 → 调整执行 → 计划跟踪</span></div><div id="content">${['plans','review','analysis'].includes(view)?filterBar():''}${content()}</div></main><dialog id="dialog" aria-labelledby="dialogTitle"></dialog><div id="message" role="status" aria-live="polite"></div>`;
    document.querySelectorAll('[data-plan-kind]').forEach(b=>b.onclick=()=>{const kind=b.dataset.planKind;try{localStorage.setItem('tgx_standalone_plan_filters_'+filters.kind,JSON.stringify(filters));const saved=JSON.parse(localStorage.getItem('tgx_standalone_plan_filters_'+kind));filters=saved||{business:'all',kind,center:'all',area:'all',province:'all',channel:'all',unit:'袋',cycle:kind==='month'?'2026-10':'2026-10-12'};filters.kind=kind;localStorage.setItem('tgx_standalone_plan_filters',JSON.stringify(filters));}catch{filters.kind=kind;filters.cycle=kind==='month'?'2026-10':'2026-10-12';}view='plans';render();});
    document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render();});
    document.getElementById('role')?.addEventListener('change',e=>{role=e.target.value;taskStatus='all';filters.center='all';filters.area='all';filters.province='all';filters.channel='all';filters.business=role==='线上运营'||SalesPlan.onlineReviewer(role)?'online':'offline';view=view==='home'?'home':['大区审核','中心审核','严总','线上领导','丹总'].includes(role)?'review':role==='计划部门'?'acceptance':role==='商品管理员'?'products':role==='规则管理员'?'rules':'plans';render();});
    document.querySelectorAll('[data-filter]').forEach(el=>el.onchange=()=>{filters[el.dataset.filter]=el.value;if(el.dataset.filter==='business'){filters.center='all';filters.area='all';filters.province='all';filters.channel='all';}if(el.dataset.filter==='kind')filters.cycle=el.value==='month'?'2026-10':'2026-10-12';if(el.dataset.filter==='center'){filters.area='all';filters.province='all';}if(el.dataset.filter==='area')filters.province='all';try{localStorage.setItem('tgx_standalone_plan_filters',JSON.stringify(filters));}catch{}render();});

    SalesUX.decorate(uxApi);PlanChange.decorate(uxApi);if(view==='review'&&['大区审核','中心审核','严总','线上领导','丹总'].includes(role))PlanHierarchy.render(uxApi);PlanTaskUI.decorate(uxApi);AuditStateUI.decorate(uxApi);PlanBusiness.decorate(uxApi);SalesHistory.decorate(uxApi);MonthRecap.decorate(uxApi);BusinessTables.decorate(uxApi);PlanWorkflow.decorate(uxApi);WorkflowDemo.decorate(uxApi);TaskConfirmation.decorate(uxApi);StableSidebar.decorate(uxApi);PersonGovernance.decorate(uxApi);BusinessRelease.decorate(uxApi);OrderPolicy.decorate(uxApi);NoDemandFlow.decorate(uxApi);ClosedLoopDemo.decorate(uxApi);PlanAchievement.decorate(uxApi);AchievementDemo.decorate(uxApi);FilingUX.decorate(uxApi);UrgentAdjustmentDemo.decorate(uxApi);RoleFocus.decorate(uxApi);PlanOperations.decorate(uxApi);OrderPolicy.end(d);
  }
  function filterBar(){const areaList=Object.keys(M.areas), provinces=filters.area==='all'?Object.values(M.areas).flat():M.areas[filters.area];return `<div class="card row filters"><label>业务 <select data-filter="business">${options(['offline','online'],filters.business).replace('>offline<','>线下<').replace('>online<','>线上<')}</select></label>${view==='plans'?'':`<label>计划类型 <select data-filter="kind">${options(['month','week'],filters.kind).replace('>month<','>月度计划<').replace('>week<','>周计划<')}</select></label>`}<label>计划周期 <input data-filter="cycle" aria-label="计划周期" type="${filters.kind==='month'?'month':'date'}" value="${esc(filters.cycle)}"></label><label>销售中心 <select data-filter="center">${options(M.centers,filters.center,'全部中心')}</select></label><label>大区 <select data-filter="area">${options(areaList,filters.area,'全部大区')}</select></label><label>省区 <select data-filter="province">${options(provinces,filters.province,'全部省区')}</select></label><label>线上渠道 <select data-filter="channel">${options(M.channels,filters.channel,'全部渠道')}</select></label><label>统计单位 <select data-filter="unit">${options(['箱','包','袋','盒','罐','支'],filters.unit)}</select></label><button data-action="clear">清除筛选</button></div>`;}
  function metrics(list){const approved=list.filter(p=>M.effective(p)), total=approved.reduce((s,p)=>s+p.qty,0), actual=approved.some(p=>M.actual(d,p)===null)?null:approved.reduce((s,p)=>s+M.actual(d,p),0);return `<div class="metrics"><div class="metric">已确认计划数量<strong>${fmt(total)}</strong>${esc(filters.unit)} · ${approved.length} 条计划</div><div class="metric">实际完成数量<strong>${fmt(actual)}</strong>取消单不计入 · 同单位订单</div><div class="metric">计划差异<strong>${fmt(actual===null?null:total-actual)}</strong>计划减实际，允许负差异</div><div class="metric">达成率<strong>${actual===null?'待确认':total?Math.round(actual/total*100)+'%':'—'}</strong>月周计划独立分析</div></div>`;}
  function planTable(list,review=false){return list.length?`<div class="table-wrap"><table><thead><tr><th>计划 / 版本</th><th>业务 / 周期</th><th>填报维度</th><th>商品</th><th>计划数量</th>${PlanAchievement.headings()}<th>状态</th><th>操作</th></tr></thead><tbody>${list.map(p=>`<tr><td>${esc(p.id)} · V${p.version}<small>${esc(p.owner)}</small></td><td>${p.business==='online'?'线上':'线下'}${p.kind==='month'?'月度':'周'}<small>${p.start} 至 ${p.end}</small></td><td>${esc(subject(p))}${p.business==='offline'?`<small>${esc(p.center)} ${esc(p.area)}</small>`:''}</td><td>${esc(product(p.product))}</td><td>${fmt(p.qty)} ${esc(p.unit)}</td>${PlanAchievement.cells(d,[p])}<td>${tag(M.status(d,p))}</td><td><button data-action="detail" data-id="${p.id}">详情 / 订单</button> ${p.stage<0||p.rejected?`<button data-action="submit" data-id="${p.id}">提交</button>`:''}${review&&M.chain(p)[p.stage]===role?` <button class="primary review-row-pass" data-action="review" data-id="${p.id}">一键通过</button> <button class="review-row-reject" data-action="review-reject" data-id="${p.id}">驳回</button>`:''}${!screen&&p.stage>=M.chain(p).length&&!p.archived?` <button data-action="adjust" data-id="${p.id}">调整数量</button> <button data-action="archive" data-id="${p.id}">归档</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">暂无符合条件的计划。请清除筛选或新增计划。</div>';}
  function content(){
    if(view==='plans'||view==='review')return `<div class="row space"><div><h1>${view==='review'?'分级审核':filters.kind==='month'?'月度计划填报':'周计划填报'}</h1><p class="muted">汇集线上、线下需求计划，为后续生产安排提供已确认的计划依据。线下月、周计划统一按省区、客户、商品填报，线上按渠道填报。</p></div>${view==='plans'?'<button class="primary" data-action="new">新增计划</button>':''}</div><div class="notice">月度窗口：${M.windowState(d,'month')} · 周计划窗口：${M.windowState(d,'week')}。月度20日填报、周五前完成，精确时点在填报规则中配置。</div>${metrics(rows())}${view==='review'&&filters.business==='offline'?reviewSummary(rows()):''}<section class="card">${planTable(rows(),view==='review')}</section>`;
    if(view==='analysis')return analysis();
    if(view==='products')return `<section class="card"><div class="row space"><h1>可填报商品维护</h1><button data-action="product-new" ${role!=='商品管理员'?'disabled':''}>新增商品</button></div><p>商品管理员维护启用状态、适用业务、生效与失效日期。停用不影响历史计划。</p><div class="table-wrap"><table><thead><tr><th>商品名称</th><th>适用业务</th><th>有效期</th><th>状态</th><th>操作</th></tr></thead><tbody>${d.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.scope)}</td><td>${p.from} 至 ${p.to||'长期'}</td><td>${p.enabled?'已启用':'已停用'}</td><td><button data-action="product-edit" data-id="${p.id}" ${role!=='商品管理员'?'disabled':''}>编辑</button></td></tr>`).join('')}</tbody></table></div><h3>商品变更记录</h3>${d.productHistory.map(h=>`<p>${esc(h.at)} · ${esc(product(h.id))} · ${esc(h.action)}</p>`).join('')||'<p class="muted">暂无变更记录</p>'}</section>`;
    if(view==='adjustments')return `<section class="card"><h1>计划调整与确认</h1><p>开始前可调整月、周计划内容并重新审批；普通数量调整由计划部门确认，不走 OA。销售审批完成后仍需计划部门确认，确认前保留原执行版本。</p>${d.adjustments.length?`<div class="table-wrap"><table><thead><tr><th>计划</th><th>调整前 / 后</th><th>原因 / 附件</th><th>审批人</th><th>状态 / 进度</th><th>操作</th></tr></thead><tbody>${d.adjustments.map(a=>`<tr data-change-id="${esc(a.id)}"><td>${a.plan} · V${a.base}${a.priority==='urgent'?'<small class="tag warn">加急</small>':''}<small>变更单：${esc(a.documentId||'待生成')}</small><small>${a.type==='before-start'?'开始前内容调整':a.type==='quantity'?(a.priority==='urgent'?'加急数量调整':'普通数量调整'):'历史加急数量调整'}</small></td><td>${a.type==='before-start'?`<details><summary>内容变更对比</summary><table><thead><tr><th>字段</th><th>原计划</th><th>申请调整</th></tr></thead><tbody>${PlanChange.diff(a,d)}</tbody></table></details>`:''}${fmt(a.before)} → ${fmt(a.after)}<small>差异 ${fmt(a.after-a.before)}</small></td><td>${esc(a.reason)}<small>${esc(a.attachment||'无附件')}</small></td><td>${esc(a.approver)}</td><td>${tag(a.type==='quantity'&&['待OA审批','待计划部门确认'].includes(a.status)?'待计划部门确认':a.status)}<small>发起：${esc(a.at)}</small><small>${a.reviewAt?'审批：'+esc(a.reviewAt):'等待 '+esc(a.approver)+' 确认'}</small><small>${esc(a.opinion||'')}</small></td><td>${['待OA审批','待计划部门确认'].includes(a.status)&&role===a.approver?`<button data-action="adjust-review" data-id="${a.id}">${role==='计划部门'?'确认任务':'销售审核'}</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">暂无调整记录。请从计划列表发起调整。</div>'}</section>`;
    if(view==='orders')return `<section class="card"><h1>销售订单与计划关联</h1><p>自动匹配周期、业务、中心/渠道、省区、周计划客户、商品和单位。审核人员可处理未匹配与多匹配异常。</p>${orderTable(d.orders)}</section>`;
    if(view==='rules')return rules();
  }

  function reviewSummary(list){const groups=new Map();list.filter(p=>p.business==='offline').forEach(p=>{const key=p.center+' / '+p.area;const g=groups.get(key)||{original:0,current:0,count:0};g.original+=p.versions[0].qty;g.current+=p.qty;g.count++;groups.set(key,g);});return '<section class="card"><h2>省区 → 大区 → 中心汇总</h2><p class="muted">当前筛选范围及单位；省区原始值与执行版本分开保留，逐级审核意见可从明细查看。</p><div class="table-wrap"><table><thead><tr><th>中心 / 大区</th><th>省区计划明细数</th><th>原始填报合计</th><th>执行计划合计</th></tr></thead><tbody>'+[...groups].map(([name,g])=>'<tr><td>'+esc(name)+'</td><td>'+g.count+'</td><td>'+fmt(g.original)+'</td><td>'+fmt(g.current)+'</td></tr>').join('')+'</tbody></table></div></section>';}
  function orderTable(list){const index=new Map();for(const p of d.plans){for(const o of M.linked(d,p)){const key=p.kind+':'+o.id;if(!index.has(key))index.set(key,[]);index.get(key).push(p);}}list=list.filter(o=>PlanBusiness.canView(d,role,o)&&o.business===filters.business);return `<div class="table-wrap"><table><thead><tr><th>订单 / 来源</th><th>下单日期 / ${filters.business==='online'?'渠道':'客户'}</th><th>商品</th><th>数量 / 退货</th><th>月计划关联</th><th>周计划关联</th><th>状态</th></tr></thead><tbody>${list.map(o=>{const links=k=>index.get(k+':'+o.id)||[];return `<tr><td>${o.id}<small>${o.source}</small></td><td>${M.orderDay(o)||'下单时间缺失'}<small>${esc(o.business==='online'?o.channel:o.customer)}</small></td><td>${esc(product(o.product))}</td><td>${fmt(o.qty)} ${o.unit}<small>退货 ${fmt(o.returned)}</small></td>${['month','week'].map(k=>`<td>${links(k).map(p=>`<button data-action="detail" data-id="${p.id}">${p.id}</button>`).join('')||'未匹配'}${links(k).length>1?tag('多匹配异常'):''} <button data-action="link-${k}" data-id="${o.id}">处理</button></td>`).join('')}<td>${esc(o.status)}</td></tr>`;}).join('')}</tbody></table></div>`;}
  function analysis(){const list=rows().filter(p=>p.stage>=M.chain(p).length&&!p.rejected), dimensions=filters.business==='online'?['channel','product']:['center','area','province','customer','product'];return `<h1>计划完成情况与达成分析</h1><p class="muted">按下单时间（北京时间）统计：线下OMS订单、线上旺店通接口订单；人工生产交付不计入销量。仅统计已确认及归档计划。不同单位分开统计；缺失销量与未确定口径显示待确认。</p>${metrics(rows())}<div class="grid">${dimensions.map(key=>{const groups=new Map();list.forEach(p=>{const name=key==='product'?product(p.product):p[key];if(!name)return;const x=groups.get(name)||{qty:0,actual:0,ids:[]};x.qty+=p.qty;const n=M.actual(d,p);x.actual=x.actual===null||n===null?null:x.actual+n;x.ids.push(p.id);groups.set(name,x);});return `<section class="card"><h2>${({center:'销售中心',area:'大区',province:'省区',customer:'客户',channel:'线上渠道',product:'商品'})[key]}达成</h2><div class="table-wrap"><table><thead><tr><th>维度</th><th>已确认计划数量</th><th>实际完成数量</th><th>达成率</th><th>操作</th></tr></thead><tbody>${[...groups].map(([name,g])=>`<tr><td>${esc(name)}</td><td>${fmt(g.qty)} ${esc(filters.unit)}</td><td>${fmt(g.actual)}</td><td>${g.actual===null?'待确认':g.qty?Math.round(g.actual/g.qty*100)+'%':'—'}</td><td>${g.ids.map(id=>`<button data-action="detail" data-id="${id}">详情 ${id}</button>`).join(' ')}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">当前业务暂无已确认计划</td></tr>'}</tbody></table></div></section>`;}).join('')}</div><section class="card"><h2>计划明细下钻</h2>${planTable(list)}</section>`;}
  function modal(title,html){const el=document.getElementById('dialog');el.innerHTML=`<div class="row space"><h2 id="dialogTitle">${esc(title)}</h2><button id="close">关闭</button></div>${html}`;el.querySelector('#close').onclick=()=>el.close();el.showModal();queueMicrotask(()=>{if(el.open&&!el.querySelector('#batchForm'))PlanOperations.tools(el,uxApi);});setTimeout(()=>SalesUX.protect(),0);el.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action,b.dataset.id));}
  const field=(label,name,html)=>`<label class="field">${label}${html||`<input name="${name}" required>`}</label>`;
  function newPlan(){return SalesUX.batch(uxApi);}
  function detail(p){modal('计划详情 '+p.id,`${PlanOperations.progress(d,p)}<p>${esc(subject(p))} · ${esc(product(p.product))} · ${p.start} 至 ${p.end}</p><p>${tag(M.status(d,p))} · 当前 V${p.version} · ${fmt(p.qty)} ${p.unit}</p><h3>${p.business==='online'?'渠道原始填报及审核记录':'省区原始值及逐级汇总'}</h3><p>原始 ${fmt(p.versions[0].qty)}；当前执行 ${fmt(p.qty)}。以下审核意见保留各级汇总快照。</p><h3>版本记录</h3>${p.versions.map(v=>`<p>V${v.version} · ${fmt(v.qty)} ${p.unit} · ${esc(v.reason)}</p>`).join('')}<h3>全过程记录</h3>${p.history.map(h=>`<div class="history">${esc(h.at)} · ${esc(h.by)} · ${esc(h.action)} ${esc(h.opinion||'')}${h.qty!==undefined?' · 数量 '+fmt(h.qty):''}</div>`).join('')}<h3>内容调整与审批记录</h3>${d.adjustments.filter(a=>a.plan===p.id).map(a=>`<div class="history"><p>${esc(a.at)} · ${esc(a.reason)} · ${tag(a.status)}</p>${a.type==='before-start'?`<table><thead><tr><th>字段</th><th>调整前</th><th>申请调整</th></tr></thead><tbody>${PlanChange.diff(a,d)}</tbody></table>${(a.approvals||[]).map(x=>`<p>${esc(x.at)} · ${esc(x.by)} · ${esc(x.result)} · ${esc(x.opinion)}</p>`).join('')}`:''}</div>`).join('')||'暂无调整记录'}<h3>关联订单</h3>${orderTable(M.linked(d,p))}`);}
  function quickReview(p){if(!PlanBusiness.canAuditBusiness(d,role,p)||M.chain(p)[p.stage]!==role||p.rejected||p.archived||PlanChange.pending(d,p))return message('当前无审核权限或计划状态已变化。');const backup=structuredClone(d);log(p,'一键审核通过（明细快照）',{opinion:'一键审核通过（用户操作）',qty:p.qty,sourceIds:[p.id]});p.stage++;if(!persist()){Object.assign(d,backup);return;}if(document.getElementById('dialog').open)document.getElementById('dialog').close();render();message('该条计划已审核通过，记录已保存。');}
  function review(p){if(!PlanBusiness.canAuditBusiness(d,role,p))return message('当前角色无权审核该业务：大区、中心、严总仅线下，线上领导、丹总仅线上。');if(PlanChange.pending(d,p))return message('该计划的内容调整正在审批，请先处理调整。');if(M.chain(p)[p.stage]!==role)return;const previous=d.plans.filter(q=>q.id!==p.id&&q.business===p.business&&q.kind===p.kind&&q.product===p.product&&q.unit===p.unit&&q.end<p.start&&(p.business==='online'?q.channel===p.channel:q.center===p.center&&q.area===p.area&&q.province===p.province&&q.customer===p.customer)).sort((a,b)=>b.end.localeCompare(a.end))[0];modal('审核 '+p.id,`<div class="notice">上期计划：${previous?fmt(previous.qty)+' '+p.unit+'；本期较上期 '+fmt(p.qty-previous.qty):'暂无可比计划，不能用零值替代'}</div><p>${esc(subject(p))} · 数量 ${fmt(p.qty)} ${p.unit}</p><label class="field">审核意见（驳回时请明确明细问题及修改要求）<textarea id="opinion" required></textarea></label><div class="actions"><button id="reject">驳回</button><button class="primary" id="approve">通过并提交下一级</button></div>`);const finish=pass=>{if(!PlanBusiness.canAuditBusiness(d,role,p)||M.chain(p)[p.stage]!==role||p.rejected||p.archived||PlanChange.pending(d,p))return message('业务权限或计划状态已变化，请刷新后审核。');const opinion=document.getElementById('opinion').value.trim();if(!opinion){message('请填写审核意见。');return;}log(p,pass?'审核通过（汇总快照）':'审核驳回',{opinion,qty:p.qty});if(pass)p.stage++;else p.rejected=true;if(persist()){document.getElementById('dialog').close();render();}};document.getElementById('approve').onclick=()=>finish(true);document.getElementById('reject').onclick=()=>finish(false);}
  function adjustment(p,options={}){if(!['省区填报','线上运营'].includes(role)){message('请由填报角色申请数量调整。');return;}modal((options.urgent?'加急数量调整 ':'数量调整 ')+p.id,`<p>关联原计划：${esc(p.id)} · V${p.version} · 原数量 ${p.qty}${esc(p.unit)}。${options.urgent?'加急申请独立留痕，优先处理，不绕过确认。':''}</p><form id="adjustForm"><div class="grid">${field('调整类型','type','<select name="type"><option value="add">增加数量</option><option value="subtract">减少数量</option></select>')}${field('差异数量','qty','<input name="qty" type="number" min="1" step="1" required>')}${field('调整原因','reason','<textarea name="reason" required></textarea>')}${field('附件（演示保留文件名）','attachment','<input name="attachment" type="file">')}</div><p>数量调整由计划部门确认，不提交 OA；确认后生成生效版本，保留调整记录。</p><div class="error" id="adjustError"></div><div class="actions"><button class="primary">提交计划部门确认</button></div></form>`);document.getElementById('adjustForm').onsubmit=e=>{e.preventDefault();const f=e.target,q=Number(f.qty.value),after=p.qty+(f.type.value==='add'?q:-q);const guard=PlanBusiness.adjustGuard(d,p,after);if(guard){document.getElementById('adjustError').textContent=guard;return;}if(!Number.isInteger(q)||q<1||after<0||d.adjustments.some(a=>a.plan===p.id&&['待OA审批','待计划部门确认'].includes(a.status))){document.getElementById('adjustError').textContent='数量无效、减少后为负，或该计划已有待审批调整。';return;}d.adjustments.push({id:'A'+Date.now(),plan:p.id,base:p.version,type:'quantity',priority:options.urgent?'urgent':'normal',before:p.qty,after,reason:f.reason.value.trim(),attachment:f.attachment.files[0]?.name||'',approver:'计划部门',at:new Date().toISOString(),status:'待计划部门确认'});log(p,options.urgent?'提交加急数量调整申请，待计划部门确认':'申请普通数量调整，待计划部门确认');PlanBusiness.notify(d,'计划部门','待审核数量调整',p.id+'：'+p.qty+' → '+after);if(persist()){document.getElementById('dialog').close();view='adjustments';render();}};}
  function productForm(p){if(role!=='商品管理员')return;modal(p?'编辑可填报商品':'新增可填报商品',`<form id="productForm"><div class="grid">${field('商品编码','id',`<input name="id" value="${esc(p?.id||'')}" ${p?'readonly':''} required>`)}${field('商品名称','name',`<input name="name" value="${esc(p?.name||'')}" required>`)}${field('适用业务','scope',`<select name="scope">${options(['全部','线上','线下'],p?.scope)}</select>`)}${field('启用状态','enabled',`<select name="enabled">${options(['已启用','已停用'],p?.enabled===false?'已停用':'已启用')}</select>`)}${field('生效日期','from',`<input name="from" type="date" required value="${p?.from||''}">`)}${field('失效日期','to',`<input name="to" type="date" value="${p?.to||''}">`)}</div><div class="error" id="productError"></div><div class="actions"><button class="primary">保存商品</button></div></form>`);document.getElementById('productForm').onsubmit=e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.target));if((x.to&&x.to<x.from)||(!p&&d.products.some(v=>v.id===x.id))){document.getElementById('productError').textContent='商品编码重复或有效期错误，请修正。';return;}const before=p?structuredClone(p):null,after={...x,enabled:x.enabled==='已启用'};if(p)Object.assign(p,after);else d.products.push(after);d.productHistory.push({at:new Date().toISOString(),id:x.id,action:before?'商品更新':'新增商品',before,after:structuredClone(after),by:role});if(persist()){document.getElementById('dialog').close();render();}};}
  function rules(){return `<section class="card"><h1>填报窗口与统计规则</h1><p>业务纪要未确定精确截止时间。以下配置仅供演示，正式上线须经业务确认。</p><form id="rulesForm"><div class="grid">${['month','week'].map(k=>`${field((k==='month'?'月度':'周计划')+'开放时间',k+'Open',`<input type="datetime-local" id="${k}Open" value="${d.windows[k].open}">`)}${field((k==='month'?'月度':'周计划')+'截止时间',k+'Close',`<input type="datetime-local" id="${k}Close" value="${d.windows[k].close}">`)}`).join('')}${field('月周订单计入','overlap',`<select id="overlap">${options(['pending','independent'],d.rules.overlap).replace('>pending<','>待业务确认<').replace('>independent<','>演示：月周独立计入，不跨类型相加<')}</select>`)}${field('售后回冲','returns',`<select id="returns">${options(['pending','gross','net'],d.rules.returns).replace('>pending<','>待业务确认<').replace('>gross<','>演示：退货不回冲（取消不计入）<').replace('>net<','>演示：退货回冲（取消不计入）<')}</select>`)}</div><div class="error" id="rulesError"></div><div class="actions"><button type="button" data-action="rules-save" ${role!=='规则管理员'?'disabled':''}>保存演示规则</button></div></form></section>`;}
  function action(type,id){const p=d.plans.find(x=>x.id===id);
    if(type==='new')return newPlan();if(type==='clear'){const keepKind=filters.kind;try{localStorage.removeItem('tgx_standalone_plan_filters');}catch{}filters={business:'all',kind:'month',center:'all',area:'all',province:'all',channel:'all',unit:'袋',cycle:keepKind==='month'?'2026-10':'2026-10-12'};filters.kind=keepKind;return render();}
    if(type==='detail'){if(!PlanBusiness.canView(d,role,p))return message('无权查看该组织或客户计划。');return detail(p);}if(type==='review'&&p.business==='offline')return message('线下请从完整省区、大区或中心汇总审核，不能单独审核明细。');if(type==='review')return review(p);if(type==='review-reject'&&p.business==='offline')return message('请从完整下级汇总审核。');if(type==='review-reject'){review(p);document.getElementById('approve')?.remove();return;}if(type==='adjust'){const guard=PlanBusiness.adjustGuard(d,p,p.qty);if(guard)return message(guard);adjustment(p);return SalesUX.adjustPreview(uxApi,p);}
    if(type==='product-new')return productForm();if(type==='product-edit')return productForm(d.products.find(x=>x.id===id));
    if(type==='submit')return message('请从整份计划单提交，不能单独提交明细。');if(type==='submit'){const guard=PlanBusiness.fillGuard(d,role,p);if(guard)return message(guard);if(PlanChange.pending(d,p))return message('内容调整正在审批，请先处理调整。');if(!['省区填报','线上运营'].includes(role)||(p.business==='online')!==(role==='线上运营'))return message('当前角色无权提交该业务计划。');if(!['可填报','即将截止'].includes(PlanBusiness.periodState(d,p.kind,p.start)))return message('当前填报窗口未开放，请通过授权窗口或调整流程处理。');const pr=d.products.find(x=>x.id===p.product);if(!pr?.enabled||pr.from>p.start||(pr.to&&pr.to<p.end)||(pr.scope!=='全部'&&pr.scope!==(p.business==='online'?'线上':'线下')))return message('商品已停用或不在计划有效范围，请联系商品管理员。');p.stage=0;p.rejected=false;log(p,'重新提交计划');if(persist())render();return;}
    if(type==='archive'){if(!['严总','丹总'].includes(role)||role!==(p.business==='online'?'丹总':'严总'))return message('请由最终确认人归档。');if(p.end>=new Date().toLocaleDateString('sv-SE'))return message('计划周期尚未结束，不能归档。');p.archived=true;log(p,'计划归档');if(persist())render();return;}
    if(type==='adjust-review'){const a=d.adjustments.find(x=>x.id===id);if(a.type==='quantity')return TaskConfirmation.confirm(uxApi,d.plans.find(p=>p.id===a.plan),a);if(a.type==='before-start')return PlanChange.approve(uxApi,a);if(role!==a.approver||!PlanBusiness.canAuditBusiness(d,role,d.plans.find(p=>p.id===a.plan)))return;modal(a.type==='quantity'?'计划部门数量调整审核':'历史加急审批演示',`<p>${a.plan} · ${fmt(a.before)} → ${fmt(a.after)}</p><label class="field">审批意见<textarea id="opinion"></textarea></label><div class="actions"><button id="reject">驳回</button><button id="approve" class="primary">通过</button></div>`);const finish=pass=>{const opinion=document.getElementById('opinion').value.trim();if(!opinion)return message('请填写审批意见。');const plan=d.plans.find(p=>p.id===a.plan);if(pass&&plan.version!==a.base)return message('原计划版本已变化，请重新发起调整。');a.status=pass?'已通过':'已驳回';a.opinion=opinion;a.reviewAt=new Date().toISOString();if(pass){plan.qty=a.after;plan.version++;plan.versions.push({version:plan.version,qty:a.after,reason:a.reason});}log(plan,(a.type==='quantity'?'计划部门数量调整审核':'历史加急审批')+a.status,{opinion,qty:plan.qty});if(persist()){document.getElementById('dialog').close();render();}};document.getElementById('approve').onclick=()=>finish(true);document.getElementById('reject').onclick=()=>finish(false);return;}
    if(type.startsWith('link-')){if(!['大区审核','中心审核','严总','线上领导','丹总'].includes(role))return message('当前角色无订单关联处理权限。');const o=d.orders.find(x=>x.id===id),kind=type.slice(5),eligible=d.plans.filter(p=>p.kind===kind&&M.match(p,o));modal('处理订单关联',`<p>${id} · ${kind==='month'?'月度':'周'}计划；仅可选择同周期与业务维度的计划。</p><select id="link" aria-label="关联计划"><option value="">暂不关联</option>${options(eligible.map(p=>p.id),'')}</select><button id="saveLink">保存关联</button>`);document.getElementById('saveLink').onclick=()=>{d.manualLinks[id+':'+kind]=document.getElementById('link').value;eligible.forEach(p=>log(p,'人工处理订单关联 '+id));if(persist()){document.getElementById('dialog').close();render();}};return;}
    if(type==='rules-save'){if(role!=='规则管理员')return;for(const k of ['month','week']){const a=document.getElementById(k+'Open').value,b=document.getElementById(k+'Close').value;if(!a||!b||a>=b){document.getElementById('rulesError').textContent='请填写完整窗口，截止时间须晚于开放时间。';return;}}for(const k of ['month','week'])d.windows[k]={open:document.getElementById(k+'Open').value,close:document.getElementById(k+'Close').value};d.rules.overlap=document.getElementById('overlap').value;d.rules.returns=document.getElementById('returns').value;if(persist()){render();message('已保存演示配置；正式配置仍需业务确认。');}return;}
  }
  window.addEventListener('storage',e=>{if(e.key===M.KEY){try{if(document.getElementById('dialog')?.open){message('其他窗口已更新计划，当前表单输入已保留，提交前请刷新核对。');return;}d=M.load();storageBaseline=localStorage.getItem(M.KEY);render();}catch(err){message(err.message);}}});
  window.addEventListener('focus',()=>{try{if(document.getElementById('dialog')?.open)return;d=M.load();storageBaseline=localStorage.getItem(M.KEY);render();}catch(e){message(e.message);}});
  render();
  if(!screen&&document.body.dataset.initialView==='urgentDemo'){const backup=structuredClone(d);try{UrgentAdjustmentDemo.add(d);if(persist())render();else Object.assign(d,backup);}catch(e){Object.assign(d,backup);message(e.message);}}
})();
