<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系我们 | 卓希集团</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .contact-layout {
            max-width: 1220px;
            margin: 0 auto;
            display: grid;
            gap: 40px;
            padding: 40px 0;
            /* Remove horizontal 5% to allow children to control width or fill 1440px */
        }

        .recruitment-block {
            background: #fff;
            border-radius: 64px;
            padding: 40px 80px;
            /* Reduced vertical padding to match top card height */
            box-shadow: var(--island-shadow);
            display: flex;
            gap: 80px;
            align-items: center;
            border: 1px solid rgba(0, 0, 0, 0.03);
            width: 100%;
        }

        .recruitment-content {
            flex: 1.5;
            /* Give text more horizontal room */
        }

        .career-image-wrap {
            flex: 1;
            display: flex;
            justify-content: center;
        }

        .career-image-wrap img {
            max-width: 200px;
            /* Optimized size to keep card height sleek */
            height: auto;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.1));
        }

        .career-image-wrap:hover img {
            transform: scale(1.08) rotate(3deg);
        }
    </style>
</head>

<body>

    <!-- ═══ Floating Navbar ═══ -->
    <zhuoxi-navbar></zhuoxi-navbar>
    <script src="components/navbar.js"></script>

    <main style="padding-top: 120px;">
        <div class="contact-layout">

            <!-- ═══ Contact Section ═══ -->
            <section id="cooperative" class="contact-section">
                <div class="contact-island reveal" style="padding: 60px 80px; display: flex; justify-content: space-between; align-items: flex-start; overflow: hidden; position: relative;">
                    <!-- Content Group -->
                    <div style="position: relative; z-index: 2;">
                        <h2 class="section-title" style="font-size: 36px; margin-bottom: 4px;">商务合作</h2>
                        <p style="opacity: 0.8; margin-bottom: 24px;">全渠道合作 · 全球分销 · 媒体联系</p>
                        
                        <div style="display: flex; gap: 32px; align-items: center;">
                            <a href="javascript:void(0)" onclick="copyToClipboard('biz@zhuoxi-hero.com', '合作邮箱')" title="点击复制" 
                               style="color: inherit; text-decoration: none; opacity: 0.8; transition: opacity 0.3s; cursor: pointer; font-size: 16px;">📧 biz@zhuoxi-hero.com</a>
                            <a href="javascript:void(0)" onclick="copyToClipboard('400-888-XXXX', '联系电话')" title="点击复制"
                               style="color: inherit; text-decoration: none; opacity: 0.8; transition: opacity 0.3s; cursor: pointer; font-size: 16px;">📞 400-888-XXXX</a>
                        </div>
                    </div>
                    
                    <!-- Decorative Element on Right -->
                    <div class="contact-visual" style="opacity: 0.05; transform: rotate(-8deg); pointer-events: none; user-select: none;">
                        <h1 style="font-size: 110px; font-weight: 900; margin: 0; line-height: 0.8; letter-spacing: -2px; white-space: nowrap;">ZHUOXI</h1>
                    </div>
                </div>
            </section>

            <!-- ═══ ESG & Careers (Unified Width) ═══ -->
            <section id="careers" class="careers-section">
                <div class="recruitment-block reveal">
                    <div class="recruitment-content">
                        <h2 class="section-title" style="font-size: 32px;">加入我们</h2>
                        <div class="title-accent"></div>
                        <p class="body-text">寻找敢于打破常规、有想法、做实事的同行者。在卓希，每一个想法都有被实现的可能。</p>
                        <p style="margin-top: 16px; font-size: 16px; font-weight: 500;">
                            投递简历：<a href="javascript:void(0)" onclick="copyToClipboard('hr@zhuoxi-hero.com', '招聘邮箱')" title="点击复制" 
                                   style="color: var(--hero-orange); text-decoration: none; transition: opacity 0.3s; cursor: pointer;">📧 hr@zhuoxi-hero.com</a>
                        </p>
                    </div>
                    <div class="career-image-wrap">
                        <img src="喇叭脱脱.png" alt="卓希吉祥物 - 青椒脱脱">
                    </div>
                </div>
            </section>

        </div>
    </main>

    <!-- ═══ Footer ═══ -->
    <zhuoxi-footer></zhuoxi-footer>
    <script src="components/footer.js"></script>

    <script src="main.js"></script>
</body>

</html>
