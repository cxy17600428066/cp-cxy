<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>后台管理 | 卓希集团</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div class="admin-login-overlay" id="loginOverlay">
    <div class="admin-login-panel">
      <h2>卓希内容后台</h2>
      <p>请使用管理员账号登录</p>
      <form id="loginForm" class="admin-login-form">
        <label>账号</label>
        <input type="text" id="loginUsername" class="admin-input" placeholder="admin" required />
        <label>密码</label>
        <input type="password" id="loginPassword" class="admin-input" placeholder="admin123" required />
        <button type="submit" class="btn-admin btn-admin-primary">登录</button>
      </form>
      <div class="admin-login-hint">
        默认账号：`admin/admin123`、`editor/editor123`、`reviewer/reviewer123`
      </div>
      <div id="loginError" class="admin-login-error"></div>
    </div>
  </div>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-logo">
        <h1>卓希管理后台</h1>
        <p>ZHUOXI CMS v2</p>
      </div>

      <nav class="admin-nav">
        <button class="admin-nav-item active" data-tab="dashboard"><span class="nav-icon">📊</span> 总览</button>
        <button class="admin-nav-item" data-tab="carousel"><span class="nav-icon">🖼️</span> 轮播管理</button>
        <button class="admin-nav-item" data-tab="news"><span class="nav-icon">📰</span> 资讯管理</button>
        <button class="admin-nav-item" data-tab="products"><span class="nav-icon">📦</span> 产品管理</button>
        <button class="admin-nav-item" data-tab="careers"><span class="nav-icon">👥</span> 招聘管理</button>
        <button class="admin-nav-item" data-tab="seo"><span class="nav-icon">🔎</span> SEO设置</button>
        <button class="admin-nav-item" data-tab="site"><span class="nav-icon">🏢</span> 站点信息</button>
        <button class="admin-nav-item" data-tab="workflow"><span class="nav-icon">✅</span> 发布流程</button>
        <button class="admin-nav-item" data-tab="media"><span class="nav-icon">🗂️</span> 媒体资产</button>
        <button class="admin-nav-item" data-tab="logs"><span class="nav-icon">🧾</span> 操作日志</button>
      </nav>

      <div class="admin-sidebar-footer">
        <button class="admin-nav-item" id="btnExport"><span class="nav-icon">💾</span> 导出数据</button>
        <button class="admin-nav-item" id="btnImport"><span class="nav-icon">📥</span> 导入数据</button>
        <input type="file" id="importFile" class="hidden-input" accept=".json" />
        <button class="admin-nav-item" id="btnReset"><span class="nav-icon">♻️</span> 重置默认</button>
        <button class="admin-nav-item" id="btnLogout"><span class="nav-icon">🚪</span> 退出登录</button>
        <a href="index.html" class="admin-nav-item admin-link-item"><span class="nav-icon">🌐</span> 返回前台</a>
      </div>
    </aside>

    <main class="admin-main">
      <div class="admin-userbar">
        <div class="admin-userbar-left">
          <strong id="currentUserName">-</strong>
          <span id="currentUserRole">-</span>
        </div>
        <div class="admin-userbar-right">
          <input id="globalSearchInput" class="admin-input admin-input-sm" placeholder="全局搜索（标题、slug、内容）" />
          <button class="btn-admin btn-admin-ghost btn-admin-sm" id="btnGlobalSearch">搜索</button>
          <button class="btn-admin btn-admin-ghost btn-admin-sm" id="btnGlobalSearchReset">清空</button>
        </div>
      </div>

      <section class="admin-tab-content active" id="tab-dashboard">
        <div class="admin-header">
          <h2>📊 内容总览</h2>
        </div>
        <div class="admin-kpi-grid" id="dashboardKpi"></div>
        <div class="admin-card admin-card-block">
          <div class="admin-card-title-row">
            <h3>最近操作</h3>
          </div>
          <div id="dashboardLogs"></div>
        </div>
      </section>

      <section class="admin-tab-content" id="tab-carousel">
        <div class="admin-header">
          <h2>🖼️ 轮播管理</h2>
          <div class="admin-header-actions">
            <button class="btn-admin btn-admin-primary" id="btnAddCarousel">+ 新增轮播</button>
          </div>
        </div>
        <div class="admin-toolbar">
          <select id="carouselStatusFilter" class="admin-select admin-select-sm">
            <option value="all">全部状态</option>
            <option value="draft">草稿</option>
            <option value="review">待审核</option>
            <option value="published">已发布</option>
            <option value="archived">已归档</option>
          </select>
        </div>
        <div id="carouselList"></div>
        <div class="admin-pagination" id="carouselPagination"></div>
      </section>

      <section class="admin-tab-content" id="tab-news">
        <div class="admin-header">
          <h2>📰 资讯管理</h2>
          <div class="admin-header-actions">
            <button class="btn-admin btn-admin-primary" id="btnAddNews">+ 新增资讯</button>
          </div>
        </div>
        <div class="admin-toolbar">
          <select id="newsStatusFilter" class="admin-select admin-select-sm">
            <option value="all">全部状态</option>
            <option value="draft">草稿</option>
            <option value="review">待审核</option>
            <option value="published">已发布</option>
            <option value="archived">已归档</option>
          </select>
          <select id="newsCategoryFilter" class="admin-select admin-select-sm"></select>
        </div>
        <div id="newsList"></div>
        <div class="admin-pagination" id="newsPagination"></div>
      </section>

      <section class="admin-tab-content" id="tab-products">
        <div class="admin-header">
          <h2>📦 产品管理</h2>
          <div class="admin-header-actions">
            <button class="btn-admin btn-admin-primary" id="btnAddProduct">+ 新增产品</button>
          </div>
        </div>
        <div class="admin-toolbar">
          <select id="productStatusFilter" class="admin-select admin-select-sm">
            <option value="all">全部状态</option>
            <option value="draft">草稿</option>
            <option value="review">待审核</option>
            <option value="published">已发布</option>
            <option value="archived">已归档</option>
          </select>
          <select id="productCategoryFilter" class="admin-select admin-select-sm">
            <option value="all">全部分类</option>
            <option value="spicy">无骨系列</option>
            <option value="sour">虎皮系列</option>
            <option value="fragrant">老卤系列</option>
          </select>
        </div>
        <div id="productsList"></div>
        <div class="admin-pagination" id="productsPagination"></div>
      </section>

      <section class="admin-tab-content" id="tab-careers">
        <div class="admin-header">
          <h2>👥 招聘管理</h2>
          <div class="admin-header-actions">
            <button class="btn-admin btn-admin-primary" id="btnAddCareer">+ 新增岗位</button>
          </div>
        </div>
        <div class="admin-toolbar">
          <select id="careerStatusFilter" class="admin-select admin-select-sm">
            <option value="all">全部状态</option>
            <option value="draft">草稿</option>
            <option value="review">待审核</option>
            <option value="published">已发布</option>
            <option value="archived">已归档</option>
          </select>
        </div>
        <div id="careersList"></div>
        <div class="admin-pagination" id="careersPagination"></div>
      </section>

      <section class="admin-tab-content" id="tab-seo">
        <div class="admin-header">
          <h2>🔎 SEO 设置</h2>
        </div>
        <div class="admin-card admin-card-block">
          <form id="seoForm">
            <div class="admin-form-row">
              <div class="admin-form-group">
                <label>页面</label>
                <select id="seoPageKey" class="admin-select">
                  <option value="home">首页</option>
                  <option value="about">关于我们</option>
                  <option value="news">新闻中心</option>
                  <option value="products">产品中心</option>
                  <option value="contact">联系我们</option>
                  <option value="careers">加入我们</option>
                  <option value="privacy">隐私政策</option>
                  <option value="terms">使用条款</option>
                </select>
              </div>
              <div class="admin-form-group">
                <label>Canonical</label>
                <input id="seoCanonical" class="admin-input" />
              </div>
            </div>
            <div class="admin-form-group">
              <label>Title</label>
              <input id="seoTitle" class="admin-input" required />
            </div>
            <div class="admin-form-group">
              <label>Description</label>
              <textarea id="seoDescription" class="admin-textarea" rows="3"></textarea>
            </div>
            <div class="admin-form-row">
              <div class="admin-form-group">
                <label>Keywords</label>
                <input id="seoKeywords" class="admin-input" />
              </div>
              <div class="admin-form-group">
                <label>OG Image</label>
                <input id="seoOgImage" class="admin-input" />
              </div>
            </div>
            <div class="admin-modal-footer">
              <button class="btn-admin btn-admin-primary" type="submit">保存SEO</button>
            </div>
          </form>
        </div>
      </section>

      <section class="admin-tab-content" id="tab-site">
        <div class="admin-header">
          <h2>🏢 站点信息</h2>
        </div>
        <div class="admin-card admin-card-block">
          <form id="siteProfileForm">
            <div class="admin-form-row">
              <div class="admin-form-group">
                <label>公司全称</label>
                <input id="profileCompanyName" class="admin-input" required />
              </div>
              <div class="admin-form-group">
                <label>公司简称</label>
                <input id="profileCompanyShortName" class="admin-input" required />
              </div>
            </div>
            <div class="admin-form-row">
              <div class="admin-form-group">
                <label>统一社会信用代码</label>
                <input id="profileUnifiedCode" class="admin-input" />
              </div>
              <div class="admin-form-group">
                <label>ICP备案号</label>
                <input id="profileIcp" class="admin-input" />
              </div>
            </div>
            <div class="admin-form-row">
              <div class="admin-form-group">
                <label>食品生产许可证</label>
                <input id="profileFoodLicense" class="admin-input" />
              </div>
              <div class="admin-form-group">
                <label>公安备案</label>
                <input id="profilePublicSecurity" class="admin-input" />
              </div>
            </div>
            <div class="admin-form-row">
              <div class="admin-form-group">
                <label>联系电话</label>
                <input id="profileServicePhone" class="admin-input" />
              </div>
              <div class="admin-form-group">
                <label>商务邮箱</label>
                <input id="profileBusinessEmail" class="admin-input" />
              </div>
            </div>
            <div class="admin-form-row">
              <div class="admin-form-group">
                <label>招聘邮箱</label>
                <input id="profileHrEmail" class="admin-input" />
              </div>
              <div class="admin-form-group">
                <label>办公时间</label>
                <input id="profileWorkingHours" class="admin-input" />
              </div>
            </div>
            <div class="admin-form-group">
              <label>公司地址</label>
              <input id="profileAddress" class="admin-input" />
            </div>
            <div class="admin-form-group">
              <label>法律声明</label>
              <textarea id="profileLegalStatement" class="admin-textarea" rows="3"></textarea>
            </div>
            <div class="admin-modal-footer">
              <button class="btn-admin btn-admin-primary" type="submit">保存站点信息</button>
            </div>
          </form>
        </div>

        <div class="admin-card admin-card-block">
          <h3>法律条款内容</h3>
          <form id="legalForm">
            <div class="admin-form-row">
              <div class="admin-form-group">
                <label>隐私政策生效日期</label>
                <input id="privacyEffectiveDate" class="admin-input" />
              </div>
              <div class="admin-form-group">
                <label>使用条款生效日期</label>
                <input id="termsEffectiveDate" class="admin-input" />
              </div>
            </div>
            <div class="admin-form-group">
              <label>隐私政策正文</label>
              <textarea id="privacyContent" class="admin-textarea" rows="4"></textarea>
            </div>
            <div class="admin-form-group">
              <label>使用条款正文</label>
              <textarea id="termsContent" class="admin-textarea" rows="4"></textarea>
            </div>
            <div class="admin-modal-footer">
              <button class="btn-admin btn-admin-primary" type="submit">保存法律条款</button>
            </div>
          </form>
        </div>
      </section>

      <section class="admin-tab-content" id="tab-workflow">
        <div class="admin-header">
          <h2>✅ 发布流程</h2>
        </div>
        <div class="admin-card admin-card-block">
          <p>当前流程：草稿 -> 待审核 -> 已发布 -> 已归档</p>
          <p>说明：编辑可提交审核，审核员可发布，管理员可回滚版本。</p>
          <div id="workflowBoard"></div>
        </div>
      </section>

      <section class="admin-tab-content" id="tab-media">
        <div class="admin-header">
          <h2>🗂️ 媒体资产</h2>
        </div>
        <div class="admin-card admin-card-block">
          <form id="mediaForm">
            <div class="admin-form-row">
              <div class="admin-form-group">
                <label>文件路径</label>
                <input id="mediaPath" class="admin-input" placeholder="例如：hero.png" />
              </div>
              <div class="admin-form-group">
                <label>标题</label>
                <input id="mediaTitle" class="admin-input" />
              </div>
            </div>
            <div class="admin-form-row">
              <div class="admin-form-group">
                <label>标签（逗号分隔）</label>
                <input id="mediaTags" class="admin-input" />
              </div>
              <div class="admin-form-group">
                <label>使用页面（逗号分隔）</label>
                <input id="mediaUsage" class="admin-input" />
              </div>
            </div>
            <div class="admin-modal-footer">
              <button class="btn-admin btn-admin-primary" type="submit">登记/更新资产</button>
            </div>
          </form>
          <div id="mediaList"></div>
        </div>
      </section>

      <section class="admin-tab-content" id="tab-logs">
        <div class="admin-header">
          <h2>🧾 操作日志</h2>
        </div>
        <div class="admin-card admin-card-block">
          <div id="logsList"></div>
        </div>
      </section>
    </main>
  </div>

  <div class="admin-modal-overlay" id="entityModalOverlay">
    <div class="admin-modal admin-modal-xl">
      <div class="admin-modal-header">
        <h3 id="entityModalTitle">内容编辑</h3>
        <button class="admin-modal-close" id="btnCloseEntityModal">×</button>
      </div>
      <form id="entityForm">
        <input type="hidden" id="entityModule" />
        <input type="hidden" id="entityId" />
        <div id="entityFormBody"></div>
        <div class="admin-modal-footer">
          <button type="button" class="btn-admin btn-admin-ghost" id="btnSaveDraft">保存草稿</button>
          <button type="button" class="btn-admin btn-admin-ghost" id="btnSubmitReview">提交审核</button>
          <button type="button" class="btn-admin btn-admin-primary" id="btnPublish">发布</button>
          <button type="button" class="btn-admin btn-admin-danger" id="btnArchive">归档</button>
          <button type="button" class="btn-admin btn-admin-ghost" id="btnRevertVersion">回滚到上一版本</button>
        </div>
      </form>
      <div class="admin-version-box">
        <h4>版本记录</h4>
        <div id="entityVersions"></div>
      </div>
    </div>
  </div>

  <script src="data/site-data.js"></script>
  <script src="admin.js"></script>
</body>
</html>
