<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系我们 | 卓希集团</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="data/site-data.js"></script>
    <style>
        .contact-layout {
            max-width: 1220px;
            margin: 0 auto;
            display: grid;
            gap: 40px;
            padding: 40px 0;
        }

        .recruitment-block {
            background: #fff;
            border-radius: 64px;
            padding: 40px 80px;
            box-shadow: var(--island-shadow);
            display: flex;
            gap: 80px;
            align-items: center;
            border: 1px solid rgba(0, 0, 0, 0.03);
            width: 100%;
        }

        .recruitment-content {
            flex: 1.5;
        }

        .career-image-wrap {
            flex: 1;
            display: flex;
            justify-content: center;
        }

        .career-image-wrap img {
            max-width: 200px;
            height: auto;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.1));
        }

        .career-image-wrap:hover img {
            transform: scale(1.08) rotate(3deg);
        }

        .careers-list {
            margin-top: 24px;
            display: grid;
            gap: 14px;
        }

        .career-item {
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 20px;
            padding: 16px 18px;
            background: #fff;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .career-item-head {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            margin-bottom: 8px;
        }

        .career-item-title {
            font-size: 18px;
            font-weight: 700;
        }

        .career-item-meta {
            color: var(--text-muted);
            font-size: 14px;
        }
    </style>
</head>

<body>

    <zhuoxi-navbar></zhuoxi-navbar>
    <script src="components/navbar.js"></script>

    <main style="padding-top: 120px;">
        <div class="contact-layout">

            <section id="cooperative" class="contact-section">
                <div class="contact-island reveal" style="padding: 60px 80px; display: flex; justify-content: space-between; align-items: flex-start; overflow: hidden; position: relative;">
                    <div style="position: relative; z-index: 2;">
                        <h2 class="section-title" style="font-size: 36px; margin-bottom: 4px;">商务合作</h2>
                        <p style="opacity: 0.8; margin-bottom: 24px;">全渠道合作 · 全球分销 · 媒体联系</p>

                        <div style="display: flex; gap: 32px; align-items: center;">
                            <a href="javascript:void(0)" id="bizEmailLink" title="点击复制"
                                style="color: inherit; text-decoration: none; opacity: 0.8; transition: opacity 0.3s; cursor: pointer; font-size: 16px;">📧 biz@zhuoxi-hero.com</a>
                            <a href="javascript:void(0)" id="servicePhoneLink" title="点击复制"
                                style="color: inherit; text-decoration: none; opacity: 0.8; transition: opacity 0.3s; cursor: pointer; font-size: 16px;">📞 400-888-8888</a>
                        </div>
                    </div>

                    <div class="contact-visual" style="opacity: 0.05; transform: rotate(-8deg); pointer-events: none; user-select: none;">
                        <h1 style="font-size: 110px; font-weight: 900; margin: 0; line-height: 0.8; letter-spacing: -2px; white-space: nowrap;">ZHUOXI</h1>
                    </div>
                </div>
            </section>

            <section id="careers" class="careers-section">
                <div class="recruitment-block reveal">
                    <div class="recruitment-content">
                        <h2 class="section-title" style="font-size: 32px;">加入我们</h2>
                        <div class="title-accent"></div>
                        <p class="body-text">寻找敢于打破常规、有想法、做实事的同行者。在卓希，每一个想法都有被实现的可能。</p>
                        <p style="margin-top: 16px; font-size: 16px; font-weight: 500;">
                            投递简历：<a href="javascript:void(0)" id="hrEmailLink" title="点击复制"
                                style="color: var(--hero-orange); text-decoration: none; transition: opacity 0.3s; cursor: pointer;">📧 hr@zhuoxi-hero.com</a>
                        </p>
                        <div id="careersList" class="careers-list"></div>
                    </div>
                    <div class="career-image-wrap">
                        <img src="喇叭脱脱.png" alt="卓希吉祥物 - 青椒脱脱">
                    </div>
                </div>
            </section>

        </div>
    </main>

    <zhuoxi-footer></zhuoxi-footer>
    <script src="components/footer.js"></script>

    <script src="main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            siteData.load();
            const profile = siteData.getProfile();
            const careers = siteData.getPublishedCareers();

            const bizEmail = profile.businessEmail || 'biz@zhuoxi-hero.com';
            const phone = profile.servicePhone || '400-888-8888';
            const hrEmail = profile.hrEmail || 'hr@zhuoxi-hero.com';

            const bizEmailLink = document.getElementById('bizEmailLink');
            const servicePhoneLink = document.getElementById('servicePhoneLink');
            const hrEmailLink = document.getElementById('hrEmailLink');

            if (bizEmailLink) {
                bizEmailLink.textContent = `📧 ${bizEmail}`;
                bizEmailLink.onclick = () => copyToClipboard(bizEmail, '合作邮箱');
            }
            if (servicePhoneLink) {
                servicePhoneLink.textContent = `📞 ${phone}`;
                servicePhoneLink.onclick = () => copyToClipboard(phone, '联系电话');
            }
            if (hrEmailLink) {
                hrEmailLink.textContent = `📧 ${hrEmail}`;
                hrEmailLink.onclick = () => copyToClipboard(hrEmail, '招聘邮箱');
            }

            const listNode = document.getElementById('careersList');
            if (!listNode) return;
            if (!careers.length) {
                listNode.innerHTML = '<div class="career-item"><div class="career-item-meta">当前暂无开放岗位。</div></div>';
                return;
            }
            listNode.innerHTML = careers.map(item => `
                <a class="career-item" href="#careers">
                    <div class="career-item-head">
                        <div class="career-item-title">${item.title || ''}</div>
                        <div class="career-item-meta">${item.salary || ''}</div>
                    </div>
                    <div class="career-item-meta">${item.department || ''} · ${item.city || ''} · ${item.type || ''}</div>
                </a>
            `).join('');
        });
    </script>
</body>

</html>
