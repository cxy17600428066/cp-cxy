<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新闻中心 | 卓希集团</title>
    <meta name="description" content="卓希集团媒体中心，包含品牌资讯、活动报道和产品研发动态。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="data/site-data.js"></script>
    <style>
        :root {
            --bg-base: #faf8f5;
            --surface: #fff;
            --text-primary: #171717;
            --text-muted: #888;
            --primary: #ffaa00;
            --shadow-card: 0 12px 32px rgba(0, 0, 0, 0.05);
            --shadow-soft: 0 8px 30px rgba(0, 0, 0, 0.03);
            --shadow-cta: 0 8px 24px rgba(255, 170, 0, 0.35);
            --r-pill: 999px;
            --r-card: 32px;
        }

        body {
            background: var(--bg-base);
            font-family: "Inter", "Noto Sans SC", system-ui, -apple-system, sans-serif;
            color: var(--text-primary);
        }

        .news-wrap {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px 120px;
        }

        .news-page-header {
            padding: 60px 0 48px;
        }

        .page-eyebrow {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--primary);
            margin-bottom: 12px;
        }

        .page-title {
            font-size: clamp(40px, 5vw, 64px);
            font-weight: 900;
            letter-spacing: -1.5px;
            line-height: 1;
            margin-bottom: 12px;
        }

        .page-subtitle {
            font-size: 16px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .filter-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 48px;
        }

        .filter-btn {
            padding: 11px 24px;
            border-radius: var(--r-pill);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            background: var(--surface);
            color: var(--text-muted);
            box-shadow: var(--shadow-soft);
        }

        .filter-btn.active {
            background: var(--primary);
            color: #fff;
            box-shadow: var(--shadow-cta);
        }

        .news-featured {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .news-hero-card {
            background: var(--text-primary);
            border-radius: var(--r-card);
            overflow: hidden;
            min-height: 480px;
            position: relative;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .news-hero-content {
            position: relative;
            z-index: 2;
            padding: 44px 48px;
            display: flex;
            min-height: 100%;
            flex-direction: column;
            justify-content: flex-end;
        }

        .news-hero-cat {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 170, 0, 0.15);
            color: var(--primary);
            border-radius: var(--r-pill);
            padding: 6px 14px;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 20px;
            width: fit-content;
        }

        .cat-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--primary);
        }

        .news-hero-title {
            font-size: clamp(20px, 2.2vw, 28px);
            font-weight: 900;
            color: #fff;
            line-height: 1.3;
            margin-bottom: 14px;
        }

        .news-hero-excerpt {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.7;
            margin-bottom: 28px;
        }

        .news-hero-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .news-hero-date {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.45);
            font-weight: 600;
        }

        .btn-outline-light {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: var(--r-pill);
            padding: 10px 22px;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
        }

        .news-side-stack {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .news-side-card {
            background: var(--surface);
            border-radius: var(--r-card);
            padding: 32px;
            box-shadow: var(--shadow-card);
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .side-cat {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .side-title {
            font-size: 17px;
            font-weight: 800;
            line-height: 1.35;
            margin-bottom: 10px;
        }

        .side-excerpt {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.65;
            margin-bottom: 16px;
        }

        .side-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
        }

        .grid-eyebrow {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .news-card {
            background: var(--surface);
            border-radius: var(--r-card);
            overflow: hidden;
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
        }

        .card-thumb {
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            flex-shrink: 0;
            background: linear-gradient(135deg, #fff8e0, #ffedb0);
        }

        .card-body {
            padding: 24px 24px 28px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .card-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 11px;
        }

        .card-cat {
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--primary);
        }

        .card-date {
            color: var(--text-muted);
            font-weight: 600;
        }

        .card-title {
            font-size: 16px;
            font-weight: 800;
            line-height: 1.4;
            margin-bottom: 10px;
        }

        .card-excerpt {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.65;
            flex: 1;
            margin-bottom: 18px;
        }

        .card-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 700;
            color: var(--primary);
        }

        .news-load-more {
            text-align: center;
            margin-top: 56px;
        }

        .btn-ghost {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--surface);
            border: none;
            border-radius: var(--r-pill);
            padding: 14px 36px;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            box-shadow: var(--shadow-soft);
        }

        @media (max-width: 960px) {
            .news-wrap {
                padding: 0 20px 80px;
            }

            .news-featured {
                grid-template-columns: 1fr;
            }

            .news-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 640px) {
            .news-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <zhuoxi-navbar></zhuoxi-navbar>
    <script src="components/navbar.js"></script>

    <main style="padding-top: 80px;">
        <div class="news-wrap">
            <div class="news-page-header reveal">
                <div class="page-eyebrow">MEDIA CENTER</div>
                <h1 class="page-title">新闻中心</h1>
                <p class="page-subtitle">品牌动态 · 行业观察 · 企业资讯</p>
            </div>

            <div class="filter-bar reveal"></div>

            <div class="news-featured reveal"></div>

            <div class="grid-eyebrow reveal" style="margin-top: 48px;">更多资讯</div>
            <div class="news-grid"></div>

            <div class="news-load-more reveal">
                <button class="btn-ghost">加载更多资讯 →</button>
            </div>
        </div>
    </main>

    <zhuoxi-footer></zhuoxi-footer>
    <script src="components/footer.js"></script>

    <script src="main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            siteData.load();
            const allNews = siteData.getPublishedNews();

            const featuredContainer = document.querySelector('.news-featured');
            if (featuredContainer && allNews.length > 0) {
                const featured = allNews.filter(n => n.isFeatured);
                const hero = featured[0] || allNews[0];
                const sides = (featured.length > 1 ? featured.slice(1, 3) : allNews.slice(1, 3));

                featuredContainer.innerHTML = `
                    <a class="news-hero-card" href="news-detail.html?slug=${encodeURIComponent(hero.slug || '')}">
                        <div class="news-hero-content">
                            <div class="news-hero-cat"><span class="cat-dot"></span>${hero.category}</div>
                            <div class="news-hero-title">${hero.title}</div>
                            <div class="news-hero-excerpt">${hero.excerpt}</div>
                            <div class="news-hero-foot">
                                <span class="news-hero-date">${hero.date.replace(/\./g, ' · ')}</span>
                                <span class="btn-outline-light">阅读详情 <span class="btn-arrow">→</span></span>
                            </div>
                        </div>
                    </a>
                    <div class="news-side-stack">
                        ${sides.map(n => `
                            <a class="news-side-card" href="news-detail.html?slug=${encodeURIComponent(n.slug || '')}">
                                <div class="side-cat">${n.category}</div>
                                <div class="side-title">${n.title}</div>
                                <div class="side-excerpt">${n.excerpt}</div>
                                <div class="side-foot">
                                    <span>${n.date}</span>
                                    <span>→</span>
                                </div>
                            </a>
                        `).join('')}
                    </div>
                `;
            }

            let displayCount = 3;
            const gridContainer = document.querySelector('.news-grid');
            const loadMoreWrap = document.querySelector('.news-load-more');
            const loadMoreButton = loadMoreWrap ? loadMoreWrap.querySelector('button') : null;

            function renderNewsGrid() {
                if (!gridContainer) return;
                const gridNews = allNews.filter(n => !n.isFeatured);
                const toRender = gridNews.slice(0, displayCount);

                gridContainer.innerHTML = toRender.map((n, i) => `
                    <a class="news-card reveal in-view" style="transition-delay:${i * 0.05}s" data-category="${n.categoryKey}" href="news-detail.html?slug=${encodeURIComponent(n.slug || '')}">
                        <div class="card-thumb">${n.emoji || '📰'}</div>
                        <div class="card-body">
                            <div class="card-meta">
                                <span class="card-cat">${n.category}</span>
                                <span class="card-date">${n.date}</span>
                            </div>
                            <div class="card-title">${n.title}</div>
                            <div class="card-excerpt">${n.excerpt}</div>
                            <span class="card-link">阅读详情 →</span>
                        </div>
                    </a>
                `).join('');

                if (loadMoreWrap) {
                    loadMoreWrap.style.display = displayCount >= gridNews.length ? 'none' : 'block';
                }
            }

            renderNewsGrid();

            if (loadMoreButton) {
                loadMoreButton.addEventListener('click', () => {
                    displayCount += 3;
                    renderNewsGrid();
                });
            }

            const filterBar = document.querySelector('.filter-bar');
            if (filterBar) {
                const categories = [{ key: 'all', label: '全部动态' }];
                const seen = new Set();
                allNews.forEach(n => {
                    if (n.categoryKey && !seen.has(n.categoryKey)) {
                        seen.add(n.categoryKey);
                        categories.push({ key: n.categoryKey, label: n.category });
                    }
                });
                filterBar.innerHTML = categories
                    .map(c => `<button class="filter-btn${c.key === 'all' ? ' active' : ''}" onclick="filterNews(this,'${c.key}')">${c.label}</button>`)
                    .join('');
                const activeBtn = filterBar.querySelector('.filter-btn.active');
                if (activeBtn) filterNews(activeBtn, 'all');
            }
        });

        function filterNews(btn, category) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const cards = document.querySelectorAll('.news-card[data-category]');
            cards.forEach(card => {
                const match = category === 'all' || card.dataset.category === category;
                card.style.display = match ? '' : 'none';
            });
        }
    </script>
</body>

</html>
