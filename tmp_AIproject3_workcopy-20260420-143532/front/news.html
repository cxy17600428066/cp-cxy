        鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲 */
        :root {
            --bg-base:       #faf8f5;
            --surface:       #ffffff;
            --text-primary:  #171717;
            --text-muted:    #888888;
            --primary:       #ffaa00;
            --primary-dark:  #e69900;
            --shadow-card:   0 12px 32px rgba(0, 0, 0, 0.05);
            --shadow-soft:   0 8px 30px rgba(0, 0, 0, 0.03);
            --shadow-raised: 0 12px 40px rgba(0, 0, 0, 0.10);
            --shadow-cta:    0 8px 24px rgba(255, 170, 0, 0.35);
            --r-pill:   999px;
            --r-card:    32px;
        }

        body {
            background: var(--bg-base);
            font-family: 'Inter', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
            color: var(--text-primary);
        }

        /* 鈺愨晲鈺愨晲 Layout 鈺愨晲鈺愨晲 */
        .news-wrap {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px 120px;
        }

        /* 鈺愨晲鈺愨晲 Page Header 鈺愨晲鈺愨晲 */
        .news-page-header {
            padding: 60px 0 48px;
        }

        .page-eyebrow {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--primary);
            margin-bottom: 12px;
        }

        .page-title {
            font-size: clamp(40px, 5vw, 64px);
            font-weight: 900;
            color: var(--text-primary);
            letter-spacing: -1.5px;
            line-height: 1.0;
            margin-bottom: 12px;
        }

        .page-subtitle {
            font-size: 16px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* 鈺愨晲鈺愨晲 Filter Bar 鈺愨晲鈺愨晲 */
        .filter-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 48px;
        }

        .filter-btn {
            padding: 11px 24px;
            border-radius: var(--r-pill);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            background: var(--surface);
            color: var(--text-muted);
            box-shadow: var(--shadow-soft);
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-family: inherit;
        }

        .filter-btn:hover {
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.07);
        }

        .filter-btn:active {
            transform: scale(0.97);
        }

        .filter-btn.active {
            background: var(--primary);
            color: #fff;
            box-shadow: var(--shadow-cta);
        }

        /* 鈺愨晲鈺愨晲 Hero + Side Stack 鈺愨晲鈺愨晲 */
        .news-featured {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        /* 鈹€鈹€ Hero Card (dark ambient surface) 鈹€鈹€ */
        .news-hero-card {
            background: var(--text-primary);
            border-radius: var(--r-card);
            box-shadow: var(--shadow-raised);
            overflow: hidden;
            min-height: 480px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            cursor: pointer;
            position: relative;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                        box-shadow 0.25s ease;
        }

        .news-hero-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 24px 56px rgba(0, 0, 0, 0.18);
        }

        /* Ambient amber glow */
        .news-hero-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at 70% 30%, rgba(255, 170, 0, 0.2) 0%, transparent 55%),
                radial-gradient(ellipse at 20% 90%, rgba(255, 170, 0, 0.08) 0%, transparent 40%);
            pointer-events: none;
        }

        .news-hero-content {
            position: relative;
            z-index: 2;
            padding: 44px 48px;
        }

        .news-hero-cat {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 170, 0, 0.15);
            color: var(--primary);
            border-radius: var(--r-pill);
            padding: 6px 14px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .cat-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--primary);
        }

        .news-hero-title {
            font-size: clamp(20px, 2.2vw, 28px);
            font-weight: 900;
            color: #fff;
            line-height: 1.3;
            letter-spacing: -0.3px;
            margin-bottom: 14px;
        }

        .news-hero-excerpt {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            line-height: 1.7;
            margin-bottom: 28px;
        }

        .news-hero-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .news-hero-date {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.35);
            font-weight: 600;
        }

        /* Read CTA 鈥?outline on dark */
        .btn-outline-light {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: var(--r-pill);
            padding: 10px 22px;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .btn-outline-light:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
            box-shadow: var(--shadow-cta);
            transform: translateY(-2px);
        }

        .btn-outline-light:active {
            transform: scale(0.97);
        }

        .btn-arrow { transition: transform 0.25s ease; }
        .btn-outline-light:hover .btn-arrow { transform: translateX(4px); }

        /* 鈹€鈹€ Side stack 鈹€鈹€ */
        .news-side-stack {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .news-side-card {
            background: var(--surface);
            border-radius: var(--r-card);
            padding: 32px;
            box-shadow: var(--shadow-card);
            flex: 1;
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                        box-shadow 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        /* Amber left accent grows on hover */
        .news-side-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--primary);
            border-radius: 4px 0 0 4px;
            transform: scaleY(0);
            transform-origin: bottom;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .news-side-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
        }

        .news-side-card:hover::before {
            transform: scaleY(1);
        }

        .side-cat {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .side-title {
            font-size: 17px;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1.35;
            margin-bottom: 10px;
            letter-spacing: -0.2px;
        }

        .side-excerpt {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.65;
            margin-bottom: 16px;
        }

        .side-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .side-date {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .side-arrow {
            font-size: 16px;
            color: var(--primary);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .news-side-card:hover .side-arrow {
            transform: translateX(6px);
        }

        /* 鈺愨晲鈺愨晲 Standard Grid 鈺愨晲鈺愨晲 */
        .grid-eyebrow {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .news-card {
            background: var(--surface);
            border-radius: var(--r-card);
            overflow: hidden;
            box-shadow: var(--shadow-card);
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                        box-shadow 0.25s ease;
            display: flex;
            flex-direction: column;
        }

        .news-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.09);
        }

        /* Color thumbnail zone */
        .card-thumb {
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            flex-shrink: 0;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .news-card:hover .card-thumb {
            transform: scale(1.05);
        }

        /* Warm amber thumb */
        .thumb-amber  { background: linear-gradient(135deg, #fff8e0, #ffedb0); }
        /* Deep dark thumb */
        .thumb-dark   { background: linear-gradient(135deg, #1c1c1c, #2e1800); }
        /* Warm brick */
        .thumb-brick  { background: linear-gradient(135deg, #fff0e8, #ffe0cc); }
        /* Slate green */
        .thumb-green  { background: linear-gradient(135deg, #eafaf0, #c8f0d8); }
        /* Cool blue */
        .thumb-blue   { background: linear-gradient(135deg, #eaf4ff, #c0deff); }
        /* Warm purple */
        .thumb-purple { background: linear-gradient(135deg, #f5f0ff, #e0d0ff); }

        .card-body {
            padding: 24px 24px 28px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .card-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .card-cat {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--primary);
        }

        .card-date {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;

        .card-title {
            font-size: 16px;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1.4;
            margin-bottom: 10px;
            letter-spacing: -0.2px;

        .card-excerpt {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.65;
            flex: 1;
            margin-bottom: 18px;

        .card-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
            transition: gap 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .news-card:hover .card-link {
            gap: 10px;
        }

        /* 鈺愨晲鈺愨晲 Load More 鈺愨晲鈺愨晲 */
        .news-load-more {
            text-align: center;
            margin-top: 56px;
        }

        .btn-ghost {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--surface);
            border: none;
            border-radius: var(--r-pill);
            padding: 14px 36px;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            box-shadow: var(--shadow-soft);
            font-family: inherit;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .btn-ghost:hover {
            background: var(--primary);
            color: #fff;
            box-shadow: var(--shadow-cta);
            transform: translateY(-3px);
        }

        .btn-ghost:active {
            transform: scale(0.97);
        }

        /* 鈺愨晲鈺愨晲 Responsive 鈺愨晲鈺愨晲 */
        @media (max-width: 960px) {
            .news-wrap { padding: 0 20px 80px; }
            .news-featured { grid-template-columns: 1fr; }
            .news-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 640px) {
            .news-grid { grid-template-columns: 1fr; }
        }
        /* 鈺愨晲鈺愨晲 News Detail Modal 鈺愨晲鈺愨晲 */
        .news-detail-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .news-detail-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .news-detail-modal {
            background: var(--surface);
            border-radius: var(--r-card);
            width: 90%;
            max-width: 720px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 48px;
            transform: scale(0.95) translateY(20px);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 24px 64px rgba(0,0,0,0.2);
        }
        .news-detail-overlay.active .news-detail-modal {
            transform: scale(1) translateY(0);
        }
        .news-detail-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
        }
        .news-detail-cat {
            display: inline-block;
            padding: 4px 12px;
            border-radius: var(--r-pill);
            font-size: 11px;
            font-weight: 700;
            background: var(--primary);
            color: #fff;
            margin-bottom: 12px;
        }
        .news-detail-title {
            font-size: clamp(22px, 3vw, 28px);
            font-weight: 900;
            line-height: 1.3;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }
        .news-detail-date {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
        }
        .news-detail-body {
            font-size: 16px;
            line-height: 1.8;
            color: #444;
        }
        .news-detail-close {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(0,0,0,0.05);
            border: none;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s ease;
            color: var(--text-muted);
        }
        .news-detail-close:hover {
            background: #ef4444;
            color: #fff;
        }
    </style>
</head>

    <script>
        // 鈺愨晲鈺?Dynamic News Renderer 鈺愨晲鈺?        document.addEventListener('DOMContentLoaded', () => {
            siteData.load();
            const allNews = siteData.getPublishedNews();

            // Render Featured Section
            const featuredContainer = document.querySelector('.news-featured');
            if (featuredContainer && allNews.length > 0) {
            const slugMap = new Map(allNews.map(item => [item.id, item.slug]));
                const featured = allNews.filter(n => n.isFeatured);
                const hero = featured[0] || allNews[0];
                const sides = (featured.length > 1 ? featured.slice(1, 3) : allNews.slice(1, 3));

                featuredContainer.innerHTML = `
                    <div class="news-hero-card" onclick="openNewsDetail('')">
                        <div class="news-hero-content">
                            <div class="news-hero-cat"><span class="cat-dot"></span>${hero.category}</div>
                            <div class="news-hero-title">${hero.title}</div>
                            <div class="news-hero-excerpt">${hero.excerpt}</div>
                            <div class="news-hero-foot">
                                <span class="news-hero-date">${hero.date.replace(/\./g, ' 路 ')}</span>
                                <span class="btn-outline-light">闃呰璇︽儏 <span class="btn-arrow">鈫?/span></span>
                            </div>
                        </div>
                    </div>
                    <div class="news-side-stack">
                        ${sides.map(n => `
                            <div class="news-side-card" onclick="openNewsDetail('')">
                                <div class="side-cat">${n.category}</div>
                                <div class="side-title">${n.title}</div>
                                <div class="side-excerpt">${n.excerpt}</div>
                                <div class="side-foot">
                                    <span class="side-date">${n.date}</span>
                                    <span class="side-arrow">鈫?/span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            // 鈺愨晲鈺?News Grid Pagination Logic 鈺愨晲鈺?            let displayCount = 3;
            const gridContainer = document.querySelector('.news-grid');
            const loadMoreBtn = document.querySelector('.news-load-more');

            function renderNewsGrid() {
                if (!gridContainer) return;
                
                const gridNews = allNews.filter(n => !n.isFeatured);
                const toRender = gridNews.slice(0, displayCount);

                gridContainer.innerHTML = toRender.map((n, i) => `
                    <div class="news-card reveal in-view" style="transition-delay:${i*0.05}s" data-category="${n.categoryKey}" onclick="openNewsDetail('${n.id}')">
                        <div class="card-thumb ${n.thumbClass || 'thumb-amber'}">${n.emoji || '馃摪'}</div>
                        <div class="card-body">
                            <div class="card-meta">
                                <span class="card-cat">${n.category}</span>
                                <span class="card-date">${n.date}</span>
                            </div>
                            <div class="card-title">${n.title}</div>
                            <div class="card-excerpt">${n.excerpt}</div>
                            <span class="card-link">闃呰璇︽儏 鈫?/span>
                        </div>
                    </div>
                `).join('');

                // Hide button if no more news
                if (loadMoreBtn) {
                    if (displayCount >= gridNews.length) {
                        loadMoreBtn.style.display = 'none';
                    } else {
                        loadMoreBtn.style.display = 'flex';
                    }
                }
            }

            // Initial Render
            renderNewsGrid();

            // Load More Click
            if (loadMoreBtn) {
                loadMoreBtn.querySelector('button').addEventListener('click', () => {
                    displayCount += 3;
                    renderNewsGrid();
                });
            }

            // Dynamic filter buttons
            const filterBar = document.querySelector('.filter-bar');
            if (filterBar) {
                const categories = [{key: 'all', label: '鍏ㄩ儴鍔ㄦ€?}];
                const seen = new Set();
                allNews.forEach(n => {
                    if (!seen.has(n.categoryKey)) {
                        seen.add(n.categoryKey);
                        categories.push({key: n.categoryKey, label: n.category});
                    }
                });
                filterBar.innerHTML = categories.map(c =>
                    `<button class="filter-btn${c.key === 'all' ? ' active' : ''}" onclick="filterNews(this,'${c.key}')">${c.label}</button>`
                ).join('');
                
                // 鈺愨晲鈺?Trigger initial filter to show news 鈺愨晲鈺?                const activeBtn = filterBar.querySelector('.filter-btn.active');
                if (activeBtn) {
                    filterNews(activeBtn, 'all');
                }
            }
        });

        // 鈺愨晲鈺?News Detail Modal 鈺愨晲鈺?        function openNewsDetail(id) {
            const news = siteData.getNewsById(id);
            if (!news) return;
            document.getElementById('detail-cat').textContent = news.category;
            document.getElementById('detail-title').textContent = news.title;
            document.getElementById('detail-date').textContent = news.date;
            document.getElementById('detail-body').innerHTML = news.detail.split('\n').map(p => `<p style="margin-bottom:16px">${p}</p>`).join('');
            document.getElementById('news-detail-overlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeNewsDetail() {
            document.getElementById('news-detail-overlay').classList.remove('active');
            document.body.style.overflow = '';
        }

        // Close on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeNewsDetail();
        });

        function filterNews(btn, category) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const cards = document.querySelectorAll('.news-card[data-category]');
            cards.forEach(card => {
                const match = category === 'all' || card.dataset.category === category;
                if (match) {
                    card.style.display = '';
                    requestAnimationFrame(() => {
                        card.style.opacity = '1';
                        card.style.transform = '';
                    });
                } else {
                    card.style.opacity = '0';
                    card.style.transform = 'scale(0.95) translateY(8px)';
                    setTimeout(() => {
                        if (card.style.opacity === '0') card.style.display = 'none';
                    }, 350);
                }
            });
        }
    </script>
</body>

</html>
