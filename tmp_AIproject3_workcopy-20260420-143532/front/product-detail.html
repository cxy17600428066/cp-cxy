<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品详情 | 卓希集团</title>
    <link rel="stylesheet" href="style.css">
    <script src="data/site-data.js"></script>
    <style>
        .pd-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
            padding: 0 40px;
        }

        .pd-card {
            background: #fff;
            border-radius: 36px;
            box-shadow: var(--island-shadow);
            padding: 36px;
        }

        .pd-image {
            width: 100%;
            height: 420px;
            object-fit: contain;
        }

        @media (max-width: 960px) {
            .pd-grid {
                grid-template-columns: 1fr;
                padding: 0 20px;
            }

            .pd-image {
                height: 300px;
            }
        }
    </style>
</head>

<body>
    <zhuoxi-navbar></zhuoxi-navbar>
    <script src="components/navbar.js"></script>

    <main style="padding-top: 120px; padding-bottom: 80px;">
        <div class="pd-grid">
            <div class="pd-card reveal">
                <img id="pdImage" class="pd-image" src="products_lineup.png" alt="产品图">
            </div>
            <div class="pd-card reveal">
                <div id="pdBadge" style="display:inline-block;padding:6px 14px;border-radius:999px;background:#ffaa00;color:#fff;font-size:12px;font-weight:700;margin-bottom:14px;">产品</div>
                <h1 id="pdName" style="font-size:clamp(30px,4vw,46px);line-height:1.15;margin:0 0 14px;">产品名称</h1>
                <p id="pdDesc" style="font-size:16px;line-height:1.8;color:#555;margin:0 0 18px;">产品描述</p>
                <div id="pdSpecs" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;"></div>
                <div style="display:grid;gap:10px;color:#444;">
                    <div><strong>配料：</strong><span id="pdIngredients"></span></div>
                    <div><strong>营养：</strong><span id="pdNutrition"></span></div>
                    <div><strong>场景：</strong><span id="pdScenes"></span></div>
                    <div><strong>FAQ：</strong><span id="pdFaq"></span></div>
                </div>
                <div style="margin-top:28px;display:flex;gap:12px;flex-wrap:wrap;">
                    <a id="pdBuy" href="#" target="_blank" class="btn btn-primary">购买链接</a>
                    <a href="products.html" class="btn btn-outline">返回产品中心</a>
                </div>
            </div>
        </div>
    </main>

    <zhuoxi-footer></zhuoxi-footer>
    <script src="components/footer.js"></script>
    <script src="main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            siteData.load();
            const params = new URLSearchParams(window.location.search);
            const slug = params.get("slug") || "";
            const p = siteData.getProductBySlug(slug);

            if (!p || p.status !== "published") {
                document.getElementById("pdName").textContent = "未找到对应产品";
                document.getElementById("pdDesc").textContent = "当前产品不存在或未发布。";
                document.getElementById("pdBuy").style.display = "none";
                return;
            }

            document.getElementById("pdBadge").textContent = p.badge || p.flavor || "产品";
            document.getElementById("pdName").textContent = p.name || "产品详情";
            document.getElementById("pdDesc").textContent = p.desc || "";
            document.getElementById("pdImage").src = p.image || "products_lineup.png";
            document.getElementById("pdImage").alt = p.name || "产品图";
            document.getElementById("pdIngredients").textContent = p.ingredients || "-";
            document.getElementById("pdNutrition").textContent = p.nutrition || "-";
            document.getElementById("pdScenes").textContent = p.scenes || "-";
            document.getElementById("pdFaq").textContent = p.faq || "-";

            const specs = Array.isArray(p.specs) ? p.specs : [];
            document.getElementById("pdSpecs").innerHTML = specs
                .map(s => `<span style="background:rgba(0,0,0,0.05);padding:6px 12px;border-radius:999px;font-size:13px;">${s}</span>`)
                .join("");

            const buy = document.getElementById("pdBuy");
            if (p.link) buy.href = p.link;
            else buy.style.display = "none";

            if (p.seo && p.seo.title) document.title = p.seo.title;
        });
    </script>
</body>

</html>
