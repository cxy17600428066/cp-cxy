    <script src="main.js"></script>
    <script>
        // 鈺愨晲鈺?Dynamic Product Renderer 鈺愨晲鈺?        document.addEventListener('DOMContentLoaded', () => {
            siteData.load();
            const products = siteData.getPublishedProducts();
            const grid = document.querySelector('.products-grid');
            if (grid && products.length > 0) {
                const bgColors = ['bg-lemon', 'bg-red', 'bg-spicy', 'bg-garlic', 'bg-pepper'];
                grid.innerHTML = products.map((p, i) => {
                    const isWide = i === 0;
                    const bg = bgColors[i % bgColors.length];
                    const specsHtml = (p.specs || []).map(s => `<span class="attr-chip">${s}</span>`).join('');
                    // Map flavor to category key if possible, otherwise use 'all'
                    const flavorKey = p.categoryKey || 'all'; 
                    return `
                        <div class="product-card${isWide ? ' product-card-wide' : ''} reveal" style="transition-delay:${i*0.05}s" data-flavor="${flavorKey}">
                            <div class="product-img-zone ${bg}">
                                ${p.badge ? `<span class="product-badge badge-top">${p.badge}</span>` : ''}
                                <img src="${p.image}" alt="${p.name}">
                            </div>
                            <div class="product-card-body">
                                <div class="product-flavor-label">${p.badge || p.flavor || ''}</div>
                                <div class="product-name">${p.name}鏃犻鍑ょ埅</div>
                                <div class="product-desc">${p.desc}</div>
                                ${specsHtml ? `<div class="product-attrs">${specsHtml}</div>` : ''}
                                <div class="product-card-footer">
                                    <span class="product-weight">${(p.specs && p.specs[0]) || ''}</span>
                                    <a href="product-detail.html?slug=${encodeURIComponent(p.slug || '')}" class="btn-primary-pill">了解详情 <span class="btn-arrow">→</span></a>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                // 鈺愨晲鈺?Trigger initial filter to show products 鈺愨晲鈺?                const activeBtn = document.querySelector('.filter-btn.active');
                if (activeBtn) {
                    const flavor = activeBtn.getAttribute('onclick').match(/'([^']+)'/)[1];
                    filterProducts(activeBtn, flavor);
                } else {
                    filterProducts(document.querySelector('.filter-btn'), 'all');
                }
            }
        });

        function switchHeroTheme(el, type) {
            document.querySelectorAll('.hero-cat-tag').forEach(tag => tag.classList.remove('active'));
            el.classList.add('active');
            const heroImg = document.querySelector('.hero-lineup-img');
            heroImg.classList.remove('switching');
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    heroImg.classList.add('switching');
                    heroImg.addEventListener('animationend', () => {
                        heroImg.classList.remove('switching');
                    }, { once: true });
                });
            });
            setTimeout(() => {
                const filterMap = { 'all': '鍏ㄩ儴鍙ｅ懗', 'spicy': '鏃犻绯诲垪', 'sour': '铏庣毊绯诲垪', 'fragrant': '鑰佸崵绯诲垪' };
                const targetText = filterMap[type];
                const mainFilterBtn = Array.from(document.querySelectorAll('.filter-btn')).find(btn => btn.innerText === targetText);
                if (mainFilterBtn) filterProducts(mainFilterBtn, type);
            }, 0);
        }

        function filterProducts(btn, flavor) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const cards = document.querySelectorAll('.product-card[data-flavor]');
            cards.forEach(card => {
                const match = flavor === 'all' || card.dataset.flavor === flavor;
                if (match) {
                    card.style.display = '';
                    requestAnimationFrame(() => { card.style.opacity = '1'; card.style.transform = ''; });
                } else {
                    card.style.opacity = '0';
                    card.style.transform = 'scale(0.96) translateY(8px)';
                    setTimeout(() => { if (card.style.opacity === '0') card.style.display = 'none'; }, 350);
                }
            });
        }
    </script>
