<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理 | 卓希集团</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="admin-layout">

    <!-- ═══ Sidebar ═══ -->
    <aside class="admin-sidebar">
        <div class="admin-logo">
            <h1>卓希管理后台</h1>
            <p>ZHUOXI CMS</p>
        </div>

        <nav class="admin-nav">
            <button class="admin-nav-item active" onclick="switchTab('carousel', this)">
                <span class="nav-icon">🖼️</span> 轮播图管理
            </button>
            <button class="admin-nav-item" onclick="switchTab('news', this)">
                <span class="nav-icon">📰</span> 资讯管理
            </button>
            <button class="admin-nav-item" onclick="switchTab('products', this)">
                <span class="nav-icon">🛒</span> 产品管理
            </button>
        </nav>

        <div class="admin-sidebar-footer">
            <button class="admin-nav-item" onclick="exportData()">
                <span class="nav-icon">📤</span> 导出数据
            </button>
            <button class="admin-nav-item" onclick="document.getElementById('import-file').click()">
                <span class="nav-icon">📥</span> 导入数据
            </button>
            <input type="file" id="import-file" accept=".json" class="hidden-input" onchange="importData(event)">
            <button class="admin-nav-item" onclick="resetData()" style="color: var(--admin-danger);">
                <span class="nav-icon">🔄</span> 重置默认
            </button>
            <a href="index.html" class="admin-nav-item" style="text-decoration: none;">
                <span class="nav-icon">🌐</span> 返回前台
            </a>
        </div>
    </aside>

    <!-- ═══ Main Content ═══ -->
    <main class="admin-main">

        <!-- ══ Tab: Carousel ══ -->
        <div id="tab-carousel" class="admin-tab-content active">
            <div class="admin-header">
                <h2>🖼️ 首页轮播图</h2>
                <div class="admin-header-actions">
                    <button class="btn-admin btn-admin-primary" onclick="openCarouselModal()">+ 新增轮播图</button>
                </div>
            </div>
            <div id="carousel-list"></div>
        </div>

        <!-- ══ Tab: News ══ -->
        <div id="tab-news" class="admin-tab-content">
            <div class="admin-header">
                <h2>📰 集团资讯</h2>
                <div class="admin-header-actions">
                    <button class="btn-admin btn-admin-primary" onclick="openNewsModal()">+ 新增资讯</button>
                </div>
            </div>
            <div id="news-list"></div>
        </div>

        <!-- ══ Tab: Products ══ -->
        <div id="tab-products" class="admin-tab-content">
            <div class="admin-header">
                <h2>🛒 产品管理</h2>
                <div class="admin-header-actions">
                    <button class="btn-admin btn-admin-primary" onclick="openProductModal()">+ 新增产品</button>
                </div>
            </div>
            <div id="products-list"></div>
        </div>

    </main>
</div>

<!-- ═══ Carousel Modal ═══ -->
<div id="carousel-modal" class="admin-modal-overlay" onclick="if(event.target===this)closeModal('carousel-modal')">
    <div class="admin-modal">
        <div class="admin-modal-header">
            <h3 id="carousel-modal-title">新增轮播图</h3>
            <button class="admin-modal-close" onclick="closeModal('carousel-modal')">✕</button>
        </div>
        <form id="carousel-form" onsubmit="saveCarousel(event)">
            <input type="hidden" id="carousel-id">
            <div class="admin-form-group">
                <label>图片路径</label>
                <input type="text" id="carousel-src" class="admin-input" placeholder="如: picture/photo.jpg" required>
            </div>
            <div class="admin-form-group">
                <label>图片描述 (alt)</label>
                <input type="text" id="carousel-alt" class="admin-input" placeholder="如: 脱骨侠招牌产品" required>
            </div>
            <div class="admin-form-group">
                <label>排序 (数字越小越靠前)</label>
                <input type="number" id="carousel-order" class="admin-input" value="1" min="1">
            </div>
            <div class="admin-modal-footer">
                <button type="button" class="btn-admin btn-admin-ghost" onclick="closeModal('carousel-modal')">取消</button>
                <button type="submit" class="btn-admin btn-admin-primary">保存</button>
            </div>
        </form>
    </div>
</div>

<!-- ═══ News Modal ═══ -->
<div id="news-modal" class="admin-modal-overlay" onclick="if(event.target===this)closeModal('news-modal')">
    <div class="admin-modal" style="max-width: 720px;">
        <div class="admin-modal-header">
            <h3 id="news-modal-title">新增资讯</h3>
            <button class="admin-modal-close" onclick="closeModal('news-modal')">✕</button>
        </div>
        <form id="news-form" onsubmit="saveNews(event)">
            <input type="hidden" id="news-id">
            <div class="admin-form-group">
                <label>新闻标题</label>
                <input type="text" id="news-title" class="admin-input" placeholder="输入新闻标题" required>
            </div>
            <div class="admin-form-row">
                <div class="admin-form-group">
                    <label>分类</label>
                    <select id="news-category" class="admin-select" required>
                        <option value="brand">品牌资讯</option>
                        <option value="event">活动报道</option>
                        <option value="industry">行业动态</option>
                        <option value="global">全球化</option>
                        <option value="product">产品研发</option>
                    </select>
                </div>
                <div class="admin-form-group">
                    <label>日期</label>
                    <input type="text" id="news-date" class="admin-input" placeholder="如: 2026.04.12" required>
                </div>
            </div>
            <div class="admin-form-row">
                <div class="admin-form-group">
                    <label>封面图标 (emoji)</label>
                    <input type="text" id="news-emoji" class="admin-input" placeholder="如: 🏆" value="📰">
                </div>
                <div class="admin-form-group">
                    <label>排序</label>
                    <input type="number" id="news-order" class="admin-input" value="1" min="1">
                </div>
            </div>
            <div class="admin-form-group">
                <label>摘要</label>
                <textarea id="news-excerpt" class="admin-textarea" placeholder="新闻简短摘要..." rows="3" required></textarea>
            </div>
            <div class="admin-form-group">
                <label>详情内容</label>
                <textarea id="news-detail" class="admin-textarea" placeholder="完整新闻内容..." rows="6" required></textarea>
            </div>
            <div class="admin-form-group">
                <div class="toggle-wrap">
                    <div id="news-featured-toggle" class="toggle-switch" onclick="this.classList.toggle('on')"></div>
                    <label style="margin: 0">标记为头条</label>
                </div>
            </div>
            <div class="admin-modal-footer">
                <button type="button" class="btn-admin btn-admin-ghost" onclick="closeModal('news-modal')">取消</button>
                <button type="submit" class="btn-admin btn-admin-primary">保存</button>
            </div>
        </form>
    </div>
</div>

<!-- ═══ Product Modal ═══ -->
<div id="product-modal" class="admin-modal-overlay" onclick="if(event.target===this)closeModal('product-modal')">
    <div class="admin-modal" style="max-width: 720px;">
        <div class="admin-modal-header">
            <h3 id="product-modal-title">新增产品</h3>
            <button class="admin-modal-close" onclick="closeModal('product-modal')">✕</button>
        </div>
        <form id="product-form" onsubmit="saveProduct(event)">
            <input type="hidden" id="product-id">
            <div class="admin-form-row">
                <div class="admin-form-group">
                    <label>产品名称</label>
                    <input type="text" id="product-name" class="admin-input" placeholder="如: 川香红油" required>
                </div>
                <div class="admin-form-group">
                    <label>产品标签 (badge)</label>
                    <input type="text" id="product-badge" class="admin-input" placeholder="如: 经典爆款">
                </div>
            </div>
            <div class="admin-form-group">
                <label>产品文案</label>
                <input type="text" id="product-desc" class="admin-input" placeholder="如: 地道川味 · 香辣过瘾" required>
            </div>
            <div class="admin-form-row">
                <div class="admin-form-group">
                    <label>产品图片路径</label>
                    <input type="text" id="product-image" class="admin-input" placeholder="如: 川香红油.png" required>
                </div>
                <div class="admin-form-group">
                    <label>跳转链接</label>
                    <input type="text" id="product-link" class="admin-input" placeholder="https://...">
                </div>
            </div>
            <div class="admin-form-row">
                <div class="admin-form-group">
                    <label>产品规格 (每行一个)</label>
                    <textarea id="product-specs" class="admin-textarea" placeholder="250g/罐&#10;麻辣鲜香" rows="3"></textarea>
                </div>
                <div class="admin-form-group">
                    <label>分类 (用于筛选)</label>
                    <select id="product-category" class="admin-select" required>
                        <option value="all">全部口味</option>
                        <option value="spicy">无骨系列</option>
                        <option value="sour">虎皮系列</option>
                        <option value="fragrant">老卤系列</option>
                    </select>
                </div>
            </div>
            <div class="admin-form-group">
                <label>排序</label>
                <input type="number" id="product-order" class="admin-input" value="1" min="1">
            </div>
            <div class="admin-modal-footer">
                <button type="button" class="btn-admin btn-admin-ghost" onclick="closeModal('product-modal')">取消</button>
                <button type="submit" class="btn-admin btn-admin-primary">保存</button>
            </div>
        </form>
    </div>
</div>

<script src="data/site-data.js"></script>
<script src="admin.js"></script>
</body>
</html>
