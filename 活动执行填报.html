<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>活动执行填报</title><body style="margin:16px"><div id="custom-activity"><style>
#custom-activity{--p-bg:light-dark(#f4f6f9,#171c25);--p-panel:light-dark(#fff,#232b37);--p-ink:light-dark(#263445,#e7edf6);--p-sub:light-dark(#586779,#b3c0d1);--p-line:light-dark(#dce3ec,#465365);--p-blue:light-dark(#176bc5,#83bbff);--p-soft:light-dark(#edf5ff,#233e5c);--p-error:light-dark(#bc3434,#ffacac);font:14px/1.6 'Microsoft YaHei',sans-serif;color:var(--p-ink);background:var(--p-bg);border:1px solid var(--p-line);border-radius:8px;overflow:hidden}
#custom-activity *{box-sizing:border-box}#custom-activity header{padding:16px 24px;background:var(--p-panel);border-bottom:1px solid var(--p-line);display:flex;gap:24px;align-items:center;flex-wrap:wrap}#custom-activity header strong{font-size:16px}#custom-activity .crm{color:var(--p-blue);background:var(--p-soft);padding:4px 12px;border-radius:4px}#custom-activity .shell{display:grid;grid-template-columns:132px minmax(0,1fr)}#custom-activity aside{padding:24px 12px;background:var(--p-panel);border-right:1px solid var(--p-line)}#custom-activity aside div{padding:12px 8px}#custom-activity aside .active{background:var(--p-soft);color:var(--p-blue);border-radius:4px}#custom-activity main{padding:24px;min-width:0}#custom-activity .muted{color:var(--p-sub);font-size:12px}#custom-activity h1{font-size:22px;margin:8px 0}#custom-activity h2{font-size:15px;margin:0 0 16px;border-left:3px solid var(--p-blue);padding-left:8px}#custom-activity .heading{display:flex;justify-content:space-between;gap:16px;align-items:center}#custom-activity .status{background:var(--p-soft);color:var(--p-blue);padding:4px 12px;border-radius:4px}#custom-activity section{padding:24px;background:var(--p-panel);border:1px solid var(--p-line);border-radius:6px;margin-top:16px}#custom-activity .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}#custom-activity label{display:flex;flex-direction:column;gap:6px;min-width:0}#custom-activity input,#custom-activity select,#custom-activity textarea{width:100%;font:inherit;color:var(--p-ink);background:var(--p-panel);border:1px solid var(--p-line);border-radius:4px;padding:8px 10px;min-height:36px}#custom-activity textarea{min-height:80px;resize:vertical}#custom-activity input:focus-visible,#custom-activity textarea:focus-visible,#custom-activity select:focus-visible,#custom-activity button:focus-visible{outline:2px solid var(--p-blue);outline-offset:2px}#custom-activity .wide{grid-column:1/-1}#custom-activity em{color:var(--p-error);font-style:normal}#custom-activity .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}#custom-activity button{font:inherit;padding:8px 12px;border-radius:4px;border:1px solid var(--p-line);background:var(--p-panel);color:var(--p-ink)}#custom-activity .primary{background:var(--p-blue);color:light-dark(#fff,#15283d);border-color:var(--p-blue)}#custom-activity .link{color:var(--p-blue)}#custom-activity .delete{color:var(--p-error)}#custom-activity .summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;background:var(--p-soft);padding:16px;border-radius:4px;margin:16px 0}#custom-activity .summary b{display:block;font-size:19px;font-weight:500;font-variant-numeric:tabular-nums}#custom-activity .table-wrap{overflow-x:auto;margin-top:16px}#custom-activity table{width:100%;border-collapse:collapse;min-width:620px}#custom-activity th,#custom-activity td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--p-line);vertical-align:top}#custom-activity th{font-size:12px;color:var(--p-sub);background:var(--p-bg);font-weight:500}#custom-activity td input{min-width:76px}#custom-activity td:first-child{min-width:130px}#custom-activity td select{min-width:125px}#custom-activity .check{display:flex;flex-direction:row;align-items:center;gap:8px}#custom-activity .check input{width:16px;min-height:16px}#custom-activity .footer{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:24px;padding:16px;background:var(--p-panel);border:1px solid var(--p-line);border-radius:6px}#custom-activity details{margin-top:16px}#custom-activity summary{color:var(--p-blue)}#custom-activity #feedback{margin-top:12px}#custom-activity [aria-invalid=true]{border-color:var(--p-error)}#custom-activity .error{color:var(--p-error)}#custom-activity .datepair{display:flex;gap:8px}#custom-activity small{color:var(--p-sub)}@media(max-width:800px){#custom-activity .shell{grid-template-columns:1fr}#custom-activity aside{display:none}#custom-activity .grid{grid-template-columns:repeat(2,minmax(0,1fr))}#custom-activity main{padding:16px}#custom-activity .summary{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){#custom-activity .grid{grid-template-columns:1fr}#custom-activity section{padding:16px}#custom-activity header{padding:16px;gap:12px}#custom-activity .datepair{flex-direction:column}}@media(prefers-reduced-motion:reduce){#custom-activity *{scroll-behavior:auto}}
#custom-activity input[readonly],#custom-activity textarea[readonly]{background:var(--p-bg);color:var(--p-sub)}#custom-activity input[readonly]{cursor:default}</style><header><strong>卓希综合管理系统</strong><span class="crm">CRM系统</span><span>费用管理 / 活动执行填报</span></header><main style="padding:24px"><div class="heading"><h1>活动执行填报</h1><span class="status">待填报 · 演示数据</span></div><form id="execution"><section><h2>申请信息（自动带入，不可修改）</h2><div class="grid"><label>申请单号<input readonly value="示例申请单 HD-DEMO-001"></label><label>活动类型<input readonly value="自定义活动"></label><label>申请状态<input readonly value="已审批（示例）"></label><label>经销商<input readonly value="示例经销商有限公司"></label><label>系统 / 客户<input readonly value="示例连锁系统"></label><label>计划执行日期<input readonly value="2026-10-01 至 2026-11-30"></label><label>特殊事项分类<input readonly value="团购 / 增量奖励"></label><label>产品属性<input readonly value="常温休食"></label><label>事业中心<input readonly value="大客"></label><label>渠道类型<input readonly value="超市卤味档口"></label><label>我司承担比例<input readonly value="100%"></label><label>经销商承担比例<input readonly value="0%"></label><label>支付方式<input readonly value="对公付款"></label><label>预计费用总额（元）<input readonly value="1746.88"></label><label>我司申请承担（元）<input readonly value="1746.88"></label><label>经销商申请承担（元）<input readonly value="0.00"></label><label class="wide">申请事由与活动目标<textarea readonly>配合系统团购活动，申请专项奖励及第三方结算费用支持。</textarea></label><label class="wide">申请执行方案 / 奖励规则<textarea readonly>以审核确认的团购订单为依据，按约定档位计算奖励；预估奖励预算1600元。仅适用于本次活动，实际奖励不得超过审批上限。</textarea></label><label class="wide">申请费用说明<input readonly value="示例团购奖励及第三方服务、税费"></label></div><small>申请信息及费用预算仅供查看。以下实际执行数据由填报人填写；当前关联数据为演示，正式系统须按申请单号带入审批通过版本。</small></section><section><h2>实际费用填报</h2><small>申请数据不可修改，仅填写每项实际发生费用；未发生请填0。</small><div class="table-wrap"><table><thead><tr><th>费用项</th><th>申请预算（元）</th><th>实际费用（元）*</th><th>我司承担%</th><th>支付方式</th></tr></thead><tbody id="costs"></tbody></table></div><div class="summary" aria-live="polite"><div><small>申请费用总额（元）</small><b>1,746.88</b></div><div><small>实际费用总额（元）</small><b id="actual">待填写</b></div><div><small>与预算差异（元）</small><b id="difference">待填写</b></div><div><small>实际我司承担（元）</small><b id="company">待填写</b></div></div></section><div class="footer"><span class="muted">填报实际数据后提交审核。</span><div class="row"><button type="button" id="save">保存草稿</button><button class="primary">提交执行数据</button></div></div><div id="feedback" role="status" aria-live="polite"></div></form></main><script>(()=>{const q=s=>document.querySelector(s),money=n=>n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});const items=[['团购奖励',1600],['第三方服务费',48],['发票税费',98.88]];items.forEach(([name,budget],i)=>{const tr=document.createElement('tr');tr.innerHTML='<td>'+name+'</td><td>'+money(budget)+'</td><td><input required class="amount" aria-label="'+name+'实际费用" type="number" min="0" step="0.01" placeholder="请填写"></td><td>100%</td><td>对公付款</td>';q('#costs').append(tr)});const inputs=Array.from(document.querySelectorAll('.amount'));function calc(){const complete=inputs.every(e=>e.value!==''&&e.checkValidity()),total=Math.round(inputs.reduce((sum,e)=>sum+Number(e.value),0)*100)/100;q('#actual').textContent=complete?money(total):'待填写';q('#difference').textContent=complete?(total>1746.88?'+':'')+money(total-1746.88):'待填写';q('#company').textContent=complete?money(total):'待填写';return total}inputs.forEach(el=>el.addEventListener('input',calc));const key='activity-execution-amounts-v2';try{const saved=JSON.parse(localStorage.getItem(key));if(Array.isArray(saved))inputs.forEach((el,i)=>{if(typeof saved[i]==='string')el.value=saved[i]})}catch{}q('#save').onclick=()=>{try{localStorage.setItem(key,JSON.stringify(inputs.map(e=>e.value)));q('#feedback').textContent='实际费用草稿已保存在当前浏览器。'}catch{q('#feedback').textContent='保存失败，请保留页面后重试。'}};q('#execution').onsubmit=e=>{e.preventDefault();const total=calc();q('#feedback').className=total>1746.88?'error':'';q('#feedback').textContent=total>1746.88?'实际费用超出申请预算，请先完成补充审批。':'校验通过。当前为演示页面，未提交真实数据。'};calc()})();</script></div></body></html>
