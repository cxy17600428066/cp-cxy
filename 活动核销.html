<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>活动核销</title><body style="margin:0"><div id="custom-activity"><style>
#custom-activity{--p-bg:light-dark(#f4f6f9,#171c25);--p-panel:light-dark(#fff,#232b37);--p-ink:light-dark(#263445,#e7edf6);--p-sub:light-dark(#586779,#b3c0d1);--p-line:light-dark(#dce3ec,#465365);--p-blue:light-dark(#176bc5,#83bbff);--p-soft:light-dark(#edf5ff,#233e5c);--p-error:light-dark(#bc3434,#ffacac);font:14px/1.6 'Microsoft YaHei',sans-serif;color:var(--p-ink);background:var(--p-bg);border:1px solid var(--p-line);border-radius:8px;overflow:hidden}
#custom-activity *{box-sizing:border-box}#custom-activity header{padding:16px 24px;background:var(--p-panel);border-bottom:1px solid var(--p-line);display:flex;gap:24px;align-items:center;flex-wrap:wrap}#custom-activity header strong{font-size:16px}#custom-activity .crm{color:var(--p-blue);background:var(--p-soft);padding:4px 12px;border-radius:4px}#custom-activity .shell{display:grid;grid-template-columns:132px minmax(0,1fr)}#custom-activity aside{padding:24px 12px;background:var(--p-panel);border-right:1px solid var(--p-line)}#custom-activity aside div{padding:12px 8px}#custom-activity aside .active{background:var(--p-soft);color:var(--p-blue);border-radius:4px}#custom-activity main{padding:24px;min-width:0}#custom-activity .muted{color:var(--p-sub);font-size:12px}#custom-activity h1{font-size:22px;margin:8px 0}#custom-activity h2{font-size:15px;margin:0 0 16px;border-left:3px solid var(--p-blue);padding-left:8px}#custom-activity .heading{display:flex;justify-content:space-between;gap:16px;align-items:center}#custom-activity .status{background:var(--p-soft);color:var(--p-blue);padding:4px 12px;border-radius:4px}#custom-activity section{padding:24px;background:var(--p-panel);border:1px solid var(--p-line);border-radius:6px;margin-top:16px}#custom-activity .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}#custom-activity label{display:flex;flex-direction:column;gap:6px;min-width:0}#custom-activity input,#custom-activity select,#custom-activity textarea{width:100%;font:inherit;color:var(--p-ink);background:var(--p-panel);border:1px solid var(--p-line);border-radius:4px;padding:8px 10px;min-height:36px}#custom-activity textarea{min-height:80px;resize:vertical}#custom-activity input:focus-visible,#custom-activity textarea:focus-visible,#custom-activity select:focus-visible,#custom-activity button:focus-visible{outline:2px solid var(--p-blue);outline-offset:2px}#custom-activity .wide{grid-column:1/-1}#custom-activity em{color:var(--p-error);font-style:normal}#custom-activity .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}#custom-activity button{font:inherit;padding:8px 12px;border-radius:4px;border:1px solid var(--p-line);background:var(--p-panel);color:var(--p-ink)}#custom-activity .primary{background:var(--p-blue);color:light-dark(#fff,#15283d);border-color:var(--p-blue)}#custom-activity .link{color:var(--p-blue)}#custom-activity .delete{color:var(--p-error)}#custom-activity .summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;background:var(--p-soft);padding:16px;border-radius:4px;margin:16px 0}#custom-activity .summary b{display:block;font-size:19px;font-weight:500;font-variant-numeric:tabular-nums}#custom-activity .table-wrap{overflow-x:auto;margin-top:16px}#custom-activity table{width:100%;border-collapse:collapse;min-width:620px}#custom-activity th,#custom-activity td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--p-line);vertical-align:top}#custom-activity th{font-size:12px;color:var(--p-sub);background:var(--p-bg);font-weight:500}#custom-activity td input{min-width:76px}#custom-activity td:first-child{min-width:130px}#custom-activity td select{min-width:125px}#custom-activity .check{display:flex;flex-direction:row;align-items:center;gap:8px}#custom-activity .check input{width:16px;min-height:16px}#custom-activity .footer{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:24px;padding:16px;background:var(--p-panel);border:1px solid var(--p-line);border-radius:6px}#custom-activity details{margin-top:16px}#custom-activity summary{color:var(--p-blue)}#custom-activity #feedback{margin-top:12px}#custom-activity [aria-invalid=true]{border-color:var(--p-error)}#custom-activity .error{color:var(--p-error)}#custom-activity .datepair{display:flex;gap:8px}#custom-activity small{color:var(--p-sub)}@media(max-width:800px){#custom-activity .shell{grid-template-columns:1fr}#custom-activity aside{display:none}#custom-activity .grid{grid-template-columns:repeat(2,minmax(0,1fr))}#custom-activity main{padding:16px}#custom-activity .summary{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){#custom-activity .grid{grid-template-columns:1fr}#custom-activity section{padding:16px}#custom-activity header{padding:16px;gap:12px}#custom-activity .datepair{flex-direction:column}}@media(prefers-reduced-motion:reduce){#custom-activity *{scroll-behavior:auto}}
#custom-activity .basic-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 32px}#custom-activity .basic-field{display:flex;align-items:center;gap:12px;min-width:0}#custom-activity .basic-field>span{flex:0 0 130px;text-align:right;font-size:12px}#custom-activity .basic-field>div{flex:1;min-width:0}#custom-activity .basic .check{flex-direction:row;font-size:12px}#custom-activity .basic input[type=radio]{width:14px;min-height:14px}#custom-activity .basic-product{grid-column:span 2}#custom-activity .basic-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin-top:32px}#custom-activity .basic-stats b{color:var(--p-blue)}#custom-activity .basic .datepair input{min-width:0;padding:8px 4px}#custom-activity .basic .datepair{align-items:center}@media(max-width:1200px){#custom-activity .basic-grid{grid-template-columns:1fr}#custom-activity .basic-product{grid-column:auto}}@media(max-width:600px){#custom-activity .basic-stats{grid-template-columns:1fr}#custom-activity .basic-field{align-items:flex-start;flex-direction:column;gap:6px}#custom-activity .basic-field>span{flex:auto;text-align:left}#custom-activity .basic-field>div{width:100%}}</style><main><h1>活动核销</h1><section><h2>基础信息</h2><div class="grid"><label>经销商全称<input readonly id="dealer-name"></label><label>系统名称<input readonly id="system-name"></label><label>负责人<input readonly value="当前登录用户（演示）"></label><label class="wide">关联营销活动申请单<input readonly value="HD-DEMO-001 · 自定义活动（演示）"></label><label>活动日期<input readonly id="dates"></label><label>我司实际承担费用合计（元）<input readonly id="actual-sum" value="待执行填报"></label><label>支付方式<input readonly id="pay"></label><label class="wide"><span><em>*</em> 活动总结</span><textarea form="writeoff" required placeholder="填写活动执行情况及核销说明"></textarea></label></div></section><details><summary style="padding:20px;background:var(--p-panel)">活动信息 · 展开查看完整申请表单（只读）</summary><div id="snapshot"></div></details><section><h2>执行情况</h2><div class="table-wrap"><table><thead><tr><th>费用项</th><th>申请预算（元）</th><th>实际费用（元）</th><th>我司承担比例</th><th>支付方式</th></tr></thead><tbody id="execution-rows"></tbody></table></div><h3>执行附件</h3><ul id="execution-files"></ul><small>执行费用和附件只读，需修改时返回“活动执行填报”。</small></section><section><h2>核销信息</h2><form id="writeoff"><div class="grid"><label><span><em>*</em> 本次核销金额（元）</span><input required id="amount" type="number" min="0" step="0.01" placeholder="填写本次核销金额"></label><label>本次核销日期<input required id="date" type="date"></label><label>补充附件（选填）<input id="extra" type="file" multiple></label></div><ul id="extra-list"></ul><div class="footer"><small>演示页面，未连接真实审批及历史核销数据。</small><button type="submit" class="primary">提交核销</button></div><div id="feedback" role="status" aria-live="polite"></div></form></section></main></div><script>
(()=>{const q=s=>document.querySelector(s);let available=null;function sync(){try{const app=parent.document.getElementById('application').contentDocument,execWin=parent.document.getElementById('execution').contentWindow;execWin.syncApplicationSnapshot?.();const exe=execWin.document;const fields=app.querySelectorAll('.basic-grid input');q('#dealer-name').value=fields[0]?.value||'';q('#system-name').value=fields[1]?.value||'';q('#dates').value=app.querySelector('#start').value+' 至 '+app.querySelector('#end').value;q('#pay').value=app.querySelector('#payment').value;const snapshot=q('#snapshot');snapshot.replaceChildren();const original=exe.querySelector('#application-snapshot');if(original)Array.from(original.children).forEach(el=>snapshot.append(el.cloneNode(true)));snapshot.querySelectorAll('input,select,textarea').forEach(el=>el.disabled=true);const tb=q('#execution-rows');tb.replaceChildren();let sum=0,complete=true;exe.querySelectorAll('#costs tr').forEach(row=>{const tr=document.createElement('tr');Array.from(row.cells).forEach((cell,i)=>{const td=document.createElement('td');const input=cell.querySelector('input');td.textContent=input?(input.value===''?'待填写':Number(input.value).toFixed(2)):cell.textContent;if(input){if(input.value===''||!input.checkValidity())complete=false;else sum+=Number(input.value)}tr.append(td)});tb.append(tr)});const percent=Number(app.querySelector('#company-percent').value);available=complete?Math.round(sum*percent)/100:null;q('#actual-sum').value=available===null?'待执行填报':available.toFixed(2);const list=q('#execution-files');list.replaceChildren();const files=exe.querySelector('#execution-files')?.files;if(files?.length)Array.from(files).forEach(file=>{const li=document.createElement('li');li.textContent=file.name;list.append(li)});else{const li=document.createElement('li');li.textContent='暂无执行附件';list.append(li)}}catch{q('#feedback').textContent='请在活动管理合并页面中打开，以读取申请和执行数据。'}}window.syncWriteoff=sync;sync();q('#extra').onchange=()=>{q('#extra-list').replaceChildren();Array.from(q('#extra').files).forEach(f=>{const li=document.createElement('li');li.textContent=f.name;q('#extra-list').append(li)})};q('#writeoff').onsubmit=e=>{e.preventDefault();sync();const value=Number(q('#amount').value);q('#feedback').textContent=available===null?'请先完成活动执行的实际费用填报。':value>available?'本次核销金额不能超过我司实际承担费用。':'校验通过，演示页面未提交真实核销。'}})();
</script></body></html>
