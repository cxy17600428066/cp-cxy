）&lt;/div&gt;&lt;div id=&quot;store-options&quot; class=&quot;row&quot; style=&quot;margin:12px 0&quot;&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;button type=&quot;button&quot; id=&quot;confirm-stores&quot;&gt;确认选择并替换&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;cancel-stores&quot;&gt;取消&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div id=&quot;store-message&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;div class=&quot;table-wrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;序号&lt;/th&gt;&lt;th&gt;门店名称 *&lt;/th&gt;&lt;th&gt;活动日期&lt;/th&gt;&lt;th&gt;门店地址&lt;/th&gt;&lt;th&gt;操作&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;store-rows&quot;&gt;&lt;tr&gt;&lt;td colspan=&quot;5&quot; style=&quot;text-align:center;color:var(--p-sub)&quot;&gt;暂无数据，请选择或导入门店&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;small&gt;导入支持UTF-8 CSV，表头：门店编码、门店名称、门店地址。按门店编码去重。&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;&lt;details&gt;&lt;summary&gt;关联商品或原审批单（按需填写）&lt;/summary&gt;&lt;div class=&quot;grid&quot; style=&quot;margin-top:16px&quot;&gt;&lt;label&gt;商品 / SKU&lt;input placeholder=&quot;输入商品编码或名称&quot;&gt;&lt;/label&gt;&lt;label&gt;原审批单号&lt;input placeholder=&quot;补税、补贴、调整时关联原单&quot;&gt;&lt;/label&gt;&lt;/div&gt;&lt;/details&gt;&lt;/section&gt;
&lt;section&gt;&lt;div class=&quot;heading&quot;&gt;&lt;h2&gt;费用明细与承担&lt;/h2&gt;&lt;button type=&quot;button&quot; class=&quot;link&quot; id=&quot;add&quot;&gt;＋ 添加费用项&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;muted&quot;&gt;每项独立设置测算方式、承担比例和结算方式，汇总自动计算。&lt;/div&gt;&lt;div class=&quot;table-wrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;费用名称 *&lt;/th&gt;&lt;th&gt;测算方式&lt;/th&gt;&lt;th&gt;基数 / 数量 *&lt;/th&gt;&lt;th&gt;费率% / 单价&lt;/th&gt;&lt;th&gt;预算（元）&lt;/th&gt;&lt;th&gt;我司承担%&lt;/th&gt;&lt;th&gt;结算方式&lt;/th&gt;&lt;th&gt;操作&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;cost-rows&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;div class=&quot;summary&quot; aria-live=&quot;polite&quot;&gt;&lt;div&gt;&lt;small&gt;预计费用总额（元）&lt;/small&gt;&lt;b id=&quot;total&quot;&gt;—&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;small&gt;我司承担（元）&lt;/small&gt;&lt;b id=&quot;company&quot;&gt;—&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;small&gt;经销商承担（元）&lt;/small&gt;&lt;b id=&quot;dealer&quot;&gt;—&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;small&gt;我司费销比&lt;/small&gt;&lt;b id=&quot;ratio&quot;&gt;—&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid&quot;&gt;&lt;label&gt;预计销售额（元）&lt;input id=&quot;sales&quot; type=&quot;number&quot; min=&quot;0&quot; placeholder=&quot;无销售目标可留空&quot;&gt;&lt;/label&gt;&lt;label&gt;&lt;span&gt;&lt;em&gt;*&lt;/em&gt; 我司核销上限（元）&lt;/span&gt;&lt;input id=&quot;cap&quot; required type=&quot;number&quot; min=&quot;0&quot; step=&quot;0.01&quot; value=&quot;1746.88&quot;&gt;&lt;/label&gt;&lt;label&gt;费用申请性质&lt;select id=&quot;nature&quot;&gt;&lt;option&gt;新增费用&lt;/option&gt;&lt;option&gt;补充费用&lt;/option&gt;&lt;option&gt;费用 / 政策调整&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;wide&quot; id=&quot;original-wrap&quot; hidden&gt;&lt;span&gt;&lt;em&gt;*&lt;/em&gt; 费用说明&lt;/span&gt;&lt;input id=&quot;original&quot; placeholder=&quot;请填写费用用途、计算依据及申请原因&quot;&gt;&lt;/label&gt;&lt;/div&gt;&lt;/section&gt;


&lt;div class=&quot;footer&quot;&gt;&lt;span class=&quot;muted&quot;&gt;审批前可修改；通过后按批准规则执行和核销。&lt;/span&gt;&lt;div class=&quot;row&quot;&gt;&lt;button type=&quot;button&quot; id=&quot;save&quot;&gt;保存草稿&lt;/button&gt;&lt;button class=&quot;primary&quot; type=&quot;submit&quot;&gt;提交审批&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div id=&quot;feedback&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;/form&gt;&lt;/main&gt;&lt;/div&gt;

(()=&gt;{const root=document.getElementById(&#x27;custom-activity&#x27;),q=s=&gt;root.querySelector(s),body=q(&#x27;#cost-rows&#x27;);let rows=[{name:&#x27;团购奖励&#x27;,mode:&#x27;固定金额&#x27;,base:1600,rate:0,share:100,pay:&#x27;对公付款&#x27;},{name:&#x27;第三方服务费&#x27;,mode:&#x27;金额 × 费率&#x27;,base:1600,rate:3,share:100,pay:&#x27;对公付款&#x27;},{name:&#x27;发票税费&#x27;,mode:&#x27;金额 × 费率&#x27;,base:1648,rate:6,share:100,pay:&#x27;对公付款&#x27;}];const fmt=n=&gt;n.toLocaleString(&#x27;zh-CN&#x27;,{minimumFractionDigits:2,maximumFractionDigits:2}),round=n=&gt;Math.round((n+Number.EPSILON)*100)/100;function calc(){let total=0,company=0;rows.forEach((r,i)=&gt;{r.amount=round(r.mode===&#x27;固定金额&#x27;?r.base:r.base*r.rate/(r.mode===&#x27;金额 × 费率&#x27;?100:1));total+=r.amount;company+=round(r.amount*r.share/100);const cell=body.querySelector(&#x27;[data-amount=&quot;&#x27;+i+&#x27;&quot;]&#x27;);if(cell)cell.textContent=fmt(r.amount)});total=round(total);company=round(company);q(&#x27;#total&#x27;).textContent=fmt(total);q(&#x27;#company&#x27;).textContent=fmt(company);q(&#x27;#dealer&#x27;).textContent=fmt(round(total-company));const sales=Number(q(&#x27;#sales&#x27;).value);q(&#x27;#ratio&#x27;).textContent=sales&gt;0?(company/sales*100).toFixed(2)+&#x27;%&#x27;:&#x27;不适用&#x27;;return {total,company}}

&lt;/style&gt;&lt;header&gt;&lt;strong&gt;卓希综合管理系统&lt;/strong&gt;&lt;span class=&quot;crm&quot;&gt;CRM系统&lt;/span&gt;&lt;span&gt;费用管理 / 活动执行填报&lt;/span&gt;&lt;/header&gt;&lt;main style=&quot;padding:24px&quot;&gt;&lt;div class=&quot;heading&quot;&gt;&lt;h1&gt;活动执行填报&lt;/h1&gt;&lt;span class=&quot;status&quot;&gt;待填报 · 演示数据&lt;/span&gt;&lt;/div&gt;&lt;form id=&quot;execution&quot;&gt;&lt;section&gt;&lt;h2&gt;关联活动申请&lt;/h2&gt;&lt;div class=&quot;grid&quot;&gt;&lt;label&gt;申请单号&lt;input readonly value=&quot;示例申请单 HD-DEMO-001&quot;&gt;&lt;/label&gt;&lt;label&gt;活动名称&lt;input readonly value=&quot;连锁系统团购专项支持&quot;&gt;&lt;/label&gt;&lt;label&gt;申请状态&lt;input readonly value=&quot;已审批（示例）&quot;&gt;&lt;/label&gt;&lt;label&gt;经销商&lt;input readonly value=&quot;示例经销商有限公司&quot;&gt;&lt;/label&gt;&lt;label&gt;系统 / 客户&lt;input readonly value=&quot;示例连锁系统&quot;&gt;&lt;/label&gt;&lt;label&gt;计划执行日期&lt;input readonly value=&quot;2026-10-01 至 2026-11-30&quot;&gt;&lt;/label&gt;&lt;/div&gt;&lt;small&gt;独立演示页面，关联信息需在正式系统中由已审批申请自动带入。&lt;/small&gt;&lt;/section&gt;&lt;section&gt;&lt;h2&gt;实际执行情况&lt;/h2&gt;&lt;div class=&quot;grid&quot;&gt;&lt;label&gt;&lt;span&gt;&lt;em&gt;*&lt;/em&gt; 实际开始日期&lt;/span&gt;&lt;input required id=&quot;begin&quot; type=&quot;date&quot;&gt;&lt;/label&gt;&lt;label&gt;&lt;span&gt;&lt;em&gt;*&lt;/em&gt; 实际结束日期&lt;/span&gt;&lt;input required id=&quot;finish&quot; type=&quot;date&quot;&gt;&lt;/label&gt;&lt;label&gt;&lt;span&gt;&lt;em&gt;*&lt;/em&gt; 执行状态&lt;/span&gt;&lt;select id=&quot;state&quot;&gt;&lt;option&gt;已完成&lt;/option&gt;&lt;option&gt;部分执行&lt;/option&gt;&lt;option&gt;未执行&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;wide&quot;&gt;&lt;span&gt;&lt;em&gt;*&lt;/em&gt; 执行情况说明&lt;/span&gt;&lt;textarea required placeholder=&quot;填写实际执行内容、完成情况及与申请方案的差异&quot;&gt;&lt;/textarea&gt;&lt;/label&gt;&lt;/div&gt;&lt;/section&gt;&lt;section&gt;&lt;h2&gt;门店执行数据&lt;/h2&gt;&lt;small&gt;正式系统带入申请门店。未执行门店仍保留记录并填写原因。&lt;/small&gt;&lt;div class=&quot;table-wrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;门店名称&lt;/th&gt;&lt;th&gt;执行情况&lt;/th&gt;&lt;th&gt;实际销售额（元）&lt;/th&gt;&lt;th&gt;执行说明 / 未执行原因&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;stores&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/section&gt;&lt;section&gt;&lt;h2&gt;实际费用与承担&lt;/h2&gt;&lt;small&gt;费用项、承担比例及结算方式沿用已审批申请。填写实际发生金额。&lt;/small&gt;&lt;div class=&quot;table-wrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;费用项&lt;/th&gt;&lt;th&gt;申请预算（元）&lt;/th&gt;&lt;th&gt;实际费用（元）*&lt;/th&gt;&lt;th&gt;我司承担%&lt;/th&gt;&lt;th&gt;结算方式&lt;/th&gt;&lt;th&gt;费用说明&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;costs&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;div class=&quot;summary&quot; aria-live=&quot;polite&quot;&gt;&lt;div&gt;&lt;small&gt;申请费用总额（元）&lt;/small&gt;&lt;b&gt;1,746.88&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;small&gt;实际费用总额（元）&lt;/small&gt;&lt;b id=&quot;actual&quot;&gt;0.00&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;small&gt;与预算差异（元）&lt;/small&gt;&lt;b id=&quot;difference&quot;&gt;-1,746.88&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;small&gt;实际我司费销比&lt;/small&gt;&lt;b id=&quot;ratio&quot;&gt;不适用&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid&quot;&gt;&lt;label&gt;实际我司承担（元）&lt;input readonly id=&quot;company&quot;&gt;&lt;/label&gt;&lt;label&gt;实际经销商承担（元）&lt;input readonly value=&quot;0.00&quot;&gt;&lt;/label&gt;&lt;label&gt;实际销售额合计（元）&lt;input readonly id=&quot;sales&quot;&gt;&lt;/label&gt;&lt;label class=&quot;wide&quot;&gt;差异原因说明&lt;textarea id=&quot;reason&quot; placeholder=&quot;预算不一致、门店未执行或方案调整时填写原因&quot;&gt;&lt;/textarea&gt;&lt;/label&gt;&lt;/div&gt;&lt;/section&gt;&lt;div class=&quot;footer&quot;&gt;&lt;span class=&quot;muted&quot;&gt;填报实际数据后提交审核。&lt;/span&gt;&lt;div class=&quot;row&quot;&gt;&lt;button type=&quot;button&quot; id=&quot;save&quot;&gt;保存草稿&lt;/button&gt;&lt;button class=&quot;primary&quot;&gt;提交执行数据&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div id=&quot;feedback&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;/form&gt;&lt;/main&gt;&lt;script&gt;
(()=&gt;{const q=s=&gt;document.querySelector(s),money=n=&gt;n.toLocaleString(&#x27;zh-CN&#x27;,{minimumFractionDigits:2,maximumFractionDigits:2});[&#x27;示例门店 · 中心店&#x27;,&#x27;示例门店 · 城东店&#x27;].forEach(name=&gt;{const tr=document.createElement(&#x27;tr&#x27;);tr.innerHTML=&#x27;&lt;td&gt;&#x27;+name+&#x27;&lt;/td&gt;&lt;td&gt;&lt;select class=&quot;store-state&quot;&gt;&lt;option&gt;已执行&lt;/option&gt;&lt;option&gt;未执行&lt;/option&gt;&lt;/select&gt;&lt;/td&gt;&lt;td&gt;&lt;input aria-label=&quot;&#x27;+name+&#x27;实际销售额&quot; class=&quot;sale&quot; type=&quot;number&quot; min=&quot;0&quot; step=&quot;0.01&quot; placeholder=&quot;无销售数据可留空&quot;&gt;&lt;/td&gt;&lt;td&gt;&lt;input class=&quot;store-note&quot; aria-label=&quot;&#x27;+name+&#x27;执行说明&quot;&gt;&lt;/td&gt;&#x27;;q(&#x27;#stores&#x27;).append(tr)});[[&#x27;团购奖励&#x27;,1600],[&#x27;第三方服务费&#x27;,48],[&#x27;发票税费&#x27;,98.88]].forEach(([name,budget])=&gt;{const tr=document.createElement(&#x27;tr&#x27;);tr.innerHTML=&#x27;&lt;td&gt;&#x27;+name+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+money(budget)+&#x27;&lt;/td&gt;&lt;td&gt;&lt;input required class=&quot;amount&quot; aria-label=&quot;&#x27;+name+&#x27;实际金额&quot; type=&quot;number&quot; min=&quot;0&quot; step=&quot;0.01&quot; placeholder=&quot;请填写&quot;&gt;&lt;/td&gt;&lt;td&gt;100%&lt;/td&gt;&lt;td&gt;对公付款&lt;/td&gt;&lt;td&gt;&lt;input aria-label=&quot;&#x27;+name+&#x27;费用说明&quot;&gt;&lt;/td&gt;&#x27;;q(&#x27;#costs&#x27;).append(tr)});function calc(){const total=Array.from(document.querySelectorAll(&#x27;.amount&#x27;)).reduce((a,e)=&gt;a+Number(e.value),0),sales=Array.from(document.querySelectorAll(&#x27;.sale&#x27;)).reduce((a,e)=&gt;a+Number(e.value),0);q(&#x27;#actual&#x27;).textContent=money(total);q(&#x27;#difference&#x27;).textContent=(total&gt;1746.88?&#x27;+&#x27;:&#x27;&#x27;)+money(total-1746.88);q(&#x27;#company&#x27;).value=money(total);q(&#x27;#sales&#x27;).value=money(sales);q(&#x27;#ratio&#x27;).textContent=sales&gt;0?(total/sales*100).toFixed(2)+&#x27;%&#x27;:&#x27;不适用&#x27;;return total}q(&#x27;#execution&#x27;).addEventListener(&#x27;input&#x27;,calc);q(&#x27;#save&#x27;).onclick=()=&gt;{const data=Array.from(q(&#x27;#execution&#x27;).elements).map(e=&gt;e.value);try{localStorage.setItem(&#x27;activity-execution-draft&#x27;,JSON.stringify(data));q(&#x27;#feedback&#x27;).textContent=&#x27;草稿已保存在当前浏览器。&#x27;}catch{q(&#x27;#feedback&#x27;).textContent=&#x27;浏览器无法保存，请保留页面后重试。&#x27;}};try{const data=JSON.parse(localStorage.getItem(&#x27;activity-execution-draft&#x27;));if(Array.isArray(data))Array.from(q(&#x27;#execution&#x27;).elements).forEach((e,i)=&gt;{if(data[i]!=null)e.value=data[i]})}catch{}q(&#x27;#execution&#x27;).onsubmit=e=&gt;{e.preventDefault();let error=&#x27;&#x27;;if(q(&#x27;#finish&#x27;).value&lt;q(&#x27;#begin&#x27;).value)error=&#x27;实际结束日期不能早于开始日期。&#x27;;else if(Array.from(q(&#x27;#stores&#x27;).rows).some(r=&gt;r.querySelector(&#x27;select&#x27;).value===&#x27;未执行&#x27;&amp;&amp;!r.querySelector(&#x27;.store-note&#x27;).value.trim()))error=&#x27;请填写未执行门店的原因。&#x27;;else if(Math.abs(calc()-1746.88)&gt;.005&amp;&amp;!q(&#x27;#reason&#x27;).value.trim())error=&#x27;请填写费用与预算不一致的差异原因。&#x27;;else if(calc()&gt;1746.88)error=&#x27;实际费用超出已批预算，请先完成补充审批后再提交。&#x27;;q(&#x27;#feedback&#x27;).className=error?&#x27;error&#x27;:&#x27;&#x27;;q(&#x27;#feedback&#x27;).textContent=error||&#x27;校验通过。此为演示页面，未提交真实执行数据。&#x27;};calc()})();&lt;/script&gt;&lt;/div&gt;&lt;script&gt;window.addEventListener(&#x27;load&#x27;,()=&gt;{const app=document.getElementById(&#x27;custom-activity&#x27;);if(app){const header=app.querySelector(&#x27;header&#x27;);if(header)header.remove();const aside=app.querySelector(&#x27;aside&#x27;);if(aside)aside.remove();const shell=app.querySelector(&#x27;.shell&#x27;);if(shell)shell.style.gridTemplateColumns=&#x27;minmax(0,1fr)&#x27;}});&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;"></iframe></main></div><script>
