(()=&gt;{const root=document.getElementById(&#x27;custom-activity&#x27;),q=s=&gt;root.querySelector(s),body=q(&#x27;#cost-rows&#x27;);let rows=[{name:&#x27;团购奖励&#x27;,mode:&#x27;固定金额&#x27;,base:1600,rate:0,share:100,pay:&#x27;对公付款&#x27;},{name:&#x27;第三方服务费&#x27;,mode:&#x27;金额 × 费率&#x27;,base:1600,rate:3,share:100,pay:&#x27;对公付款&#x27;},{name:&#x27;发票税费&#x27;,mode:&#x27;金额 × 费率&#x27;,base:1648,rate:6,share:100,pay:&#x27;对公付款&#x27;}];const fmt=n=&gt;n.toLocaleString(&#x27;zh-CN&#x27;,{minimumFractionDigits:2,maximumFractionDigits:2}),round=n=&gt;Math.round((n+Number.EPSILON)*100)/100;function calc(){let total=0,company=0;rows.forEach((r,i)=&gt;{r.amount=round(r.mode===&#x27;固定金额&#x27;?r.base:r.base*r.rate/(r.mode===&#x27;金额 × 费率&#x27;?100:1));total+=r.amount;company+=round(r.amount*r.share/100);const cell=body.querySelector(&#x27;[data-amount=&quot;&#x27;+i+&#x27;&quot;]&#x27;);if(cell)cell.textContent=fmt(r.amount)});total=round(total);company=round(total*Number(q(&#x27;#company-percent&#x27;).value)/100);q(&#x27;#total&#x27;).textContent=fmt(total);q(&#x27;#company&#x27;).value=company.toFixed(2);q(&#x27;#dealer&#x27;).value=round(total-company).toFixed(2);q(&#x27;#dealer-percent&#x27;).value=round(100-Number(q(&#x27;#company-percent&#x27;).value));q(&#x27;#company&#x27;).max=total;q(&#x27;#dealer&#x27;).max=total;q(&#x27;#basic-total&#x27;).textContent=fmt(total);q(&#x27;#basic-company&#x27;).textContent=fmt(company);return {total,company}}

function parseCSV(text){const all=[];let row=[],cell=&#x27;&#x27;,quoted=false;for(let i=0;i&lt;text.length;i++){const c=text[i];if(c===&#x27;&quot;&#x27;){if(quoted&amp;&amp;text[i+1]===&#x27;&quot;&#x27;){cell+=&#x27;&quot;&#x27;;i++}else quoted=!quoted}else if(c===&#x27;,&#x27;&amp;&amp;!quoted){row.push(cell);cell=&#x27;&#x27;}else if((c===&#x27;\n&#x27;||c===&#x27;\r&#x27;)&amp;&amp;!quoted){if(c===&#x27;\r&#x27;&amp;&amp;text[i+1]===&#x27;\n&#x27;)i++;row.push(cell);if(row.some(v=&gt;v.trim()))all.push(row);row=[];cell=&#x27;&#x27;}else cell+=c}if(quoted)throw Error(&#x27;CSV引号未闭合&#x27;);row.push(cell);if(row.some(v=&gt;v.trim()))all.push(row);return all}

]];items.forEach(([name,budget],i)=&gt;{const tr=document.createElement(&#x27;tr&#x27;);tr.innerHTML=&#x27;&lt;td&gt;&#x27;+name+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+money(budget)+&#x27;&lt;/td&gt;&lt;td&gt;&lt;input required class=&quot;amount&quot; aria-label=&quot;&#x27;+name+&#x27;实际费用&quot; type=&quot;number&quot; min=&quot;0&quot; step=&quot;0.01&quot; placeholder=&quot;请填写&quot;&gt;&lt;/td&gt;&lt;td&gt;100%&lt;/td&gt;&lt;td&gt;对公付款&lt;/td&gt;&#x27;;q(&#x27;#costs&#x27;).append(tr)});const inputs=Array.from(document.querySelectorAll(&#x27;.amount&#x27;));function calc(){const complete=inputs.every(e=&gt;e.value!==&#x27;&#x27;&amp;&amp;e.checkValidity()),total=Math.round(inputs.reduce((sum,e)=&gt;sum+Number(e.value),0)*100)/100;q(&#x27;#actual&#x27;).textContent=complete?money(total):&#x27;待填写&#x27;;q(&#x27;#difference&#x27;).textContent=complete?(total&gt;1746.88?&#x27;+&#x27;:&#x27;&#x27;)+money(total-1746.88):&#x27;待填写&#x27;;q(&#x27;#company&#x27;).textContent=complete?money(total):&#x27;待填写&#x27;;return total}inputs.forEach(el=&gt;el.addEventListener(&#x27;input&#x27;,calc));const key=&#x27;activity-execution-amounts-v2&#x27;;try{const saved=JSON.parse(localStorage.getItem(key));if(Array.isArray(saved))inputs.forEach((el,i)=&gt;{if(typeof saved[i]===&#x27;string&#x27;)el.value=saved[i]})}catch{}q(&#x27;#save&#x27;).onclick=()=&gt;{try{localStorage.setItem(key,JSON.stringify(inputs.map(e=&gt;e.value)));q(&#x27;#feedback&#x27;).textContent=&#x27;实际费用草稿已保存在当前浏览器。&#x27;}catch{q(&#x27;#feedback&#x27;).textContent=&#x27;保存失败，请保留页面后重试。&#x27;}};q(&#x27;#execution&#x27;).onsubmit=e=&gt;{e.preventDefault();const total=calc();q(&#x27;#feedback&#x27;).className=total&gt;1746.88?&#x27;error&#x27;:&#x27;&#x27;;q(&#x27;#feedback&#x27;).textContent=total&gt;1746.88?&#x27;实际费用超出申请预算，请先完成补充审批。&#x27;:&#x27;校验通过。当前为演示页面，未提交真实数据。&#x27;};calc()})();&lt;/script&gt;&lt;/div&gt;&lt;script&gt;window.addEventListener(&#x27;load&#x27;,()=&gt;{const app=document.getElementById(&#x27;custo
