<style>
:root{--red:#d92d20;--red-dark:#b42318;--ink:#25211f;--muted:#746d69;--line:#e9e4e1;--bg:#f5f3f1;--green:#12805c;--amber:#b75b08;--blue:#2869b2}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:14px}button,input,select{font:inherit}.topbar{height:68px;background:#211d1b;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100vw - 1240px)/2));box-shadow:0 2px 12px rgba(30,20,16,.12)}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:18px}.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--red);display:grid;place-items:center}.topbar small{color:#aaa19d}.page{max-width:1240px;margin:0 auto;padding:26px 24px 60px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}.page-head h1{font-size:24px;margin:0 0 7px}.page-head p{margin:0;color:var(--muted)}.badge{display:inline-flex;align-items:center;border-radius:99px;padding:6px 10px;font-size:12px;font-weight:700}.badge.green{background:#eaf7f1;color:var(--green)}.badge.gray{background:#eeeceb;color:#6f6966}.badge.amber{background:#fff1dc;color:var(--amber)}.badge.red{background:#fde9e6;color:var(--red)}.legend{display:flex;gap:8px;margin-bottom:16px}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px}.nav,.panel{background:#fff;border:1px solid #eeeae8;border-radius:14px;box-shadow:0 4px 16px rgba(50,35,28,.035)}.nav{padding:10px;height:max-content;position:sticky;top:18px}.tab{width:100%;border:0;background:transparent;border-radius:9px;padding:13px 12px;text-align:left;color:#6f6763;cursor:pointer;display:flex;justify-content:space-between;align-items:center}.tab.active{background:#fff0ed;color:var(--red);font-weight:800}.tab small{background:#f2efed;border-radius:99px;padding:2px 7px}.tab.active small{background:#ffdcd6}.panel{padding:20px}.panel-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;padding-bottom:17px;border-bottom:1px solid var(--line)}.panel-head h2{margin:0 0 6px;font-size:18px}.panel-head p{margin:0;color:var(--muted);font-size:13px}.card{border:1px solid var(--line);border-radius:12px;margin-top:14px;overflow:hidden}.card-head{padding:13px 15px;background:#fbfaf9;display:flex;justify-content:space-between;align-items:center}.card-body{padding:15px;display:grid;grid-template-columns:1.5fr repeat(3,minmax(105px,.7fr));gap:14px;align-items:end}.card-body.two{grid-template-columns:1fr 1fr}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}.field input,.field select{width:100%;height:40px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:#fff;outline:none}.field input:focus,.field select:focus{border-color:#d78378;box-shadow:0 0 0 3px #fff0ed}.input-unit{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.input-unit input{border:0;border-radius:0;min-width:0}.input-unit span{padding:0 10px;background:#faf8f7;color:#817874;display:flex;align-items:center}.note{grid-column:1/-1;background:#f5f8fb;border-radius:8px;padding:11px 12px;font-size:12px;color:#5f6c78}.toggle{width:44px;height:25px;border:0;border-radius:99px;background:#c9c2be;padding:3px;cursor:pointer}.toggle:after{content:'';display:block;width:19px;height:19px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px #777}.toggle.on{background:var(--green)}.toggle.on:after{transform:translateX(19px)}.driver-options{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:12px}.option{border:1px solid var(--line);border-radius:10px;padding:14px}.option label{font-weight:700}.option p{font-size:12px;color:var(--muted);margin:6px 0 0}.option input{margin-right:7px}.actions{position:sticky;bottom:0;margin:20px -20px -20px;padding:14px 20px;background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.actions span{font-size:12px;color:var(--muted)}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 16px;cursor:pointer}.btn.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}.btn.primary:hover{background:var(--red-dark)}.dirty{color:var(--amber)!important;font-weight:700}.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#211d1b;color:#fff;border-radius:9px;padding:11px 18px;opacity:0;pointer-events:none;transition:.2s;z-index:5}@media(max-width:820px){.topbar{padding:0 16px}.page{padding:20px 14px 50px}.layout{grid-template-columns:1fr}.nav{position:static;display:flex;overflow:auto}.tab{min-width:150px}.card-body,.card-body.two{grid-template-columns:1fr 1fr}.driver-options{grid-template-columns:1fr}.page-head{gap:12px}.page-head h1{font-size:21px}}@media(max-width:560px){.card-body,.card-body.two{grid-template-columns:1fr}.legend{overflow:auto}.page-head{display:block}.page-head>.badge{margin-top:12px}.actions{align-items:flex-start;gap:10px}.actions>div{display:flex;gap:6px}.btn{padding:9px 11px}}
</style>
<style>
.node-orders{border-top:1px solid var(--line);background:#fff}.orders-head{padding:12px 15px;display:flex;justify-content:space-between;align-items:center;background:#fff}.orders-head strong{font-size:13px}.orders-head span{color:var(--muted);font-size:12px}.orders-toggle{border:0;background:transparent;color:var(--blue);font-weight:700;cursor:pointer;padding:5px}.order-table-wrap{overflow:auto;border-top:1px solid #f0edeb}.order-table{width:100%;border-collapse:collapse;min-width:760px}.order-table th{padding:10px 14px;text-align:left;color:#817a76;background:#fbfaf9;font-size:12px;font-weight:600}.order-table td{padding:12px 14px;border-top:1px solid #f1eeec;vertical-align:middle}.order-no{font-weight:750}.order-sub{font-size:12px;color:var(--muted);margin-top:3px}.time-progress{width:128px;height:6px;background:#eeeae8;border-radius:99px;overflow:hidden;margin-top:6px}.time-progress i{display:block;height:100%;border-radius:99px;background:var(--green)}.time-progress.warning i{background:var(--amber)}.time-progress.overdue i{background:var(--red)}.time-value{font-weight:750}.time-value.warning{color:var(--amber)}.time-value.overdue{color:var(--red)}.empty-orders{padding:24px;text-align:center;color:var(--muted)}
</style>
<style>
[hidden]{display:none!important}.page{max-width:1480px}.layout{grid-template-columns:196px minmax(0,1fr)}.panel{min-width:0}.field label,.order-table th{font-size:14px}.order-table .badge{font-size:14px}.overview-head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px}.overview-head h2{margin:0;font-size:20px}.overview-head p,.section-caption{color:var(--muted);font-size:13px;line-height:1.7;margin:6px 0 0}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.metric{border:1px solid var(--line);background:#fff;border-radius:12px;padding:18px;text-align:left;cursor:pointer;color:var(--ink)}.metric:hover,.stage:hover{border-color:#d99085;box-shadow:0 4px 16px #3420190a}.metric strong{font-size:32px;display:block;margin:10px 0 7px;line-height:1.1}.metric small{font-size:12px;color:var(--muted)}.metric.danger{background:#fff4f2;border-color:#f3c5bc}.metric.danger strong{color:var(--red)}.metric.caution strong{color:var(--amber)}.metric.good strong{color:var(--green)}.stage-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.stage{background:#fff;border:1px solid var(--line);border-radius:12px;padding:17px;text-align:left;cursor:pointer;color:var(--ink)}.stage-top{display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:700}.stage-index{font-size:12px;color:var(--muted);font-weight:400}.stage-total{font-size:30px;font-weight:750;margin:12px 0}.stage-total small{font-size:13px;font-weight:400;color:var(--muted);margin-left:6px}.segments{display:flex;height:6px;border-radius:9px;overflow:hidden;background:#eeeae8;gap:2px;margin:12px 0}.segments i{height:100%}.segments .normal{background:var(--green)}.segments .warning{background:#d68b28}.segments .overdue{background:var(--red)}.segments .paused{background:#aca6a2}.stage-counts{display:flex;gap:12px;font-size:13px;flex-wrap:wrap}.stage-counts .overdue{color:var(--red)}.stage-counts .warning{color:var(--amber)}.stage-foot{border-top:1px solid var(--line);margin-top:14px;padding-top:12px;display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}.stage-foot b{color:var(--blue);font-weight:600}.focus-note{margin-top:20px;background:#fff5f2;border-left:3px solid var(--red);border-radius:6px;padding:13px 16px;line-height:1.8;font-size:14px}.section-title{font-size:16px;margin:0}.back-link{border:0;background:transparent;padding:0;color:var(--blue);cursor:pointer;margin-bottom:16px}.detail-summary{padding:14px 16px;border:1px solid var(--line);background:#fbfaf9;border-radius:10px;margin:14px 0;color:var(--muted);line-height:1.8}.detail-summary b{color:var(--ink)}.filter-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.filter-tabs button{border:1px solid var(--line);padding:8px 12px;border-radius:8px;background:#fff;cursor:pointer;color:var(--muted)}.filter-tabs button.active{background:#211d1b;border-color:#211d1b;color:white}.order-table{min-width:880px}.detail-settings{border:1px solid var(--line);padding:12px 15px;border-radius:10px;margin-top:20px}.detail-settings summary{cursor:pointer;font-weight:600}.detail-settings .node-orders{display:none}.detail-settings .card{border:0}.detail-settings .card-body{padding:15px 0}.detail-settings .card-head{border-radius:8px}.order-dialog{width:min(640px,94vw);border:1px solid var(--line);border-radius:16px;padding:24px;color:var(--ink);box-shadow:0 20px 70px #211d1b33}.order-dialog::backdrop{background:#211d1b66}.dialog-head{display:flex;justify-content:space-between;align-items:center}.dialog-head h2{margin:0;font-size:20px}.order-kv{display:grid;grid-template-columns:1fr 1fr;gap:22px 16px;margin:24px 0}.order-kv dt{color:var(--muted);font-size:13px;margin-bottom:7px}.order-kv dd{margin:0;font-size:16px}.order-journey{display:flex;gap:7px;flex-wrap:wrap}.order-journey span{padding:7px 9px;background:#f3f1ef;border-radius:6px;color:var(--muted)}.order-journey .current{color:var(--red);background:#fff0ed;font-weight:700}.settings-info{margin-top:12px;color:var(--muted);font-size:13px}button:focus-visible,summary:focus-visible{outline:3px solid #2869b2;outline-offset:3px}@media(max-width:1000px){.layout{grid-template-columns:1fr}.nav{position:static;display:flex}.tab{min-width:170px}.metrics{gap:8px}.metric{padding:14px}}@media(max-width:680px){.metrics,.stage-grid{grid-template-columns:repeat(2,1fr)}.metric strong{font-size:27px}.overview-head{align-items:flex-start}.stage-counts{gap:7px}.stage{padding:12px}.stage-top{font-size:14px}.order-kv{grid-template-columns:1fr}.topbar small{display:none}}@media(max-width:420px){.stage-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><span class="brand-mark">效</span><span>履约策略中心</span></div><small>经营管理视图</small></header>
<main class="page"><header class="page-head"><div><h1>订单履约总览</h1><p>先看异常集中在哪个节点，再查看需要跟进的订单。</p></div><span class="badge gray">演示数据 · 未接入订单系统</span></header><div class="layout"><nav class="nav"><button class="tab active" data-group="flow" onclick="selectGroup('flow',this)">订单履约总览 <small>6</small></button><a class="tab" style="text-decoration:none" href="商品发货时效配置.html">商品发货时效配置 ↗</a><a class="tab" style="text-decoration:none" href="商品发货时效配置.html#nodes">履约节点配置 ↗</a><button class="tab" data-group="driver" onclick="selectGroup('driver',this)">司机与车辆信息 <small>1</small></button></nav><section class="panel"><div id="content"></div><footer class="actions"><span id="saveState">上次保存：尚未保存</span><div><button class="btn" onclick="resetConfig()">恢复默认</button> <button class="btn primary" onclick="saveConfig()">保存并生效</button></div></footer></section></div></main><div class="toast" id="toast"></div>
<dialog id="orderDialog" class="order-dialog" aria-label="订单详情"><div id="orderDetail"></div></dialog>
<script>
const defaults={product:{stock:24,noStock:72},rules:[{id:'finance',name:'财务审核',from:'订单提交',to:'财务审核通过',value:2,warn:80,on:true,note:'从订单提交开始计时，财务审核通过后停止。'},{id:'accept',name:'接单',from:'财务审核通过',to:'平台完成接单',value:1,warn:80,on:true,note:'仅统计财务审核通过且未接单的订单。'},{id:'ship',name:'发货',from:'平台接单',to:'旺店通审核订单',value:24,warn:75,on:true,note:'以旺店通“订单审核完成”时间作为发货节点完成时间。'},{id:'pickup',name:'揽收',from:'旺店通审核',to:'ERP同步WMS',value:4,warn:75,on:true,note:'ERP成功同步 WMS 后停止计时，失败重试不重置起算时间。'},{id:'logistics',name:'物流信息获取',from:'ERP同步WMS',to:'获取首条物流轨迹',value:6,warn:80,on:true,note:'按物流单号轮询，获取首条有效轨迹后视为完成。'},{id:'sign',name:'签收',from:'获取物流信息',to:'物流签收',value:72,warn:80,on:true,note:'有物流信息按签收状态判断；无物流信息时按配置时效预警。'}],driver:{required:true,plate:true,source:'司机端上传',wdt:false}};
const nodeOrders={finance:[['SO202609080126','郑州乐又达食品','¥18,560.00','今天 08:42',0.7,'normal'],['SO202609080119','上海玖亭冷链仓','¥36,820.00','今天 07:31',1.8,'warning'],['SO202609080103','杭州鲜食商贸','¥12,480.00','今天 05:56',3.4,'overdue']],accept:[['SO202609080098','武汉优鲜供应链','¥9,860.00','今天 09:12',0.5,'normal'],['SO202609080086','长沙味集食品','¥27,300.00','今天 08:26',1.3,'overdue']],ship:[['SO202609070682','西安饭团餐饮','¥42,680.00','昨天 18:20',15.7,'normal'],['SO202609070651','南京鲜选商贸','¥16,240.00','昨天 13:46',20.2,'warning'],['SO202609070608','成都食刻供应链','¥58,900.00','昨天 07:10',26.8,'overdue']],pickup:[['SO202609080071','河南永鲜商贸','¥23,500.00','今天 08:15',1.4,'normal'],['SO202609080052','河北佳食供应链','¥31,700.00','今天 06:48',3.1,'warning']],logistics:[['SO202609080031','青岛海岸食品','¥19,260.00','今天 05:32',4.2,'normal'],['SO202609070712','济南玖味餐饮','¥45,100.00','昨天 23:20',9.6,'overdue']],sign:[['SO202609060516','苏州味达商贸','¥14,680.00','09-06 16:30',41.6,'normal'],['SO202609050429','合肥餐聚供应链','¥38,720.00','09-05 11:18',68.4,'warning'],['SO202609040381','宁波鲜食配送','¥21,900.00','09-04 07:42',97.2,'overdue']]};
const clone=x=>JSON.parse(JSON.stringify(x));let config=(()=>{try{return JSON.parse(localStorage.getItem('shipping-sla-config'))||clone(defaults)}catch(e){return clone(defaults)}})(),group='flow';
function selectGroup(next,el){group=next;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');render()}
function orderRows(r){const list=nodeOrders[r.id]||[];return list.map(o=>{const ratio=Math.round(o[4]/r.value*100),level=o[5],label=level==='overdue'?'已超时':level==='warning'?'临近预警':'正常',badge=level==='overdue'?'red':level==='warning'?'amber':'green';return `<tr><td><div class="order-no">${o[0]}</div><div class="order-sub">${o[1]}</div></td><td>${o[2]}</td><td>${o[3]}</td><td><span class="time-value ${level}">${o[4]} 小时 / ${r.value} 小时</span><div class="time-progress ${level}"><i style="width:${Math.min(ratio,100)}%"></i></div></td><td><span class="badge ${badge}">${label}</span></td><td><button class="orders-toggle" onclick="showToast('已打开订单 ${o[0]}')">查看订单</button></td></tr>`}).join('')}
function ruleCard(r){const list=nodeOrders[r.id]||[],alerts=list.filter(o=>o[5]!=='normal').length;return `<article class="card"><div class="card-head"><b>${r.name}时效</b><button class="toggle ${r.on?'on':''}" aria-label="启用${r.name}时效" onclick="toggleRule('${r.id}',this)"></button></div><div class="card-body"><div class="field"><label>计时区间</label><select onchange="dirty()"><option>${r.from} → ${r.to}</option></select></div><div class="field"><label>时效阈值</label><div class="input-unit"><input type="number" min="1" value="${r.value}" data-id="${r.id}" data-key="value" oninput="updateRule(this)"><span>小时</span></div></div><div class="field"><label>提前提醒</label><div class="input-unit"><input type="number" min="1" max="99" value="${r.warn}" data-id="${r.id}" data-key="warn" oninput="updateRule(this)"><span>%</span></div></div><div class="field"><label>超时动作</label><select onchange="config.rules.find(x=>x.id==='${r.id}').action=this.value;dirty()">${['创建异常工单','仅消息提醒','消息提醒并升级'].map(a=>`<option ${a===(r.action||'创建异常工单')?'selected':''}>${a}</option>`).join('')}</select></div><div class="note">ⓘ ${r.note}</div></div><section class="node-orders"><div class="orders-head"><div><strong>当前处于${r.name}节点的订单</strong> <span>共 ${list.length} 单${alerts?` · ${alerts} 单需关注`:''}</span></div><button class="orders-toggle" onclick="toggleOrders('${r.id}',this)">收起订单</button></div><div class="order-table-wrap" id="orders-${r.id}"><table class="order-table"><thead><tr><th>订单号 / 客户</th><th>订单金额</th><th>进入节点时间</th><th>已用时 / 阈值</th><th>时效状态</th><th>操作</th></tr></thead><tbody>${orderRows(r)||'<tr><td colspan="6" class="empty-orders">当前节点暂无订单</td></tr>'}</tbody></table></div></section></article>`}
function renderConfig(){const c=document.getElementById('content');if(group==='product')c.innerHTML=`<header class="panel-head"><div><h2>商品发货时效</h2><p>按库存状态维护承诺发货时间，作为订单发货预警基础。</p></div></header><article class="card"><div class="card-head"><b>库存状态对应时效</b><span class="badge gray">商品级配置</span></div><div class="card-body two"><div class="field"><label>有货商品发货时效</label><div class="input-unit"><input type="number" min="1" value="${config.product.stock}" oninput="config.product.stock=+this.value;dirty()"><span>小时</span></div></div><div class="field"><label>无货商品发货时效</label><div class="input-unit"><input type="number" min="1" value="${config.product.noStock}" oninput="config.product.noStock=+this.value;dirty()"><span>小时</span></div></div><div class="note">ⓘ 同一订单包含多个商品时，以最晚承诺发货时间作为订单时效；商品单独配置时优先使用商品值。</div></div></article>`;else if(group==='flow')c.innerHTML=`<header class="panel-head"><div><h2>订单履约节点</h2><p>每个节点均可独立启停并设置阈值，修改后仅影响新进入该节点的订单。</p></div></header>${config.rules.map(ruleCard).join('')}`;else c.innerHTML=`<header class="panel-head"><div><h2>司机与车辆信息</h2><p>配置揽收前的信息完整性要求，并预留旺店通自动采集能力。</p></div></header><article class="card"><div class="card-head"><b>司机信息采集规则</b><button class="toggle ${config.driver.required?'on':''}" onclick="config.driver.required=!config.driver.required;this.classList.toggle('on');dirty()"></button></div><div class="card-body two"><div class="field"><label>信息采集节点</label><select onchange="dirty()"><option>司机揽收前</option><option>创建发货单时</option></select></div><div class="field"><label>当前采集方式</label><select onchange="config.driver.source=this.value;dirty()"><option ${config.driver.source==='司机端上传'?'selected':''}>司机端上传</option><option>后台管理员录入</option></select></div><div class="note">ⓘ 司机姓名、手机号和车牌号为必填项；缺失时禁止完成揽收，并生成信息缺失提醒。</div><div class="driver-options"><div class="option"><label><input type="checkbox" ${config.driver.plate?'checked':''} onchange="config.driver.plate=this.checked;dirty()">车牌号必填</label><p>支持司机端拍照上传或手动输入，后台可复核。</p></div><div class="option"><label><input type="checkbox" disabled>旺店通自动采集</label><p>待确认旺店通接口能力后开放，当前由司机端上传。</p></div></div></div></article>`}
function toggleOrders(id,btn){const box=document.getElementById('orders-'+id),hidden=box.hidden;box.hidden=!hidden;btn.textContent=hidden?'收起订单':'展开订单'}function updateRule(el){const r=config.rules.find(x=>x.id===el.dataset.id);r[el.dataset.key]=+el.value;dirty();const box=document.getElementById('orders-'+r.id);if(box)box.querySelector('tbody').innerHTML=orderRows(r)}function toggleRule(id,el){const r=config.rules.find(x=>x.id===id);r.on=!r.on;el.classList.toggle('on',r.on);dirty()}function dirty(){const s=document.getElementById('saveState');s.textContent='有未保存的修改';s.classList.add('dirty')}function saveConfig(){localStorage.setItem('shipping-sla-config',JSON.stringify(config));const s=document.getElementById('saveState');s.textContent='已保存并生效 · '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});s.classList.remove('dirty');showToast('时效预警策略已保存并生效')}function resetConfig(){config=clone(defaults);render();dirty();showToast('已恢复默认配置，请保存后生效')}function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.opacity=1;t.style.transform='translate(-50%,0)';setTimeout(()=>{t.style.opacity=0;t.style.transform='translate(-50%,20px)'},1800)}

let selectedNode=null, statusFilter='all';
const statusNames={all:'全部',normal:'正常',warning:'临近预警',overdue:'已超时',paused:'预警已关闭'};
function safe(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function classify(o,r){
 if(!r.on)return 'paused';
 const hours=Number(r.value),warn=Number(r.warn);
 if(!Number.isFinite(hours)||hours<=0)return 'paused';
 return o[4]>=hours?'overdue':o[4]>=hours*warn/100?'warning':'normal';
}
function records(id='all'){
 return config.rules.filter(r=>id==='all'||r.id===id).flatMap(r=>(nodeOrders[r.id]||[]).map(o=>({o,r,level:classify(o,r)})));
}
function tally(rows){return rows.reduce((a,x)=>{a[x.level]++;a.all++;return a},{all:0,normal:0,warning:0,overdue:0,paused:0})}
function amount(rows){return rows.reduce((a,x)=>a+Number(x.o[2].replace(/[^\d.]/g,'')),0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function duration(n){return Number(n.toFixed(1))+' 小时'}
function timing(x){
 if(x.level==='paused')return '预警已关闭';
 const diff=x.o[4]-Number(x.r.value);
 return diff>=0?'超时 '+duration(diff):'剩余 '+duration(-diff);
}
function statusBadge(level){return '<span class="badge '+({normal:'green',warning:'amber',overdue:'red',paused:'gray'}[level])+'">'+statusNames[level]+'</span>'}
function selectGroup(next,el){if(next==='product'){location.href='商品发货时效配置.html';return;}group=next;selectedNode=null;statusFilter='all';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.group===next));render()}
function openNode(id,filter='all'){group='flow';selectedNode=id;statusFilter=filter;render();document.getElementById('content').scrollIntoView({block:'start',behavior:'smooth'})}
function overview(){
 const all=records(),stats=tally(all),late=all.filter(x=>x.level==='overdue');
 const worst=late.slice().sort((a,b)=>(b.o[4]-b.r.value)-(a.o[4]-a.r.value))[0];
 const tiles=[['all','当前在途订单','','覆盖全部履约节点'],['overdue','已超时订单','danger','涉及金额 ¥'+amount(late)],['warning','临近预警订单','caution','优先安排跟进，避免超时'],['normal','正常履约订单','good',stats.paused?stats.paused+' 单预警已关闭':'各节点按当前阈值判断']];
 return '<div class="overview-head"><div><h2>履约总览</h2><p>按订单当前所在节点统计，每单仅计入一个节点。</p></div><span class="badge gray">示例订单快照</span></div><div class="metrics">'+tiles.map(([key,title,color,sub])=>'<button class="metric '+color+'" onclick="openNode(\'all\',\''+key+'\')"><span>'+title+'</span><strong>'+stats[key]+' <small>单</small></strong><small>'+sub+' →</small></button>').join('')+'</div><h3 class="section-title">各节点履约情况</h3><p class="section-caption">点击节点查看订单明细 · 红色为超时，橙色为临近预警</p><div class="stage-grid">'+config.rules.map((r,i)=>{
 const s=tally(records(r.id));
 return '<button class="stage" onclick="openNode(\''+r.id+'\')"><div class="stage-top"><span>'+safe(r.name)+'</span><span class="stage-index">0'+(i+1)+'</span></div><div class="stage-total">'+s.all+'<small>单待完成</small></div><div class="segments">'+['normal','warning','overdue','paused'].map(k=>'<i class="'+k+'" style="width:'+(s.all?s[k]/s.all*100:0)+'%"></i>').join('')+'</div><div class="stage-counts"><span>正常 '+s.normal+'</span><span class="warning">临近 '+s.warning+'</span><span class="overdue">超时 '+s.overdue+'</span>'+(s.paused?'<span>关闭 '+s.paused+'</span>':'')+'</div><div class="stage-foot"><span>'+ (r.on?'阈值 '+safe(r.value)+' 小时':'预警已关闭')+'</span><b>查看详情 →</b></div></button>';
 }).join('')+'</div>'+(worst?'<div class="focus-note"><b>优先关注：</b>'+safe(worst.r.name)+'节点最长超时 '+duration(worst.o[4]-worst.r.value)+'，订单 '+safe(worst.o[0])+'（'+safe(worst.o[1])+'）。<button class="orders-toggle" onclick="openNode(\''+worst.r.id+'\',\'overdue\')">查看超时订单 →</button></div>':'<div class="detail-summary">当前暂无超时订单。</div>');
}
function detailRows(rows){
 return rows.map(x=>'<tr><td><div class="order-no">'+safe(x.o[0])+'</div><div class="order-sub">'+safe(x.o[1])+'</div></td><td>'+safe(x.r.name)+'</td><td>'+safe(x.o[2])+'</td><td>'+safe(x.o[3])+'</td><td><span class="time-value '+x.level+'">'+timing(x)+'</span><div class="order-sub">已用 '+duration(x.o[4])+' / '+safe(x.r.value)+' 小时</div><div class="time-progress '+x.level+'"><i style="width:'+Math.max(0,Math.min(100,x.o[4]/x.r.value*100))+'%"></i></div></td><td>'+statusBadge(x.level)+'</td><td><button class="orders-toggle" onclick="openOrder(\''+x.o[0]+'\')">查看详情</button></td></tr>').join('')||'<tr><td colspan="7" class="empty-orders">暂无符合当前状态的订单</td></tr>';
}
function nodeDetail(){
 const rows=records(selectedNode),s=tally(rows),r=config.rules.find(x=>x.id===selectedNode);
 const list=rows.filter(x=>statusFilter==='all'||x.level===statusFilter).sort((a,b)=>({overdue:0,warning:1,normal:2,paused:3}[a.level]-{overdue:0,warning:1,normal:2,paused:3}[b.level])||(b.o[4]-b.r.value)-(a.o[4]-a.r.value));
 return '<button class="back-link" onclick="selectedNode=null;render()">← 返回履约总览</button><div class="overview-head"><div><h2>'+ (r?safe(r.name)+' · 订单详情':'全部节点 · 订单详情')+'</h2><p>共 '+s.all+' 单 · 已超时 '+s.overdue+' 单 · 临近预警 '+s.warning+' 单</p></div><span class="badge gray">超时订单优先</span></div>'+(r?'<div class="detail-summary">计时区间 <b>'+safe(r.from)+' → '+safe(r.to)+'</b>　时效阈值 <b>'+safe(r.value)+' 小时</b>　提前提醒 <b>已用时达 '+safe(r.warn)+'%</b></div>':'')+'<div class="filter-tabs" aria-label="筛选订单时效状态">'+['all','overdue','warning','normal',...(s.paused?['paused']:[])].map(k=>'<button class="'+(statusFilter===k?'active':'')+'" aria-pressed="'+(statusFilter===k)+'" onclick="statusFilter=\''+k+'\';render()">'+statusNames[k]+' '+s[k]+'</button>').join('')+'</div><div class="order-table-wrap"><table class="order-table"><thead><tr><th>订单号 / 客户</th><th>当前节点</th><th>金额</th><th>进入节点时间</th><th>时效情况</th><th>状态</th><th>操作</th></tr></thead><tbody>'+detailRows(list)+'</tbody></table></div>';
}
function render(){
 document.querySelector('.actions').hidden=group==='flow';
 document.querySelector('.page-head h1').textContent=group==='flow'?'订单履约总览':'发货时效预警策略';
 document.querySelector('.page-head p').textContent=group==='flow'?'先看异常集中在哪个节点，再查看需要跟进的订单。':'维护商品发货时效和司机信息采集规则。';
 if(group==='flow')document.getElementById('content').innerHTML=selectedNode?nodeDetail():overview();
 else renderConfig();
}
function openOrder(id){
 const x=records().find(x=>x.o[0]===id);if(!x)return;
 const d=document.getElementById('orderDialog');
 document.getElementById('orderDetail').innerHTML='<div class="dialog-head"><h2>订单详情</h2><button class="btn" onclick="document.getElementById(\'orderDialog\').close()" aria-label="关闭订单详情">关闭</button></div><p class="section-caption">示例订单快照 · 仅展示已提供的订单信息</p><dl class="order-kv">'+[['订单编号',x.o[0]],['客户',x.o[1]],['订单金额',x.o[2]],['当前节点',x.r.name],['进入节点时间',x.o[3]],['节点已用时',duration(x.o[4])],['时效阈值',duration(Number(x.r.value))],['剩余 / 超时',timing(x)]].map(([k,v])=>'<div><dt>'+k+'</dt><dd>'+safe(v)+'</dd></div>').join('')+'</dl>'+statusBadge(x.level)+'<h3 class="section-title" style="margin:24px 0 12px">订单当前所处环节</h3><div class="order-journey">'+config.rules.map(r=>'<span class="'+(r.id===x.r.id?'current':'')+'">'+safe(r.name)+(r.id===x.r.id?' · 当前':'')+'</span>').join('')+'</div>';
 d.showModal();
}
function updateRule(el){
 const r=config.rules.find(x=>x.id===el.dataset.id);r[el.dataset.key]=+el.value;dirty();
}
function refreshDetailSettings(){
 if(group==='flow'&&selectedNode){render();const d=document.querySelector('.detail-settings');if(d)d.open=true;}
}
const originalToggle=toggleRule;
toggleRule=function(id,el){originalToggle(id,el);refreshDetailSettings()};
function saveConfig(){
 if(config.rules.some(r=>!Number.isFinite(+r.value)||+r.value<=0||!Number.isFinite(+r.warn)||r.warn<=0||r.warn>=100)||config.product.stock<=0||config.product.noStock<=0){showToast('请填写大于 0 的时效，提前提醒比例须介于 0% 和 100% 之间');return;}
 try{localStorage.setItem('shipping-sla-config',JSON.stringify(config));document.getElementById('saveState').textContent='已保存到本机 · '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});document.getElementById('saveState').classList.remove('dirty');showToast('配置已保存到当前浏览器');refreshDetailSettings()}catch(e){showToast('保存失败，请检查浏览器存储设置')}
}
document.addEventListener('change',e=>{if(e.target.matches('[data-id][data-key]'))refreshDetailSettings()});
render();

</script>
</body>
</html>
