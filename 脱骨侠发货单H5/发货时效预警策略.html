const defaults={product:{stock:24,noStock:72},rules:[{id:'finance',name:'财务审核',from:'订单提交',to:'财务审核通过',value:2,warn:80,on:true,note:'从订单提交开始计时，财务审核通过后停止。'},{id:'accept',name:'接单',from:'财务审核通过',to:'平台完成接单',value:1,warn:80,on:true,note:'仅统计财务审核通过且未接单的订单。'},{id:'ship',name:'发货',from:'平台接单',to:'旺店通审核订单',value:24,warn:75,on:true,note:'以旺店通“订单审核完成”时间作为发货节点完成时间。'},{id:'pickup',name:'揽收',from:'旺店通审核',to:'ERP同步WMS',value:4,warn:75,on:true,note:'ERP成功同步 WMS 后停止计时，失败重试不重置起算时间。'},{id:'sign',name:'签收',from:'ERP同步WMS',to:'签收完成',value:72,warn:80,on:true,note:'ERP成功同步WMS后开始计时，签收完成后停止；有物流信息按签收状态判断，无物流信息按配置时效预警。'},{id:'receipt',name:'回执上传',from:'签收完成',to:'回执上传成功',value:24,warn:80,on:true,note:'订单签收完成后开始计时，回执上传成功后停止；超过配置时效仍未上传则触发预警。'}],driver:{required:true,plate:true,source:'司机端上传',wdt:false}};

function currentNodeRules(saved){
 const previous=Array.isArray(saved)?saved:[];
 return defaults.rules.map(base=>{
  const old=previous.find(r=>r&&r.id===base.id);
  if(!old)return {...base};
  return {...base,
   value:Number.isFinite(+old.value)&&+old.value>0?+old.value:base.value,
   warn:Number.isFinite(+old.warn)&&+old.warn>0&&+old.warn<100?+old.warn:base.warn,
   on:typeof old.on==='boolean'?old.on:base.on,
   action:['创建异常工单','仅消息提醒','消息提醒并升级'].includes(old.action)?old.action:'创建异常工单'};
 });
}

const nodeOrders={finance:[['o202609080947211','临沂兰山区咔嚓食栈食品店（个体工商户）','¥2,184.00','2026-09-08 09:47:22',0.7,'normal'],['SO202609080119','上海玖亭冷链仓','¥36,820.00','今天 07:31',1.8,'warning'],['SO202609080103','杭州鲜食商贸','¥12,480.00','今天 05:56',3.4,'overdue']],accept:[['SO202609080098','武汉优鲜供应链','¥9,860.00','今天 09:12',0.5,'normal'],['SO202609080086','长沙味集食品','¥27,300.00','今天 08:26',1.3,'overdue']],ship:[['SO202609070682','西安饭团餐饮','¥42,680.00','昨天 18:20',15.7,'normal'],['SO202609070651','南京鲜选商贸','¥16,240.00','昨天 13:46',20.2,'warning'],['SO202609070608','成都食刻供应链','¥58,900.00','昨天 07:10',26.8,'overdue']],pickup:[['SO202609080071','河南永鲜商贸','¥23,500.00','今天 08:15',1.4,'normal'],['SO202609080052','河北佳食供应链','¥31,700.00','今天 06:48',3.1,'warning']],sign:[['SO202609060516','苏州味达商贸','¥14,680.00','09-06 16:30',41.6,'normal'],['SO202609050429','合肥餐聚供应链','¥38,720.00','09-05 11:18',68.4,'warning'],['SO202609040381','宁波鲜食配送','¥21,900.00','09-04 07:42',97.2,'overdue']],receipt:[['SO202609060288','青岛海岸食品','¥19,260.00','今天 03:30（已签收）',6.5,'normal'],['SO202609050207','济南玖味餐饮','¥45,100.00','昨天 07:00（已签收）',27,'overdue']]};
const clone=x=>JSON.parse(JSON.stringify(x));let config=(()=>{try{const saved=JSON.parse(localStorage.getItem('shipping-sla-config'));return {...clone(defaults),...saved,rules:currentNodeRules(saved?.rules)}}catch(e){return clone(defaults)}})(),group='flow';
function selectGroup(next,el){group=next;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');render()}
function orderRows(r){const list=nodeOrders[r.id]||[];return list.map(o=>{const ratio=Math.round(o[4]/r.value*100),level=o[5],label=level==='overdue'?'已超时':level==='warning'?'临近预警':'正常',badge=level==='overdue'?'red':level==='warning'?'amber':'green';return `<tr><td><div class="order-no">${o[0]}</div><div class="order-sub">${o[1]}</div></td><td>${o[2]}</td><td>${o[3]}</td><td><span class="time-value ${level}">${o[4]} 小时 / ${r.value} 小时</span><div class="time-progress ${level}"><i style="width:${Math.min(ratio,100)}%"></i></div></td><td><span class="badge ${badge}">${label}</span></td><td><button class="orders-toggle" onclick="showToast('已打开订单 ${o[0]}')">查看订单</button></td></tr>`}).join('')}
function ruleCard(r){const list=nodeOrders[r.id]||[],alerts=list.filter(o=>o[5]!=='normal').length;return `<article class="card"><div class="card-head"><b>${r.name}时效</b><button class="toggle ${r.on?'on':''}" aria-label="启用${r.name}时效" onclick="toggleRule('${r.id}',this)"></button></div><div class="card-body"><div class="field"><label>计时区间</label><select onchange="dirty()"><option>${r.from} → ${r.to}</option></select></div><div class="field"><label>时效阈值</label><div class="input-unit"><input type="number" min="1" value="${r.value}" data-id="${r.id}" data-key="value" oninput="updateRule(this)"><span>小时</span></div></div><div class="field"><label>提前提醒</label><div class="input-unit"><input type="number" min="1" max="99" value="${r.warn}" data-id="${r.id}" data-key="warn" oninput="updateRule(this)"><span>%</span></div></div><div class="field"><label>超时动作</label><select onchange="config.rules.find(x=>x.id==='${r.id}').action=this.value;dirty()">${['创建异常工单','仅消息提醒','消息提醒并升级'].map(a=>`<option ${a===(r.action||'创建异常工单')?'selected':''}>${a}</option>`).join('')}</select></div><div class="note">ⓘ ${r.note}</div></div><section class="node-orders"><div class="orders-head"><div><strong>当前处于${r.name}节点的订单</strong> <span>共 ${list.length} 单${alerts?` · ${alerts} 单需关注`:''}</span></div><button class="orders-toggle" onclick="toggleOrders('${r.id}',this)">收起订单</button></div><div class="order-table-wrap" id="orders-${r.id}"><table class="order-table"><thead><tr><th>订单号 / 客户</th><th>订单金额</th><th>进入节点时间</th><th>已用时 / 阈值</th><th>时效状态</th><th>操作</th></tr></thead><tbody>${orderRows(r)||'<tr><td colspan="6" class="empty-orders">当前节点暂无订单</td></tr>'}</tbody></table></div></section></article>`}
function renderConfig(){const c=document.getElementById('content');c.innerHTML=`<header class="panel-head"><div><h2>司机与车辆信息</h2><p>配置揽收前的信息完整性要求，并预留旺店通自动采集能力。</p></div></header><article class="card"><div class="card-head"><b>司机信息采集规则</b><button class="toggle ${config.driver.required?'on':''}" onclick="config.driver.required=!config.driver.required;this.classList.toggle('on');dirty()"></button></div><div class="card-body two"><div class="field"><label>信息采集节点</label><select onchange="dirty()"><option>司机揽收前</option><option>创建发货单时</option></select></div><div class="field"><label>当前采集方式</label><select onchange="config.driver.source=this.value;dirty()"><option ${config.driver.source==='司机端上传'?'selected':''}>司机端上传</option><option>后台管理员录入</option></select></div><div class="note">ⓘ 司机姓名、手机号和车牌号为必填项；缺失时禁止完成揽收，并生成信息缺失提醒。</div><div class="driver-options"><div class="option"><label><input type="checkbox" ${config.driver.plate?'checked':''} onchange="config.driver.plate=this.checked;dirty()">车牌号必填</label><p>支持司机端拍照上传或手动输入，后台可复核。</p></div><div class="option"><label><input type="checkbox" disabled>旺店通自动采集</label><p>待确认旺店通接口能力后开放，当前由司机端上传。</p></div></div></div></article>`}
function toggleOrders(id,btn){const box=document.getElementById('orders-'+id),hidden=box.hidden;box.hidden=!hidden;btn.textContent=hidden?'收起订单':'展开订单'}function updateRule(el){const r=config.rules.find(x=>x.id===el.dataset.id);r[el.dataset.key]=+el.value;dirty();const box=document.getElementById('orders-'+r.id);if(box)box.querySelector('tbody').innerHTML=orderRows(r)}function toggleRule(id,el){const r=config.rules.find(x=>x.id===id);r.on=!r.on;el.classList.toggle('on',r.on);dirty()}function dirty(){const s=document.getElementById('saveState');s.textContent='有未保存的修改';s.classList.add('dirty')}function saveConfig(){localStorage.setItem('shipping-sla-config',JSON.stringify(config));const s=document.getElementById('saveState');s.textContent='已保存并生效 · '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});s.classList.remove('dirty');showToast('时效预警策略已保存并生效')}function resetConfig(){config=clone(defaults);render();dirty();showToast('已恢复默认配置，请保存后生效')}function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.opacity=1;t.style.transform='translate(-50%,0)';setTimeout(()=>{t.style.opacity=0;t.style.transform='translate(-50%,20px)'},1800)}

let selectedNode=null, statusFilter='all';
const statusNames={all:'全部',normal:'正常',warning:'临近预警',overdue:'已超时',paused:'预警已关闭'};
function safe(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function classify(o,r){
 if(!r.on)return 'paused';
 const hours=Number(r.value),warn=Number(r.warn);
 if(!Number.isFinite(hours)||hours<=0)return 'paused';
 return o[4]>=hours?'overdue':o[4]>=hours*warn/100?'warning':'normal';
}
function records(id='all'){
 return config.rules.filter(r=>id==='all'||r.id===id).flatMap(r=>(nodeOrders[r.id]||[]).map(o=>({o,r,level:classify(o,r)})));
}
function tally(rows){return rows.reduce((a,x)=>{a[x.level]++;a.all++;return a},{all:0,normal:0,warning:0,overdue:0,paused:0})}
function amount(rows){return rows.reduce((a,x)=>a+Number(x.o[2].replace(/[^\d.]/g,'')),0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function duration(n){return Number(n.toFixed(1))+' 小时'}
function timing(x){
 if(x.level==='paused')return '预警已关闭';
 const diff=x.o[4]-Number(x.r.value);
 return diff>=0?'超时 '+duration(diff):'剩余 '+duration(-diff);
}
function statusBadge(level){return '<span class="badge '+({normal:'green',warning:'amber',overdue:'red',paused:'gray'}[level])+'">'+statusNames[level]+'</span>'}
function selectGroup(next,el){if(next==='product'){location.href='商品发货时效配置.html';return;}group=next;selectedNode=null;statusFilter='all';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.group===next));render()}
function openNode(id,filter='all'){
 group='flow';selectedNode=id;statusFilter=filter;
 if(document.getElementById('inlineOrderDetails')){refreshOrderDetails();}else{render();}
}
function selectOrderStatus(status){
 statusFilter=status;refreshOrderDetails();
 const button=document.querySelector('[data-order-status="'+status+'"]');
 if(button)button.focus({preventScroll:true});
}
function refreshOrderDetails(){
 const details=document.getElementById('inlineOrderDetails');
 if(details)details.innerHTML=nodeDetail();
 document.querySelectorAll('[data-node-card]').forEach(el=>{
  const active=el.dataset.nodeCard===(selectedNode||'all');
  el.classList.toggle('selected',active);el.setAttribute('aria-pressed',String(active));
 });
 document.querySelectorAll('[data-metric-filter]').forEach(el=>{
  const active=(!selectedNode||selectedNode==='all')&&el.dataset.metricFilter===statusFilter;
  el.classList.toggle('selected',active);el.setAttribute('aria-pressed',String(active));
 });
}
function overview(){
 const all=records(),stats=tally(all),late=all.filter(x=>x.level==='overdue');
 const worst=late.slice().sort((a,b)=>(b.o[4]-b.r.value)-(a.o[4]-a.r.value))[0];
 const tiles=[['all','当前在途订单','','覆盖全部履约节点'],['overdue','已超时订单','danger','涉及金额 ¥'+amount(late)],['warning','临近预警订单','caution','优先安排跟进，避免超时'],['normal','正常履约订单','good',stats.paused?stats.paused+' 单预警已关闭':'各节点按当前阈值判断']];
 return '<div class="overview-head"><div><h2>履约总览</h2><p>按订单当前所在节点统计，每单仅计入一个节点。</p></div><span class="badge gray">示例订单快照</span></div><div class="metrics">'+tiles.map(([key,title,color,sub])=>'<button class="metric '+color+'" data-metric-filter="'+key+'" aria-pressed="false" onclick="openNode(\'all\',\''+key+'\')"><span>'+title+'</span><strong>'+stats[key]+' <small>单</small></strong><small>'+sub+' →</small></button>').join('')+'</div><h3 class="section-title">各节点履约情况</h3><p class="section-caption">点击节点切换下方订单 · 红色为超时，橙色为临近预警</p><div class="stage-grid">'+config.rules.map((r,i)=>{
 const s=tally(records(r.id));
 return '<button class="stage" data-node-card="'+r.id+'" aria-pressed="false" onclick="openNode(\''+r.id+'\')"><div class="stage-top"><span>'+safe(r.name)+'</span><span class="stage-index">0'+(i+1)+'</span></div><div class="stage-total">'+s.all+'<small>单待完成</small></div><div class="segments">'+['normal','warning','overdue','paused'].map(k=>'<i class="'+k+'" style="width:'+(s.all?s[k]/s.all*100:0)+'%"></i>').join('')+'</div><div class="stage-counts"><span>正常 '+s.normal+'</span><span class="warning">临近 '+s.warning+'</span><span class="overdue">超时 '+s.overdue+'</span>'+(s.paused?'<span>关闭 '+s.paused+'</span>':'')+'</div><div class="stage-foot"><span>'+ (r.on?'阈值 '+safe(r.value)+' 小时':'预警已关闭')+'</span><b>查看下方订单 ↓</b></div></button>';
 }).join('')+'</div>'+(worst?'<div class="focus-note"><b>优先关注：</b>'+safe(worst.r.name)+'节点最长超时 '+duration(worst.o[4]-worst.r.value)+'，订单 '+safe(worst.o[0])+'（'+safe(worst.o[1])+'）。<button class="orders-toggle" onclick="openNode(\''+worst.r.id+'\',\'overdue\')">查看超时订单 →</button></div>':'<div class="detail-summary">当前暂无超时订单。</div>');
}
function detailRows(rows){
 return rows.map(x=>'<tr><td><div class="order-no">'+safe(x.o[0])+'</div><div class="order-sub">'+safe(x.o[1])+'</div></td><td>'+safe(x.r.name)+'</td><td>'+safe(x.o[2])+'</td><td>'+safe(x.o[3])+'</td><td><span class="time-value '+x.level+'">'+timing(x)+'</span><div class="order-sub">已用 '+duration(x.o[4])+' / '+safe(x.r.value)+' 小时</div><div class="time-progress '+x.level+'"><i style="width:'+Math.max(0,Math.min(100,x.o[4]/x.r.value*100))+'%"></i></div></td><td>'+statusBadge(x.level)+'</td><td><button class="orders-toggle" onclick="openOrder(\''+x.o[0]+'\')">查看详情</button></td></tr>').join('')||'<tr><td colspan="7" class="empty-orders">暂无符合当前状态的订单</td></tr>';
}

function nodeDetail(){
 const rows=records(selectedNode||'all'),s=tally(rows),r=config.rules.find(x=>x.id===selectedNode);
 const list=rows.filter(x=>statusFilter==='all'||x.level===statusFilter).sort((a,b)=>({overdue:0,warning:1,normal:2,paused:3}[a.level]-{overdue:0,warning:1,normal:2,paused:3}[b.level])||(b.o[4]-b.r.value)-(a.o[4]-a.r.value));
 return '<div class="overview-head"><div><h2>'+(r?safe(r.name)+' · 订单列表':'全部节点 · 订单列表')+'</h2><p>按当前履约节点展示订单，超时订单优先。</p></div><div class="inline-list-tools"><span class="badge gray">共 '+s.all+' 单</span>'+(r?'<button class="orders-toggle" onclick="openNode(\'all\')">全部节点</button>':'')+'</div></div>'+(r?'<div class="detail-summary">计时区间 <b>'+safe(r.from)+' → '+safe(r.to)+'</b>　时效阈值 <b>'+safe(r.value)+' 小时</b>　提前提醒 <b>已用时达 '+safe(r.warn)+'%</b></div>':'')+'<div class="filter-tabs" aria-label="筛选订单时效状态">'+['all','overdue','warning','normal',...(s.paused?['paused']:[])].map(k=>'<button class="'+(statusFilter===k?'active':'')+'" aria-pressed="'+(statusFilter===k)+'" data-order-status="'+k+'" onclick="selectOrderStatus(\''+k+'\')">'+statusNames[k]+' '+s[k]+'</button>').join('')+'</div><div class="oms-summary"><span>当前筛选订单：<b>'+list.length+' 单</b></span><span>订单金额合计：<b>¥ '+amount(list)+'</b></span><span>超时订单金额：<b>¥ '+amount(list.filter(x=>x.level==='overdue'))+'</b></span></div><p class="oms-source-note">截图订单保留原始订单信息；其余为演示订单，未提供的明细不作填充。节点计时为演示数据。</p><div class="oms-order-scroll">'+omsColumnHead()+(list.length?list.map(x=>omsOrderCard(x)).join(''):'<div class="empty-orders">暂无符合当前状态的订单</div>')+'</div>';
}

function render(){
 document.querySelector('.actions').hidden=group==='flow';
 document.querySelector('.page-head h1').textContent=group==='flow'?'订单履约总览':'发货时效预警策略';
 document.querySelector('.page-head p').textContent=group==='flow'?'点击总览指标或履约节点，下方直接显示对应订单。':'维护商品发货时效和司机信息采集规则。';
 if(group==='flow'){document.getElementById('content').innerHTML='<section id="overviewSurface">'+overview()+'</section><section id="inlineOrderDetails" class="inline-order-details" aria-label="订单明细">'+nodeDetail()+'</section>';refreshOrderDetails();}
 else renderConfig();
}

function openOrder(id){
 const x=records().find(x=>x.o[0]===id);if(!x)return;
 const d=document.getElementById('orderDialog');
 document.getElementById('orderDetail').innerHTML='<div class="dialog-head"><h2>订单详情</h2><button class="btn" onclick="document.getElementById(\'orderDialog\').close()" aria-label="关闭订单详情">关闭</button></div><div class="oms-current-info"><span>当前节点：<b>'+safe(x.r.name)+'</b></span><span>节点时效：'+safe(x.r.value)+' 小时</span><span>演示已用时：'+duration(x.o[4])+'</span>'+statusBadge(x.level)+'</div><div class="oms-order-scroll">'+omsColumnHead()+omsOrderCard(x,true)+'</div><h3 class="section-title" style="margin:18px 0 12px">订单当前所处环节</h3><div class="order-journey">'+config.rules.map(r=>'<span class="'+(r.id===x.r.id?'current':'')+'">'+safe(r.name)+(r.id===x.r.id?' · 当前':'')+'</span>').join('')+'</div>';
 d.showModal();
}

function updateRule(el){
 const r=config.rules.find(x=>x.id===el.dataset.id);r[el.dataset.key]=+el.value;dirty();
}
function refreshDetailSettings(){
 if(group==='flow'&&selectedNode){render();const d=document.querySelector('.detail-settings');if(d)d.open=true;}
}
const originalToggle=toggleRule;
toggleRule=function(id,el){originalToggle(id,el);refreshDetailSettings()};
function saveConfig(){
 if(config.rules.some(r=>!Number.isFinite(+r.value)||+r.value<=0||!Number.isFinite(+r.warn)||r.warn<=0||r.warn>=100)||config.product.stock<=0||config.product.noStock<=0){showToast('请填写大于 0 的时效，提前提醒比例须介于 0% 和 100% 之间');return;}
 try{if(group==='driver'){const latest=JSON.parse(localStorage.getItem('shipping-sla-config')||'null');if(latest?.rules)config.rules=currentNodeRules(latest.rules);}localStorage.setItem('shipping-sla-config',JSON.stringify(config));document.getElementById('saveState').textContent='已保存到本机 · '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});document.getElementById('saveState').classList.remove('dirty');showToast('配置已保存到当前浏览器');refreshDetailSettings()}catch(e){showToast('保存失败，请检查浏览器存储设置')}
}
document.addEventListener('change',e=>{if(e.target.matches('[data-id][data-key]'))refreshDetailSettings()});
function syncSavedRules(){try{const latest=JSON.parse(localStorage.getItem('shipping-sla-config')||'null');if(latest?.rules&&group==='flow'){config.rules=currentNodeRules(latest.rules);render();}}catch(e){showToast('无法读取最新节点配置，请检查浏览器存储');}}
window.addEventListener('pageshow',syncSavedRules);
window.addEventListener('storage',e=>{if(e.key==='shipping-sla-config')syncSavedRules();});

function omsColumnHead(){return '<div class="oms-column-head"><div>商品信息</div><div>单价 / 数量</div><div>实付金额</div><div>买家 / 收货人</div><div>客户名称</div><div>状态</div><div>操作</div></div>'}
function omsProduct(p){
 return '<div class="oms-product"><div class="oms-product-info"><div class="oms-product-name">'+safe(p.name)+'<br>（'+safe(p.pack)+'）</div><div class="oms-product-tags">'+p.tags.map(t=>'<span>'+safe(t)+'</span>').join('')+'</div></div><div class="oms-product-price">¥ '+p.price.toFixed(2)+'<br>×'+p.qty+' <em>'+safe(p.unit)+'</em></div></div>';
}
function omsOrderCard(x,inDialog=false){
 const p=omsProfiles[x.o[0]],unknown='<span class="oms-unknown">未提供</span>';
 const header='<div class="oms-order-head"><span>订单编号：<b>'+safe(x.o[0])+'</b></span><span>下单时间：'+(p?safe(p.createdAt):unknown)+'</span><span>订单来源：<span class="badge gray">'+(p?safe(p.channel):'未提供')+'</span></span><span>订单类型：<span class="badge gray">'+(p?safe(p.type):'未提供')+'</span></span><span>创建人：<span class="badge amber">'+(p?safe(p.creator):'未提供')+'</span></span><span class="oms-node-tag">'+safe(x.r.name)+'</span><span class="sla-clock '+x.level+'">'+safe(x.r.name)+' · '+timing(x)+'</span></div>';
 const products=p?p.products.map(omsProduct).join(''):'<div class="oms-no-products"><span class="oms-unknown">该演示订单未提供商品明细</span><div class="order-sub">订单金额：'+safe(x.o[2])+'</div></div>';
 const receiver=p?'收货人：'+safe(p.receiver)+'<br>手机号：'+safe(p.phone)+'<br>收货地址：'+safe(p.address):unknown;
 const statuses=p?p.statuses.map(([k,v])=>'<div class="oms-status-row">'+safe(k)+'：<span class="'+(k==='订单状态'?'badge gray':'oms-blue-tag')+'">'+safe(v)+'</span></div>').join(''):'<div class="oms-unknown">业务状态未提供</div>';
 return '<article class="oms-order">'+header+'<div class="oms-order-body"><div class="oms-products">'+products+'</div><div class="oms-money">'+(p?'¥ '+p.paid.toFixed(2)+'元':unknown)+'</div><div class="oms-receiver">'+receiver+'</div><div class="oms-customer">客户：'+safe(x.o[1])+'<br><span style="margin-top:8px">销售人员：'+(p?safe(p.salesperson):unknown)+'</span></div><div>'+statuses+'<div class="oms-status-row">时效状态：'+statusBadge(x.level)+'</div></div><div class="oms-actions">'+(inDialog?'<span class="oms-node-tag">'+safe(x.r.name)+' · 当前</span>':'<button class="orders-toggle" onclick="openOrder(\''+x.o[0]+'\')">▤ 订单详情</button>')+'<span class="oms-unknown">'+(p?'截图录入':'演示订单')+'</span></div></div><div class="oms-order-foot">工厂备注：'+(p?(safe(p.factoryRemark)||'未填写'):'未提供')+'</div>'+(p?'<div class="oms-source-note" style="padding:10px 18px;margin:0">原订单剩余时间（截图值）：'+safe(p.originalCountdown)+'。节点已用时 '+duration(x.o[4])+' 为演示值；实付金额与业务状态按原图展示。</div>':'')+'</article>';
}
